<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GASTER_BLASTER://SIMULATOR</title>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #000;
            --beam: #fff;
            --beam-glow: #0cf;
            --accent: #fff;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; cursor: crosshair; }

        body {
            background: var(--bg);
            color: var(--accent);
            font-family: 'VT323', monospace;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* ──── VOID PARTICLES ──── */
        #particle-canvas {
            position: fixed; top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1; pointer-events: none;
        }

        /* ──── CRT SCANLINES ──── */
        .crt-overlay {
            position: fixed; inset: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
            background-size: 100% 3px, 3px 100%;
            pointer-events: none; z-index: 1000;
        }

        .ui-container {
            position: fixed; top: 20px; left: 20px;
            z-index: 2000; display: flex; flex-direction: column; gap: 10px;
            background: rgba(0,0,0,0.8); padding: 15px; border: 2px solid #333;
        }

        .stats-container {
            position: fixed; top: 20px; right: 20px;
            z-index: 2000; display: flex; flex-direction: column; align-items: flex-end;
            background: rgba(0,0,0,0.8); padding: 15px; border: 2px solid #333; font-size: 1.5rem;
        }

        .title { font-size: 2.5rem; letter-spacing: 4px; color: #fff; text-shadow: 2px 2px #0cf; }
        .hint { font-size: 1.2rem; color: #666; }

        .btn {
            background: #000; border: 2px solid #fff; color: #fff;
            font-family: inherit; font-size: 1.4rem; padding: 5px 15px;
            cursor: pointer; transition: 0.2s;
        }
        .btn:hover { background: #fff; color: #000; box-shadow: 0 0 15px #fff; }

        /* ──── BLASTER STYLING ──── */
        .blaster {
            position: absolute; width: 100px; height: 100px;
            background: url('https://undertale.wiki/images/Gaster_Blaster_idle.gif') no-repeat center center;
            background-size: contain;
            z-index: 100; pointer-events: none;
            image-rendering: pixelated;
            transition: transform 0.1s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .beam {
            position: absolute; background: #fff;
            box-shadow: 0 0 20px #0cf, 0 0 40px #fff, 0 0 60px #0cf;
            z-index: 90; pointer-events: none; transform-origin: top center;
            opacity: 0;
        }

        .soul {
            position: absolute; width: 30px; height: 30px;
            background: #f00; z-index: 80; pointer-events: none;
            clip-path: polygon(50% 0%, 100% 35%, 80% 100%, 50% 80%, 20% 100%, 0% 35%);
            box-shadow: 0 0 15px rgba(255, 0, 0, 0.5);
        }

        .shake { animation: shake 0.2s infinite; }
        @keyframes shake {
            0% { transform: translate(2px, 2px); }
            50% { transform: translate(-2px, -2px); }
            100% { transform: translate(2px, -2px); }
        }

        .glitch-flash {
            position: fixed; inset: 0; background: #fff; opacity: 0;
            z-index: 5000; pointer-events: none;
        }

        @keyframes flashIn { 0% { opacity: 0.8; } 100% { opacity: 0; } }

        .back-hub { position: fixed; bottom: 20px; right: 20px; z-index: 2000; color: #444; font-size: 1.5rem; text-decoration: none; }
        .back-hub:hover { color: #fff; }

        #game-over {
            position: fixed; inset: 0; background: rgba(0,0,0,0.9);
            display: none; flex-direction: column; align-items: center; justify-content: center;
            z-index: 3000; text-align: center;
        }
    </style>
</head>
<body>

    <canvas id="particle-canvas"></canvas>
    <div class="crt-overlay"></div>
    <div class="glitch-flash" id="flash"></div>

    <div class="ui-container">
        <h1 class="title">GASTER_BLASTER</h1>
        <p class="hint">CLICK ANYWHERE TO FIRE // SPACE TO RESET</p>
        <button class="btn" onclick="triggerJudgement()">JUDGEMENT_MODE</button>
        <button class="btn" id="minigame-btn" onclick="toggleGame()">START SOUL DEFENSE</button>
        <p style="margin-top: 10px; font-size: 0.8rem; opacity: 0.4; letter-spacing: 2px;">✌︎☹︎☹︎ ☟︎✌︎💧︎ ✌︎ 🏱︎🕆︎☼︎🏱︎⚐︎💧︎☜︎ ⚐︎☞︎ ⚐︎☠︎☜︎ ❄︎⚐︎ 👎︎✋︎☜︎ 📫︎🕈︎👎︎ ☝︎✌︎💧︎❄︎☜︎☼︎ ☞︎☼︎⚐︎💣︎ 🕆︎☠︎👎︎☜︎☼︎❄︎✌︎☹︎☜︎</p>
    </div>

    <div class="stats-container" id="stats" style="display: none;">
        <div>SOULS HARVESTED: <span id="soul-count">0</span></div>
        <div style="font-size: 0.8rem; color: #ffd700;">🪙 <span class="coin-balance-val">0</span> COINS</div>
        <div style="font-size: 0.8rem; color: #666;">HI: <span id="hi-score">0</span></div>
    </div>

    <div id="game-over">
        <h1 style="font-size: 4rem; color: #f00;">STAY DETERMINED</h1>
        <p style="font-size: 1.5rem; margin-top: 20px;">YOU HARVESTED <span id="final-score">0</span> SOULS.</p>
        <button class="btn" style="margin-top: 30px;" onclick="location.reload()">RETRY</button>
    </div>

    <a href="index.html" class="back-hub">← HUB</a>

    <script src="discovery.js"></script>
    <script src="economy.js"></script>
    <script>
        const canvas = document.getElementById('particle-canvas');
        const ctx = canvas.getContext('2d');
        const flash = document.getElementById('flash');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        // Void Particles
        let particles = [];
        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2;
                this.speedY = Math.random() * 0.5 + 0.1;
                this.opacity = Math.random();
            }
            update() {
                this.y -= this.speedY;
                if (this.y < 0) this.y = canvas.height;
            }
            draw() {
                ctx.fillStyle = `rgba(255, 255, 255, ${this.opacity})`;
                ctx.fillRect(this.x, this.y, this.size, this.size);
            }
        }

        function initParticles() {
            for (let i = 0; i < 100; i++) particles.push(new Particle());
        }

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => { p.update(); p.draw(); });
            requestAnimationFrame(animateParticles);
        }

        initParticles();
        animateParticles();

        // ──── BLASTER LOGIC ────
        let activeBeams = [];

        window.onclick = (e) => {
            if (e.target.tagName === 'BUTTON') return;
            fireBlaster(e.clientX, e.clientY);
        };

        window.onkeydown = (e) => {
            if (e.code === 'Space') {
                document.querySelectorAll('.blaster, .beam').forEach(el => el.remove());
                activeBeams = [];
            }
        };

        async function fireBlaster(targetX, targetY) {
            const blaster = document.createElement('div');
            blaster.className = 'blaster';
            
            const spawnX = targetX + (Math.random() - 0.5) * 400;
            const spawnY = targetY - 300 - Math.random() * 200;
            
            blaster.style.left = spawnX + 'px';
            blaster.style.top = spawnY + 'px';
            
            const angle = Math.atan2(targetY - spawnY, targetX - spawnX);
            blaster.style.transform = `rotate(${angle * 180 / Math.PI + 90}deg) scale(0)`;
            
            document.body.appendChild(blaster);

            await new Promise(r => setTimeout(r, 10));
            blaster.style.transform = `rotate(${angle * 180 / Math.PI + 90}deg) scale(1.5)`;
            
            await new Promise(r => setTimeout(r, 250)); // Faster charge (Ultimate Mode)
            blaster.style.transform += ' scale(1.2)';
            
            const beam = document.createElement('div');
            beam.className = 'beam';
            beam.style.left = (spawnX + 45) + 'px';
            beam.style.top = (spawnY + 45) + 'px';
            beam.style.width = '10px';
            beam.style.height = '1500px';
            beam.style.transform = `rotate(${angle * 180 / Math.PI + 90}deg)`;
            document.body.appendChild(beam);

            beam.style.opacity = '1';
            beam.style.width = '60px';
            beam.style.left = (spawnX + 20) + 'px'; 
            
            activeBeams.push(beam);
            document.body.classList.add('shake');
            flash.style.animation = 'flashIn 0.3s ease-out';

            setTimeout(() => {
                beam.style.width = '0px';
                beam.style.opacity = '0';
                blaster.style.opacity = '0';
                blaster.style.transform += ' scale(0)';
                document.body.classList.remove('shake');
                flash.style.animation = '';
                activeBeams = activeBeams.filter(b => b !== beam);
                setTimeout(() => { beam.remove(); blaster.remove(); }, 300);
            }, 500);
        }

        async function triggerJudgement() {
            const cx = window.innerWidth / 2;
            const cy = window.innerHeight / 2;
            
            for (let i = 0; i < 8; i++) {
                fireBlaster(cx + (Math.random()-0.5)*400, cy + (Math.random()-0.5)*400);
                await new Promise(r => setTimeout(r, 80));
            }
        }

        // ──── MINIGAME LOGIC ────
        let isGame = false;
        let souls = [];
        let score = 0;
        let hiScore = localStorage.getItem('wwg_blaster_hi') || 0;
        document.getElementById('hi-score').innerText = hiScore;

        function toggleGame() {
            isGame = !isGame;
            const btn = document.getElementById('minigame-btn');
            const stats = document.getElementById('stats');
            
            if (isGame) {
                btn.innerText = "EXIT MINIGAME";
                stats.style.display = "flex";
                score = 0;
                updateStats();
                gameLoop();
            } else {
                btn.innerText = "START SOUL DEFENSE";
                stats.style.display = "none";
                souls.forEach(s => s.element.remove());
                souls = [];
            }
        }

        function spawnSoul() {
            if (!isGame) return;
            const soulEl = document.createElement('div');
            soulEl.className = 'soul';
            const colors = ['#f00', '#0cf', '#f0f', '#0f0', '#ff0'];
            soulEl.style.background = colors[Math.floor(Math.random()*colors.length)];
            soulEl.style.left = Math.random() * (window.innerWidth - 30) + 'px';
            soulEl.style.top = '-50px';
            document.body.appendChild(soulEl);
            
            souls.push({
                element: soulEl,
                y: -50,
                speed: 2 + (score / 10)
            });
            
            setTimeout(spawnSoul, Math.max(200, 1500 - (score * 20)));
        }

        function gameLoop() {
            if (!isGame) return;
            
            souls.forEach((soul, index) => {
                soul.y += soul.speed;
                soul.element.style.top = soul.y + 'px';
                
                // Check Collision with active beams
                activeBeams.forEach(beam => {
                    const b = beam.getBoundingClientRect();
                    const s = soul.element.getBoundingClientRect();
                    // Geometric approximation of slanted beam
                    if (!(s.right < b.left || s.left > b.right || s.bottom < b.top || s.top > b.bottom)) {
                        soul.element.remove();
                        souls.splice(index, 1);
                        score++;
                        Economy.addCoins(10);
                        updateStats();
                        
                        // Check for Unlock
                        if (score >= 1000) {
                            const data = JSON.parse(localStorage.getItem('wwg_avatar_data') || '{}');
                            if (!data.unlocked?.includes('the-voidwalker')) {
                                data.unlocked = [...(data.unlocked || []), 'the-voidwalker'];
                                localStorage.setItem('wwg_avatar_data', JSON.stringify(data));
                                Discovery.unlock('void-conqueror');
                            }
                        }
                    }
                });
                
                // Failure condition
                if (soul.y > window.innerHeight) {
                    gameOver();
                }
            });
            
            requestAnimationFrame(gameLoop);
        }

        function updateStats() {
            document.getElementById('soul-count').innerText = score;
            if (score > hiScore) {
                hiScore = score;
                localStorage.setItem('wwg_blaster_hi', hiScore);
                document.getElementById('hi-score').innerText = hiScore;
            }
        }

        function gameOver() {
            isGame = false;
            document.getElementById('game-over').style.display = 'flex';
            document.getElementById('final-score').innerText = score;
        }

        window.onresize = () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        };

        if (isGame) spawnSoul();
    </script>
</body>
</html>
