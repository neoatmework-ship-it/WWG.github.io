<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dimension</title>
    <link rel="icon"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🌌%3C/text%3E%3C/svg%3E">
    <style>
        body {
            margin: 0;
            background: #000;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        canvas {
            display: block;
        }

        .hint {
            position: absolute;
            bottom: 30px;
            font-family: monospace;
            color: #555;
            letter-spacing: 5px;
            pointer-events: none;
        }
    </style>
</head>

<body>
    <div class="hint">4D HYPERCUBE</div>
    <canvas id="c"></canvas>

    <script src="discovery.js"></script>
    <script>
        Discovery.unlock('dimension');

        const canvas = document.getElementById('c');
        const ctx = canvas.getContext('2d');
        let w = canvas.width = window.innerWidth;
        let h = canvas.height = window.innerHeight;

        const points = [];
        // Generate a 4D hypercube (tesseract) points
        for (let x = -1; x <= 1; x += 2)
            for (let y = -1; y <= 1; y += 2)
                for (let z = -1; z <= 1; z += 2)
                    for (let w = -1; w <= 1; w += 2)
                        points.push([x, y, z, w]);

        let angle = 0;

        function draw() {
            ctx.clearRect(0, 0, w, h);
            ctx.strokeStyle = '#0ff';
            ctx.lineWidth = 2;

            angle += 0.01;

            const projected = [];

            // Math for 4D to 3D to 2D
            for (let i = 0; i < points.length; i++) {
                let [x, y, z, w_d] = points[i];

                // Rotate in XW plane
                let x1 = x * Math.cos(angle) - w_d * Math.sin(angle);
                let w1 = x * Math.sin(angle) + w_d * Math.cos(angle);

                // Rotate in YW plane
                let y1 = y * Math.cos(angle * 0.5) - w1 * Math.sin(angle * 0.5);
                let w2 = y * Math.sin(angle * 0.5) + w1 * Math.cos(angle * 0.5);

                // Perspective projection 4D -> 3D
                const distance = 3;
                let w_p = 1 / (distance - w2);

                let px = x1 * w_p;
                let py = y1 * w_p;
                let pz = z * w_p;

                // Rotate in XZ Plane (3D)
                let tempX = px * Math.cos(angle) - pz * Math.sin(angle);
                let tempZ = px * Math.sin(angle) + pz * Math.cos(angle);
                px = tempX; pz = tempZ;

                // Perspective 3D -> 2D
                let z_p = 1 / (distance - pz);
                let mapX = px * z_p * 400 + w / 2;
                let mapY = py * z_p * 400 + h / 2;

                projected.push([mapX, mapY]);

                // Draw nodes
                ctx.beginPath();
                ctx.arc(mapX, mapY, 4, 0, Math.PI * 2);
                ctx.fillStyle = '#f0f';
                ctx.fill();
            }

            // Draw edges
            ctx.beginPath();
            for (let i = 0; i < 16; i++) {
                for (let j = i + 1; j < 16; j++) {
                    // Check if points differ by exactly 1 coordinate (they are connected)
                    let diff = 0;
                    for (let k = 0; k < 4; k++) if (points[i][k] !== points[j][k]) diff++;
                    if (diff === 1) {
                        ctx.moveTo(projected[i][0], projected[i][1]);
                        ctx.lineTo(projected[j][0], projected[j][1]);
                    }
                }
            }
            ctx.stroke();

            requestAnimationFrame(draw);
        }
        draw();

        window.addEventListener('resize', () => {
            w = canvas.width = window.innerWidth;
            h = canvas.height = window.innerHeight;
        });
    </script>
</body>

</html>
