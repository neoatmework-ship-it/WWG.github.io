<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hollow</title>
    <link rel="icon"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🕳️%3C/text%3E%3C/svg%3E">
    <style>
        body {
            margin: 0;
            background: #fff;
            overflow: hidden;
            height: 100vh;
            cursor: crosshair;
        }

        .ripple {
            position: absolute;
            border-radius: 50%;
            border: 1px solid #000;
            transform: translate(-50%, -50%);
            opacity: 1;
            pointer-events: none;
        }

        @keyframes rippleOut {
            0% {
                width: 0px;
                height: 0px;
                opacity: 1;
            }

            100% {
                width: 2000px;
                height: 2000px;
                opacity: 0;
            }
        }

        .hint {
            position: absolute;
            bottom: 30px;
            width: 100%;
            text-align: center;
            color: #aaa;
            font-family: sans-serif;
            letter-spacing: 5px;
            opacity: 0;
            transition: opacity 2s;
            pointer-events: none;
        }
    </style>
</head>

<body>
    <div class="hint" id="hint">IT ECHOES</div>

    <script src="discovery.js"></script>
    <script>
        Discovery.unlock('hollow');

        let clicks = 0;

        window.addEventListener('click', e => {
            clicks++;
            if (clicks > 5) document.getElementById('hint').style.opacity = 1;

            // Visual ripple
            const r = document.createElement('div');
            r.className = 'ripple';
            r.style.left = e.clientX + 'px';
            r.style.top = e.clientY + 'px';
            r.style.animation = 'rippleOut 4s cubic-bezier(0.1, 0.8, 0.3, 1) forwards';
            document.body.appendChild(r);

            // Audio echo
            playEcho(400 - (clicks * 10 % 200));

            setTimeout(() => r.remove(), 4000);
        });

        const actx = new (window.AudioContext || window.webkitAudioContext)();

        function playEcho(freq) {
            if (actx.state === 'suspended') actx.resume();

            const osc = actx.createOscillator();
            const gain = actx.createGain();

            // Hollow sine curve
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, actx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(freq * 0.5, actx.currentTime + 2);

            gain.gain.setValueAtTime(0, actx.currentTime);
            gain.gain.linearRampToValueAtTime(0.5, actx.currentTime + 0.1);
            gain.gain.exponentialRampToValueAtTime(0.01, actx.currentTime + 3);

            osc.connect(gain);
            gain.connect(actx.destination);

            osc.start(actx.currentTime);
            osc.stop(actx.currentTime + 3);
        }
    </script>
</body>

</html>
