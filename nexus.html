<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus</title>
    <link rel="icon"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🌐%3C/text%3E%3C/svg%3E">
    <style>
        body {
            margin: 0;
            background: #050510;
            overflow: hidden;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        canvas {
            display: block;
            filter: drop-shadow(0 0 5px rgba(100, 200, 255, 0.5));
        }

        .hint {
            position: absolute;
            bottom: 30px;
            font-family: monospace;
            letter-spacing: 5px;
            color: #64c8ff;
            opacity: 0.5;
            pointer-events: none;
        }
    </style>

    <!-- wwg-mobile-patch-start -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        canvas {
            max-width: 100vw;
            max-height: 100vh;
            touch-action: none;
        }
    </style>
    <!-- wwg-mobile-patch-end -->

</head>

<body>
    <div class="hint">NEXUS NETWORK</div>
    <canvas id="c"></canvas>

    <script src="discovery.js"></script>
    <script>
        Discovery.unlock('nexus');
        const canvas = document.getElementById('c');
        const ctx = canvas.getContext('2d');
        let w = canvas.width = window.innerWidth;
        let h = canvas.height = window.innerHeight;

        const nodes = [];
        const numNodes = 100;

        for (let i = 0; i < numNodes; i++) {
            nodes.push({
                x: Math.random() * w,
                y: Math.random() * h,
                vx: (Math.random() - 0.5) * 2,
                vy: (Math.random() - 0.5) * 2,
                r: Math.random() * 3 + 1
            });
        }

        let mouseX = w / 2;
        let mouseY = h / 2;

        window.addEventListener('mousemove', e => {
            mouseX = e.clientX;
            mouseY = e.clientY;
        });

        // Click adds massive repelling force
        let pulseForce = 0;
        let pulseX = 0, pulseY = 0;

        window.addEventListener('click', e => {
            pulseForce = 100;
            pulseX = e.clientX;
            pulseY = e.clientY;
        });

        function draw() {
            ctx.fillStyle = '#050510';
            ctx.fillRect(0, 0, w, h);

            // Connect nodes
            for (let i = 0; i < nodes.length; i++) {
                const n1 = nodes[i];

                // Mouse interaction
                const dxm = mouseX - n1.x;
                const dym = mouseY - n1.y;
                const distm = Math.sqrt(dxm * dxm + dym * dym);

                if (distm < 150) {
                    // gentle attract
                    n1.vx += (dxm / distm) * 0.1;
                    n1.vy += (dym / distm) * 0.1;
                }

                // Pulse interaction
                if (pulseForce > 0) {
                    const dxp = n1.x - pulseX;
                    const dyp = n1.y - pulseY;
                    const distp = Math.sqrt(dxp * dxp + dyp * dyp);
                    if (distp > 0 && distp < 300) {
                        n1.vx += (dxp / distp) * pulseForce * 0.1;
                        n1.vy += (dyp / distp) * pulseForce * 0.1;
                    }
                }

                for (let j = i + 1; j < nodes.length; j++) {
                    const n2 = nodes[j];
                    const dx = n2.x - n1.x;
                    const dy = n2.y - n1.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);

                    if (dist < 100) {
                        ctx.beginPath();
                        ctx.moveTo(n1.x, n1.y);
                        ctx.lineTo(n2.x, n2.y);
                        ctx.strokeStyle = `rgba(100, 200, 255, ${1 - dist / 100})`;
                        ctx.lineWidth = 1;
                        ctx.stroke();

                        // Spring force between close nodes
                        if (dist < 50) {
                            const force = (50 - dist) * 0.001;
                            n1.vx -= dx * force; n1.vy -= dy * force;
                            n2.vx += dx * force; n2.vy += dy * force;
                        }
                    }
                }

                // Friction
                n1.vx *= 0.95;
                n1.vy *= 0.95;

                // Move
                n1.x += n1.vx;
                n1.y += n1.vy;

                // Wrap
                if (n1.x < 0) n1.x = w; if (n1.x > w) n1.x = 0;
                if (n1.y < 0) n1.y = h; if (n1.y > h) n1.y = 0;

                // Draw node
                ctx.beginPath();
                ctx.arc(n1.x, n1.y, n1.r, 0, Math.PI * 2);
                ctx.fillStyle = '#fff';
                ctx.fill();
            }

            // Draw pulse wave
            if (pulseForce > 0) {
                pulseForce *= 0.9;
                ctx.beginPath();
                ctx.arc(pulseX, pulseY, 150 - pulseForce, 0, Math.PI * 2);
                ctx.strokeStyle = `rgba(100, 200, 255, ${pulseForce / 100})`;
                ctx.lineWidth = pulseForce * 0.1;
                ctx.stroke();
            }

            requestAnimationFrame(draw);
        }
        draw();

        window.addEventListener('resize', () => {
            w = canvas.width = window.innerWidth;
            h = canvas.height = window.innerHeight;
        });
    </script>

    <!-- wwg-mobile-patch-js-start -->
    <script>
        // Touch-to-Mouse Polyfill for legacy canvas interactives
        document.addEventListener('touchstart', function(e) {
            if(e.touches.length > 0) {
                const touch = e.touches[0];
                const mouseEvent = new MouseEvent('mousedown', {
                    clientX: touch.clientX,
                    clientY: touch.clientY,
                    bubbles: true,
                    cancelable: true
                });
                e.target.dispatchEvent(mouseEvent);
            }
        }, {passive: false});

        document.addEventListener('touchmove', function(e) {
            if(e.touches.length > 0) {
                const touch = e.touches[0];
                const mouseEvent = new MouseEvent('mousemove', {
                    clientX: touch.clientX,
                    clientY: touch.clientY,
                    bubbles: true,
                    cancelable: true
                });
                e.target.dispatchEvent(mouseEvent);
            }
        }, {passive: false});

        document.addEventListener('touchend', function(e) {
            const mouseEvent = new MouseEvent('mouseup', {
                bubbles: true,
                cancelable: true
            });
            e.target.dispatchEvent(mouseEvent);
        }, {passive: false});
    </script>
    <!-- wwg-mobile-patch-js-end -->

</body>

</html>
