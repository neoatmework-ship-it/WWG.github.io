<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PHARLOOM_SONG://WEAVER_QUIZ</title>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0d0608;
            --silk-red: #8b1d1d;
            --silk-gold: #c3a14e;
            --silk-white: #fdfdfd;
            --silk-shadow: #1a0a0d;
        }

        body {
            margin: 0;
            padding: 0;
            background: var(--bg);
            color: var(--silk-white);
            font-family: 'Share Tech Mono', monospace;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        #quiz-container {
            width: 800px;
            height: 500px;
            background: linear-gradient(135deg, #1a0a0d 0%, #0d0608 100%);
            border: 2px solid var(--silk-red);
            padding: 40px;
            position: relative;
            box-shadow: 0 0 100px rgba(139, 29, 29, 0.4);
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .header {
            position: absolute;
            top: 30px;
            left: 40px;
            right: 40px;
            display: flex;
            justify-content: space-between;
            border-bottom: 2px solid rgba(139, 29, 29, 0.3);
            padding-bottom: 10px;
        }

        .header h2 {
            margin: 0;
            color: var(--silk-gold);
            letter-spacing: 4px;
            font-size: 1.5rem;
        }

        .count {
            color: var(--silk-white);
            opacity: 0.6;
            font-size: 0.8rem;
        }

        /* ──── PROGRESS BAR ──── */
        .progress-wrap {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: rgba(0,0,0,0.5);
        }

        #progress-bar {
            height: 100%;
            width: 0%;
            background: var(--silk-white);
            box-shadow: 0 0 15px #fff;
            transition: width 0.5s ease;
        }

        /* ──── QUESTION ──── */
        #quiz-content {
            text-align: center;
            transition: 0.3s;
        }

        #question-text {
            font-size: 1.8rem;
            margin-bottom: 40px;
            line-height: 1.3;
            animation: textFade 0.5s ease;
        }

        @keyframes textFade {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            max-width: 600px;
            margin: 0 auto;
        }

        .option-btn {
            background: #0d0608;
            border: 1px solid #331111;
            color: #999;
            padding: 15px 20px;
            cursor: pointer;
            font-family: inherit;
            font-size: 1rem;
            transition: 0.2s;
            text-transform: uppercase;
            letter-spacing: 1px;
            position: relative;
            overflow: hidden;
        }

        .option-btn:hover {
            border-color: var(--silk-gold);
            color: #fff;
            background: #1a0a0d;
        }

        .option-btn.correct {
            background: #1d331d !important;
            border-color: #2ecc71 !important;
            color: #fff !important;
            box-shadow: 0 0 20px rgba(46, 204, 113, 0.3);
        }

        .option-btn.incorrect {
            background: #331d1d !important;
            border-color: #e74c3c !important;
            color: #fff !important;
        }

        /* ──── FINAL SCREEN ──── */
        #final-screen {
            text-align: center;
            display: none;
        }

        #final-screen h1 {
            font-size: 3rem;
            color: var(--silk-gold);
            margin-bottom: 10px;
        }

        .score-row {
            font-size: 1.5rem;
            margin-top: 20px;
            color: var(--silk-white);
        }

        .rank-box {
            margin-top: 30px;
            padding: 20px;
            border: 1px dashed var(--silk-red);
            font-size: 1.2rem;
            color: var(--silk-red);
        }

        .btn-restart {
            margin-top: 40px;
            background: var(--silk-white);
            color: #000;
            border: none;
            padding: 10px 30px;
            font-family: inherit;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-restart:hover { background: var(--silk-gold); }

        .hint {
            position: absolute;
            bottom: 20px;
            left: 40px;
            font-size: 0.6rem;
            color: #333;
            letter-spacing: 2px;
        }

    </style>
</head>
<body>

    <a href="index.html" style="position: fixed; top: 20px; right: 20px; color:#444; font-size:0.8rem; text-decoration:none;">← EXIT_ARCHIVE</a>

    <div id="quiz-container">
        <div class="header">
            <h2 id="quiz-title">THE_WEAVER_TEST</h2>
            <div class="count" id="question-count">01/10</div>
        </div>

        <div id="quiz-content">
            <div id="question-text">WHAT IS THE NAME OF THE FALLEN KINGDOM IN SILKSONG?</div>
            <div class="options" id="options-container">
                <!-- Options populated by JS -->
            </div>
        </div>

        <div id="final-screen">
            <div id="rank-title">ARCHIVE_COMPLETE</div>
            <h1 id="result-score">8/10</h1>
            <div class="score-row" id="result-text">KNOWLEDGE_RETAINED</div>
            <div class="rank-box" id="rank-box">RANK: WEAVER_ACOLYTE</div>
            <button class="btn-restart" onclick="location.reload()">RE-EXAMINE</button>
        </div>

        <div class="progress-wrap">
            <div id="progress-bar"></div>
        </div>

        <div class="hint">WEAVER_SYSTEM_LINK_STABLE // VERSION_2.1_SILK</div>
    </div>

    <script src="discovery.js"></script>
    <script>
        const quizData = [
            {
                q: "What is the name of the new kingdom Hornet explores in Silksong?",
                a: ["Pharloom", "Hallownest", "Dirtmouth", "Deepnest"],
                c: 0
            },
            {
                q: "What was Silksong originally planned as before becoming a sequel?",
                a: ["A Mobile Game", "Standalone DLC", "Art Book", "A Comic"],
                c: 1
            },
            {
                q: "What resource does Hornet consume to perform her 'Bind' healing?",
                a: ["Soul", "Geo", "Silk", "Honey"],
                c: 2
            },
            {
                q: "Hornet is known as the 'Gendered Child' being the daughter of the Pale King and...",
                a: ["The White Lady", "Herrah the Beast", "Mantis Lords", "Iselda"],
                c: 1
            },
            {
                q: "Which creature acts as the fast-travel mechanism in Pharloom?",
                a: ["The Last Stag", "Tramway", "Bell Beast", "Silk Carriage"],
                c: 2
            },
            {
                q: "Unlike the Knight, Hornet can perform which action while healing?",
                a: ["Attack", "Glide", "Teleport", "Heal In Mid-Air"],
                c: 3
            },
            {
                q: "What is the name of the memoriam boss added for a fan named Seth?",
                a: ["Seth", "Grimm", "Quirrel", "Zote"],
                c: 0
            },
            {
                q: "Instead of 'Nails', what do the citizens of Pharloom typically wield?",
                a: ["Swords", "Needles", "Pins", "Claws"],
                c: 2
            },
            {
                q: "Hornet's pogo attack is different in Silksong because it is...",
                a: ["Slower", "Diagonal", "Horizontal", "Explosive"],
                c: 1
            },
            {
                q: "What do fans affectionately call Hornet's fans/waiting community?",
                a: ["Silkies", "Skongers", "The Weavers", "Shaders"],
                c: 1
            }
        ];

        let currentIdx = 0;
        let score = 0;
        let canAnswer = true;

        const container = document.getElementById('quiz-content');
        const finalScreen = document.getElementById('final-screen');
        const qText = document.getElementById('question-text');
        const optContainer = document.getElementById('options-container');
        const progress = document.getElementById('progress-bar');
        const count = document.getElementById('question-count');

        function loadQuestion() {
            if (currentIdx >= quizData.length) {
                showResults();
                return;
            }

            canAnswer = true;
            const item = quizData[currentIdx];
            qText.textContent = item.q;
            count.textContent = `${(currentIdx + 1).toString().padStart(2, '0')}/${quizData.length}`;
            progress.style.width = ((currentIdx) / quizData.length * 100) + '%';

            optContainer.innerHTML = '';
            item.a.forEach((opt, index) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.textContent = opt;
                btn.onclick = () => selectOption(index, btn);
                optContainer.appendChild(btn);
            });
        }

        function selectOption(idx, btn) {
            if (!canAnswer) return;
            canAnswer = false;

            const correct = quizData[currentIdx].c;
            if (idx === correct) {
                score++;
                btn.classList.add('correct');
            } else {
                btn.classList.add('incorrect');
                optContainer.children[correct].classList.add('correct');
            }

            setTimeout(() => {
                currentIdx++;
                loadQuestion();
            }, 1000);
        }

        function showResults() {
            container.style.display = 'none';
            finalScreen.style.display = 'block';
            progress.style.width = '100%';
            
            const scoreDisplay = document.getElementById('result-score');
            scoreDisplay.textContent = `${score}/${quizData.length}`;

            const rankBox = document.getElementById('rank-box');
            if (score === 10) rankBox.textContent = "RANK: WEAVER_GENIUS";
            else if (score >= 7) rankBox.textContent = "RANK: PHARLOOM_SCHOLAR";
            else if (score >= 4) rankBox.textContent = "RANK: SILK_ACOLYTE";
            else rankBox.textContent = "RANK: DIM_LIGHT";

            if (score === 10 && typeof Discovery !== 'undefined') {
                 console.log("[SYSTEM] PERFECT_SCORE_DETECTED.");
            }
        }

        // Discovery Lock
        if (typeof Discovery !== 'undefined' && !Discovery.isUnlocked('mini-silksong')) {
            document.body.innerHTML = '<div style="height:100vh; background:#000; display:flex; flex-direction:column; align-items:center; justify-content:center; color:#fff; font-size:2rem; font-family: Share Tech Mono;">[VOID_UNAUTHORIZED]<br><span style="font-size: 1rem; color: #444; margin-top: 20px;">ACCESS THE ARCHIVES THROUGH THE DREAM_ARENA</span></div>';
            setTimeout(() => window.location.href = 'index.html', 1500);
        } else {
            loadQuestion();
        }
    </script>
</body>
</html>
