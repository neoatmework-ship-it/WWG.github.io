<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PHARLOOM_SONG://SILK_DEMO</title>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0d0608;
            --silk-red: #8b1d1d;
            --silk-gold: #c3a14e;
            --silk-white: #fdfdfd;
            --silk-shadow: #1a0a0d;
        }

        body {
            margin: 0;
            padding: 0;
            background: var(--bg);
            color: var(--silk-white);
            font-family: 'Share Tech Mono', monospace;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        #world-container {
            position: relative;
            width: 900px;
            height: 500px;
            background: linear-gradient(to bottom, #1a0a0d 0%, #0d0608 100%);
            border: 2px solid var(--silk-red);
            box-shadow: 0 0 100px rgba(139, 29, 29, 0.2);
            overflow: hidden;
        }

        /* ──── ATMOSPHERE ──── */
        .layer { position: absolute; inset: 0; pointer-events: none; }
        .back-pillars { background-image: linear-gradient(90deg, transparent 50%, rgba(255,255,255,0.02) 51%, transparent 52%); background-size: 150px 100%; opacity: 0.5; }
        .dust { position: absolute; width: 100%; height: 100%; background-image: radial-gradient(white 1px, transparent 1px); background-size: 50px 50px; opacity: 0.1; animation: rise 20s linear infinite; }
        @keyframes rise { from { transform: translateY(0); } to { transform: translateY(-500px); } }

        /* ──── HORNET ──── */
        #hornet {
            position: absolute; width: 60px; height: 90px;
            z-index: 100; transform-origin: center;
            transition: filter 0.2s;
        }

        #hornet-sprite {
            width: 100%; height: 100%;
            background: url('https://hollowknight.wiki/w/images/0/07/Hornet_idle_HK.png') no-repeat center;
            background-size: contain;
            filter: drop-shadow(0 0 10px rgba(139, 29, 29, 0.4));
        }

        /* ──── ENEMIES ──── */
        .crawler {
            position: absolute; width: 40px; height: 30px;
            background: #441a1a; border-radius: 20px 20px 5px 5px;
            box-shadow: 0 0 15px rgba(255,140,0,0.3);
            z-index: 50;
        }

        .silk-drop {
            position: absolute; width: 10px; height: 10px;
            background: #fff; border-radius: 50%;
            box-shadow: 0 0 10px #fff;
            animation: pulse 1s infinite alternate;
            z-index: 40;
        }

        @keyframes pulse { from { transform: scale(1); opacity: 0.6; } to { transform: scale(1.5); opacity: 1; } }

        /* ──── UI ──── */
        .overlay-ui {
            position: absolute; top: 30px; left: 30px; right: 30px;
            display: flex; justify-content: space-between; z-index: 200;
            pointer-events: none;
        }

        .silk-meter {
            width: 250px; height: 12px;
            background: rgba(255,255,255,0.05);
            border: 2px solid var(--silk-red);
            border-radius: 6px; overflow: hidden;
            box-shadow: 0 0 10px rgba(139, 29, 29, 0.3);
        }

        #silk-fill {
            height: 100%; width: 0%;
            background: var(--silk-white);
            box-shadow: 0 0 20px #fff;
            transition: width 0.2s cubic-bezier(0.18, 0.89, 0.32, 1.28);
        }

        .masks { display: flex; gap: 8px; margin-top: 10px; }
        .mask { width: 20px; height: 20px; background: #fff; clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%); opacity: 0.9; }
        .mask.broken { background: #331111; opacity: 0.2; }

        .hint { position: absolute; bottom: 20px; left: 30px; font-size: 0.7rem; color: #666; }

    </style>
</head>
<body>

    <a href="index.html" style="position: fixed; top: 20px; right: 20px; color:#444; text-decoration:none; font-size:0.8rem;">← HUB</a>

    <div id="world-container">
        <div id="cam-pivot" style="width:100%; height:100%;">
            <div class="layer back-pillars"></div>
            <div class="dust"></div>

            <div class="overlay-ui">
                <div>
                    <div style="font-size: 0.8rem; margin-bottom: 5px; color: var(--silk-red); letter-spacing: 2px;">SILK_WEAVE</div>
                    <div class="silk-meter"><div id="silk-fill"></div></div>
                    <div class="masks" id="masks">
                        <div class="mask"></div>
                        <div class="mask"></div>
                        <div class="mask"></div>
                        <div class="mask"></div>
                        <div class="mask"></div>
                    </div>
                </div>
                <div style="text-align: right">
                    <div style="font-size: 2rem; color: var(--silk-gold); letter-spacing: 4px;">PHARLOOM</div>
                    <div id="kill-count" style="font-size: 0.7rem; color: #666;">CRAWLERS_REMOVED: 0</div>
                </div>
            </div>

            <div id="hornet">
                <div id="hornet-sprite"></div>
            </div>

            <div id="entities"></div>

            <div class="hint">WASD / ARROWS: Move | SHIFT: Silk Dash | CLICK: Needle Throw | Q: Bind (Heal at full Silk)</div>
        </div>
    </div>

    <script>
        const hornet = document.getElementById('hornet');
        const container = document.getElementById('world-container');
        const entities = document.getElementById('entities');
        const silkFill = document.getElementById('silk-fill');
        const masks = document.getElementById('masks');
        const camPivot = document.getElementById('cam-pivot');
        
        let x = 100, y = 300, vx = 0, vy = 0, hp = 5, silk = 0, kills = 0;
        const speed = 7, friction = 0.85;
        const keys = {}, crawlers = [], drops = [];
        let shake = 0;

        function update() {
            if (shake > 0) {
                shake--;
                camPivot.style.transform = `translate(${(Math.random()-0.5)*shake}px, ${(Math.random()-0.5)*shake}px)`;
            } else {
                camPivot.style.transform = 'none';
            }

            // Movement
            if (keys['a'] || keys['arrowleft']) { vx = -speed; hornet.style.transform = 'scaleX(-1)'; }
            else if (keys['d'] || keys['arrowright']) { vx = speed; hornet.style.transform = 'scaleX(1)'; }
            else { vx *= friction; }

            if (keys['w'] || keys['arrowup']) vy = -speed;
            else if (keys['s'] || keys['arrowdown']) vy = speed;
            else { vy *= friction; }

            if (keys['q'] && silk >= 100 && hp < 5) bindSilk();

            x += vx; y += vy;

            // Boundaries
            x = Math.max(0, Math.min(x, 840));
            y = Math.max(50, Math.min(y, 400));

            hornet.style.left = x + 'px';
            hornet.style.top = y + 'px';

            // Enemy Logic
            if (Math.random() < 0.02 && crawlers.length < 5) spawnCrawler();
            
            crawlers.forEach((c, i) => {
                c.x += c.dir * 2;
                if (c.x < 0 || c.x > 860) c.dir *= -1;
                c.el.style.left = c.x + 'px';
                c.el.style.top = c.y + 'px';

                // Player Collision
                if (Math.abs(c.x - x) < 40 && Math.abs(c.y - y) < 40 && c.invuln === 0) {
                    takeDamage();
                }
            });

            // Drop Collection
            drops.forEach((d, i) => {
                if (Math.abs(d.x - x) < 60 && Math.abs(d.y - y) < 60) {
                    silk = Math.min(100, silk + 10);
                    silkFill.style.width = silk + '%';
                    d.el.remove();
                    drops.splice(i, 1);
                }
            });

            requestAnimationFrame(update);
        }

        function spawnCrawler() {
            const el = document.createElement('div');
            el.className = 'crawler';
            const c = { x: Math.random() < 0.5 ? -40 : 940, y: 100 + Math.random() * 300, dir: Math.random() < 0.5 ? 1 : -1, el, invuln: 0 };
            entities.appendChild(el);
            crawlers.push(c);
        }

        function takeDamage() {
            if (hornet.style.opacity === '0.5') return;
            hp--;
            shake = 15;
            updateMasks();
            hornet.style.opacity = '0.5';
            setTimeout(() => hornet.style.opacity = '1', 1000);
            if (hp <= 0) location.reload();
        }

        function updateMasks() {
            const m = masks.querySelectorAll('.mask');
            m.forEach((mask, i) => mask.classList.toggle('broken', i >= hp));
        }

        function dash() {
            shake = 5;
            x += (vx >= 0 ? 1 : -1) * 120;
            const trail = document.createElement('div');
            trail.style.cssText = `position:absolute; background:rgba(255,255,255,0.3); width:150px; height:2px; left:${x}px; top:${y+45}px; transition:0.3s;`;
            entities.appendChild(trail);
            setTimeout(() => { trail.style.opacity = '0'; setTimeout(() => trail.remove(), 300); }, 100);
        }

        function bindSilk() {
            silk = 0;
            silkFill.style.width = '0%';
            hp++;
            shake = 10;
            updateMasks();
            const burst = document.createElement('div');
            burst.style.cssText = `position:absolute; border:2px solid #fff; border-radius:50%; left:${x+30}px; top:${y+45}px; width:0; height:0; transition:0.5s; transform:translate(-50%,-50%);`;
            entities.appendChild(burst);
            setTimeout(() => { burst.style.width = '200px'; burst.style.height = '200px'; burst.style.opacity = '0'; }, 10);
        }

        function needleThrow(e) {
            const rect = container.getBoundingClientRect();
            const tx = e.clientX - rect.left, ty = e.clientY - rect.top;
            
            const needle = document.createElement('div');
            needle.style.cssText = `position:absolute; width:150px; height:2px; background:var(--silk-gold); left:${x+30}px; top:${y+45}px; transform-origin:left; transition:0.1s; box-shadow:0 0 10px var(--silk-gold); z-index:100;`;
            const angle = Math.atan2(ty - (y+45), tx - (x+30));
            needle.style.transform = `rotate(${angle}rad)`;
            entities.appendChild(needle);

            // Hit Check
            crawlers.forEach((c, i) => {
                const dx = c.x - tx, dy = c.y - ty;
                if (Math.abs(c.x - (x+30 + Math.cos(angle)*150)) < 60 && Math.abs(c.y - (y+45 + Math.sin(angle)*150)) < 60) {
                     killCrawler(i);
                }
            });

            setTimeout(() => { needle.style.width = '0'; setTimeout(() => needle.remove(), 100); }, 100);
        }

        function killCrawler(i) {
            const c = crawlers[i];
            kills++;
            document.getElementById('kill-count').textContent = `CRAWLERS_REMOVED: ${kills}`;
            
            // Drop Silk
            const dEl = document.createElement('div');
            dEl.className = 'silk-drop';
            dEl.style.left = c.x + 'px'; dEl.style.top = c.y + 'px';
            entities.appendChild(dEl);
            drops.push({ x: c.x, y: c.y, el: dEl });

            c.el.remove();
            crawlers.splice(i, 1);
            shake = 8;
        }

        window.addEventListener('keydown', (e) => {
            keys[e.key.toLowerCase()] = true;
            if (e.key === 'Shift') dash();
        });
        window.addEventListener('keyup', (e) => keys[e.key.toLowerCase()] = false);
        window.addEventListener('mousedown', needleThrow);
        
        requestAnimationFrame(update);

    </script>
</body>
</html>
