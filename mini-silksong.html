<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PHARLOOM_SONG://MINI_SILKSONG</title>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0d0608;
            --silk-red: #8b1d1d;
            --silk-gold: #c3a14e;
            --silk-white: #fdfdfd;
            --silk-shadow: #1a0a0d;
        }

        body {
            margin: 0;
            padding: 0;
            background: var(--bg);
            color: var(--silk-white);
            font-family: 'Share Tech Mono', monospace;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        #world-container {
            position: relative;
            width: 900px;
            height: 500px;
            background: linear-gradient(to bottom, #1a0a0d 0%, #0d0608 100%);
            border: 2px solid var(--silk-red);
            box-shadow: 0 0 100px rgba(139, 29, 29, 0.2);
            overflow: hidden;
        }

        /* Atmospheric Layers */
        .layer {
            position: absolute;
            inset: 0;
            pointer-events: none;
        }

        .back-pillars {
            background-image: 
                linear-gradient(90deg, transparent 50%, rgba(255,255,255,0.02) 51%, transparent 52%);
            background-size: 150px 100%;
            opacity: 0.5;
        }

        .dust-particles {
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: radial-gradient(white 1px, transparent 1px);
            background-size: 50px 50px;
            opacity: 0.1;
            animation: rise 20s linear infinite;
        }

        @keyframes rise {
            from { transform: translateY(0); }
            to { transform: translateY(-500px); }
        }

        /* Player Hornet */
        #hornet {
            position: absolute;
            left: 100px;
            top: 300px;
            width: 80px;
            height: 110px;
            transition: transform 0.1s;
            z-index: 100;
        }

        #hornet-sprite {
            width: 100%;
            height: 100%;
            background: url('https://hollowknight.wiki/w/images/0/07/Hornet_idle_HK.png') no-repeat center;
            background-size: contain;
            filter: drop-shadow(0 0 10px rgba(139, 29, 29, 0.4));
        }

        .silk-trail {
            position: absolute;
            height: 2px;
            background: #fff;
            opacity: 0.6;
            transform-origin: left;
            pointer-events: none;
        }

        /* UI */
        .overlay-ui {
            position: absolute;
            top: 30px;
            left: 30px;
            right: 30px;
            display: flex;
            justify-content: space-between;
            pointer-events: none;
        }

        .silk-meter {
            width: 200px;
            height: 15px;
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--silk-red);
            border-radius: 10px;
            overflow: hidden;
        }

        #silk-fill {
            height: 100%;
            width: 85%;
            background: var(--silk-white);
            box-shadow: 0 0 15px #fff;
            transition: width 0.3s;
        }

        .teaser-text {
            position: absolute;
            bottom: 40px;
            width: 100%;
            text-align: center;
            letter-spacing: 5px;
            text-transform: uppercase;
            font-size: 1.2rem;
            color: var(--silk-gold);
            text-shadow: 0 0 10px rgba(195, 161, 78, 0.3);
            pointer-events: none;
        }

        .btn-exit {
            position: fixed;
            top: 20px;
            right: 20px;
            color: #444;
            text-decoration: none;
            font-size: 0.8rem;
        }

        .btn-exit:hover { color: #fff; }

        .hint {
            position: absolute;
            top: 60px;
            left: 30px;
            font-size: 0.7rem;
            color: #666;
        }

    </style>
</head>
<body>

    <a href="index.html" class="btn-exit">RE-ENTER THE VOID</a>

    <div id="world-container">
        <div class="layer back-pillars"></div>
        <div class="dust-particles"></div>

        <div class="overlay-ui">
            <div>
                <div style="font-size: 0.8rem; margin-bottom: 5px; color: var(--silk-red)">SONG_METER</div>
                <div class="silk-meter"><div id="silk-fill"></div></div>
            </div>
            <div style="text-align: right">
                <div style="font-size: 1.5rem; color: var(--silk-gold)">PHARLOOM</div>
                <div style="font-size: 0.6rem; color: #444">SILK_ARCHIVE.01</div>
            </div>
        </div>

        <div class="hint">WASD / ARROWS to Move | SHIFT to Silk Dash | CLICK to Slash</div>

        <div id="hornet">
            <div id="hornet-sprite"></div>
        </div>

        <div class="teaser-text">Silk Awakens... Soon</div>
    </div>

    <script>
        const hornet = document.getElementById('hornet');
        const container = document.getElementById('world-container');
        let x = 100, y = 300;
        let vx = 0, vy = 0;
        const speed = 6;
        const keys = {};

        window.addEventListener('keydown', (e) => {
            keys[e.key.toLowerCase()] = true;
            if (e.key === 'Shift') dash();
        });

        window.addEventListener('keyup', (e) => {
            keys[e.key.toLowerCase()] = false;
        });

        window.addEventListener('mousedown', (e) => {
            slash(e);
        });

        function update() {
            if (keys['a'] || keys['arrowleft']) { vx = -speed; hornet.style.transform = 'scaleX(-1)'; }
            else if (keys['d'] || keys['arrowright']) { vx = speed; hornet.style.transform = 'scaleX(1)'; }
            else { vx *= 0.8; }

            if (keys['w'] || keys['arrowup']) vy = -speed;
            else if (keys['s'] || keys['arrowdown']) vy = speed;
            else { vy *= 0.8; }

            x += vx;
            y += vy;

            // Boundaries
            if (x < 0) x = 0;
            if (x > 820) x = 820;
            if (y < 50) y = 50;
            if (y > 380) y = 380;

            hornet.style.left = x + 'px';
            hornet.style.top = y + 'px';

            requestAnimationFrame(update);
        }

        function dash() {
            const trail = document.createElement('div');
            trail.className = 'silk-trail';
            trail.style.left = (x + 40) + 'px';
            trail.style.top = (y + 55) + 'px';
            trail.style.width = '200px';
            trail.style.transform = `rotate(${vx > 0 ? 0 : 180}deg)`;
            container.appendChild(trail);

            const oldX = x;
            x += (vx >= 0 ? 1 : -1) * 150;
            
            setTimeout(() => {
                trail.style.opacity = '0';
                setTimeout(() => trail.remove(), 200);
            }, 100);
        }

        function slash(e) {
            const rect = container.getBoundingClientRect();
            const clickX = e.clientX - rect.left;
            const clickY = e.clientY - rect.top;

            const needle = document.createElement('div');
            needle.style.position = 'absolute';
            needle.style.width = '100px';
            needle.style.height = '2px';
            needle.style.background = 'var(--silk-gold)';
            needle.style.left = (x + 40) + 'px';
            needle.style.top = (y + 55) + 'px';
            needle.style.transformOrigin = 'left';
            
            const angle = Math.atan2(clickY - (y + 55), clickX - (x + 40));
            needle.style.transform = `rotate(${angle}rad)`;
            needle.style.transition = 'width 0.1s ease-out, opacity 0.2s';
            needle.style.boxShadow = '0 0 10px var(--silk-gold)';
            
            container.appendChild(needle);

            setTimeout(() => {
                needle.style.width = '150px';
                setTimeout(() => {
                    needle.style.opacity = '0';
                    setTimeout(() => needle.remove(), 200);
                }, 100);
            }, 10);
        }

        requestAnimationFrame(update);

        // Gamepad Support (Inherited)
        setInterval(() => {
            const gp = navigator.getGamepads()[0];
            if (gp) {
                if (Math.abs(gp.axes[0]) > 0.3) {
                    vx = gp.axes[0] * speed;
                    hornet.style.transform = vx > 0 ? 'scaleX(1)' : 'scaleX(-1)';
                }
                if (Math.abs(gp.axes[1]) > 0.3) vy = gp.axes[1] * speed;
                
                if (gp.buttons[0].pressed) dash(); // A
                if (gp.buttons[2].pressed) { // X
                   // Simulated slash at center-forward
                   const mockE = { clientX: rect.left + x + (vx > 0 ? 200 : -200), clientY: rect.top + y + 55 };
                   // slash needs a real mouse event or a modified function
                }
            }
        }, 100);

    </script>
</body>
</html>
