<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Star Map</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; user-select:none; }
  body { background:#02020a; overflow:hidden; height:100vh; cursor:crosshair; font-family:'Plus Jakarta Sans',sans-serif; }
  canvas { position:absolute; inset:0; }
  #back { position:fixed; top:20px; left:20px; z-index:10; text-decoration:none; color:rgba(255,255,255,0.25); font-size:0.75rem; letter-spacing:2px; }
  #back:hover { color:#fff; }
  #tooltip {
    position:fixed; pointer-events:none; background:rgba(5,5,20,0.95);
    border:1px solid rgba(120,120,255,0.3); padding:16px 20px;
    font-family:'JetBrains Mono', monospace; font-size:0.72rem;
    color:#aac; line-height:1.8; z-index:20;
    box-shadow:0 0 30px rgba(80,80,255,0.2);
    transition:opacity 0.2s; opacity:0;
    max-width:260px;
  }
  #name-input-wrap {
    position:fixed; z-index:30; display:none;
    flex-direction:column; align-items:center; gap:12px;
    background:rgba(5,5,20,0.98); border:1px solid rgba(120,120,255,0.4);
    padding:24px; box-shadow:0 0 60px rgba(80,80,255,0.3);
  }
  #name-input-wrap label { font-size:0.7rem; letter-spacing:3px; color:#88f; text-transform:uppercase; }
  #star-name-input {
    background:transparent; border-bottom:2px solid #88f; color:#fff;
    font-family:'JetBrains Mono',monospace; font-size:1.2rem; padding:6px 0;
    outline:none; text-align:center; width:220px;
  }
  .nib { background:#4455ff; border:none; color:#fff; padding:10px 28px; cursor:pointer; font-family:'Plus Jakarta Sans',sans-serif; font-weight:700; letter-spacing:2px; margin-top:4px; }
  #hint { position:fixed; bottom:28px; width:100%; text-align:center; color:rgba(255,255,255,0.18); font-size:0.7rem; letter-spacing:3px; pointer-events:none; }
</style>
</head>
<body>
<a href="index.html" id="back">← BACK</a>
<canvas id="c"></canvas>
<div id="tooltip"></div>
<div id="name-input-wrap" id="niw">
  <label>Name This Star</label>
  <input id="star-name-input" type="text" placeholder="e.g. Bjorn Minor" maxlength="30" autocomplete="off">
  <button class="nib" id="name-btn">CONFIRM</button>
</div>
<div id="hint">HOVER STARS · CLICK TO NAME THEM</div>
<script>
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const tip = document.getElementById('tooltip');
  const niw = document.getElementById('name-input-wrap');
  const inp = document.getElementById('star-name-input');

  let W, H, stars = [], named = {}, activeIdx = -1, namingIdx = -1;

  const adjectives = ['Dim','Ancient','Burning','Cold','Silent','Restless','Forgotten','Hollow','Bright','Wandering','Distant','Collapsed','Endless','Pale','Cursed'];
  const nouns = ['Shepherd','Remnant','Shard','Beacon','Watcher','Echo','Pilgrim','Void','Cradle','Witness','Drifter','Ember','Giant','Dwarf','Nebula'];
  const facts = [
    'surface temp: 4,200°C (approx.)',
    'last blinked: unknowable',
    'visible to: 3 owls and one astronomer',
    'age: "old enough"',
    'contains: mostly regret and hydrogen',
    'wobble: detectable, unexplained',
    'has 0 confirmed planets (probably)',
    'spectral class: K (a little tired)',
    'brightness varies: yes. why: unknown',
    'distance: "far"',
    'named by: no one until now',
    'mood: indifferent',
  ];

  function resize() { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; buildStars(); }

  function buildStars() {
    stars = [];
    const n = Math.floor((W*H)/5000);
    for (let i=0; i<n; i++) {
      stars.push({
        x: Math.random()*W, y: Math.random()*H,
        r: 0.5 + Math.random()*2.5,
        bright: 0.3 + Math.random()*0.7,
        twinkle: Math.random()*Math.PI*2,
        speed: 0.005 + Math.random()*0.02,
        driftX: (Math.random()-0.5)*0.03,
        driftY: (Math.random()-0.5)*0.03,
        hue: Math.random()<0.7 ? 220 : (Math.random()<0.5 ? 30 : 180),
        fact: facts[Math.floor(Math.random()*facts.length)],
        nameFact: adjectives[Math.floor(Math.random()*adjectives.length)]+' '+nouns[Math.floor(Math.random()*nouns.length)],
      });
    }
  }

  resize(); window.addEventListener('resize', resize);

  let mx=-9, my=-9;
  canvas.addEventListener('mousemove', e => { mx=e.clientX; my=e.clientY; });

  canvas.addEventListener('click', e => {
    const idx = hitTest(e.clientX, e.clientY);
    if (idx < 0) { niw.style.display='none'; return; }
    namingIdx = idx;
    niw.style.display='flex';
    niw.style.left = Math.min(e.clientX+10, W-290)+'px';
    niw.style.top = Math.min(e.clientY+10, H-150)+'px';
    inp.value = named[idx]?.name || '';
    inp.focus();
  });

  document.getElementById('name-btn').addEventListener('click', confirmName);
  inp.addEventListener('keydown', e => { if(e.key==='Enter') confirmName(); if(e.key==='Escape') niw.style.display='none'; });

  function confirmName() {
    if (namingIdx < 0) return;
    const n = inp.value.trim();
    if (n) named[namingIdx] = { name: n };
    niw.style.display='none';
  }

  function hitTest(x,y) {
    for (let i=0; i<stars.length; i++) {
      const s=stars[i];
      const d=Math.sqrt((x-s.x)**2+(y-s.y)**2);
      if (d < Math.max(8, s.r*3)) return i;
    }
    return -1;
  }

  function draw() {
    ctx.fillStyle='rgba(2,2,10,0.15)';
    ctx.fillRect(0,0,W,H);

    const t = performance.now()/1000;
    let hovered = hitTest(mx, my);

    stars.forEach((s,i) => {
      s.x += s.driftX; s.y += s.driftY;
      if(s.x<0) s.x=W; if(s.x>W) s.x=0;
      if(s.y<0) s.y=H; if(s.y>H) s.y=0;
      s.twinkle += s.speed;
      const alpha = s.bright * (0.6 + 0.4*Math.sin(s.twinkle));
      const isHovered = i === hovered;
      const isNamed = named[i];
      const r = isHovered ? s.r*2.5 : s.r;

      // Glow
      if (isHovered || isNamed) {
        const g = ctx.createRadialGradient(s.x,s.y,0,s.x,s.y,r*8);
        g.addColorStop(0, `hsla(${s.hue},90%,70%,${0.3*alpha})`);
        g.addColorStop(1,'transparent');
        ctx.fillStyle=g;
        ctx.beginPath(); ctx.arc(s.x,s.y,r*8,0,Math.PI*2); ctx.fill();
      }

      ctx.beginPath();
      ctx.arc(s.x,s.y,r,0,Math.PI*2);
      ctx.fillStyle=`hsla(${s.hue},60%,90%,${alpha})`;
      ctx.shadowBlur = isHovered ? 20 : 4;
      ctx.shadowColor = `hsl(${s.hue},80%,70%)`;
      ctx.fill();

      // Name label
      if (named[i]) {
        ctx.font = '10px JetBrains Mono';
        ctx.fillStyle = `rgba(170,170,255,${0.5*alpha})`;
        ctx.fillText(named[i].name, s.x+s.r*2+4, s.y+4);
      }
    });
    ctx.shadowBlur=0;

    // Tooltip
    if (hovered >= 0) {
      const s = stars[hovered];
      const name = named[hovered]?.name || `Star #${hovered} (unnamed)`;
      tip.innerHTML = `<b style="color:#ccf">${name}</b><br>catalog id: ${hovered.toString(16).padStart(4,'0').toUpperCase()}<br>${s.fact}<br><span style="color:#666">click to rename</span>`;
      const tx = Math.min(mx+18, W-280), ty = Math.min(my+18, H-120);
      tip.style.left=tx+'px'; tip.style.top=ty+'px'; tip.style.opacity='1';
    } else {
      tip.style.opacity='0';
    }

    requestAnimationFrame(draw);
  }
  draw();
</script>
</body>
</html>
