<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Core</title>
    <link rel="icon"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🌋%3C/text%3E%3C/svg%3E">
    <style>
        body {
            margin: 0;
            background: #000;
            overflow: hidden;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .crust {
            position: relative;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            background: #222;
            box-shadow: inset 0 0 50px #000;
            overflow: hidden;
            cursor: pointer;
            transition: 0.2s;
        }

        .magma {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 0%;
            background: radial-gradient(circle at center, #fff, #ffae00, #ff0000);
            transition: height 0.5s ease-out;
            box-shadow: 0 -20px 50px #ffae00;
        }

        .crust:active {
            transform: scale(0.95);
        }

        .crust.erupt .magma {
            height: 150%;
            transition: height 2s ease-in;
        }

        .crust.erupt {
            box-shadow: 0 0 100px 50px rgba(255, 50, 0, 0.8), inset 0 0 50px #ff0;
        }

        .crack {
            position: absolute;
            background: #f40;
            box-shadow: 0 0 10px #ff0;
            opacity: 0;
            transition: 1s;
        }

        .c1 {
            top: 20%;
            left: 40%;
            width: 50px;
            height: 2px;
            transform: rotate(15deg);
        }

        .c2 {
            top: 50%;
            right: 20%;
            width: 80px;
            height: 3px;
            transform: rotate(-45deg);
        }

        .c3 {
            bottom: 30%;
            left: 10%;
            width: 100px;
            height: 4px;
            transform: rotate(30deg);
        }

        .crust.erupt .crack {
            opacity: 1;
        }

        body.erupt {
            background: #310;
            transition: 2s;
        }
    </style>
</head>

<body>
    <div class="crust" id="core">
        <div class="magma"></div>
        <div class="crack c1"></div>
        <div class="crack c2"></div>
        <div class="crack c3"></div>
    </div>

    <script src="discovery.js"></script>
    <script>
        Discovery.unlock('core');
        let heat = 0;
        const core = document.getElementById('core');
        const mag = core.querySelector('.magma');

        core.addEventListener('click', () => {
            heat += 20;
            if (heat > 100) heat = 100;
            mag.style.height = heat + '%';

            if (heat >= 100) {
                core.classList.add('erupt');
                document.body.classList.add('erupt');
                setTimeout(() => {
                    heat = 0;
                    core.classList.remove('erupt');
                    document.body.classList.remove('erupt');
                    mag.style.height = '0%';
                }, 4000);
            }
        });
    </script>
</body>

</html>
