<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cascade</title>
    <link rel="icon"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🌊%3C/text%3E%3C/svg%3E">
    <style>
        body {
            margin: 0;
            background: #011;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        canvas {
            display: block;
            filter: blur(1px);
        }

        .text {
            position: absolute;
            bottom: 40px;
            color: cyan;
            font-family: sans-serif;
            letter-spacing: 15px;
            pointer-events: none;
            opacity: 0.5;
        }
    </style>
</head>

<body>
    <div class="text">CASCADE</div>
    <canvas id="c"></canvas>
    <script src="discovery.js"></script>
    <script>
        Discovery.unlock('cascade');
        const canvas = document.getElementById('c');
        const ctx = canvas.getContext('2d');
        let w = canvas.width = window.innerWidth;
        let h = canvas.height = window.innerHeight;

        const drops = [];
        for (let i = 0; i < 800; i++) {
            drops.push({
                x: Math.random() * w,
                y: Math.random() * -h,
                vy: Math.random() * 10 + 5,
                l: Math.random() * 20 + 10,
                opacity: Math.random() * 0.5 + 0.1
            });
        }

        function draw() {
            ctx.fillStyle = 'rgba(0,17,17,0.3)';
            ctx.fillRect(0, 0, w, h);

            ctx.strokeStyle = '#0ff';
            ctx.lineWidth = 1.5;
            ctx.lineCap = 'round';

            drops.forEach(d => {
                ctx.globalAlpha = d.opacity;
                ctx.beginPath();
                ctx.moveTo(d.x, d.y);
                ctx.lineTo(d.x, d.y + d.l);
                ctx.stroke();

                d.y += d.vy;
                if (d.y > h) {
                    d.y = -d.l;
                    d.x = Math.random() * w;
                }
            });
            requestAnimationFrame(draw);
        }
        draw();

        window.addEventListener('resize', () => {
            w = canvas.width = window.innerWidth;
            h = canvas.height = window.innerHeight;
        });
    </script>
</body>

</html>
