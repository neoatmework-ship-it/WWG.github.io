<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E👤%3C/text%3E%3C/svg%3E">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Identity Hub | Avatar Customization</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #050508;
            --accent: #a78bfa;
            --coin: #ffd700;
            --glass: rgba(255, 255, 255, 0.05);
            --border: rgba(255, 255, 255, 0.1);
        }

        body {
            background: var(--bg);
            color: #fff;
            font-family: 'Outfit', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 80px 20px;
            margin: 0;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(167, 139, 250, 0.05), transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(255, 0, 85, 0.05), transparent 40%);
        }

        .main-layout {
            display: grid;
            grid-template-columns: 1fr 1.5fr;
            max-width: 1200px;
            margin: 0 auto;
            gap: 60px;
            width: 100%;
        }

        .avatar-preview-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: sticky;
            top: 80px;
        }

        .avatar-container {
            width: 220px;
            height: 220px;
            background: var(--glass);
            border: 2px solid var(--border);
            border-radius: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 6rem;
            position: relative;
            box-shadow: 0 30px 60px rgba(0,0,0,0.5);
            transition: 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .aura {
            position: absolute;
            inset: -15px;
            border-radius: 45px;
            filter: blur(25px);
            opacity: 0.3;
            z-index: -1;
            transition: 0.3s;
        }

        .badge {
            position: absolute;
            bottom: -10px;
            right: -10px;
            background: var(--accent);
            padding: 6px 16px;
            border-radius: 50px;
            font-size: 0.8rem;
            font-weight: 800;
            text-transform: uppercase;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            letter-spacing: 1px;
        }

        .controls {
            background: var(--glass);
            border: 1px solid var(--border);
            padding: 40px;
            border-radius: 32px;
            backdrop-filter: blur(20px);
        }

        .option-group { margin-bottom: 40px; }

        .option-label {
            display: block;
            font-size: 0.8rem;
            color: rgba(255,255,255,0.4);
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .option-grid { display: flex; gap: 15px; flex-wrap: wrap; }

        .item-card {
            padding: 12px 24px;
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--border);
            border-radius: 12px;
            cursor: pointer;
            font-size: 1rem;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .item-card:hover { background: rgba(255,255,255,0.1); border-color: rgba(255,255,255,0.3); }

        .item-card.active {
            border-color: var(--accent);
            background: rgba(167, 139, 250, 0.1);
            color: var(--accent);
            box-shadow: 0 0 20px rgba(167, 139, 250, 0.2);
        }

        .locked-item { opacity: 0.4; filter: grayscale(1); }
        .locked-item:hover { filter: grayscale(0.5); }

        .price-tag {
            font-size: 0.75rem;
            color: var(--coin);
            font-family: 'Share Tech Mono', monospace;
            font-weight: bold;
        }

        .guide-panel {
            margin-top: 40px;
            padding: 25px;
            background: rgba(0,0,0,0.3);
            border: 1px dashed rgba(255,255,255,0.1);
            border-radius: 20px;
        }
        .quest-item {
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
        }
        .quest-req { color: #888; font-style: italic; }

        .back-btn {
            position: fixed; top: 40px; left: 40px;
            text-decoration: none; color: rgba(255,255,255,0.3);
            font-size: 0.8rem; letter-spacing: 2px; z-index: 1000;
        }
        .back-btn:hover { color: #fff; }

        .save-banner {
            position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%);
            background: #4ade80; color: #000; padding: 10px 30px;
            border-radius: 50px; font-weight: bold; display: none;
            z-index: 2000;
        }

        /* Polish FX */
        .items-locked-pulse { animation: locked-pulse 2s infinite ease-in-out; }
        @keyframes locked-pulse {
            0%, 100% { box-shadow: 0 0 5px rgba(255, 255, 255, 0.05); }
            50% { box-shadow: 0 0 20px rgba(167, 139, 250, 0.2); }
        }
        .transforming {
            animation: transform-flash 0.5s ease-out forwards;
        }
        @keyframes transform-flash {
            0% { filter: brightness(1); transform: scale(1); }
            50% { filter: brightness(5); transform: scale(1.1); }
            100% { filter: brightness(1); transform: scale(1); }
        }
    </style>
</head>
<body>

    <a href="index.html" class="back-btn">← RETURN TO HUB</a>

    <div class="main-layout">
        <div class="avatar-preview-section">
            <div class="avatar-container" id="avatar-view">
                <div class="aura" id="aura-view"></div>
                <div id="emoji-view">👾</div>
                <div class="badge" id="badge-view">EXPLORER</div>
            </div>
            <h2 style="margin-top: 25px; margin-bottom: 5px; font-size: 2rem;" id="nickname-view">Void_Visitor</h2>
            <div class="price-tag" style="font-size: 1.2rem;">🪙 <span class="coin-balance-val">0</span> COINS</div>
        </div>

        <div class="controls">
            <div class="option-group">
                <span class="option-label">Reward Identities</span>
                <div class="option-grid">
                    <div class="item-card active" onclick="resetAvatar()">👾 Visitor</div>
                    <!-- Reward Identities -->
                    <div class="item-card locked-item" id="judge-item" onclick="setRewardAvatar('judge')">
                        ⚖️ Judge <span class="price-tag">REWARD</span>
                    </div>
                </div>
            </div>

            <div class="option-group">
                <span class="option-label">System Title</span>
                <input type="text" id="badge-input" placeholder="Title..." maxlength="12" oninput="setBadge(this.value)" 
                style="width: 100%; background: rgba(255,255,255,0.05); border: 1px solid var(--border); padding: 15px; border-radius: 12px; color:#fff; font-family:'Share Tech Mono'; font-size: 1.2rem;">
            </div>

            <div class="guide-panel">
                <span class="option-label">The Only Trial</span>
                <div class="quest-item"><span>THE JUDGE</span><span class="quest-req">Survive the 30-second final attack in the Secret Hub.</span></div>
            </div>
        </div>
    </div>

    <div class="save-banner" id="save-banner">IDENTITY SAVED</div>

    <script src="transitions.js"></script>
    <script src="economy.js"></script>
    <script>
        const STORAGE_KEY = 'wwg_avatar_data';
        let avatarData = {
            emoji: '👾',
            aura: 'transparent',
            badge: 'EXPLORER',
            nickname: 'Void_Visitor',
            unlocked: []
        };

        const REWARDS = {
            'judge': { emoji: '⚖️', name: 'JUDGEMENT', aura: '#0cf', badge: 'THE JUDGE', key: 'the-judge' }
        };

        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) avatarData = JSON.parse(saved);

        function updatePreview() {
            const container = document.getElementById('avatar-view');
            container.classList.remove('transforming');
            void container.offsetWidth; // Trigger reflow
            container.classList.add('transforming');

            const emojiEl = document.getElementById('emoji-view');
            emojiEl.textContent = avatarData.emoji;
            document.getElementById('aura-view').style.background = avatarData.aura;
            document.getElementById('badge-view').textContent = avatarData.badge;
            document.getElementById('nickname-view').textContent = avatarData.nickname;
            document.getElementById('badge-input').value = avatarData.badge;
            
            // Unlock reward cards
            Object.entries(REWARDS).forEach(([id, config]) => {
                const item = document.getElementById(id + '-item');
                if (avatarData.unlocked.includes(config.key)) {
                    item.classList.remove('locked-item', 'items-locked-pulse');
                    item.querySelector('.price-tag').textContent = 'UNLOCKED';
                    item.querySelector('.price-tag').style.color = '#4ade80';
                } else {
                    item.classList.add('items-locked-pulse');
                }
            });

            save();
        }

        function resetAvatar() {
            avatarData.emoji = '👾';
            avatarData.nickname = 'Void_Visitor';
            avatarData.aura = 'transparent';
            avatarData.badge = 'EXPLORER';
            updatePreview();
        }

        function setRewardAvatar(id) {
            const config = REWARDS[id];
            if (!avatarData.unlocked.includes(config.key)) {
                alert(`REQUIREMENT NOT MET: Defeat Sans to win judgement.`);
                return;
            }
            avatarData.emoji = config.emoji;
            avatarData.nickname = config.name;
            avatarData.aura = config.aura;
            avatarData.badge = config.badge;
            updatePreview();
        }

        function setBadge(text) {
            avatarData.badge = (text || 'EXPLORER').toUpperCase();
            document.getElementById('badge-view').textContent = avatarData.badge;
            save();
        }

        function save() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(avatarData));
            const banner = document.getElementById('save-banner');
            banner.style.display = 'block';
            setTimeout(() => banner.style.display = 'none', 1000);
        }

        updatePreview();
    </script>
</body>
</html>
