<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lattice</title>
    <link rel="icon"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🕸️%3C/text%3E%3C/svg%3E">
    <style>
        body {
            margin: 0;
            background: #080f15;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            color: #fff;
            font-family: sans-serif;
        }

        canvas {
            display: block;
            position: absolute;
            inset: 0;
        }

        .label {
            position: relative;
            z-index: 10;
            font-size: 3rem;
            font-weight: 300;
            letter-spacing: 0.5rem;
            text-shadow: 0 0 20px rgba(0, 255, 255, 0.5);
            pointer-events: none;
        }
    </style>
</head>

<body>
    <div class="label">LATTICE</div>
    <canvas id="c"></canvas>
    <script src="discovery.js"></script>
    <script>
        Discovery.unlock('lattice');

        const canvas = document.getElementById('c');
        const ctx = canvas.getContext('2d');
        let w = canvas.width = window.innerWidth;
        let h = canvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            w = canvas.width = window.innerWidth;
            h = canvas.height = window.innerHeight;
            init();
        });

        let particles = [];
        const numParticles = 100;
        let mouse = { x: w / 2, y: h / 2, r: 150 };

        window.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });

        function init() {
            particles = [];
            for (let i = 0; i < numParticles; i++) {
                particles.push({
                    x: Math.random() * w,
                    y: Math.random() * h,
                    vx: (Math.random() - 0.5) * 1.5,
                    vy: (Math.random() - 0.5) * 1.5,
                    r: Math.random() * 2 + 1
                });
            }
        }

        function draw() {
            ctx.clearRect(0, 0, w, h);

            for (let i = 0; i < numParticles; i++) {
                let p = particles[i];
                p.x += p.vx;
                p.y += p.vy;

                if (p.x < 0 || p.x > w) p.vx *= -1;
                if (p.y < 0 || p.y > h) p.vy *= -1;

                ctx.beginPath();
                ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                ctx.fillStyle = '#0ff';
                ctx.fill();

                // Connect to mouse
                let dx = mouse.x - p.x;
                let dy = mouse.y - p.y;
                let dist = Math.sqrt(dx * dx + dy * dy);
                if (dist < mouse.r) {
                    ctx.beginPath();
                    ctx.moveTo(p.x, p.y);
                    ctx.lineTo(mouse.x, mouse.y);
                    ctx.strokeStyle = `rgba(0, 255, 255, ${1 - dist / mouse.r})`;
                    ctx.lineWidth = 1;
                    ctx.stroke();
                }

                // Connect to others
                for (let j = i + 1; j < numParticles; j++) {
                    let p2 = particles[j];
                    let dx2 = p2.x - p.x;
                    let dy2 = p2.y - p.y;
                    let dist2 = Math.sqrt(dx2 * dx2 + dy2 * dy2);
                    if (dist2 < 100) {
                        ctx.beginPath();
                        ctx.moveTo(p.x, p.y);
                        // Add some color variance
                        ctx.strokeStyle = `rgba(0, ${150 + dist2}, 255, ${0.5 - dist2 / 200})`;
                        ctx.lineTo(p2.x, p2.y);
                        ctx.stroke();
                    }
                }
            }
            requestAnimationFrame(draw);
        }

        init();
        draw();
    </script>
</body>

</html>
