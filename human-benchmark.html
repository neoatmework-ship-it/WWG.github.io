<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E⏱️%3C/text%3E%3C/svg%3E">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Human Benchmark Map — Global Performance</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;500;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0a0a0f;
            --card: #161625;
            --accent: #34d399;
            --text: #f8fafc;
            --text-sub: #94a3b8;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 40px;
            display: grid;
            grid-template-columns: 350px 1fr;
            gap: 40px;
            height: 100vh;
            box-sizing: border-box;
            overflow: hidden;
        }

        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .card {
            background: var(--card);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            padding: 24px;
        }

        h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.5rem;
            margin: 0 0 10px 0;
            color: var(--accent);
        }

        .test-grid {
            display: grid;
            gap: 15px;
        }

        .test-btn {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 15px;
            border-radius: 12px;
            color: var(--text);
            text-align: left;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
        }

        .test-btn:hover:not(.active) {
            background: rgba(52, 211, 153, 0.1);
            border-color: var(--accent);
        }

        .test-btn.active {
            background: var(--accent);
            color: #000;
            font-weight: 700;
        }

        .test-area {
            background: var(--card);
            border-radius: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            cursor: pointer;
            overflow: hidden;
            position: relative;
            transition: 0.2s;
        }

        .instruction {
            font-size: 2rem;
            font-weight: 800;
            text-align: center;
            pointer-events: none;
            max-width: 80%;
            z-index: 5;
        }

        /* Typing Styles */
        #typing-input {
            position: absolute;
            opacity: 0;
            pointer-events: none;
        }
        .words-container {
            font-size: 1.5rem;
            line-height: 1.8;
            color: var(--text-sub);
            padding: 40px;
            max-width: 600px;
            text-align: left;
            user-select: none;
        }
        .word { margin-right: 12px; display: inline-block; }
        .word.current { color: var(--text); border-bottom: 2px solid var(--accent); }
        .word.correct { color: var(--accent); }
        .word.wrong { color: #ef4444; }

        /* Memory Styles */
        .memory-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            width: 300px;
        }
        .memory-tile {
            aspect-ratio: 1;
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
            transition: 0.1s;
        }
        .memory-tile.active { background: var(--accent); box-shadow: 0 0 20px var(--accent); }

        #map-container {
            margin-top: auto;
            height: 200px;
            position: relative;
            background: #000;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            color: var(--text-sub);
            overflow: hidden;
        }

        .stat-val {
            font-size: 2rem;
            font-weight: 700;
            color: var(--accent);
            margin: 10px 0;
        }

        .back-link {
            position: fixed;
            top: 20px;
            left: 20px;
            color: var(--text-sub);
            text-decoration: none;
            font-size: 0.8rem;
            z-index: 100;
        }
    </style>
</head>
<body>

    <a href="index.html" class="back-link">← BACK</a>

    <div class="sidebar">
        <div class="card">
            <h1>Human Benchmark</h1>
            <p style="font-size: 0.9rem; color: var(--text-sub);">Test your cognitive performance and compare with the world.</p>
        </div>

        <div class="test-grid">
            <button class="test-btn active" id="btn-reaction" onclick="switchTest('reaction')">⚡ Reaction Time</button>
            <button class="test-btn" id="btn-typing" onclick="switchTest('typing')">⌨️ Typing Speed</button>
            <button class="test-btn" id="btn-memory" onclick="switchTest('memory')">🧠 Sequence Memory</button>
        </div>

        <div class="card" id="results-card">
            <div style="font-size: 0.8rem; text-transform: uppercase; color: var(--text-sub);">Your Best</div>
            <div class="stat-val" id="best-score">---</div>
            <div id="rank-text" style="font-size: 0.9rem;">Start a test to see rank</div>
        </div>

        <div id="map-container">
            <svg viewBox="0 0 800 400" style="width: 100%; height: 100%; opacity: 0.3;">
                <path d="M150,150 Q200,100 250,150 T350,150" fill="none" stroke="var(--accent)" stroke-width="1"/>
                <circle cx="150" cy="150" r="3" fill="var(--accent)"/>
                <circle cx="250" cy="150" r="3" fill="var(--accent)"/>
                <circle cx="350" cy="150" r="3" fill="var(--accent)"/>
            </svg>
            <div style="position: absolute; bottom: 10px; left: 10px; font-size: 0.7rem; opacity: 0.5;">LIVE GLOBAL TRAFFIC</div>
        </div>
    </div>

    <div class="test-area" id="main-test">
        <!-- Content dynamic via JS -->
    </div>

    <input type="text" id="typing-input">

    <script src="discovery.js"></script>
    <script>
        Discovery.unlock('human-benchmark');

        const testArea = document.getElementById('main-test');
        let currentMode = 'reaction';
        let state = 'idle';
        let timer, startTime;

        // Reaction Test State
        function initReaction() {
            state = 'idle';
            testArea.style.background = 'var(--card)';
            testArea.innerHTML = `
                <div class="instruction">Click to start Reaction Test</div>
                <div style="margin-top: 10px; opacity: 0.7;">Wait for RED to turn GREEN</div>
            `;
        }

        function runReaction() {
            if(state === 'idle' || state === 'result') {
                state = 'waiting';
                testArea.style.background = '#ef4444';
                testArea.innerHTML = `<div class="instruction">WAIT FOR GREEN...</div>`;
                const delay = 2000 + Math.random() * 3000;
                timer = setTimeout(() => {
                    state = 'click';
                    testArea.style.background = '#10b981';
                    testArea.innerHTML = `<div class="instruction">CLICK NOW!</div>`;
                    startTime = Date.now();
                }, delay);
            } else if (state === 'waiting') {
                clearTimeout(timer);
                state = 'result';
                testArea.style.background = '#334155';
                testArea.innerHTML = `<div class="instruction">TOO EARLY!</div><p>Click to try again</p>`;
            } else if (state === 'click') {
                const ms = Date.now() - startTime;
                state = 'result';
                testArea.style.background = 'var(--bg)';
                testArea.innerHTML = `<div class="instruction">${ms}ms</div><p>Top ${Math.max(1, Math.floor(ms/10))}% globally. Click to retry.</p>`;
                updateStats(ms + 'ms', `Rank: #` + (Math.floor(ms * 1.5) % 1000));
            }
        }

        // Typing Test State
        const SENTENCE = "The quick brown fox jumps over the lazy dog in a strange digital landscape where speed is the only currency of the soul.";
        let currentWordIndex = 0;
        
        function initTyping() {
            state = 'idle';
            testArea.style.background = 'var(--card)';
            testArea.innerHTML = `
                <div class="words-container" id="words-wrap"></div>
                <div class="instruction" style="font-size: 1.2rem; margin-top: 20px;">Type the text above to start.</div>
            `;
            const wrap = document.getElementById('words-wrap');
            wrap.innerHTML = SENTENCE.split(' ').map((w, i) => `<span class="word" id="word-${i}">${w}</span>`).join('');
            document.getElementById('word-0').classList.add('current');
            
            document.getElementById('typing-input').value = '';
            document.getElementById('typing-input').focus();
            currentWordIndex = 0;
        }

        document.getElementById('typing-input').oninput = (e) => {
            if(currentMode !== 'typing') return;
            const val = e.target.value;
            
            if(state === 'idle') {
                state = 'playing';
                startTime = Date.now();
            }

            const words = SENTENCE.split(' ');
            const targetWord = words[currentWordIndex];

            if(val.endsWith(' ')) {
                const cleanVal = val.trim();
                const wordEl = document.getElementById(`word-${currentWordIndex}`);
                wordEl.classList.remove('current');
                
                if(cleanVal === targetWord) {
                    wordEl.classList.add('correct');
                } else {
                    wordEl.classList.add('wrong');
                }

                currentWordIndex++;
                e.target.value = '';

                if(currentWordIndex >= words.length) {
                    const elapsed = (Date.now() - startTime) / 1000 / 60;
                    const wpm = Math.round(words.length / elapsed);
                    state = 'result';
                    testArea.innerHTML = `<div class="instruction">${wpm} WPM</div><p>Click Area to Reset.</p>`;
                    updateStats(wpm + ' WPM', `Faster than 88% of users.`);
                } else {
                    document.getElementById(`word-${currentWordIndex}`).classList.add('current');
                }
            }
        };

        // Memory Test State
        let sequence = [];
        let userSequence = [];
        let level = 1;

        function initMemory() {
            state = 'idle';
            level = 1;
            sequence = [];
            testArea.style.background = 'var(--card)';
            testArea.innerHTML = `
                <div class="instruction">Sequence Memory</div>
                <p>Watch the pattern, then repeat it.</p>
                <button class="test-btn" style="margin-top: 20px;" onclick="startMemory()">START</button>
            `;
        }

        function startMemory() {
            state = 'showing';
            userSequence = [];
            sequence.push(Math.floor(Math.random() * 9));
            renderMemoryGrid();
            playSequence();
        }

        function renderMemoryGrid() {
            testArea.innerHTML = `
                <div style="margin-bottom: 20px;">Level: ${level}</div>
                <div class="memory-grid">
                    ${[0,1,2,3,4,5,6,7,8].map(i => `<div class="memory-tile" id="tile-${i}" onclick="handleMemoryClick(${i})"></div>`).join('')}
                </div>
            `;
        }

        async function playSequence() {
            state = 'showing';
            for(let id of sequence) {
                await new Promise(r => setTimeout(r, 600));
                const tile = document.getElementById(`tile-${id}`);
                tile.classList.add('active');
                await new Promise(r => setTimeout(r, 400));
                tile.classList.remove('active');
            }
            state = 'playing';
        }

        function handleMemoryClick(id) {
            if(state !== 'playing') return;
            
            const tile = document.getElementById(`tile-${id}`);
            tile.classList.add('active');
            setTimeout(() => tile.classList.remove('active'), 100);

            userSequence.push(id);
            if(userSequence[userSequence.length-1] !== sequence[userSequence.length-1]) {
                state = 'result';
                testArea.innerHTML = `<div class="instruction">Score: ${level}</div><p>Wrong sequence. Click to try again.</p>`;
                updateStats('Level ' + level, `Global Avg: Level 7`);
                return;
            }

            if(userSequence.length === sequence.length) {
                level++;
                setTimeout(startMemory, 1000);
            }
        }

        // Global Orchestration
        function switchTest(mode) {
            currentMode = mode;
            document.querySelectorAll('.test-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(`btn-${mode}`).classList.add('active');
            
            if(mode === 'reaction') initReaction();
            if(mode === 'typing') initTyping();
            if(mode === 'memory') initMemory();
        }

        testArea.onclick = (e) => {
            if(e.target.tagName === 'BUTTON') return;
            if(currentMode === 'reaction') runReaction();
            if(currentMode === 'typing' && state === 'result') initTyping();
            if(currentMode === 'memory' && state === 'result') initMemory();
        };

        function updateStats(score, rank) {
            document.getElementById('best-score').textContent = score;
            document.getElementById('rank-text').textContent = rank;
        }

        initReaction();
    </script>
<script>
    if(/Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent)){
        document.body.innerHTML += '<a href="index.html" style="position:fixed;bottom:20px;right:20px;background:#000;color:#fff;padding:10px 20px;border-radius:30px;text-decoration:none;z-index:9999;border:1px solid #333;font-family:sans-serif;font-size:14px;">Back to Gallery</a>';
    }
</script>
</body>
</html>
