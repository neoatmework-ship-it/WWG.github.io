<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aurora</title>
    <link rel="icon"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🌌%3C/text%3E%3C/svg%3E">
    <style>
        body {
            margin: 0;
            background: #010a15;
            overflow: hidden;
            height: 100vh;
        }

        canvas {
            display: block;
            filter: blur(20px);
        }

        .stars {
            position: absolute;
            inset: 0;
            background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200"><circle cx="10" cy="10" r="1" fill="white" opacity="0.8"/><circle cx="100" cy="80" r="1.5" fill="white" opacity="0.5"/><circle cx="180" cy="150" r="0.5" fill="white" opacity="0.9"/></svg>');
            pointer-events: none;
            z-index: 1;
        }

        .title {
            position: absolute;
            bottom: 30px;
            left: 30px;
            color: rgba(255, 255, 255, 0.4);
            font-family: sans-serif;
            font-size: 2rem;
            letter-spacing: 5px;
            z-index: 10;
            pointer-events: none;
        }
    </style>
</head>

<body>
    <div class="stars"></div>
    <canvas id="c"></canvas>
    <div class="title">AURORA</div>

    <script src="discovery.js"></script>
    <script>
        Discovery.unlock('aurora');

        const canvas = document.getElementById('c');
        const ctx = canvas.getContext('2d');
        let w = canvas.width = window.innerWidth;
        let h = canvas.height = window.innerHeight;

        let mouseX = w / 2;
        window.addEventListener('mousemove', e => { mouseX = e.clientX; });

        let time = 0;

        function draw() {
            ctx.clearRect(0, 0, w, h);
            time += 0.01;

            const bands = 5;
            for (let i = 0; i < bands; i++) {
                ctx.beginPath();
                ctx.moveTo(-100, h);

                const shift = Math.sin(time + i) * 200 + (mouseX - w / 2) * 0.5;

                for (let x = -100; x < w + 100; x += 50) {
                    const y = h / 2 + Math.sin(x * 0.005 + time * 2 + i) * 150 + Math.cos(x * 0.002 - time) * 100;
                    ctx.lineTo(x, y + shift - (i * 50));
                }

                ctx.lineTo(w + 100, h);
                ctx.closePath();

                // Color based on band and time
                const hue = 120 + i * 20 + Math.sin(time) * 30;
                ctx.fillStyle = `hsla(${hue}, 100%, 50%, 0.15)`;
                ctx.fill();
            }
            requestAnimationFrame(draw);
        }
        draw();

        window.addEventListener('resize', () => {
            w = canvas.width = window.innerWidth;
            h = canvas.height = window.innerHeight;
        });
    </script>
</body>

</html>
