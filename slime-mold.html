<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slime Mold</title>
    <meta name="description" content="Watch Physarum polycephalum organisms seek food and build networks.">
    <link rel="icon"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🦠%3C/text%3E%3C/svg%3E">
    <style>
        body {
            margin: 0;
            background: #000;
            overflow: hidden;
            font-family: sans-serif;
        }

        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            cursor: crosshair;
        }

        .hud {
            position: absolute;
            top: 20px;
            left: 20px;
            color: rgba(160, 255, 100, 0.6);
            pointer-events: none;
        }

        .hud a {
            color: rgba(160, 255, 100, 0.8);
            text-decoration: none;
            pointer-events: auto;
            font-weight: bold;
        }

        .hud a:hover {
            color: #fff;
        }

        h1 {
            margin: 0 0 5px;
            font-size: 1.5rem;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        p {
            margin: 0;
            font-size: 0.9rem;
        }
    </style>
</head>

<body>
    <div class="hud">
        <a href="index.html">← GALLERY</a>
        <br><br>
        <h1>Slime Mold</h1>
        <p>Physarum polycephalum routing simulation</p>
        <p>Move mouse to drop food attractants</p>
    </div>

    <canvas id="c"></canvas>

    <script>
        const canvas = document.getElementById('c');
        const ctx = canvas.getContext('2d');
        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        // Settings
        const numAgents = 8000;
        const moveSpeed = 2;
        const sensorAngle = 0.5; // radians
        const sensorDist = 15;
        const turnSpeed = 0.3;

        let agents = [];

        // Pheromone trail map
        let trailMap = new Float32Array(width * height);

        let mouseX = width / 2;
        let mouseY = height / 2;

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            trailMap = new Float32Array(width * height);
            initAgents();
        });

        window.addEventListener('mousemove', e => {
            mouseX = e.clientX;
            mouseY = e.clientY;
        });
        window.addEventListener('touchmove', e => {
            mouseX = e.touches[0].clientX;
            mouseY = e.touches[0].clientY;
        });

        function initAgents() {
            agents = [];
            // Spawn in a circle
            const cx = width / 2;
            const cy = height / 2;
            const radius = Math.min(width, height) * 0.2;

            for (let i = 0; i < numAgents; i++) {
                const angle = Math.random() * Math.PI * 2;
                const r = Math.random() * radius;
                agents.push({
                    x: cx + Math.cos(angle) * r,
                    y: cy + Math.sin(angle) * r,
                    angle: angle + Math.PI // Face outward initially or inward
                });
            }
        }

        function getIndex(x, y) {
            return Math.floor(y) * width + Math.floor(x);
        }

        function sense(agent, angleOffset) {
            const angle = agent.angle + angleOffset;
            const sx = agent.x + Math.cos(angle) * sensorDist;
            const sy = agent.y + Math.sin(angle) * sensorDist;

            if (sx >= 0 && sx < width && sy >= 0 && sy < height) {
                return trailMap[getIndex(sx, sy)];
            }
            return 0; // Out of bounds
        }

        function updateAgents() {
            for (let i = 0; i < numAgents; i++) {
                let a = agents[i];

                // Sense pheromones
                let weightCenter = sense(a, 0);
                let weightLeft = sense(a, -sensorAngle);
                let weightRight = sense(a, sensorAngle);

                // Attraction to mouse
                const dx = mouseX - a.x;
                const dy = mouseY - a.y;
                const distToMouse = Math.sqrt(dx * dx + dy * dy);
                if (distToMouse < 200 && distToMouse > 10) {
                    const angleToMouse = Math.atan2(dy, dx);
                    // Slight bias toward mouse
                    const diff = angleToMouse - a.angle;
                    a.angle += Math.sign(diff) * turnSpeed * 0.5 * (1 - distToMouse / 200);
                }

                // Steer based on pheromones
                const randomSteer = (Math.random() - 0.5) * turnSpeed * 0.5;
                if (weightCenter > weightLeft && weightCenter > weightRight) {
                    a.angle += 0; // Stay straight
                } else if (weightCenter < weightLeft && weightCenter < weightRight) {
                    a.angle += (Math.random() > 0.5 ? 1 : -1) * turnSpeed; // Turn randomly
                } else if (weightRight > weightLeft) {
                    a.angle += turnSpeed; // Turn right
                } else if (weightLeft > weightRight) {
                    a.angle -= turnSpeed; // Turn left
                }

                a.angle += randomSteer;

                // Move
                const nx = a.x + Math.cos(a.angle) * moveSpeed;
                const ny = a.y + Math.sin(a.angle) * moveSpeed;

                // Boundary check (bounce)
                if (nx < 0 || nx >= width || ny < 0 || ny >= height) {
                    a.x = Math.min(width - 1, Math.max(0, a.x));
                    a.y = Math.min(height - 1, Math.max(0, a.y));
                    a.angle = Math.random() * Math.PI * 2;
                } else {
                    a.x = nx;
                    a.y = ny;
                }

                // Deposit pheromone
                const idx = getIndex(a.x, a.y);
                trailMap[idx] += 25; // drop weight
            }
        }

        // Draw and decay trails
        const imgData = new ImageData(width, height);

        function drawTrails() {
            for (let y = 0; y < height; y++) {
                for (let x = 0; x < width; x++) {
                    const idx = y * width + x;
                    const val = trailMap[idx];

                    if (val > 0) {
                        const newval = val * 0.95; // Decay rate
                        trailMap[idx] = newval;

                        const pixelIdx = idx * 4;
                        // Map pheromone density to color (neon green/yellow)
                        const intensity = Math.min(255, newval);
                        imgData.data[pixelIdx] = intensity * 0.4;     // R
                        imgData.data[pixelIdx + 1] = intensity;       // G
                        imgData.data[pixelIdx + 2] = intensity * 0.2; // B
                        imgData.data[pixelIdx + 3] = 255;             // A
                    } else {
                        const pixelIdx = idx * 4;
                        imgData.data[pixelIdx] = 0;
                        imgData.data[pixelIdx + 1] = 0;
                        imgData.data[pixelIdx + 2] = 0;
                        imgData.data[pixelIdx + 3] = 255;
                    }
                }
            }

            // Diffuse blur step (simple 3x3 approx for performance)
            // Real diffusion is too slow in pure JS per frame, so we rely on visual trail overlap
            ctx.putImageData(imgData, 0, 0);
        }

        function loop() {
            updateAgents();
            drawTrails();
            requestAnimationFrame(loop);
        }

        initAgents();
        loop();
    </script>

    transition: all 0.3s ease;
}
.wwg-nav a:hover {
    background: rgba(167, 139, 250, 0.2);
    border-color: rgba(167, 139, 250, 0.4);
    color: #fff;
    transform: translateY(-2px);
    box-shadow: 0 4px 15px rgba(167, 139, 250, 0.3);
}
</style>
<script>
(function() {
    let sequence = '';
    const trigger = 'PNPNPN';
    document.querySelectorAll('.wwg-nav a').forEach(a => {
        a.addEventListener('click', (e) => {
            const type = a.innerText.includes('Prev') ? 'P' : 'N';
            sequence += type;
            if (sequence.length > 6) sequence = sequence.substring(1);
            if (sequence === trigger) {
                e.preventDefault();
                window.location.href = 'time-loop.html';
            }
        });
    });
})();
</script>
