<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cataclysm</title>
    <link rel="icon"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E☄️%3C/text%3E%3C/svg%3E">
    <style>
        body {
            margin: 0;
            background: #000;
            overflow: hidden;
            height: 100vh;
            font-family: Impact, sans-serif;
            cursor: crosshair;
        }

        .city {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 200px;
            background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="200"><rect x="10" y="100" width="20" height="100" fill="%23222"/><rect x="35" y="50" width="30" height="150" fill="%23111"/><rect x="70" y="120" width="20" height="80" fill="%23333"/></svg>') repeat-x;
        }

        .title {
            position: absolute;
            top: 10%;
            width: 100%;
            text-align: center;
            color: #333;
            font-size: 5rem;
            letter-spacing: 20px;
            z-index: -1;
            pointer-events: none;
        }

        .meteor {
            position: absolute;
            width: 10px;
            height: 10px;
            background: #fff;
            border-radius: 50%;
            box-shadow: 0 0 20px 10px #f40, -20px -20px 30px #f00;
            pointer-events: none;
        }

        .meteor::after {
            content: '';
            position: absolute;
            top: -50px;
            left: -50px;
            width: 100px;
            height: 10px;
            background: linear-gradient(135deg, rgba(255, 100, 0, 0.8), transparent);
            transform: rotate(45deg);
            transform-origin: top left;
            border-radius: 5px;
        }

        .explosion {
            position: absolute;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #fff;
            transform: translate(-50%, -50%);
            animation: boom 1s ease-out forwards;
            pointer-events: none;
        }

        @keyframes boom {
            0% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1);
                box-shadow: 0 0 50px 20px #ff0;
            }

            100% {
                opacity: 0;
                transform: translate(-50%, -50%) scale(30);
                box-shadow: 0 0 100px 50px #f00;
            }
        }

        .shake {
            animation: s 0.5s;
        }

        @keyframes s {
            0% {
                transform: translate(10px, 10px);
            }

            20% {
                transform: translate(-10px, 0);
            }

            40% {
                transform: translate(5px, -10px);
            }

            60% {
                transform: translate(-5px, 10px);
            }

            80% {
                transform: translate(10px, -5px);
            }

            100% {
                transform: translate(0, 0);
            }
        }
    </style>

    <!-- wwg-mobile-patch-start -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        canvas {
            max-width: 100vw;
            max-height: 100vh;
            touch-action: none;
        }
    </style>
    <!-- wwg-mobile-patch-end -->

</head>

<body>
    <div class="title">CATACLYSM</div>
    <div class="city"></div>

    <script src="discovery.js"></script>
    <script>
        Discovery.unlock('cataclysm');

        window.addEventListener('click', e => {
            const m = document.createElement('div');
            m.className = 'meteor';

            // start position top rightish relative to click
            const startX = e.clientX + 500;
            const startY = e.clientY - 500;

            m.style.left = startX + 'px';
            m.style.top = startY + 'px';
            document.body.appendChild(m);

            // animate falling
            const anim = m.animate([
                { transform: `translate(0, 0)` },
                { transform: `translate(-500px, 500px)` }
            ], { duration: 500, easing: 'linear' });

            anim.onfinish = () => {
                m.remove();

                // explosion
                const ex = document.createElement('div');
                ex.className = 'explosion';
                ex.style.left = e.clientX + 'px';
                ex.style.top = e.clientY + 'px';
                document.body.appendChild(ex);

                // shake screen
                document.body.classList.remove('shake');
                void document.body.offsetWidth;
                document.body.classList.add('shake');

                setTimeout(() => ex.remove(), 1000);
            };
        });
    </script>

    <!-- wwg-mobile-patch-js-start -->
    <script>
        // Touch-to-Mouse Polyfill for legacy canvas interactives
        document.addEventListener('touchstart', function(e) {
            if(e.touches.length > 0) {
                const touch = e.touches[0];
                const mouseEvent = new MouseEvent('mousedown', {
                    clientX: touch.clientX,
                    clientY: touch.clientY,
                    bubbles: true,
                    cancelable: true
                });
                e.target.dispatchEvent(mouseEvent);
            }
        }, {passive: false});

        document.addEventListener('touchmove', function(e) {
            if(e.touches.length > 0) {
                const touch = e.touches[0];
                const mouseEvent = new MouseEvent('mousemove', {
                    clientX: touch.clientX,
                    clientY: touch.clientY,
                    bubbles: true,
                    cancelable: true
                });
                e.target.dispatchEvent(mouseEvent);
            }
        }, {passive: false});

        document.addEventListener('touchend', function(e) {
            const mouseEvent = new MouseEvent('mouseup', {
                bubbles: true,
                cancelable: true
            });
            e.target.dispatchEvent(mouseEvent);
        }, {passive: false});
    </script>
    <!-- wwg-mobile-patch-js-end -->

</body>

</html>
