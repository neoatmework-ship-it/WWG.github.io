<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hive</title>
    <link rel="icon"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🐝%3C/text%3E%3C/svg%3E">
    <style>
        body {
            margin: 0;
            background: #1a1a00;
            overflow: hidden;
            height: 100vh;
            cursor: none;
        }

        canvas {
            display: block;
            filter: drop-shadow(0 0 5px #f00);
        }

        .cursor {
            position: absolute;
            width: 40px;
            height: 40px;
            background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><polygon points="50,10 90,30 90,70 50,90 10,70 10,30" fill="none" stroke="%23ff0" stroke-width="5"/></svg>') no-repeat center;
            pointer-events: none;
            transform: translate(-50%, -50%);
            transition: transform 0.1s;
        }

        .cursor.click {
            transform: translate(-50%, -50%) scale(0.5);
        }
    </style>

    <!-- wwg-mobile-patch-start -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        canvas {
            max-width: 100vw;
            max-height: 100vh;
            touch-action: none;
        }
    </style>
    <!-- wwg-mobile-patch-end -->

</head>

<body>
    <div class="cursor" id="curs"></div>
    <canvas id="c"></canvas>

    <script src="discovery.js"></script>
    <script>
        Discovery.unlock('hive');
        const canvas = document.getElementById('c');
        const ctx = canvas.getContext('2d');
        const curs = document.getElementById('curs');

        let w = canvas.width = window.innerWidth;
        let h = canvas.height = window.innerHeight;

        const bees = [];
        for (let i = 0; i < 300; i++) {
            bees.push({
                x: Math.random() * w,
                y: Math.random() * h,
                vx: 0, vy: 0,
                targetX: w / 2, targetY: h / 2,
                size: Math.random() * 2 + 1,
                color: Math.random() > 0.5 ? '#ffcc00' : '#ff9900' // yellow/orange
            });
        }

        let mouseX = w / 2;
        let mouseY = h / 2;
        let isAngry = false;

        window.addEventListener('mousemove', e => {
            mouseX = e.clientX;
            mouseY = e.clientY;
            curs.style.left = mouseX + 'px';
            curs.style.top = mouseY + 'px';
        });

        window.addEventListener('mousedown', () => { isAngry = true; curs.classList.add('click'); });
        window.addEventListener('mouseup', () => { isAngry = false; curs.classList.remove('click'); });

        function draw() {
            ctx.fillStyle = 'rgba(26, 26, 0, 0.3)'; // dark yellow/green trail
            ctx.fillRect(0, 0, w, h);

            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';

            for (let i = 0; i < bees.length; i++) {
                const b = bees[i];

                // Swarm behavior towards mouse
                const dx = mouseX - b.x;
                const dy = mouseY - b.y;
                const dist = Math.sqrt(dx * dx + dy * dy);

                let force = 0.05;
                if (isAngry) {
                    force = 0.5; // aggressive swarming
                    b.color = '#ff0000'; // angry red
                } else {
                    b.color = Math.random() > 0.5 ? '#ffcc00' : '#ff9900';
                }

                if (dist > 0) {
                    b.vx += (dx / dist) * force;
                    b.vy += (dy / dist) * force;
                }

                // Add jitter
                b.vx += (Math.random() - 0.5) * 2;
                b.vy += (Math.random() - 0.5) * 2;

                // Friction
                b.vx *= 0.9;
                b.vy *= 0.9;

                // Speed limit
                const speed = Math.sqrt(b.vx * b.vx + b.vy * b.vy);
                const maxSpeed = isAngry ? 15 : 8;
                if (speed > maxSpeed) {
                    b.vx = (b.vx / speed) * maxSpeed;
                    b.vy = (b.vy / speed) * maxSpeed;
                }

                const oldX = b.x;
                const oldY = b.y;

                b.x += b.vx;
                b.y += b.vy;

                ctx.beginPath();
                ctx.moveTo(oldX, oldY);
                ctx.lineTo(b.x, b.y);
                ctx.strokeStyle = b.color;
                ctx.lineWidth = b.size;
                ctx.stroke();
            }
            requestAnimationFrame(draw);
        }
        draw();

        window.addEventListener('resize', () => {
            w = canvas.width = window.innerWidth;
            h = canvas.height = window.innerHeight;
        });
    </script>

    <!-- wwg-mobile-patch-js-start -->
    <script>
        // Touch-to-Mouse Polyfill for legacy canvas interactives
        document.addEventListener('touchstart', function(e) {
            if(e.touches.length > 0) {
                const touch = e.touches[0];
                const mouseEvent = new MouseEvent('mousedown', {
                    clientX: touch.clientX,
                    clientY: touch.clientY,
                    bubbles: true,
                    cancelable: true
                });
                e.target.dispatchEvent(mouseEvent);
            }
        }, {passive: false});

        document.addEventListener('touchmove', function(e) {
            if(e.touches.length > 0) {
                const touch = e.touches[0];
                const mouseEvent = new MouseEvent('mousemove', {
                    clientX: touch.clientX,
                    clientY: touch.clientY,
                    bubbles: true,
                    cancelable: true
                });
                e.target.dispatchEvent(mouseEvent);
            }
        }, {passive: false});

        document.addEventListener('touchend', function(e) {
            const mouseEvent = new MouseEvent('mouseup', {
                bubbles: true,
                cancelable: true
            });
            e.target.dispatchEvent(mouseEvent);
        }, {passive: false});
    </script>
    <!-- wwg-mobile-patch-js-end -->

</body>

</html>
