<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anomaly</title>
    <link rel="icon"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E📺%3C/text%3E%3C/svg%3E">
    <style>
        body {
            margin: 0;
            background: #000;
            color: #fff;
            font-family: monospace;
            overflow: hidden;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }

        .text {
            font-size: 4rem;
            letter-spacing: 10px;
            position: relative;
        }

        .slice {
            position: absolute;
            left: 0;
            right: 0;
            background: #000;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            border-top: 1px solid rgba(255, 0, 0, 0);
            transition: 0.1s;
        }

        .content {
            position: absolute;
        }

        #scanline {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 5px;
            background: rgba(0, 255, 255, 0.5);
            opacity: 0.3;
            animation: scan 3s linear infinite;
            pointer-events: none;
            z-index: 10;
        }

        @keyframes scan {
            0% {
                top: 0;
            }

            100% {
                top: 100vh;
            }
        }

        .warn {
            color: red;
            font-size: 1rem;
            margin-top: 20px;
            opacity: 0;
            transition: 2s;
        }
    </style>
</head>

<body>
    <div id="scanline"></div>
    <div class="text" id="target">A N O M A L Y</div>
    <div class="warn" id="warn">SYSTEM INTEGRITY COMPROMISED</div>

    <script src="discovery.js"></script>
    <script>
        Discovery.unlock('anomaly');

        let slices = [];
        const numSlices = 20;
        const h = window.innerHeight;
        const sliceH = h / numSlices;

        // Build slices
        for (let i = 0; i < numSlices; i++) {
            const row = document.createElement('div');
            row.className = 'slice';
            row.style.top = (i * sliceH) + 'px';
            row.style.height = sliceH + 'px';

            const cont = document.createElement('div');
            cont.className = 'content';
            cont.style.top = -(i * sliceH) + 'px';
            cont.style.height = h + 'px';
            cont.style.width = '100vw';
            cont.style.display = 'flex';
            cont.style.alignItems = 'center';
            cont.style.justifyContent = 'center';
            cont.innerHTML = `<div class="text">A N O M A L Y</div>`;

            row.appendChild(cont);
            document.body.appendChild(row);

            slices.push({ el: row, x: 0, targetX: 0 });
        }

        document.getElementById('target').style.display = 'none';

        let intensity = 0;

        window.addEventListener('mousemove', e => {
            const centerX = window.innerWidth / 2;
            const dist = Math.abs(e.clientX - centerX) / centerX;
            intensity = dist * 50; // Max shift pixels

            if (intensity > 40) document.getElementById('warn').style.opacity = 1;
        });

        function glitch() {
            slices.forEach((s, i) => {
                if (Math.random() > 0.8) {
                    s.targetX = (Math.random() - 0.5) * intensity;

                    if (intensity > 20 && Math.random() > 0.9) {
                        s.el.style.borderTop = `1px solid rgba(0,255,255,${Math.random()})`;
                    } else {
                        s.el.style.borderTop = 'none';
                    }
                }

                s.x += (s.targetX - s.x) * 0.2;
                s.el.style.transform = `translateX(${s.x}px)`;
            });

            if (Math.random() > 0.95 && intensity > 10) {
                document.body.style.filter = `invert(${Math.random() > 0.5 ? 1 : 0}) hue-rotate(${Math.random() * 90}deg)`;
                setTimeout(() => document.body.style.filter = 'none', 50);
            }

            requestAnimationFrame(glitch);
        }
        glitch();
    </script>
</body>

</html>
