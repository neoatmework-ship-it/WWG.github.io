<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE SECRET HUB | Master Discovery</title>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #050505;
            --text: #fff;
            --accent: #ffff00;
            --locked: #333;
            --unlocked: #00ff00;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'VT323', monospace;
            margin: 0;
            padding: 40px;
            overflow-x: hidden;
            background-image: radial-gradient(circle at center, #111 0%, #000 100%);
        }

        .header {
            text-align: center;
            border-bottom: 2px solid var(--accent);
            padding-bottom: 20px;
            margin-bottom: 50px;
            position: relative;
        }

        h1 {
            font-size: 5rem;
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 5px;
            color: var(--accent);
            text-shadow: 0 0 20px rgba(255, 255, 0, 0.5);
        }

        .progress-bar {
            width: 100%;
            max-width: 600px;
            height: 10px;
            background: #222;
            margin: 20px auto;
            position: relative;
            overflow: hidden;
        }
        #progress-fill {
            height: 100%;
            background: var(--accent);
            width: 0%;
            transition: 1s ease-out;
        }

        .hub-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 30px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .secret-card {
            background: rgba(255, 255, 255, 0.02);
            border: 2px solid #222;
            padding: 30px;
            transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-align: center;
            position: relative;
            opacity: 0.6;
            filter: grayscale(1);
        }

        .secret-card.unlocked {
            opacity: 1;
            filter: none;
            border-color: var(--accent);
            background: rgba(255, 255, 0, 0.05);
            cursor: pointer;
        }

        .secret-card.unlocked:hover {
            transform: translateY(-10px) scale(1.05);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5), 0 0 20px rgba(255, 255, 0, 0.2);
        }

        .card-actions {
            display: flex;
            gap: 12px;
            margin-top: 20px;
            justify-content: center;
        }

        .card-btn {
            font-family: 'VT323', monospace;
            font-size: 1.2rem;
            padding: 6px 20px;
            cursor: pointer;
            border: 2px solid;
            background: transparent;
            letter-spacing: 1px;
            transition: 0.2s;
            text-transform: uppercase;
        }

        .card-btn.primary {
            color: var(--accent);
            border-color: var(--accent);
        }
        .card-btn.primary:hover {
            background: var(--accent);
            color: #000;
            box-shadow: 0 0 14px rgba(255,255,0,0.4);
        }

        .card-btn.danger {
            color: #ff4444;
            border-color: #ff4444;
        }
        .card-btn.danger:hover {
            background: #ff4444;
            color: #000;
            box-shadow: 0 0 14px rgba(255,68,68,0.4);
        }

        .icon { font-size: 4rem; margin-bottom: 15px; display: block; }
        .name { font-size: 2rem; color: var(--accent); margin-bottom: 10px; text-transform: uppercase; }
        .desc { font-size: 1.2rem; opacity: 0.8; line-height: 1.4; color: #ccc; }

        .back-btn {
            position: fixed; top: 20px; left: 20px;
            color: #fff; text-decoration: none; font-size: 1.5rem;
            z-index: 100; opacity: 0.7; transition: 0.3s;
        }
        .back-btn:hover { opacity: 1; color: var(--accent); }

        /* Scanning Line Effect */
        .scan-line {
            position: fixed; top: 0; left: 0; width: 100%; height: 2px;
            background: rgba(255, 255, 0, 0.1);
            animation: scan 4s linear infinite;
            pointer-events: none;
            z-index: 999;
        }
        @keyframes scan { from { top: -100px; } to { top: 100%; } }

        .reset-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            background: transparent;
            border: 1px solid #ff3333;
            color: #ff3333;
            font-family: 'VT323', monospace;
            font-size: 1.2rem;
            padding: 6px 16px;
            cursor: pointer;
            letter-spacing: 2px;
            transition: 0.2s;
            z-index: 100;
        }
        .reset-btn:hover {
            background: #ff3333;
            color: #000;
            box-shadow: 0 0 16px rgba(255,51,51,0.5);
        }
    </style>
</head>
<body>

    <div class="scan-line"></div>
    <a href="index.html" class="back-btn">← [RE-ENTRY]</a>
    <button class="reset-btn" onclick="resetSecrets()">⚠ WIPE ARCHIVE</button>

    <div class="header">
        <h1>THE SECRET HUB</h1>
        <div id="stats-text" style="font-size: 1.4rem; opacity: 0.6; margin-top: 10px;">ARTIFACTS STABILIZED</div>
        <div class="progress-bar"><div id="progress-fill"></div></div>
    </div>

    <div id="hub-grid" class="hub-grid">
        <!-- Dynamically Populated -->
    </div>

    <script src="transitions.js"></script>
    <script src="discovery.js"></script>
    <script>
        const grid = document.getElementById('hub-grid');
        const fill = document.getElementById('progress-fill');
        const statsText = document.getElementById('stats-text');

        function renderHub() {
            const discovered = Discovery.getDiscovered();
            const total = Discovery.SECRETS.length;
            const count = discovered.length;

            statsText.innerText = `${count} / ${total} ARTIFACTS STABILIZED`;
            fill.style.width = (count / total * 100) + '%';

            grid.innerHTML = '';
            Discovery.SECRETS.forEach(secret => {
                const isUnlocked = discovered.includes(secret.id);
                const card = document.createElement('div');
                card.className = `secret-card ${isUnlocked ? 'unlocked' : ''}`;
                
                let lockMsg = 'DATA_CORRUPTED. REQUIRE_KEY_SIGNAL.';
                if (secret.id === 'void-conqueror') {
                    lockMsg = 'INSTRUCTION: CLICK THE [WWG] TITLE 3 TIMES ON THE HOME PAGE. SURVIVE THE JUDGEMENT.';
                } else if (secret.id === 'the-terminal') {
                    lockMsg = 'HIDDEN_OS_DETECTED. LOCATE_THE_BOOT_SEQUENCE.';
                }

                const iconContent = (isUnlocked && secret.icon.startsWith('http')) 
                    ? `<img src="${secret.icon}" style="width: 64px; height: 64px; image-rendering: pixelated; margin-bottom: 15px;">`
                    : `<span class="icon">${isUnlocked ? secret.icon : '🔒'}</span>`;

                card.innerHTML = `
                    ${iconContent}
                    <h3 class="name">${isUnlocked ? secret.name : '?? ? ? ?'}</h3>
                    <p class="desc" style="font-size: 0.9rem; letter-spacing: 1px;">${isUnlocked ? secret.description : lockMsg}</p>
                    ${isUnlocked ? `
                    <div class="card-actions">
                        <button class="card-btn primary" onclick="event.stopPropagation(); window.location.href='${secret.url}'">▶ ENTER</button>
                        <button class="card-btn danger" onclick="event.stopPropagation(); resetSecret('${secret.id}')">↺ RESET</button>
                    </div>` : ''}
                `;

                grid.appendChild(card);
            });
        }

        function resetSecret(id) {
            if (confirm('RESET THIS ARTIFACT? YOU WILL NEED TO REDISCOVER IT.')) {
                const remaining = Discovery.getDiscovered().filter(d => d !== id);
                localStorage.setItem(Discovery.STORAGE_KEY, JSON.stringify(remaining));
                renderHub();
            }
        }

        function resetSecrets() {
            if (confirm('WIPE ALL DISCOVERED ARTIFACTS? THIS CANNOT BE UNDONE.')) {
                localStorage.removeItem(Discovery.STORAGE_KEY);
                renderHub();
            }
        }

        renderHub();
    </script>
</body>
</html>
