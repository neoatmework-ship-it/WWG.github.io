<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relic</title>
    <link rel="icon"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🏺%3C/text%3E%3C/svg%3E">
    <style>
        body {
            margin: 0;
            background: #2b2521;
            overflow: hidden;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .artifact {
            position: absolute;
            width: 300px;
            height: 400px;
            background: linear-gradient(to right, #b48530 0%, #ffe99b 50%, #b48530 100%);
            border-radius: 100px / 50px 50px 150px 150px;
            box-shadow: inset -20px -20px 50px rgba(0, 0, 0, 0.5), 0 20px 50px rgba(0, 0, 0, 0.8);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Inner glow/details hidden by dust */
        .glow {
            position: absolute;
            width: 100px;
            height: 100px;
            background: #fff;
            filter: blur(50px);
            opacity: 0;
            transition: 2s;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            pointer-events: auto;
            cursor: cell;
        }

        .hint {
            position: absolute;
            bottom: 30px;
            font-family: serif;
            color: #a48259;
            letter-spacing: 5px;
            opacity: 0.5;
            pointer-events: none;
        }
    </style>

    <!-- wwg-mobile-patch-start -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        canvas {
            max-width: 100vw;
            max-height: 100vh;
            touch-action: none;
        }
    </style>
    <!-- wwg-mobile-patch-end -->

</head>

<body>
    <div class="artifact">
        <div class="glow" id="glow"></div>
        <div style="font-size: 5rem; filter: drop-shadow(0 0 10px #ffe99b);">✨</div>
    </div>
    <div class="hint">BRUSH AWAY THE DUST</div>
    <canvas id="c"></canvas>

    <script src="discovery.js"></script>
    <script>
        Discovery.unlock('relic');
        const canvas = document.getElementById('c');
        const ctx = canvas.getContext('2d');
        const glow = document.getElementById('glow');

        // Exact size of window to cover everything in dust
        let w = canvas.width = window.innerWidth;
        let h = canvas.height = window.innerHeight;

        // Draw dust layer
        ctx.fillStyle = '#4a4036';
        ctx.fillRect(0, 0, w, h);

        // Add grit
        for (let i = 0; i < 50000; i++) {
            ctx.fillStyle = Math.random() > 0.5 ? '#3b332b' : '#594d41';
            ctx.fillRect(Math.random() * w, Math.random() * h, 2, 2);
        }

        // Setup erasing
        ctx.globalCompositeOperation = 'destination-out';
        ctx.lineJoin = 'round';
        ctx.lineCap = 'round';
        ctx.lineWidth = 60; // brush size

        let isBrushing = false;
        let pixelsCleared = 0;
        const totalPixelsToClear = 1000; // estimation

        function calcClearing() {
            // Very rough estimation based on mouse events, real pixel check is slow
            pixelsCleared++;
            if (pixelsCleared > totalPixelsToClear) {
                glow.style.opacity = 0.5 + Math.random(); // pulse glow
            }
        }

        canvas.addEventListener('mousedown', e => {
            isBrushing = true;
            ctx.beginPath();
            ctx.moveTo(e.clientX, e.clientY);
        });

        window.addEventListener('mouseup', () => isBrushing = false);

        canvas.addEventListener('mousemove', e => {
            if (!isBrushing) return;

            // Brush effect (soft edge eraser via radial gradient)
            const radGrad = ctx.createRadialGradient(e.clientX, e.clientY, 0, e.clientX, e.clientY, 30);
            radGrad.addColorStop(0, 'rgba(0,0,0,1)');
            radGrad.addColorStop(1, 'rgba(0,0,0,0)');

            ctx.fillStyle = radGrad;
            ctx.beginPath();
            ctx.arc(e.clientX, e.clientY, 30, 0, Math.PI * 2);
            ctx.fill();

            ctx.lineTo(e.clientX, e.clientY);
            ctx.stroke();

            calcClearing();
        });

        // Resize resets dust sadly, but keeps it simple
        window.addEventListener('resize', () => {
            w = canvas.width = window.innerWidth;
            h = canvas.height = window.innerHeight;
            ctx.globalCompositeOperation = 'source-over';
            ctx.fillStyle = '#4a4036';
            ctx.fillRect(0, 0, w, h);
            ctx.globalCompositeOperation = 'destination-out';
        });
    </script>

    <!-- wwg-mobile-patch-js-start -->
    <script>
        // Touch-to-Mouse Polyfill for legacy canvas interactives
        document.addEventListener('touchstart', function(e) {
            if(e.touches.length > 0) {
                const touch = e.touches[0];
                const mouseEvent = new MouseEvent('mousedown', {
                    clientX: touch.clientX,
                    clientY: touch.clientY,
                    bubbles: true,
                    cancelable: true
                });
                e.target.dispatchEvent(mouseEvent);
            }
        }, {passive: false});

        document.addEventListener('touchmove', function(e) {
            if(e.touches.length > 0) {
                const touch = e.touches[0];
                const mouseEvent = new MouseEvent('mousemove', {
                    clientX: touch.clientX,
                    clientY: touch.clientY,
                    bubbles: true,
                    cancelable: true
                });
                e.target.dispatchEvent(mouseEvent);
            }
        }, {passive: false});

        document.addEventListener('touchend', function(e) {
            const mouseEvent = new MouseEvent('mouseup', {
                bubbles: true,
                cancelable: true
            });
            e.target.dispatchEvent(mouseEvent);
        }, {passive: false});
    </script>
    <!-- wwg-mobile-patch-js-end -->

</body>

</html>
