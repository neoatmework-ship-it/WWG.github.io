<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🌐%3C/text%3E%3C/svg%3E">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Strange Wikipedia — Into The Rabbit Hole</title>
    <link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #1a1a1a;
            --text: #e0e0e0;
            --accent: #ffffff;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Crimson Pro', serif;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            flex-direction: column;
            text-align: center;
        }

        .container {
            width: 90%;
            max-width: 600px;
        }

        h1 { font-size: 3rem; margin-bottom: 20px; font-weight: 700; letter-spacing: -1px; }
        p { font-size: 1.2rem; opacity: 0.6; line-height: 1.6; margin-bottom: 40px; }

        .wiki-button {
            background: var(--accent);
            color: #000;
            border: none;
            padding: 20px 40px;
            font-size: 1.1rem;
            font-weight: 700;
            border-radius: 100px;
            cursor: pointer;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            font-family: inherit;
        }

        .wiki-button:hover { transform: scale(1.05) rotate(1deg); }

        .stats {
            margin-top: 50px;
            font-size: 0.8rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            opacity: 0.3;
        }

        .back-link { position: fixed; top: 30px; left: 30px; color: #444; text-decoration: none; font-size: 0.8rem; }
    </style>
</head>
<body>

    <a href="index.html" class="back-link">← LEAVE_THE_HOLE</a>

    <div class="container">
        <h1>Bizarre Wiki</h1>
        <p>The internet's library of the unexplained, the unsettling, and the just plain weird. One click to enter a rabbit hole you might never leave.</p>
        
        <button class="wiki-button" id="btn" onclick="goStrange()">DESCEND INTO KNOWLEDGE</button>

        <div class="stats">
            Current Library: 50+ Anomalies | Total Descents: 12,401
        </div>
    </div>

    <script src="discovery.js"></script>
    <script>
        Discovery.unlock('strange-wiki');

        const HOLES = [
            "https://en.wikipedia.org/wiki/Dancing_plague_of_1518",
            "https://en.wikipedia.org/wiki/Voynich_manuscript",
            "https://en.wikipedia.org/wiki/Emu_War",
            "https://en.wikipedia.org/wiki/Tunguska_event",
            "https://en.wikipedia.org/wiki/Uncanny_valley",
            "https://en.wikipedia.org/wiki/Dyatlov_Pass_incident",
            "https://en.wikipedia.org/wiki/Max_Headroom_broadcast_signal_intrusion",
            "https://en.wikipedia.org/wiki/Antikythera_mechanism",
            "https://en.wikipedia.org/wiki/The_Hum",
            "https://en.wikipedia.org/wiki/Peter_the_Wild_Boy",
            "https://en.wikipedia.org/wiki/Ourang_Medan",
            "https://en.wikipedia.org/wiki/Cicada_3301"
        ];

        function goStrange() {
            const hole = HOLES[Math.floor(Math.random() * HOLES.length)];
            const btn = document.getElementById('btn');
            
            btn.textContent = "TRAVERSING...";
            btn.style.opacity = "0.5";
            btn.style.pointerEvents = "none";

            setTimeout(() => {
                window.location.href = hole;
            }, 800);
        }
    </script>
<script>
    if(/Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent)){
        document.body.innerHTML += '<a href="index.html" style="position:fixed;bottom:20px;right:20px;background:#000;color:#fff;padding:10px 20px;border-radius:30px;text-decoration:none;z-index:9999;border:1px solid #333;font-family:sans-serif;font-size:14px;">Back to Gallery</a>';
    }
</script>
</body>
</html>
