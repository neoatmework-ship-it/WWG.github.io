<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analog</title>
    <link rel="icon"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E📼%3C/text%3E%3C/svg%3E">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #050510;
            color: #0f0;
            font-family: 'Courier New', Courier, monospace;
            height: 100vh;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .crt {
            position: absolute;
            inset: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 4px, 6px 100%;
            pointer-events: none;
            z-index: 10;
        }

        .vhs-text {
            font-size: clamp(3rem, 10vw, 8rem);
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1vw;
            position: relative;
            transform: skewX(-5deg);
            animation: glitch-anim 4s infinite, rgb-shift 3s infinite alternate;
        }

        .vhs-text::before,
        .vhs-text::after {
            content: "ANALOG";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: #050510;
            color: #0ff;
            z-index: -1;
            clip-path: polygon(0 0, 100% 0, 100% 45%, 0 45%);
            transform: translate(-4px, 2px);
            animation: glitch-anim-2 3s infinite;
        }

        .vhs-text::after {
            color: #f0f;
            clip-path: polygon(0 60%, 100% 60%, 100% 100%, 0 100%);
            transform: translate(4px, -2px);
            animation: glitch-anim-3 2.5s infinite;
        }

        .date {
            position: absolute;
            bottom: 40px;
            left: 40px;
            font-size: 1.5rem;
            color: #fff;
            text-shadow: 2px 2px 0px #f00, -2px -2px 0px #00f;
            opacity: 0.8;
            font-family: 'Courier New', Courier, monospace;
        }

        .play-icon {
            position: absolute;
            top: 40px;
            left: 40px;
            font-size: 2rem;
            color: #fff;
            text-shadow: 2px 2px 0px #f00, -2px -2px 0px #00f;
            animation: blink 1s step-end infinite;
        }

        @keyframes blink {
            50% {
                opacity: 0;
            }
        }

        /* Noise layer */
        .noise {
            position: fixed;
            top: -50%;
            left: -50%;
            right: -50%;
            bottom: -50%;
            width: 200%;
            height: 200%;
            background: transparent url('data:image/svg+xml,%3Csvg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"%3E%3Cfilter id="noiseFilter"%3E%3CfeTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/%3E%3C/filter%3E%3Crect width="100%25" height="100%25" filter="url(%23noiseFilter)"/%3E%3C/svg%3E');
            opacity: 0.12;
            animation: noise-shift .2s infinite;
            pointer-events: none;
            z-index: 15;
        }

        @keyframes noise-shift {
            0% {
                transform: translate(0, 0)
            }

            10% {
                transform: translate(-5%, -5%)
            }

            20% {
                transform: translate(-15%, 5%)
            }

            30% {
                transform: translate(5%, -15%)
            }

            40% {
                transform: translate(-5%, 15%)
            }

            50% {
                transform: translate(-10%, 5%)
            }

            60% {
                transform: translate(15%, 0)
            }

            70% {
                transform: translate(0, 10%)
            }

            80% {
                transform: translate(-15%, 0)
            }

            90% {
                transform: translate(10%, 5%)
            }

            100% {
                transform: translate(5%, 0)
            }
        }

        @keyframes rgb-shift {
            0% {
                text-shadow: 3px 0 0 red, -3px 0 0 blue;
            }

            100% {
                text-shadow: 6px 0 0 red, -6px 0 0 blue;
            }
        }

        @keyframes glitch-anim {
            0% {
                transform: skewX(-5deg);
            }

            100% {
                transform: skewX(-5deg);
            }

            2%,
            64% {
                transform: skewX(-15deg) translate(-5px, 0);
            }

            4%,
            60% {
                transform: skewX(10deg) translate(5px, 0);
            }

            62% {
                transform: skewX(-5deg) translate(0, 0);
            }
        }

        @keyframes glitch-anim-2 {
            0% {
                clip-path: polygon(0 0, 100% 0, 100% 45%, 0 45%);
                transform: translate(-4px, 2px);
            }

            20% {
                clip-path: polygon(0 15%, 100% 15%, 100% 30%, 0 30%);
                transform: translate(5px, -5px);
            }

            40% {
                clip-path: polygon(0 10%, 100% 10%, 100% 50%, 0 50%);
                transform: translate(-5px, 5px);
            }

            60% {
                clip-path: polygon(0 40%, 100% 40%, 100% 60%, 0 60%);
                transform: translate(10px, 2px);
            }

            80% {
                clip-path: polygon(0 30%, 100% 30%, 100% 45%, 0 45%);
                transform: translate(-2px, -2px);
            }

            100% {
                clip-path: polygon(0 0, 100% 0, 100% 45%, 0 45%);
                transform: translate(-4px, 2px);
            }
        }
    </style>
</head>

<body>
    <div class="noise"></div>
    <div class="crt"></div>
    <div class="play-icon">▶ PLAY</div>
    <div class="date" id="vhs-date">FORMATTING...</div>
    <div class="vhs-text">ANALOG</div>

    <script src="discovery.js"></script>
    <script>
        Discovery.unlock('analog');
        setInterval(() => {
            const d = new Date();
            document.getElementById('vhs-date').innerText = d.toLocaleString().toUpperCase();
        }, 1000);
    </script>
</body>

</html>
