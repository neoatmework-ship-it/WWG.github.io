<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nomad</title>
    <link rel="icon"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🚶%3C/text%3E%3C/svg%3E">
    <style>
        body {
            margin: 0;
            background: #e8dbce;
            overflow: hidden;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        canvas {
            display: block;
            filter: sepia(0.3);
        }

        .text {
            position: absolute;
            top: 40px;
            font-family: 'Courier New', Courier, monospace;
            letter-spacing: 5px;
            color: #8c7b6c;
            pointer-events: none;
        }
    </style>

    <!-- wwg-mobile-patch-start -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        canvas {
            max-width: 100vw;
            max-height: 100vh;
            touch-action: none;
        }
    </style>
    <!-- wwg-mobile-patch-end -->

</head>

<body>
    <div class="text">THE WANDERER</div>
    <canvas id="c"></canvas>

    <script src="discovery.js"></script>
    <script>
        Discovery.unlock('nomad');
        const canvas = document.getElementById('c');
        const ctx = canvas.getContext('2d');
        let w = canvas.width = window.innerWidth;
        let h = canvas.height = window.innerHeight;

        let nomadX = w / 2;
        let noiseOffset = 0;
        let walkCycle = 0;

        function drawStickFigure(x, y, scale = 1) {
            ctx.strokeStyle = '#3a2e24';
            ctx.lineWidth = 3 * scale;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';

            ctx.beginPath();

            // head
            const headY = y - 40 * scale;
            ctx.arc(x, headY, 8 * scale, 0, Math.PI * 2);
            ctx.stroke();

            // body
            ctx.beginPath();
            ctx.moveTo(x, headY + 8 * scale);
            ctx.lineTo(x, y - 15 * scale);
            ctx.stroke();

            // animation vars
            const swingX = Math.sin(walkCycle) * 10 * scale;
            const swingY = Math.abs(Math.cos(walkCycle)) * 5 * scale;

            // legs
            ctx.beginPath(); ctx.moveTo(x, y - 15 * scale); ctx.lineTo(x + swingX, y); ctx.stroke(); // Front leg
            ctx.beginPath(); ctx.moveTo(x, y - 15 * scale); ctx.lineTo(x - swingX, y - swingY); ctx.stroke(); // Back leg

            // arms
            const armY = headY + 15 * scale;
            ctx.beginPath(); ctx.moveTo(x, armY); ctx.lineTo(x - swingX, armY + 15 * scale); ctx.stroke(); // Front arm
            ctx.beginPath(); ctx.moveTo(x, armY); ctx.lineTo(x + swingX, armY + 15 * scale); ctx.stroke(); // Back arm
        }

        function draw() {
            ctx.fillStyle = '#e8dbce';
            ctx.fillRect(0, 0, w, h);

            // Auto walk
            noiseOffset += 0.5;
            walkCycle += 0.1;

            // Move landscape instead of nomad to keep him centered

            ctx.fillStyle = '#c7b49f';
            ctx.beginPath();
            ctx.moveTo(0, h);

            let nomadY = 0;

            for (let cx = 0; cx < w; cx += 5) {
                // Procedural terrain using sine waves
                const ty = h / 2 + Math.sin((cx + noiseOffset) * 0.005) * 100 + Math.sin((cx + noiseOffset * 0.5) * 0.02) * 20;
                ctx.lineTo(cx, ty);

                if (Math.abs(cx - nomadX) < 5) nomadY = ty;
            }

            ctx.lineTo(w, h);
            ctx.fill();

            // Moon/Sun
            ctx.fillStyle = '#f4e9d8';
            ctx.beginPath();
            ctx.arc(w * 0.8, h * 0.2 + Math.sin(noiseOffset * 0.001) * 50, 40, 0, Math.PI * 2);
            ctx.fill();

            drawStickFigure(nomadX, nomadY);

            requestAnimationFrame(draw);
        }
        draw();

        window.addEventListener('resize', () => {
            w = canvas.width = window.innerWidth;
            h = canvas.height = window.innerHeight;
            nomadX = w / 2;
        });
    </script>

    <!-- wwg-mobile-patch-js-start -->
    <script>
        // Touch-to-Mouse Polyfill for legacy canvas interactives
        document.addEventListener('touchstart', function(e) {
            if(e.touches.length > 0) {
                const touch = e.touches[0];
                const mouseEvent = new MouseEvent('mousedown', {
                    clientX: touch.clientX,
                    clientY: touch.clientY,
                    bubbles: true,
                    cancelable: true
                });
                e.target.dispatchEvent(mouseEvent);
            }
        }, {passive: false});

        document.addEventListener('touchmove', function(e) {
            if(e.touches.length > 0) {
                const touch = e.touches[0];
                const mouseEvent = new MouseEvent('mousemove', {
                    clientX: touch.clientX,
                    clientY: touch.clientY,
                    bubbles: true,
                    cancelable: true
                });
                e.target.dispatchEvent(mouseEvent);
            }
        }, {passive: false});

        document.addEventListener('touchend', function(e) {
            const mouseEvent = new MouseEvent('mouseup', {
                bubbles: true,
                cancelable: true
            });
            e.target.dispatchEvent(mouseEvent);
        }, {passive: false});
    </script>
    <!-- wwg-mobile-patch-js-end -->

</body>

</html>
