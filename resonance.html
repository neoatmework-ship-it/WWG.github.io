<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resonance</title>
    <link rel="icon"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🌊%3C/text%3E%3C/svg%3E">
    <style>
        body {
            margin: 0;
            background: #011;
            overflow: hidden;
        }

        .ripple {
            position: absolute;
            border-radius: 50%;
            border: 2px solid cyan;
            transform: translate(-50%, -50%);
            animation: ripple-anim 3s linear forwards;
            pointer-events: none;
        }

        @keyframes ripple-anim {
            0% {
                width: 0;
                height: 0;
                opacity: 1;
                border-width: 4px;
            }

            100% {
                width: 400px;
                height: 400px;
                opacity: 0;
                border-width: 0;
            }
        }

        .text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: rgba(0, 255, 255, 0.2);
            font-family: sans-serif;
            font-size: 3rem;
            letter-spacing: 20px;
            text-transform: uppercase;
        }
    </style>

    <!-- wwg-mobile-patch-start -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        canvas {
            max-width: 100vw;
            max-height: 100vh;
            touch-action: none;
        }
    </style>
    <!-- wwg-mobile-patch-end -->

</head>

<body>
    <div class="text">RESONANCE</div>
    <script src="discovery.js"></script>
    <script>
        Discovery.unlock('resonance');
        document.addEventListener('mousemove', (e) => {
            if (Math.random() > 0.8) {
                const r = document.createElement('div');
                r.className = 'ripple';
                r.style.left = e.clientX + 'px';
                r.style.top = e.clientY + 'px';
                document.body.appendChild(r);
                setTimeout(() => r.remove(), 3000);
            }
        });
    </script>

    <!-- wwg-mobile-patch-js-start -->
    <script>
        // Touch-to-Mouse Polyfill for legacy canvas interactives
        document.addEventListener('touchstart', function(e) {
            if(e.touches.length > 0) {
                const touch = e.touches[0];
                const mouseEvent = new MouseEvent('mousedown', {
                    clientX: touch.clientX,
                    clientY: touch.clientY,
                    bubbles: true,
                    cancelable: true
                });
                e.target.dispatchEvent(mouseEvent);
            }
        }, {passive: false});

        document.addEventListener('touchmove', function(e) {
            if(e.touches.length > 0) {
                const touch = e.touches[0];
                const mouseEvent = new MouseEvent('mousemove', {
                    clientX: touch.clientX,
                    clientY: touch.clientY,
                    bubbles: true,
                    cancelable: true
                });
                e.target.dispatchEvent(mouseEvent);
            }
        }, {passive: false});

        document.addEventListener('touchend', function(e) {
            const mouseEvent = new MouseEvent('mouseup', {
                bubbles: true,
                cancelable: true
            });
            e.target.dispatchEvent(mouseEvent);
        }, {passive: false});
    </script>
    <!-- wwg-mobile-patch-js-end -->

</body>

</html>
