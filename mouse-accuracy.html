<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mouse Accuracy Trainer — Precision Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #000;
            --accent: #ff0050;
            --text: #fff;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Outfit', sans-serif;
            margin: 0;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            cursor: crosshair;
        }

        .stats-bar {
            background: #111;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            border-bottom: 2px solid #222;
            z-index: 10;
        }

        .stat { font-size: 1.2rem; font-weight: 700; }
        .stat span { color: var(--accent); }

        #canvas { background: #080808; flex: 1; }

        .start-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.9);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            z-index: 20;
        }

        h1 { font-size: 4rem; font-weight: 900; margin: 0; color: var(--accent); text-transform: uppercase; }
        p { opacity: 0.6; margin: 10px 0 30px 0; }

        .btn-start {
            background: var(--accent);
            color: #fff;
            border: none;
            padding: 20px 50px;
            font-size: 1.5rem;
            font-weight: 800;
            cursor: pointer;
            border-radius: 4px;
            transition: 0.2s;
        }
        .btn-start:hover { transform: scale(1.1); box-shadow: 0 0 30px var(--accent); }

        .back-link {
            position: fixed;
            bottom: 20px;
            left: 20px;
            color: #444;
            text-decoration: none;
            font-size: 0.8rem;
        }
    </style>
</head>
<body>

    <div class="stats-bar">
        <div class="stat">KILLS: <span id="val-kills">0</span></div>
        <div class="stat">ACCURACY: <span id="val-acc">100%</span></div>
        <div class="stat">TIME: <span id="val-time">30</span>s</div>
    </div>

    <canvas id="canvas"></canvas>

    <div class="start-overlay" id="overlay">
        <h1>PRECISION</h1>
        <p>Click the targets. Don't miss. 30 seconds.</p>
        <button class="btn-start" onclick="startGame()">START PROTOCOL</button>
    </div>

    <a href="index.html" class="back-link">EXIT_TRAINING</a>

    <script src="discovery.js"></script>
    <script>
        Discovery.unlock('mouse-accuracy');

        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        let kills = 0;
        let shots = 0;
        let timeLeft = 30;
        let gameActive = false;
        let target = { x: 0, y: 0, r: 25 };

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight - document.querySelector('.stats-bar').offsetHeight;
        }
        window.onresize = resize;
        resize();

        function spawnTarget() {
            target.x = target.r + Math.random() * (canvas.width - target.r * 2);
            target.y = target.r + Math.random() * (canvas.height - target.r * 2);
        }

        function draw() {
            if(!gameActive) return;
            ctx.clearRect(0,0,canvas.width, canvas.height);
            
            // Draw Target
            ctx.beginPath();
            ctx.arc(target.x, target.y, target.r, 0, Math.PI * 2);
            ctx.fillStyle = '#ff0050';
            ctx.fill();
            
            // Draw Target Inner
            ctx.beginPath();
            ctx.arc(target.x, target.y, target.r * 0.6, 0, Math.PI * 2);
            ctx.fillStyle = '#fff';
            ctx.fill();

            requestAnimationFrame(draw);
        }

        canvas.onmousedown = (e) => {
            if(!gameActive) return;
            shots++;
            const rect = canvas.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;
            
            const dist = Math.sqrt((mouseX - target.x)**2 + (mouseY - target.y)**2);
            if(dist < target.r) {
                kills++;
                spawnTarget();
                document.getElementById('val-kills').textContent = kills;
            }
            
            const acc = shots === 0 ? 100 : Math.round((kills / shots) * 100);
            document.getElementById('val-acc').textContent = acc + '%';
        };

        function startGame() {
            document.getElementById('overlay').style.display = 'none';
            gameActive = true;
            kills = 0;
            shots = 0;
            timeLeft = 30;
            spawnTarget();
            draw();
            
            const timer = setInterval(() => {
                timeLeft--;
                document.getElementById('val-time').textContent = timeLeft;
                if(timeLeft <= 0) {
                    clearInterval(timer);
                    endGame();
                }
            }, 1000);
        }

        function endGame() {
            gameActive = false;
            document.getElementById('overlay').style.display = 'flex';
            document.getElementById('overlay').innerHTML = `
                <h1 style="color: #fff">FINAL RESULT</h1>
                <p>Kills: ${kills} | Accuracy: ${document.getElementById('val-acc').textContent}</p>
                <button class="btn-start" onclick="location.reload()">RE-TRY</button>
            `;
        }
    </script>
<script>
    if(/Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent)){
        document.body.innerHTML += '<a href="index.html" style="position:fixed;bottom:20px;right:20px;background:#000;color:#fff;padding:10px 20px;border-radius:30px;text-decoration:none;z-index:9999;border:1px solid #333;font-family:sans-serif;font-size:14px;">Back to Gallery</a>';
    }
</script>
</body>
</html>
