<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geode</title>
    <link rel="icon"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🪨%3C/text%3E%3C/svg%3E">
    <style>
        body {
            margin: 0;
            background: #1a1a1a;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            flex-direction: column;
        }

        .geode-container {
            position: relative;
            width: 300px;
            height: 300px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
        }

        .rock {
            position: absolute;
            width: 280px;
            height: 260px;
            background: #444;
            border-radius: 40% 60% 70% 30% / 40% 40% 60% 50%;
            box-shadow: inset -20px -20px 50px #111, 20px 20px 50px rgba(0, 0, 0, 0.5);
            transition: 0.1s;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .crystals {
            position: absolute;
            width: 200px;
            height: 180px;
            background: radial-gradient(circle, #d188ff 0%, #aa00ff 50%, #2f004d 100%);
            border-radius: 40% 50% 30% 60%;
            box-shadow: inset 0 0 50px #000;
            opacity: 0;
            transition: opacity 2s ease-in;
            mix-blend-mode: screen;
        }

        .crack {
            position: absolute;
            width: 0;
            height: 4px;
            background: #111;
            z-index: 10;
            transform-origin: left;
            transition: width 0.1s;
        }

        .c1 {
            top: 30%;
            left: 10%;
            transform: rotate(15deg);
        }

        .c2 {
            top: 60%;
            right: 10%;
            transform: rotate(160deg);
        }

        .c3 {
            top: 80%;
            left: 30%;
            transform: rotate(-30deg);
        }

        .geode-container:active .rock {
            transform: scale(0.95);
        }

        /* Shards for break effect */
        .shard {
            position: absolute;
            width: 100px;
            height: 100px;
            background: #444;
            clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
            opacity: 0;
            pointer-events: none;
        }

        .open .rock {
            background: transparent;
            box-shadow: none;
            transition: 0s;
        }

        .open .crystals {
            opacity: 1;
            animation: glow 2s infinite alternate;
        }

        @keyframes glow {
            0% {
                filter: drop-shadow(0 0 20px #a0f);
            }

            100% {
                filter: drop-shadow(0 0 50px #d8f);
            }
        }

        .open .crack {
            display: none;
        }

        .hint {
            margin-top: 50px;
            font-family: sans-serif;
            color: #555;
            letter-spacing: 5px;
        }
    </style>
</head>

<body>
    <div class="geode-container" id="geo">
        <div class="rock" id="rock">
            <div class="crystals" id="crys">
                <!-- Inner crystal facets using CSS borders -->
                <div
                    style="position:absolute; top:20px; left:50px; width:0; height:0; border-left: 20px solid transparent; border-right: 20px solid transparent; border-bottom: 50px solid rgba(255,255,255,0.8); transform: rotate(30deg);">
                </div>
                <div
                    style="position:absolute; top:80px; left:120px; width:0; height:0; border-left: 30px solid transparent; border-right: 30px solid transparent; border-bottom: 60px solid rgba(255,255,255,0.5); transform: rotate(-45deg);">
                </div>
                <div
                    style="position:absolute; top:100px; left:30px; width:0; height:0; border-left: 25px solid transparent; border-right: 25px solid transparent; border-bottom: 40px solid rgba(255,255,255,0.6); transform: rotate(110deg);">
                </div>
            </div>
            <div class="crack c1" id="k1"></div>
            <div class="crack c2" id="k2"></div>
            <div class="crack c3" id="k3"></div>
        </div>
    </div>
    <div class="hint" id="hint">BREAK IT OPEN</div>

    <script src="discovery.js"></script>
    <script>
        Discovery.unlock('geode');

        let hits = 0;
        const geo = document.getElementById('geo');
        const k1 = document.getElementById('k1');
        const k2 = document.getElementById('k2');
        const k3 = document.getElementById('k3');
        const hint = document.getElementById('hint');

        let broken = false;

        geo.addEventListener('click', e => {
            if (broken) return;
            hits++;

            // Shake effect
            const x = (Math.random() - 0.5) * 10;
            const y = (Math.random() - 0.5) * 10;
            geo.style.transform = `translate(${x}px, ${y}px)`;
            setTimeout(() => geo.style.transform = 'translate(0,0)', 50);

            // Cracks grow
            if (hits > 2) k1.style.width = '100px';
            if (hits > 5) k2.style.width = '150px';
            if (hits > 8) k3.style.width = '120px';

            if (hits >= 12) {
                broken = true;
                geo.classList.add('open');
                hint.innerText = 'BEAUTIFUL';
                hint.style.color = '#a0f';

                // Spawn shells
                for (let i = 0; i < 8; i++) {
                    const s = document.createElement('div');
                    s.className = 'shard';
                    s.style.top = '100px';
                    s.style.left = '100px';
                    geo.appendChild(s);

                    const angle = (i / 8) * Math.PI * 2;
                    const dist = Math.random() * 100 + 100;

                    s.animate([
                        { transform: `translate(0,0) rotate(0deg)`, opacity: 1 },
                        { transform: `translate(${Math.cos(angle) * dist}px, ${Math.sin(angle) * dist + 200}px) rotate(${Math.random() * 360}deg)`, opacity: 0 }
                    ], { duration: 1000, easing: 'ease-in', fill: 'forwards' });
                }
            }
        });
    </script>
</body>

</html>
