<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wave Machine — Interference Patterns</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{background:#0a0a12;overflow:hidden}
        canvas{display:block}
        .info{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);color:rgba(255,255,255,0.35);font-size:0.75rem;font-family:sans-serif;text-align:center}
    </style>

    <!-- wwg-mobile-patch-start -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        canvas {
            max-width: 100vw;
            max-height: 100vh;
            touch-action: none;
        }
    </style>
    <!-- wwg-mobile-patch-end -->

</head>
<body>
<style>
.wwg-back-btn{position:fixed;top:20px;left:20px;width:44px;height:44px;background:rgba(10,10,15,0.7);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,0.1);border-radius:50%;display:flex;align-items:center;justify-content:center;color:#a78bfa;z-index:99999;transition:all 0.3s;text-decoration:none}
.wwg-back-btn:hover{background:rgba(167,139,250,0.2);border-color:rgba(167,139,250,0.4);color:#fff}
</style>
<a href="index.html" class="wwg-back-btn" title="Back to Gallery"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg></a>
<canvas id="c"></canvas>
<div class="info">Click to place wave sources · Watch interference patterns form</div>
<script>
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
let W,H;
function resize(){W=canvas.width=innerWidth;H=canvas.height=innerHeight}
resize();window.onresize=resize;

const sources=[{x:200,y:300},{x:500,y:300}];
let t=0;

canvas.addEventListener('click',e=>{
    if(sources.length>=8)sources.shift();
    sources.push({x:e.clientX,y:e.clientY});
});
canvas.addEventListener('touchstart',e=>{
    e.preventDefault();
    if(sources.length>=8)sources.shift();
    sources.push({x:e.touches[0].clientX,y:e.touches[0].clientY});
},{passive:false});

const imgData=()=>ctx.createImageData(W,H);
let img;

function draw(){
    img=imgData();
    const d=img.data;
    const step=3;

    for(let y=0;y<H;y+=step){
        for(let x=0;x<W;x+=step){
            let val=0;
            for(const s of sources){
                const dx=x-s.x,dy=y-s.y;
                const dist=Math.sqrt(dx*dx+dy*dy);
                val+=Math.sin(dist*0.04-t*3)*0.5;
            }
            val/=sources.length||1;

            const r=Math.floor((Math.sin(val*Math.PI)*0.5+0.5)*60);
            const g=Math.floor((Math.sin(val*Math.PI+1)*0.5+0.5)*120);
            const b=Math.floor((Math.sin(val*Math.PI+2)*0.5+0.5)*255);

            for(let sy=0;sy<step&&y+sy<H;sy++){
                for(let sx=0;sx<step&&x+sx<W;sx++){
                    const i=((y+sy)*W+(x+sx))*4;
                    d[i]=r;d[i+1]=g;d[i+2]=b;d[i+3]=255;
                }
            }
        }
    }

    ctx.putImageData(img,0,0);

    // Draw source markers
    for(const s of sources){
        ctx.beginPath();
        ctx.arc(s.x,s.y,6,0,Math.PI*2);
        ctx.fillStyle='rgba(255,255,255,0.8)';
        ctx.fill();
        ctx.beginPath();
        ctx.arc(s.x,s.y,10,0,Math.PI*2);
        ctx.strokeStyle='rgba(255,255,255,0.3)';
        ctx.lineWidth=1;
        ctx.stroke();
    }

    t+=0.016;
    requestAnimationFrame(draw);
}
draw();
</script>

    <!-- wwg-mobile-patch-js-start -->
    <script>
        // Touch-to-Mouse Polyfill for legacy canvas interactives
        document.addEventListener('touchstart', function(e) {
            if(e.touches.length > 0) {
                const touch = e.touches[0];
                const mouseEvent = new MouseEvent('mousedown', {
                    clientX: touch.clientX,
                    clientY: touch.clientY,
                    bubbles: true,
                    cancelable: true
                });
                e.target.dispatchEvent(mouseEvent);
            }
        }, {passive: false});

        document.addEventListener('touchmove', function(e) {
            if(e.touches.length > 0) {
                const touch = e.touches[0];
                const mouseEvent = new MouseEvent('mousemove', {
                    clientX: touch.clientX,
                    clientY: touch.clientY,
                    bubbles: true,
                    cancelable: true
                });
                e.target.dispatchEvent(mouseEvent);
            }
        }, {passive: false});

        document.addEventListener('touchend', function(e) {
            const mouseEvent = new MouseEvent('mouseup', {
                bubbles: true,
                cancelable: true
            });
            e.target.dispatchEvent(mouseEvent);
        }, {passive: false});
    </script>
    <!-- wwg-mobile-patch-js-end -->

</body>
</html>
