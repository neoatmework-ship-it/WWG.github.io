<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ULTRA</title>
    <link rel="icon"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E⚡%3C/text%3E%3C/svg%3E">
    <style>
        body {
            margin: 0;
            background: #000;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            font-family: Impact, sans-serif;
            cursor: crosshair;
        }

        .ultra {
            font-size: 15vw;
            color: #000;
            text-transform: uppercase;
            letter-spacing: -2px;
            -webkit-text-stroke: 4px #0f0;
            text-shadow: 0 0 20px #0f0, 0 0 50px #0f0;
            animation: shake 0.1s infinite;
            position: relative;
            z-index: 10;
            user-select: none;
        }

        @keyframes shake {
            0% {
                transform: translate(2px, 1px) rotate(0deg);
            }

            10% {
                transform: translate(-1px, -2px) rotate(-1deg);
            }

            20% {
                transform: translate(-3px, 0px) rotate(1deg);
            }

            30% {
                transform: translate(0px, 2px) rotate(0deg);
            }

            40% {
                transform: translate(1px, -1px) rotate(1deg);
            }

            50% {
                transform: translate(-1px, 2px) rotate(-1deg);
            }

            60% {
                transform: translate(-3px, 1px) rotate(0deg);
            }

            70% {
                transform: translate(2px, 1px) rotate(-1deg);
            }

            80% {
                transform: translate(-1px, -1px) rotate(1deg);
            }

            90% {
                transform: translate(2px, 2px) rotate(0deg);
            }

            100% {
                transform: translate(1px, -2px) rotate(-1deg);
            }
        }

        .bg-flash {
            position: absolute;
            inset: 0;
            background: red;
            mix-blend-mode: screen;
            opacity: 0;
            z-index: 1;
            pointer-events: none;
        }

        @keyframes bgflash {
            0% {
                opacity: 0.8;
            }

            100% {
                opacity: 0;
            }
        }
    </style>
</head>

<body>
    <div class="ultra">ULTRA</div>
    <div class="bg-flash" id="f"></div>
    <script src="discovery.js"></script>
    <script>
        Discovery.unlock('ultra');
        window.addEventListener('click', () => {
            const f = document.getElementById('f');
            f.style.animation = 'none';
            void f.offsetWidth; // trigger reflow
            f.style.background = `hsl(${Math.random() * 360}, 100%, 50%)`;
            f.style.animation = 'bgflash 0.5s ease-out forwards';

            const txt = document.querySelector('.ultra');
            const col = `hsl(${Math.random() * 360}, 100%, 50%)`;
            txt.style.webkitTextStroke = `4px ${col}`;
            txt.style.textShadow = `0 0 20px ${col}, 0 0 50px ${col}`;
        });
    </script>
</body>

</html>
