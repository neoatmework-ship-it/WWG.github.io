<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ember</title>
    <link rel="icon"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🔥%3C/text%3E%3C/svg%3E">
    <style>
        body {
            margin: 0;
            background: #0a0505;
            overflow: hidden;
            height: 100vh;
            display: flex;
            align-items: flex-end;
            justify-content: center;
        }

        .log {
            width: 300px;
            height: 50px;
            background: #321;
            border-radius: 25px;
            position: absolute;
            bottom: 20px;
            box-shadow: 0 -10px 30px #f40, inset 0 10px 20px #210;
            z-index: 10;
            cursor: pointer;
        }

        .log::after {
            content: '';
            position: absolute;
            width: 250px;
            height: 40px;
            background: #210;
            border-radius: 20px;
            top: 5px;
            left: 25px;
            transform: rotate(5deg);
            z-index: -1;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            pointer-events: none;
            z-index: 5;
            mix-blend-mode: screen;
        }

        .hint {
            color: #f40;
            position: absolute;
            top: 30px;
            font-family: sans-serif;
            letter-spacing: 5px;
            opacity: 0.3;
        }
    </style>

    <!-- wwg-mobile-patch-start -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        canvas {
            max-width: 100vw;
            max-height: 100vh;
            touch-action: none;
        }
    </style>
    <!-- wwg-mobile-patch-end -->

</head>

<body>
    <div class="hint">STOKE THE FIRE</div>
    <div class="log" id="log"></div>
    <canvas id="c"></canvas>

    <script src="discovery.js"></script>
    <script>
        Discovery.unlock('ember');
        const canvas = document.getElementById('c');
        const ctx = canvas.getContext('2d');
        let w = canvas.width = window.innerWidth;
        let h = canvas.height = window.innerHeight;

        let embers = [];
        let intensity = 1;

        document.getElementById('log').addEventListener('click', () => {
            intensity = Math.min(intensity + 5, 20);
            for (let i = 0; i < 30; i++) spawnEmber(true);
        });

        // Decay fire
        setInterval(() => {
            if (intensity > 1) intensity -= 0.5;
        }, 1000);

        function spawnEmber(burst = false) {
            const size = Math.random() * 4 + 1;
            embers.push({
                x: w / 2 + (Math.random() - 0.5) * 200,
                y: h - 50,
                vx: (Math.random() - 0.5) * (burst ? 10 : 2),
                vy: -(Math.random() * 5 + 2) * (burst ? 2 : 1) * (intensity * 0.2),
                life: 1,
                decay: Math.random() * 0.02 + 0.005,
                size: size,
                color: `hsl(${Math.random() * 30 + 10}, 100%, 50%)`
            });
        }

        function draw() {
            ctx.clearRect(0, 0, w, h);

            // Auto spawn
            if (Math.random() < intensity * 0.1) spawnEmber();

            for (let i = 0; i < embers.length; i++) {
                const e = embers[i];
                e.x += e.vx;
                e.y += e.vy;
                e.life -= e.decay;

                // Drift
                e.vx += (Math.random() - 0.5) * 0.5;

                if (e.life <= 0) {
                    embers.splice(i, 1);
                    i--;
                    continue;
                }

                ctx.beginPath();
                ctx.arc(e.x, e.y, e.size * e.life, 0, Math.PI * 2);
                ctx.fillStyle = e.color;
                ctx.globalAlpha = e.life;
                ctx.fill();

                // Glow
                ctx.shadowBlur = 10;
                ctx.shadowColor = e.color;
            }
            ctx.shadowBlur = 0;
            ctx.globalAlpha = 1;

            // Heat blur base
            ctx.fillStyle = `rgba(255, 60, 0, ${intensity * 0.01})`;
            ctx.beginPath();
            ctx.ellipse(w / 2, h - 40, 150 + intensity * 10, 50 + intensity * 5, 0, 0, Math.PI * 2);
            ctx.fill();

            requestAnimationFrame(draw);
        }
        draw();

        window.addEventListener('resize', () => {
            w = canvas.width = window.innerWidth;
            h = canvas.height = window.innerHeight;
        });
    </script>

    <!-- wwg-mobile-patch-js-start -->
    <script>
        // Touch-to-Mouse Polyfill for legacy canvas interactives
        document.addEventListener('touchstart', function(e) {
            if(e.touches.length > 0) {
                const touch = e.touches[0];
                const mouseEvent = new MouseEvent('mousedown', {
                    clientX: touch.clientX,
                    clientY: touch.clientY,
                    bubbles: true,
                    cancelable: true
                });
                e.target.dispatchEvent(mouseEvent);
            }
        }, {passive: false});

        document.addEventListener('touchmove', function(e) {
            if(e.touches.length > 0) {
                const touch = e.touches[0];
                const mouseEvent = new MouseEvent('mousemove', {
                    clientX: touch.clientX,
                    clientY: touch.clientY,
                    bubbles: true,
                    cancelable: true
                });
                e.target.dispatchEvent(mouseEvent);
            }
        }, {passive: false});

        document.addEventListener('touchend', function(e) {
            const mouseEvent = new MouseEvent('mouseup', {
                bubbles: true,
                cancelable: true
            });
            e.target.dispatchEvent(mouseEvent);
        }, {passive: false});
    </script>
    <!-- wwg-mobile-patch-js-end -->

</body>

</html>
