<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alchemy</title>
    <link rel="icon"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E⚗️%3C/text%3E%3C/svg%3E">
    <style>
        body {
            margin: 0;
            background: #221;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            font-family: sans-serif;
        }

        .cauldron {
            width: 200px;
            height: 150px;
            background: #111;
            border-radius: 20px;
            border-bottom-left-radius: 100px;
            border-bottom-right-radius: 100px;
            position: relative;
            margin-top: 50px;
            border-top: 10px solid #333;
            box-shadow: 0 20px 50px rgba(0, 255, 0, 0.2);
            transition: 0.3s;
        }

        .brew {
            position: absolute;
            top: -5px;
            left: 10px;
            right: 10px;
            height: 40px;
            background: rgba(0, 255, 0, 0.4);
            border-radius: 50%;
            filter: blur(5px);
            transition: 1s;
        }

        .shelf {
            display: flex;
            gap: 20px;
            margin-bottom: 50px;
        }

        .el {
            width: 60px;
            height: 60px;
            background: #fff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            cursor: grab;
            user-select: none;
            z-index: 10;
            font-family: monospace;
        }

        .fire {
            background: #ff4500;
            color: white;
        }

        .water {
            background: #1e90ff;
            color: white;
        }

        .earth {
            background: #8b4513;
            color: white;
        }

        .air {
            background: #e0ffff;
            color: #333;
        }

        .result {
            position: absolute;
            top: 20%;
            color: #fff;
            font-size: 2rem;
            opacity: 0;
            transition: 0.5s;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 5px;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.8);
        }

        .drag {
            position: absolute;
            pointer-events: none;
        }
    </style>

    <!-- wwg-mobile-patch-start -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        canvas {
            max-width: 100vw;
            max-height: 100vh;
            touch-action: none;
        }
    </style>
    <!-- wwg-mobile-patch-end -->

</head>

<body>
    <div class="result" id="res">EXPLOSION</div>
    <div class="shelf">
        <div class="el fire">🔥</div>
        <div class="el water">💧</div>
        <div class="el earth">🪨</div>
        <div class="el air">💨</div>
    </div>

    <div class="cauldron" id="pot">
        <div class="brew" id="brew"></div>
    </div>

    <script src="discovery.js"></script>
    <script src="economy.js"></script>
    <script src="gaster-hook.js"></script>
    <script>
        Discovery.unlock('alchemy');

        const els = document.querySelectorAll('.el');
        const pot = document.getElementById('pot');
        const brew = document.getElementById('brew');
        const res = document.getElementById('res');

        let inPot = [];
        let dragEl = null;

        els.forEach(el => {
            el.addEventListener('mousedown', e => {
                const copy = el.cloneNode(true);
                copy.classList.add('drag');
                document.body.appendChild(copy);
                dragEl = { node: copy, x: e.clientX, y: e.clientY, type: el.innerText };
                moveDrag(e);
            });
        });

        window.addEventListener('mousemove', moveDrag);
        window.addEventListener('mouseup', dropDrag);

        function moveDrag(e) {
            if (!dragEl) return;
            dragEl.node.style.left = e.clientX - 30 + 'px';
            dragEl.node.style.top = e.clientY - 30 + 'px';
        }

        function dropDrag(e) {
            if (!dragEl) return;
            const potRect = pot.getBoundingClientRect();
            if (e.clientX > potRect.left && e.clientX < potRect.right &&
                e.clientY > potRect.top && e.clientY < potRect.bottom) {
                inPot.push(dragEl.type);
                if (inPot.length > 2) inPot.shift();
                checkMix();
            }
            dragEl.node.remove();
            dragEl = null;
        }

        const recipes = {
            '🔥💧': { n: 'Steam', c: 'rgba(255,255,255,0.8)' }, '💧🔥': { n: 'Steam', c: 'rgba(255,255,255,0.8)' },
            '🔥🪨': { n: 'Lava', c: 'rgba(255,50,0,0.8)' }, '🪨🔥': { n: 'Lava', c: 'rgba(255,50,0,0.8)' },
            '🔥💨': { n: 'Energy', c: 'rgba(255,255,0,0.8)' }, '💨🔥': { n: 'Energy', c: 'rgba(255,255,0,0.8)' },
            '💧🪨': { n: 'Mud', c: 'rgba(100,50,0,0.8)' }, '🪨💧': { n: 'Mud', c: 'rgba(100,50,0,0.8)' },
            '💧💨': { n: 'Rain', c: 'rgba(0,100,255,0.8)' }, '💨💧': { n: 'Rain', c: 'rgba(0,100,255,0.8)' },
            '🪨💨': { n: 'Dust', c: 'rgba(200,200,200,0.8)' }, '💨🪨': { n: 'Dust', c: 'rgba(200,200,200,0.8)' },
            '🔥🔥': { n: 'Plasma', c: 'rgba(255,0,255,0.8)' },
            '💧💧': { n: 'Ocean', c: 'rgba(0,0,255,0.8)' },
            '🪨🪨': { n: 'Mountain', c: 'rgba(50,50,50,0.8)' },
            '💨💨': { n: 'Tornado', c: 'rgba(255,255,255,0.3)' },
            // Secret Level 2 recipes
            'PlasmaEnergy': { n: 'Sun', c: 'rgba(255,255,255,1)' },
            'EnergyPlasma': { n: 'Sun', c: 'rgba(255,255,255,1)' }
        };

        function checkMix() {
            if (inPot.length === 2) {
                const combo = inPot[0] + inPot[1];
                const found = recipes[combo] || { n: 'Sludge', c: 'rgba(50,50,50,0.9)' };

                brew.style.background = found.c;
                pot.style.boxShadow = `0 20px 50px ${found.c}`;
                res.innerText = found.n;
                res.style.opacity = 1;
                res.style.transform = 'translateY(-20px)';

                // Alchemist Unlock Logic
                if (found.n === 'Sun') {
                    const data = JSON.parse(localStorage.getItem('wwg_avatar_data') || '{}');
                    if (!data.unlocked?.includes('the-alchemist')) {
                        data.unlocked = [...(data.unlocked || []), 'the-alchemist'];
                        localStorage.setItem('wwg_avatar_data', JSON.stringify(data));
                        alert("THE GREAT WORK IS COMPLETE. 'ALCHEMIST' IDENTITY UNLOCKED.");
                    }
                }

                setTimeout(() => {
                    res.style.opacity = 0;
                    res.style.transform = 'translateY(0)';
                    inPot = [];
                    brew.style.background = 'rgba(0, 255, 0, 0.4)';
                    pot.style.boxShadow = `0 20px 50px rgba(0,255,0,0.2)`;
                }, 2000);
            } else {
                brew.style.background = 'rgba(255, 255, 255, 0.8)';
            }
        }

        // Spawn Gaster Fragment
        GasterHook.spawnFragment('fragment-alchemy', '85%', '10%');
    </script>

    <!-- wwg-mobile-patch-js-start -->
    <script>
        document.addEventListener('touchstart', function(e) {
            if(e.touches.length > 0) {
                const touch = e.touches[0];
                const mouseEvent = new MouseEvent('mousedown', {
                    clientX: touch.clientX, clientY: touch.clientY,
                    bubbles: true, cancelable: true
                });
                e.target.dispatchEvent(mouseEvent);
            }
        }, {passive: false});
        document.addEventListener('touchmove', function(e) {
            if(e.touches.length > 0) {
                const touch = e.touches[0];
                const mouseEvent = new MouseEvent('mousemove', {
                    clientX: touch.clientX, clientY: touch.clientY,
                    bubbles: true, cancelable: true
                });
                e.target.dispatchEvent(mouseEvent);
            }
        }, {passive: false});
        document.addEventListener('touchend', function(e) {
            const mouseEvent = new MouseEvent('mouseup', {
                bubbles: true, cancelable: true
            });
            e.target.dispatchEvent(mouseEvent);
        }, {passive: false});
    </script>
    <!-- wwg-mobile-patch-js-end -->
</body>
</html>
