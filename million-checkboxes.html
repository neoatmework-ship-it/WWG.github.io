<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>One Million Checkboxes — The Infinite Grid</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #ffffff;
            --text: #000000;
            --accent: #007bff;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            margin: 0;
            overflow-x: hidden;
        }

        .header {
            position: fixed;
            top: 0;
            width: 100%;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            padding: 20px;
            text-align: center;
            border-bottom: 1px solid #eee;
            z-index: 100;
        }

        .stats {
            font-weight: 700;
            font-size: 1.2rem;
            color: var(--accent);
        }

        .grid-container {
            margin-top: 100px;
            display: flex;
            flex-wrap: wrap;
            padding: 10px;
            gap: 2px;
            justify-content: center;
        }

        input[type="checkbox"] {
            width: 20px;
            height: 20px;
            cursor: pointer;
            accent-color: var(--accent);
        }

        .back-link {
            position: fixed;
            top: 30px;
            left: 30px;
            color: #ccc;
            text-decoration: none;
            font-size: 0.8rem;
            z-index: 101;
        }

        .loading-curtain {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 200;
            transition: opacity 0.5s;
        }
    </style>
</head>
<body>

    <a href="index.html" class="back-link">← EXIT_GRID</a>

    <div class="loading-curtain" id="loader">
        <div style="text-align: center;">
            <div style="font-weight: 900; font-size: 2rem; margin-bottom: 10px;">INITIALIZING 1,000,000 BOXES</div>
            <div id="load-progress">0%</div>
        </div>
    </div>

    <div class="header">
        <div class="stats">TOTAL CHECKED: <span id="total-count">0</span> / 1,000,000</div>
        <div style="font-size: 0.7rem; opacity: 0.5; margin-top: 5px;">COLLECTIVE (SIMULATED) ACTIVITY DETECTED</div>
    </div>

    <div class="grid-container" id="grid"></div>

    <script src="discovery.js"></script>
    <script>
        Discovery.unlock('million-checkboxes');

        let totalChecked = Math.floor(Math.random() * 500000) + 100000;
        const totalEl = document.getElementById('total-count');
        const gridEl = document.getElementById('grid');

        // Only render 5000 at a time to keep it playable, simulate the rest
        const VISIBLE_COUNT = 2500;

        function init() {
            let loaded = 0;
            const step = 5;
            const interval = setInterval(() => {
                loaded += step;
                document.getElementById('load-progress').textContent = loaded + "%";
                if(loaded >= 100) {
                    clearInterval(interval);
                    document.getElementById('loader').style.opacity = '0';
                    setTimeout(() => document.getElementById('loader').style.display = 'none', 500);
                    renderGrid();
                }
            }, 50);
        }

        function renderGrid() {
            totalEl.textContent = totalChecked.toLocaleString();

            for(let i = 0; i < VISIBLE_COUNT; i++) {
                const cb = document.createElement('input');
                cb.type = "checkbox";
                if(Math.random() > 0.7) {
                    cb.checked = true;
                }
                cb.onchange = (e) => {
                    if(e.target.checked) totalChecked++;
                    else totalChecked--;
                    totalEl.textContent = totalChecked.toLocaleString();
                };
                gridEl.appendChild(cb);
            }

            // Simulate "other users"
            setInterval(() => {
                const change = Math.floor(Math.random() * 3) - 1;
                totalChecked += change;
                totalEl.textContent = totalChecked.toLocaleString();
                
                // Occasionally check/uncheck a random visible box
                const randomBox = gridEl.children[Math.floor(Math.random() * VISIBLE_COUNT)];
                if(Math.random() > 0.95) {
                    randomBox.checked = !randomBox.checked;
                }
            }, 1000);
        }

        init();
    </script>
<script>
    if(/Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent)){
        document.body.innerHTML += '<a href="index.html" style="position:fixed;bottom:20px;right:20px;background:#000;color:#fff;padding:10px 20px;border-radius:30px;text-decoration:none;z-index:9999;border:1px solid #333;font-family:sans-serif;font-size:14px;">Back to Gallery</a>';
    }
</script>
</body>
</html>
