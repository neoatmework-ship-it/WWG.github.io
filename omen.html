<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Omen</title>
    <link rel="icon"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E👁️‍🗨️%3C/text%3E%3C/svg%3E">
    <style>
        body {
            margin: 0;
            background: #000;
            overflow: hidden;
            height: 100vh;
            position: relative;
        }

        .eye {
            position: absolute;
            width: 60px;
            height: 30px;
            background: #fff;
            border-radius: 50% 50% 50% 50% / 100% 100% 100% 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.5);
            transition: opacity 2s;
            opacity: 0;
        }

        .iris {
            width: 20px;
            height: 20px;
            background: #f00;
            border-radius: 50%;
            box-shadow: inset 0 0 10px #000;
            transform: translate(0, 0);
            transition: 0.1s linear;
        }

        .pupil {
            width: 10px;
            height: 10px;
            background: #000;
            border-radius: 50%;
            margin: auto;
        }

        .hint {
            position: absolute;
            bottom: 20px;
            width: 100%;
            text-align: center;
            color: #300;
            font-family: monospace;
            letter-spacing: 10px;
            pointer-events: none;
        }
    </style>

    <!-- wwg-mobile-patch-start -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        canvas {
            max-width: 100vw;
            max-height: 100vh;
            touch-action: none;
        }
    </style>
    <!-- wwg-mobile-patch-end -->

</head>

<body>
    <div class="hint">THEY WATCH</div>

    <script src="discovery.js"></script>
    <script>
        Discovery.unlock('omen');
        const eyes = [];

        for (let i = 0; i < 10; i++) {
            const eye = document.createElement('div');
            eye.className = 'eye';
            eye.style.left = (Math.random() * 80 + 10) + 'vw';
            eye.style.top = (Math.random() * 80 + 10) + 'vh';

            const iris = document.createElement('div');
            iris.className = 'iris';
            iris.innerHTML = '<div class="pupil"></div>';

            eye.appendChild(iris);
            document.body.appendChild(eye);

            // Randomly appear
            setTimeout(() => eye.style.opacity = 1, Math.random() * 5000);

            eyes.push({ el: eye, iris: iris, blinkTimer: Math.random() * 5000 + 2000 });
        }

        window.addEventListener('mousemove', e => {
            const mx = e.clientX;
            const my = e.clientY;

            eyes.forEach(eyeObj => {
                const rect = eyeObj.el.getBoundingClientRect();
                const ex = rect.left + rect.width / 2;
                const ey = rect.top + rect.height / 2;

                const angle = Math.atan2(my - ey, mx - ex);
                const dist = Math.min(10, Math.sqrt(Math.pow(mx - ex, 2) + Math.pow(my - ey, 2)) / 10);

                const ix = Math.cos(angle) * dist;
                const iy = Math.sin(angle) * Math.min(5, dist);

                eyeObj.iris.style.transform = `translate(${ix}px, ${iy}px)`;
            });
        });

        // Blinking logic
        function blinkLoop() {
            eyes.forEach(eyeObj => {
                eyeObj.blinkTimer -= 50;
                if (eyeObj.blinkTimer <= 0 && eyeObj.el.style.opacity == 1) {
                    eyeObj.el.style.transform = "scaleY(0.1)"; // close
                    setTimeout(() => eyeObj.el.style.transform = "scaleY(1)", 150); // open
                    eyeObj.blinkTimer = Math.random() * 5000 + 2000;
                }
            });
            requestAnimationFrame(blinkLoop);
        }
        blinkLoop();
    </script>

    <!-- wwg-mobile-patch-js-start -->
    <script>
        // Touch-to-Mouse Polyfill for legacy canvas interactives
        document.addEventListener('touchstart', function(e) {
            if(e.touches.length > 0) {
                const touch = e.touches[0];
                const mouseEvent = new MouseEvent('mousedown', {
                    clientX: touch.clientX,
                    clientY: touch.clientY,
                    bubbles: true,
                    cancelable: true
                });
                e.target.dispatchEvent(mouseEvent);
            }
        }, {passive: false});

        document.addEventListener('touchmove', function(e) {
            if(e.touches.length > 0) {
                const touch = e.touches[0];
                const mouseEvent = new MouseEvent('mousemove', {
                    clientX: touch.clientX,
                    clientY: touch.clientY,
                    bubbles: true,
                    cancelable: true
                });
                e.target.dispatchEvent(mouseEvent);
            }
        }, {passive: false});

        document.addEventListener('touchend', function(e) {
            const mouseEvent = new MouseEvent('mouseup', {
                bubbles: true,
                cancelable: true
            });
            e.target.dispatchEvent(mouseEvent);
        }, {passive: false});
    </script>
    <!-- wwg-mobile-patch-js-end -->

</body>

</html>
