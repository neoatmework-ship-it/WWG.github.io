<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WWG Discovery Guide | The 25 Fragments</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;700&family=Inter:wght@400;600&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg: #050510;
            --accent: #a78bfa;
            --zinc: #18181b;
            --glass: rgba(255, 255, 255, 0.03);
            --border: rgba(255, 255, 255, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--bg);
            color: #fff;
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            padding: 80px 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header {
            text-align: center;
            margin-bottom: 80px;
            max-width: 800px;
        }

        h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 3rem;
            letter-spacing: -2px;
            margin-bottom: 20px;
            color: var(--accent);
        }

        .desc {
            color: #a1a1aa;
            line-height: 1.6;
            font-size: 1.1rem;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 30px;
            width: 100%;
            max-width: 1400px;
        }

        .card {
            background: var(--glass);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 30px;
            transition: 0.4s;
            position: relative;
            opacity: 0.6;
        }

        .card.found {
            opacity: 1;
            border-color: var(--accent);
            background: rgba(167, 139, 250, 0.05);
        }

        .tag {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #444;
            margin-bottom: 10px;
        }

        .found .tag {
            color: var(--accent);
        }

        .name {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 15px;
            color: #444;
        }

        .found .name {
            color: #fff;
        }

        .hint {
            background: rgba(255, 255, 255, 0.02);
            padding: 15px;
            border-radius: 12px;
            font-size: 0.85rem;
            line-height: 1.5;
            color: #666;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .found .hint {
            color: #aaa;
            background: rgba(0, 0, 0, 0.2);
        }

        .hint b {
            color: var(--accent);
            font-family: 'Space Grotesk', sans-serif;
            text-transform: uppercase;
            font-size: 0.65rem;
            letter-spacing: 1px;
            display: block;
            margin-bottom: 2px;
        }

        .hint-block {
            background: rgba(255, 255, 255, 0.03);
            padding: 10px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .status {
            margin-top: 20px;
            font-size: 0.7rem;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .status.unfound {
            color: #444;
        }

        .status.found-text {
            color: var(--accent);
        }

        .back-link {
            position: fixed;
            top: 40px;
            left: 40px;
            color: #666;
            text-decoration: none;
            font-size: 0.8rem;
            letter-spacing: 2px;
        }

        .back-link:hover {
            color: #fff;
        }
    </style>
</head>

<body>
    <a href="index.html" class="back-link">← RETURN</a>

    <div class="header">
        <h1>DISCOVERY GUIDE</h1>
        <p class="desc">There are 25 core fragments hidden within this gallery. Use the hints below to salvage them for
            your Vault.</p>
    </div>

    <div class="grid" id="guide-grid">
        <!-- Generated by JS -->
    </div>

    <script src="discovery.js"></script>
    <script>
        if (!Discovery.isCheatsheetUnlocked()) {
            window.location.href = 'index.html';
        }

        const secrets = [
            { id: 'void', name: 'The Void', keyword: 'void', action: 'Stay perfectly still for 30 seconds.', tainted: 'Stay perfectly still for 60 seconds.' },
            { id: 'ghost', name: 'The Ghost', keyword: 'ghost', action: 'Type "HELLO" anywhere on the main page.', tainted: 'Type "VALLEY" anywhere on the main page.' },
            { id: 'classified', name: 'Classified Records', keyword: 'classified', action: 'Triple-click the ✦ symbol in the footer.', tainted: 'Double-click the creator name in the footer information.' },
            { id: 'backrooms', name: 'The Backrooms', keyword: 'backrooms', action: 'Click the footer background 5 times.', tainted: 'Hold Alt and click the footer background 5 times.' },
            { id: 'limbo', name: 'Dep. of Waiting', keyword: 'limbo', action: 'Stay on a "No Results" page for 20 seconds.', tainted: 'Stay on a "No Results" page for 60 seconds.' },
            { id: 'static', name: '103.7 Broadcast', keyword: 'static', action: 'Focus the search bar 5 times rapidly.', tainted: 'Focus the search bar 10 times rapidly.' },
            { id: 'deep', name: 'The Deep', keyword: 'deep', action: 'Double-click the ↑ button while scrolling.', tainted: 'Double-click the WWG logo in the hero section.' },
            { id: 'underground', name: 'The Underground', keyword: 'underground', action: 'Triple-click the "Suggest Idea" button.', tainted: 'Triple-click the title inside the "Suggest Idea" popup.' },
            { id: 'starlight', name: 'Starlight Observatory', keyword: 'starlight', action: 'Shift + Click the "WWG" title.', tainted: 'Play Twinkle Twinkle (C,C,G,G,A,A,G) on the Color Piano.' },
            { id: 'eclipse', name: 'Solar Eclipse', keyword: 'eclipse', action: 'Ctrl + Click the "WWG" title.', tainted: 'Ctrl + Alt + Click the "WWG" title.' },
            { id: 'mirror', name: 'Broken Mirror', keyword: 'mirror', action: 'Click the "WWG" title 5 times.', tainted: 'Click the "WWG" title 10 times.' },
            { id: 'blackhole', name: 'Black Hole', keyword: 'blackhole', action: 'Triple-click the 🔍 emoji on the "No Results" screen.', tainted: 'Triple-click the "Suggest" button while on the "No Results" screen.' },
            { id: 'chosen', name: 'The Chosen', keyword: 'chosen', action: 'Alt + Click the "WWG" title.', tainted: 'Roll 777 on the Emoji Slots.' },
            { id: 'useful', name: 'The Useful Button', keyword: 'useful', action: 'Input the Konami code in "Useless Button Museum".', tainted: 'Input the Konami code in "DVD Simulator".' },
            { id: 'corner', name: 'The Corner Room', keyword: 'corner', action: 'Wait for a corner hit in "DVD Simulator".', tainted: 'Wait for two consecutive corner hits in "DVD Simulator".' },
            { id: 'braille', name: 'Braille Labs', keyword: 'braille', action: 'Click any card emoji 5 times.', tainted: 'Click any card emoji 10 times.' },
            { id: 'glitch', name: 'Nexus Corrupt', keyword: 'glitch', action: 'Rapidly click any category tag 7 times.', tainted: 'Rapidly click any category tag 15 times.' },
            { id: 'voidvoid', name: 'The Void Matrix', keyword: 'glitchvoid', action: 'Press Shift + Enter on "void" search.', tainted: 'Press Ctrl + Enter on "glitchvoid" search.' },
            { id: 'terminal', name: 'System Terminal', keyword: 'terminal', action: 'Type "cmd" or "root" on home page.', tainted: 'Type "root" twice rapidly on home page.' },
            { id: 'blueprint', name: 'Technical Blueprint', keyword: 'blueprint', action: 'Click the footer version number 3 times.', tainted: 'Click the footer version number 7 times.' },
            { id: 'zenith', name: 'Zenith Sanctuary', keyword: 'zenith', action: 'Click "Find my secrets" 3 times.', tainted: 'Click "Find my secrets" 7 times.' },
            { id: 'gravity', name: 'Gravity Shift', keyword: 'gravityshift', action: 'Type "flip" on home page.', tainted: 'Type "invert" on home page.' },
            { id: 'timeloop', name: 'The Time Loop', keyword: 'timeloop', action: 'Sequence: P, N, P, N, P, N in navigation.', tainted: 'Sequence: P, N, P, N, P, N, P, N in navigation.' },
            { id: 'forest', name: 'The Binary Forest', keyword: 'binaryforest', action: 'Type "tree" on home page.', tainted: 'Type "forest" on home page.' },
            { id: 'observer', name: 'The Observer', keyword: 'observer', action: 'Type "eye" on home page.', tainted: 'Type "stalker" on home page.' }
        ];

        function render() {
            const discovered = Discovery.getDiscovered(false);
            const taintedDiscovered = Discovery.getDiscovered(true);
            const grid = document.getElementById('guide-grid');
            grid.innerHTML = '';

            secrets.forEach(s => {
                const isFound = discovered.includes(s.id);
                const isTaintedFound = taintedDiscovered.includes(s.id);
                const card = document.createElement('div');
                card.className = `card ${isFound ? 'found' : ''}`;
                if (isTaintedFound) card.style.boxShadow = 'inset 0 0 20px rgba(239, 68, 68, 0.2)';

                card.innerHTML = `
                    <div class="tag" style="display:flex; justify-content:space-between;">
                        <span>Fragment ID: ${s.id.toUpperCase()}</span>
                        <span style="color:${isTaintedFound ? '#ef4444' : '#444'}">${isTaintedFound ? 'TAINTED_LOCKED' : ''}</span>
                    </div>
                    <div class="name">${isFound ? s.name : 'HIDDEN_FRAGMENT'}</div>
                    <div class="hint">
                        <div class="hint-block"><b>Normal Approach</b> Keyword: "${s.keyword}" or Action: ${s.action}</div>
                        <div class="hint-block" style="border-color:${isTaintedFound ? '#ef444433' : ''}">
                            <b style="color:#ef4444">Tainted Side</b> ${s.tainted}
                        </div>
                    </div>
                    <div class="status-wrap" style="display:flex; gap:10px; margin-top:20px;">
                        <div class="status ${isFound ? 'found-text' : 'unfound'}">
                            NORMAL: ${isFound ? '✓' : '👀'}
                        </div>
                        <div class="status ${isTaintedFound ? 'found-text' : 'unfound'}" style="${isTaintedFound ? 'color:#ef4444' : ''}">
                            TAINTED: ${isTaintedFound ? '✓' : '👀'}
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        render();
    </script>
</body>

</html>
