<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E📑%3C/text%3E%3C/svg%3E">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Protocol: Salvage Status | [REDACTED]</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #050505;
            --accent: #f87171;
            --border: #1f2937;
        }

        * { margin:0; padding:0; box-sizing:border-box; }
        body { background: var(--bg); color: #9ca3af; font-family: 'Space Grotesk', sans-serif; padding: 60px 40px; }
        .header { margin-bottom: 40px; border-bottom: 2px solid var(--accent); padding-bottom: 20px; }
        h1 { font-family: 'JetBrains Mono', monospace; font-size: 1.5rem; color: var(--accent); letter-spacing: 2px; }
        .protocol-id { font-size: 0.8rem; opacity: 0.5; margin-top: 5px; }

        .table-container { width: 100%; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; font-family: 'JetBrains Mono', monospace; font-size: 0.85rem; }
        th { text-align: left; padding: 15px; border-bottom: 1px solid var(--border); color: #ef4444; text-transform: uppercase; letter-spacing: 1px; }
        td { padding: 15px; border-bottom: 1px solid var(--border); }
        
        .status-badge { padding: 4px 8px; border-radius: 4px; font-size: 0.7rem; font-weight: bold; }
        .status-salvaged { background: rgba(52, 211, 153, 0.1); color: #34d399; }
        .status-redacted { background: rgba(239, 68, 68, 0.1); color: #ef4444; }

        .redacted-text { background: #111; color: #111; position: relative; display: inline-block; padding: 0 4px; }
        .redacted-text::selection { background: #111; color: #111; }

        .back-link { display: inline-block; margin-top: 40px; color: #6b7280; text-decoration: none; font-size: 0.8rem; }
        .back-link:hover { color: #fff; }
    </style>
</head>
<body>
    <div class="header">
        <h1>PROTOCOL_SALVAGE_STATUS</h1>
        <div class="protocol-id">REF_ID: WWG_SEC_2026 // ACCESS_LEVEL: RESTRICTED</div>
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>Fragment_ID</th>
                    <th>Status</th>
                    <th>Observation_Logs</th>
                </tr>
            </thead>
            <tbody id="protocol-body">
                <!-- JS generated -->
            </tbody>
        </table>
    </div>

    <a href="archive.html" class="back-link">← RETURN_TO_VAULT</a>

    <script src="discovery.js"></script>
    <script>
        const fragments = [
            { id: 'phantom-signal', hint: ' handshaking sequence detected in primary title identification.' },
            { id: 'void-fragment', hint: ' sixty seconds of observational silence required in home quadrant.' },
            { id: 'oracle-machine', hint: ' tactile input required during treasure visualization (Keys V+I).' },
            { id: 'whisperer', hint: ' finding identity of the self within the empty void of results.' },
            { id: 'pattern-breaker', hint: ' corner-point connection sequence initiated.' },
            { id: 'night-mode', hint: ' temporal window restriction [00:00 - 01:00].' },
            { id: 'forgotten', hint: ' ghost presence detected after 15s of search-failure.' },
            { id: 'chaos-engine', hint: ' entropy modifiers required during category selection (C-A-C).' },
            { id: 'liar', hint: ' prolonged exposure to deception (30s) yields fragment.' },
            { id: 'grand-finale', hint: ' total synchronization achieved.' }
        ];

        const body = document.getElementById('protocol-body');
        const discovered = Discovery.getDiscovered();

        fragments.forEach(f => {
            const isFound = discovered.includes(f.id);
            const row = document.createElement('tr');
            row.innerHTML = `
                <td>${f.id.toUpperCase()}</td>
                <td><span class="status-badge ${isFound ? 'status-salvaged' : 'status-redacted'}">${isFound ? 'SALVAGED' : 'REDACTED'}</span></td>
                <td>${isFound ? f.hint : '<span class="redacted-text">█████████████████████████████████</span>'}</td>
            `;
            body.appendChild(row);
        });
    </script>
</body>
</html>
