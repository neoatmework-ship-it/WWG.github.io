<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E📋%3C/text%3E%3C/svg%3E">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WWG Discovery Guide | The 45 Fragments</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;700&family=Inter:wght@400;600&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg: #050510;
            --accent: #a78bfa;
            --zinc: #18181b;
            --glass: rgba(255, 255, 255, 0.03);
            --border: rgba(255, 255, 255, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--bg);
            color: #fff;
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            padding: 80px 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header {
            text-align: center;
            margin-bottom: 80px;
            max-width: 800px;
        }

        h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 3rem;
            letter-spacing: -2px;
            margin-bottom: 20px;
            color: var(--accent);
        }

        .desc {
            color: #a1a1aa;
            line-height: 1.6;
            font-size: 1.1rem;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 30px;
            width: 100%;
            max-width: 1400px;
        }

        .card {
            background: var(--glass);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 30px;
            transition: 0.4s;
            position: relative;
            opacity: 0.6;
        }

        .card.found {
            opacity: 1;
            border-color: var(--accent);
            background: rgba(167, 139, 250, 0.05);
        }

        .tag {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #444;
            margin-bottom: 10px;
        }

        .found .tag {
            color: var(--accent);
        }

        .name {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 15px;
            color: #444;
        }

        .found .name {
            color: #fff;
        }

        .hint {
            background: rgba(255, 255, 255, 0.02);
            padding: 15px;
            border-radius: 12px;
            font-size: 0.85rem;
            line-height: 1.5;
            color: #666;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .found .hint {
            color: #aaa;
            background: rgba(0, 0, 0, 0.2);
        }

        .hint b {
            color: var(--accent);
            font-family: 'Space Grotesk', sans-serif;
            text-transform: uppercase;
            font-size: 0.65rem;
            letter-spacing: 1px;
            display: block;
            margin-bottom: 2px;
        }

        .hint-block {
            background: rgba(255, 255, 255, 0.03);
            padding: 10px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .status {
            margin-top: 20px;
            font-size: 0.7rem;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .status.unfound {
            color: #444;
        }

        .status.found-text {
            color: var(--accent);
        }

        .back-link {
            position: fixed;
            top: 40px;
            left: 40px;
            color: #666;
            text-decoration: none;
            font-size: 0.8rem;
            letter-spacing: 2px;
        }

        .back-link:hover {
            color: #fff;
        }
    </style>

    <!-- wwg-mobile-patch-start -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        canvas {
            max-width: 100vw;
            max-height: 100vh;
            touch-action: none;
        }
    </style>
    <!-- wwg-mobile-patch-end -->

</head>

<body>
    <a href="index.html" class="back-link">← RETURN</a>

    <div class="header">
        <h1>DISCOVERY GUIDE</h1>
        <p class="desc">There are 45 core fragments hidden within this gallery. Use the hints below to salvage them for
            your Vault.</p>
    </div>

    <div class="grid" id="guide-grid">
        <!-- Generated by JS -->
    </div>

    <script src="discovery.js"></script>
    <script>
        if (!Discovery.isCheatsheetUnlocked()) {
            window.location.href = 'index.html';
        }

        const secrets = [
            {
                id: 'phantom-signal',
                name: 'Phantom Signal',
                keyword: '—',
                action: 'Click the "WWG" title at the top of the home page 7 times in quick succession.'
            },
            {
                id: 'void-fragment',
                name: 'Void Fragment',
                keyword: '—',
                action: 'Stay on the home page for 60 seconds straight without clicking anything.'
            },
            {
                id: 'oracle-machine',
                name: 'The Oracle Machine',
                keyword: 'FUTURE',
                action: 'Type the word "FUTURE" anywhere on the home page (not in the search box).'
            },
            {
                id: 'whisperer',
                name: 'The Whisperer',
                keyword: '—',
                action: 'Type your own name into the search bar (3+ chars), then press Enter. Must return 0 results.'
            },
            {
                id: 'pattern-breaker',
                name: 'Pattern Breaker',
                keyword: '—',
                action: 'Click the 4 screen corners in order: Top-Left → Top-Right → Bottom-Right → Bottom-Left.'
            },
            {
                id: 'night-mode',
                name: 'Night Mode',
                keyword: '—',
                action: 'Visit the gallery between midnight (00:00) and 01:00 AM in your local timezone.'
            },
            {
                id: 'forgotten',
                name: 'The Forgotten',
                keyword: '—',
                action: 'Search for anything that returns 0 results. Then wait 15 seconds on the empty screen.'
            },
            {
                id: 'chaos-engine',
                name: 'Chaos Engine',
                keyword: 'CHAOS',
                action: 'Type the word "CHAOS" anywhere on the home page (not in the search box).'
            },
            {
                id: 'liar',
                name: 'The Liar',
                keyword: '—',
                action: 'Visit the "Liar\'s Clicker" game and stay on the page for 30 seconds.'
            },
            {
                id: 'grand-finale',
                name: '★ The Grand Finale',
                keyword: '—',
                action: 'Discover all 9 other secrets. This one unlocks automatically as your reward.'
            },
        ];

        function render() {
            const discovered = Discovery.getDiscovered();
            const grid = document.getElementById('guide-grid');
            grid.innerHTML = '';

            secrets.forEach(s => {
                const isFound = discovered.includes(s.id);
                const card = document.createElement('div');
                card.className = `card ${isFound ? 'found' : ''}`;

                card.innerHTML = `
                    <div class="tag">Fragment ID: ${s.id.toUpperCase()}</div>
                    <div class="name">${isFound ? s.name : 'HIDDEN_FRAGMENT'}</div>
                    <div class="hint">
                        <div class="hint-block"><b>Approach</b> Keyword: "${s.keyword}" or Action: ${s.action}</div>
                    </div>
                    <div class="status ${isFound ? 'found-text' : 'unfound'}">
                        STATUS: ${isFound ? 'SALVAGED' : 'HIDDEN'}
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        render();
    </script>

    <!-- wwg-mobile-patch-js-start -->
    <script>
        // Touch-to-Mouse Polyfill for legacy canvas interactives
        document.addEventListener('touchstart', function(e) {
            if(e.touches.length > 0) {
                const touch = e.touches[0];
                const mouseEvent = new MouseEvent('mousedown', {
                    clientX: touch.clientX,
                    clientY: touch.clientY,
                    bubbles: true,
                    cancelable: true
                });
                e.target.dispatchEvent(mouseEvent);
            }
        }, {passive: false});

        document.addEventListener('touchmove', function(e) {
            if(e.touches.length > 0) {
                const touch = e.touches[0];
                const mouseEvent = new MouseEvent('mousemove', {
                    clientX: touch.clientX,
                    clientY: touch.clientY,
                    bubbles: true,
                    cancelable: true
                });
                e.target.dispatchEvent(mouseEvent);
            }
        }, {passive: false});

        document.addEventListener('touchend', function(e) {
            const mouseEvent = new MouseEvent('mouseup', {
                bubbles: true,
                cancelable: true
            });
            e.target.dispatchEvent(mouseEvent);
        }, {passive: false});
    </script>
    <!-- wwg-mobile-patch-js-end -->

</body>

</html>
