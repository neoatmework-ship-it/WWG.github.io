<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glimmer</title>
    <link rel="icon"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E✨%3C/text%3E%3C/svg%3E">
    <style>
        body {
            margin: 0;
            background: #00020a;
            overflow: hidden;
            font-family: sans-serif;
        }

        .glimmer {
            position: absolute;
            width: 4px;
            height: 4px;
            background: #fff;
            box-shadow: 0 0 10px 2px rgba(255, 255, 255, 0.8), 0 0 20px 5px rgba(200, 220, 255, 0.5);
            border-radius: 50%;
            pointer-events: none;
            animation: twinkle 1.5s ease-in-out forwards;
        }

        @keyframes twinkle {
            0% {
                transform: scale(0) rotate(0deg);
                opacity: 0;
            }

            50% {
                transform: scale(1.5) rotate(45deg);
                opacity: 1;
            }

            100% {
                transform: scale(0) rotate(90deg);
                opacity: 0;
            }
        }

        .text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: rgba(255, 255, 255, 0.1);
            font-size: 3rem;
            letter-spacing: 1rem;
            text-transform: uppercase;
            pointer-events: none;
        }
    </style>
</head>

<body>
    <div class="text">GLIMMER</div>
    <script src="discovery.js"></script>
    <script>
        Discovery.unlock('glimmer');
        window.addEventListener('mousemove', (e) => {
            if (Math.random() > 0.6) {
                const g = document.createElement('div');
                g.className = 'glimmer';
                g.style.left = e.clientX - 2 + (Math.random() * 40 - 20) + 'px';
                g.style.top = e.clientY - 2 + (Math.random() * 40 - 20) + 'px';

                const hue = 200 + Math.random() * 60;
                g.style.boxShadow = `0 0 10px 2px hsl(${hue}, 100%, 80%), 0 0 20px 5px hsl(${hue}, 100%, 60%)`;

                document.body.appendChild(g);
                setTimeout(() => g.remove(), 1500);
            }
        });
    </script>
</body>

</html>
