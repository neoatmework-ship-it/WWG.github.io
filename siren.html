<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Siren</title>
    <link rel="icon"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🌀%3C/text%3E%3C/svg%3E">
    <style>
        body {
            margin: 0;
            background: #000;
            overflow: hidden;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        canvas {
            display: block;
            filter: contrast(5) blur(1px);
        }

        .text {
            position: absolute;
            font-family: sans-serif;
            font-size: 5rem;
            letter-spacing: 20px;
            color: #ff0055;
            mix-blend-mode: exclusion;
            pointer-events: none;
        }
    </style>

    <!-- wwg-mobile-patch-start -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        canvas {
            max-width: 100vw;
            max-height: 100vh;
            touch-action: none;
        }
    </style>
    <!-- wwg-mobile-patch-end -->

</head>

<body>
    <div class="text" id="t">COME CLOSER</div>
    <canvas id="c"></canvas>

    <script src="discovery.js"></script>
    <script>
        Discovery.unlock('siren');
        const canvas = document.getElementById('c');
        const ctx = canvas.getContext('2d');
        const txt = document.getElementById('t');

        let w = canvas.width = window.innerWidth;
        let h = canvas.height = window.innerHeight;

        let time = 0;
        let mouseX = w / 2;
        let mouseY = h / 2;

        window.addEventListener('mousemove', e => {
            // Fake gravity pulling mouse towards center (if not interacting)
            // Can't actually pull OS cursor, but can track intent
            mouseX = e.clientX;
            mouseY = e.clientY;

            const dx = w / 2 - mouseX;
            const dy = h / 2 - mouseY;
            const dist = Math.sqrt(dx * dx + dy * dy);

            if (dist < 50) {
                txt.innerText = "Y E S";
                txt.style.color = "#fff";
                txt.style.transform = "scale(2)";
            } else {
                txt.innerText = "COME CLOSER";
                txt.style.color = "#ff0055";
                txt.style.transform = "scale(1)";
            }
        });

        function draw() {
            ctx.fillStyle = 'rgba(0,0,0,0.1)';
            ctx.fillRect(0, 0, w, h);

            time += 0.05;

            // Draw hypnotic spiral
            ctx.translate(w / 2, h / 2);
            ctx.rotate(time * 0.1);

            for (let i = 0; i < 30; i++) {
                ctx.beginPath();
                ctx.arc(0, 0, i * 20 + Math.sin(time + i * 0.5) * 10, 0, Math.PI);
                ctx.strokeStyle = `hsl(${(time * 20 + i * 10) % 360}, 100%, 50%)`;
                ctx.lineWidth = 10;
                ctx.stroke();

                ctx.rotate(Math.PI / 15); // twist
            }

            ctx.rotate(-time * 0.1);
            ctx.translate(-w / 2, -h / 2);

            requestAnimationFrame(draw);
        }
        draw();

        window.addEventListener('resize', () => {
            w = canvas.width = window.innerWidth;
            h = canvas.height = window.innerHeight;
        });
    </script>

    <!-- wwg-mobile-patch-js-start -->
    <script>
        // Touch-to-Mouse Polyfill for legacy canvas interactives
        document.addEventListener('touchstart', function(e) {
            if(e.touches.length > 0) {
                const touch = e.touches[0];
                const mouseEvent = new MouseEvent('mousedown', {
                    clientX: touch.clientX,
                    clientY: touch.clientY,
                    bubbles: true,
                    cancelable: true
                });
                e.target.dispatchEvent(mouseEvent);
            }
        }, {passive: false});

        document.addEventListener('touchmove', function(e) {
            if(e.touches.length > 0) {
                const touch = e.touches[0];
                const mouseEvent = new MouseEvent('mousemove', {
                    clientX: touch.clientX,
                    clientY: touch.clientY,
                    bubbles: true,
                    cancelable: true
                });
                e.target.dispatchEvent(mouseEvent);
            }
        }, {passive: false});

        document.addEventListener('touchend', function(e) {
            const mouseEvent = new MouseEvent('mouseup', {
                bubbles: true,
                cancelable: true
            });
            e.target.dispatchEvent(mouseEvent);
        }, {passive: false});
    </script>
    <!-- wwg-mobile-patch-js-end -->

</body>

</html>
