<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ULTRA_HACK — System Breach Simulator</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E💻%3C/text%3E%3C/svg%3E">
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --green: #00ff41;
            --bg: #0a0a0a;
        }

        * { margin:0; padding:0; box-sizing:border-box; }

        body {
            background: var(--bg);
            color: var(--green);
            font-family: 'Share Tech Mono', monospace;
            padding: 20px;
            height: 100vh;
            overflow: hidden;
            text-transform: uppercase;
        }

        #terminal {
            height: 100%;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            text-shadow: 0 0 5px var(--green);
        }

        .line {
            margin-bottom: 2px;
            font-size: 1.1rem;
            line-height: 1.2;
            white-space: pre-wrap;
            word-break: break-all;
        }

        #cursor {
            display: inline-block;
            width: 10px;
            height: 1.2rem;
            background: var(--green);
            vertical-align: middle;
            animation: blink 0.5s infinite;
        }

        @keyframes blink { 50% { opacity: 0; } }

        .ui-overlay {
            position: fixed;
            inset: 0;
            pointer-events: none;
            background: 
                radial-gradient(circle at center, transparent 0%, rgba(0,255,65,0.05) 100%),
                repeating-linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%),
                repeating-linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
            background-size: 100%, 100% 4px, 6px 100%;
            z-index: 10;
        }

        .alert-box {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: var(--bg);
            border: 2px solid #ff0000;
            padding: 40px;
            color: #ff0000;
            z-index: 20;
            display: none;
            text-align: center;
            box-shadow: 0 0 50px rgba(255,0,0,0.5);
        }

        .back-link {
            position: fixed;
            top: 10px;
            right: 10px;
            color: rgba(0,255,65,0.2);
            text-decoration: none;
            font-size: 0.7rem;
            z-index: 30;
        }
        .back-link:hover { color: var(--green); }
    </style>
</head>
<body onclick="document.getElementById('hidden-input').focus()">

    <div class="ui-overlay"></div>
    <a href="index.html" class="back-link">[ DISCONNECT_UPLINK ]</a>

    <div id="terminal">
        <!-- Lines will be injected here -->
        <div id="active-line">INITIALIZING KERNEL... <span id="cursor"></span></div>
    </div>

    <!-- For mobile focus -->
    <input type="text" id="hidden-input" style="position: absolute; opacity: 0; pointer-events: none;">

    <div class="alert-box" id="alert">
        <h1 style="font-size: 3rem; margin-bottom: 10px;">BREACH DETECTED</h1>
        <p>ENCRYPTING SATELLITE UPLINK...</p>
        <p style="margin-top: 20px;">[ TYPE FASTER TO OVERRIDE ]</p>
    </div>

    <script src="discovery.js"></script>
    <script>
        Discovery.unlock('hacker-prank');

        const phrases = [
            "Bypassing mainframe firewall...",
            "Decrypting RSA-4096 protocols...",
            "Scanning local subnets for vulnerability...",
            "Overriding Admin privileges...",
            "Injecting SQL payload into DB_ROOT...",
            "Establishing peer-to-peer satellite link...",
            "Downloading encrypted 'pizza_secrets.zip'...",
            "Analyzing biometric hash signatures...",
            "Proxy chain established: GERMANY -> JAPAN -> MOON...",
            "Compiling exploit.exe [88%]...",
            "Accessing Federal Donut Reserve...",
            "Rootkit deployed successfully.",
            "Tracing connection... [WARNING: IP LEAK DETECTED]",
            "Cloaking active processes...",
            "Kernel heap overflow initiated..."
        ];

        const terminal = document.getElementById('terminal');
        const activeLine = document.getElementById('active-line');
        const alertBox = document.getElementById('alert');
        
        let charIndex = 0;
        let phraseIndex = 0;
        let lineCount = 0;

        window.addEventListener('keydown', (e) => {
            e.preventDefault();
            addCode();
        });

        // Touch support
        window.addEventListener('touchstart', (e) => {
            e.preventDefault();
            for(let i=0; i<5; i++) setTimeout(addCode, i*50);
        });

        function addCode() {
            if(phraseIndex >= phrases.length) {
                phraseIndex = 0;
                triggerAlert();
            }

            const currentPhrase = phrases[phraseIndex];
            const charsToType = 3; // Type 3 chars per keypress for that "fast hacker" feel
            
            for(let i=0; i<charsToType; i++) {
                if(charIndex < currentPhrase.length) {
                    const char = currentPhrase[charIndex];
                    const span = document.createElement('span');
                    span.textContent = char;
                    activeLine.insertBefore(span, document.getElementById('cursor'));
                    charIndex++;
                } else {
                    // Start new line
                    const oldLine = activeLine.cloneNode(true);
                    oldLine.removeAttribute('id');
                    const cursor = oldLine.querySelector('#cursor');
                    if(cursor) cursor.remove();
                    
                    terminal.insertBefore(oldLine, activeLine);
                    
                    activeLine.innerHTML = '> <span id="cursor"></span>';
                    charIndex = 0;
                    phraseIndex++;
                    lineCount++;

                    // Limit lines to prevent lag
                    if(lineCount > 30) {
                        terminal.firstElementChild.remove();
                        lineCount--;
                    }
                    break;
                }
            }
        }

        function triggerAlert() {
            alertBox.style.display = 'block';
            document.body.style.backgroundColor = '#200';
            setTimeout(() => {
                alertBox.style.display = 'none';
                document.body.style.backgroundColor = '';
            }, 1000);
        }

        // Auto focus for typing
        window.onload = () => document.getElementById('hidden-input').focus();
    </script>
    <script>
        if(/Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent)){
            document.body.innerHTML += '<a href="index.html" style="position:fixed;bottom:20px;right:20px;background:#000;color:#fff;padding:10px 20px;border-radius:30px;text-decoration:none;z-index:9999;border:1px solid #333;font-family:sans-serif;font-size:14px;">Back to Gallery</a>';
        }
    </script>
</body>
</html>
