<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paradox</title>
    <link rel="icon"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E📐%3C/text%3E%3C/svg%3E">
    <style>
        body {
            margin: 0;
            background: #eee;
            overflow: hidden;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .text {
            position: absolute;
            top: 40px;
            font-family: sans-serif;
            font-size: 2rem;
            color: #333;
            letter-spacing: 5px;
            opacity: 0.5;
            font-weight: bold;
        }

        /* Optical Illusion Box using Borders */
        .penrose {
            position: relative;
            width: 200px;
            height: 200px;
            transform: rotate(-30deg) skewX(30deg);
            animation: rot 10s linear infinite;
        }

        @keyframes rot {
            0% {
                filter: hue-rotate(0deg);
            }

            100% {
                filter: hue-rotate(360deg);
            }
        }

        .bar {
            position: absolute;
        }

        /* Bar 1 (Bottom/Right) */
        .b1 {
            width: 200px;
            height: 50px;
            background: #ea4335;
            bottom: 0;
            left: 0;
            z-index: 3;
        }

        .b1::after {
            content: '';
            position: absolute;
            right: -50px;
            top: 0;
            border-top: 50px solid #ea4335;
            border-right: 50px solid transparent;
        }

        /* Bar 2 (Left) */
        .b2 {
            width: 50px;
            height: 200px;
            background: #4285f4;
            top: 0;
            left: 0;
            z-index: 2;
        }

        .b2::after {
            content: '';
            position: absolute;
            top: -50px;
            left: 0;
            border-bottom: 50px solid #4285f4;
            border-left: 50px solid transparent;
        }

        /* Bar 3 (Top/Right connecting) */
        .b3 {
            width: 150px;
            height: 50px;
            background: #34a853;
            top: -50px;
            left: 50px;
            transform-origin: 0 50px;
            transform: rotate(90deg);
            z-index: 1;
        }

        .b3::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent 80%, rgba(0, 0, 0, 0.5) 100%);
        }
    </style>

    <!-- wwg-mobile-patch-start -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        canvas {
            max-width: 100vw;
            max-height: 100vh;
            touch-action: none;
        }
    </style>
    <!-- wwg-mobile-patch-end -->

</head>

<body>
    <div class="text">IMPOSSIBLE</div>

    <div class="penrose">
        <div class="bar b1"></div>
        <div class="bar b2"></div>
        <div class="bar b3"></div>
    </div>

    <script src="discovery.js"></script>
    <script>Discovery.unlock('paradox');</script>

    <!-- wwg-mobile-patch-js-start -->
    <script>
        // Touch-to-Mouse Polyfill for legacy canvas interactives
        document.addEventListener('touchstart', function(e) {
            if(e.touches.length > 0) {
                const touch = e.touches[0];
                const mouseEvent = new MouseEvent('mousedown', {
                    clientX: touch.clientX,
                    clientY: touch.clientY,
                    bubbles: true,
                    cancelable: true
                });
                e.target.dispatchEvent(mouseEvent);
            }
        }, {passive: false});

        document.addEventListener('touchmove', function(e) {
            if(e.touches.length > 0) {
                const touch = e.touches[0];
                const mouseEvent = new MouseEvent('mousemove', {
                    clientX: touch.clientX,
                    clientY: touch.clientY,
                    bubbles: true,
                    cancelable: true
                });
                e.target.dispatchEvent(mouseEvent);
            }
        }, {passive: false});

        document.addEventListener('touchend', function(e) {
            const mouseEvent = new MouseEvent('mouseup', {
                bubbles: true,
                cancelable: true
            });
            e.target.dispatchEvent(mouseEvent);
        }, {passive: false});
    </script>
    <!-- wwg-mobile-patch-js-end -->

</body>

</html>
