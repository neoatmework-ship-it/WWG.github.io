<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Skill Generator — Discover Your Next Passion</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #030712;
            --accent: #6366f1;
            --surface: #111827;
            --text: #f9fafb;
            --text-muted: #9ca3af;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Plus Jakarta Sans', sans-serif;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .container {
            width: 90%;
            max-width: 500px;
            text-align: center;
        }

        .skill-card {
            background: var(--surface);
            padding: 40px;
            border-radius: 32px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 50px 100px -20px rgba(0, 0, 0, 0.5);
            min-height: 400px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            transition: all 0.5s cubic-bezier(0.23, 1, 0.32, 1);
            position: relative;
        }

        .skill-card:hover { border-color: var(--accent); transform: translateY(-5px); }

        .category {
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--accent);
            margin-bottom: 20px;
        }

        h1 { font-size: 2.5rem; margin: 0 0 16px 0; line-height: 1.1; }
        p { font-size: 1.1rem; line-height: 1.6; color: var(--text-muted); margin-bottom: 30px; }

        .gen-btn {
            background: var(--accent);
            color: #fff;
            border: none;
            padding: 16px 32px;
            border-radius: 100px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 10px 30px rgba(99, 102, 241, 0.3);
        }

        .gen-btn:hover { transform: scale(1.05); filter: brightness(1.2); }

        .step-tag {
            background: rgba(255, 255, 255, 0.05);
            padding: 8px 16px;
            border-radius: 100px;
            font-size: 0.8rem;
            margin-bottom: 10px;
            display: inline-block;
        }

        .back-link {
            position: fixed;
            top: 30px;
            left: 30px;
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 600;
        }

        /* Ambient glow */
        .glow {
            position: absolute;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            background: radial-gradient(circle, var(--accent) 0%, transparent 70%);
            opacity: 0.1;
            filter: blur(50px);
            z-index: -1;
            animation: move 20s infinite alternate;
        }

        @keyframes move {
            from { transform: translate(-50%, -50%); }
            to { transform: translate(50%, 50%); }
        }
    </style>
</head>
<body>

    <div class="glow"></div>
    <a href="index.html" class="back-link">← Gallery</a>

    <div class="container">
        <div class="skill-card" id="skill-card">
            <div class="step-tag">Step 1: Discover</div>
            <div class="category" id="category">Creative</div>
            <h1 id="title">Skill Generation Ready</h1>
            <p id="desc">Need a new hobby? Press the button to generate a random skill and a quick tutorial suggestion.</p>
            <div>
                <button class="gen-btn" onclick="generate()">GENERATE SKILL</button>
            </div>
        </div>
    </div>

    <script src="discovery.js"></script>
    <script>
        Discovery.unlock('skill-gen');

        const SKILLS = [
            { cat: "Physical", title: "Contact Juggling", desc: "Learn to move a ball as if it's floating. Start with a single crystal ball and master 'The Butterfly'." },
            { cat: "Mental", title: "Memory Palace", desc: "Technical mnemonics. Visualize a house and place items you need to remember in specific rooms." },
            { cat: "Creative", title: "Pen Spinning", desc: "Turn your bored office moments into art. Master the 'ThumbAround' first." },
            { cat: "Practical", title: "Lock Picking", desc: "Understand the mechanics of security. Start with a clear acrylic lock to visualize the pins." },
            { cat: "Creative", title: "Modern Calligraphy", desc: "Grab a brush pen. Focus on downstrokes (heavy) and upstrokes (light)." },
            { cat: "Physical", title: "Card Throwing", desc: "Learn to throw playing cards with lethal accuracy. Use your wrist, not your arm." },
            { cat: "Mindfulness", title: "Wim Hof Breathing", desc: "The iceman method. Controlled hyperventilation followed by breath retention to boost energy." }
        ];

        function generate() {
            const card = document.getElementById('skill-card');
            const skill = SKILLS[Math.floor(Math.random() * SKILLS.length)];
            
            card.style.opacity = '0';
            card.style.transform = 'translateY(20px) scale(0.95)';
            
            setTimeout(() => {
                document.getElementById('category').textContent = skill.cat;
                document.getElementById('title').textContent = skill.title;
                document.getElementById('desc').textContent = skill.desc;
                document.querySelector('.step-tag').textContent = "Your Challenge";
                
                card.style.opacity = '1';
                card.style.transform = 'translateY(0) scale(1)';
            }, 300);
        }
    </script>
<script>
    if(/Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent)){
        document.body.innerHTML += '<a href="index.html" style="position:fixed;bottom:20px;right:20px;background:#000;color:#fff;padding:10px 20px;border-radius:30px;text-decoration:none;z-index:9999;border:1px solid #333;font-family:sans-serif;font-size:14px;">Back to Gallery</a>';
    }
</script>
</body>
</html>
