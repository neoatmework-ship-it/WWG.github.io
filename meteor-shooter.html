<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🚀%3C/text%3E%3C/svg%3E">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meteor Shooter - WWG</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #000; display: flex; align-items: center; justify-content: center; height: 100vh; overflow: hidden; font-family: 'Orbitron', monospace; }
        #ui { position: absolute; top: 0; left: 0; right: 0; padding: 12px 20px; display: flex; gap: 20px; align-items: center; font-size: 0.85rem; color: #7dd3fc; z-index: 10; pointer-events: none; }
        #ui span { color: #fff; font-weight: 700; }
        .back-link { position: fixed; top: 12px; right: 12px; color: #7dd3fc; text-decoration: none; font-size: 0.75rem; z-index: 20; }
        canvas { display: block; }
        #overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.88); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 50; color: white; text-align: center; }
        #overlay h2 { font-size: 2rem; color: #7dd3fc; margin-bottom: 15px; }
        #overlay p { color: #aaa; margin-bottom: 25px; font-size: 0.85rem; font-family: monospace; }
        .cta-btn { background: #0ea5e9; color: #fff; border: none; padding: 14px 36px; border-radius: 8px; font-family: 'Orbitron', monospace; font-size: 1rem; cursor: pointer; transition: background 0.2s; }
        .cta-btn:hover { background: #0284c7; }
        /* Arch-Heroes style upgrade picker */
        #upgrade-screen { position: fixed; inset: 0; background: rgba(0,0,5,0.93); display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 50; }
        #upgrade-screen h2 { color: #fbbf24; font-size: 1.6rem; margin-bottom: 4px; }
        #upgrade-screen .wave-label { color: #7dd3fc; font-size: 0.8rem; margin-bottom: 28px; font-family: monospace; }
        .upgrade-cards { display: flex; gap: 18px; flex-wrap: wrap; justify-content: center; }
        .ucard {
            background: linear-gradient(160deg, #111, #0d0d1a);
            border: 2px solid #333; border-radius: 16px; padding: 24px 20px;
            width: 160px; cursor: pointer; text-align: center;
            transition: border-color 0.15s, transform 0.15s, box-shadow 0.15s;
            position: relative; overflow: hidden;
        }
        .ucard::before { content: ''; position: absolute; inset: 0; background: linear-gradient(135deg, rgba(255,255,255,0.04), transparent); pointer-events: none; }
        .ucard:hover { border-color: #fbbf24; transform: translateY(-4px) scale(1.03); box-shadow: 0 12px 40px rgba(251,191,36,0.25); }
        .ucard .icon { font-size: 2.4rem; display: block; margin-bottom: 10px; }
        .ucard .uname { font-size: 0.85rem; font-weight: 700; color: #7dd3fc; margin-bottom: 6px; }
        .ucard .udesc { font-size: 0.72rem; color: #888; line-height: 1.4; }
        .ucard .rarity { position: absolute; top: 8px; right: 10px; font-size: 0.6rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; }
        .rarity-common { color: #9ca3af; }
        .rarity-rare { color: #60a5fa; }
        .rarity-epic { color: #c084fc; }
        .rarity-legendary { color: #fbbf24; }

    </style>

    <!-- wwg-mobile-patch-start -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        canvas {
            max-width: 100vw;
            max-height: 100vh;
            touch-action: none;
        }
    </style>
    <!-- wwg-mobile-patch-end -->

</head>

<body>
    <a href="index.html" class="back-link">← Back</a>

    <div id="ui">
        SCORE: <span id="sc">0</span> &nbsp;
        WAVE: <span id="wv">1</span> &nbsp;
        LIVES: <span id="lv">❤️❤️❤️</span>
    </div>
    <canvas id="c"></canvas>
    <div id="overlay">
        <h2>☄️ METEOR SHOOTER</h2>
        <p>← → or A/D to move &nbsp;|&nbsp; SPACE or click to fire</p>
        <button class="cta-btn" onclick="startGame()">LAUNCH MISSION</button>
    </div>
    <div id="upgrade-screen">
        <h2>⚡ CHOOSE YOUR UPGRADE</h2>
        <div class="wave-label" id="upg-wave-label">Pick 1 — FREE every wave!</div>
        <div class="upgrade-cards" id="upg-cards"></div>
    </div>

    <script>
        const canvas = document.getElementById('c');
        const ctx = canvas.getContext('2d');
        let W, H;
        function resize() { W = canvas.width = Math.min(window.innerWidth, 600); H = canvas.height = window.innerHeight; }
        resize(); window.addEventListener('resize', resize);

        let ship, bullets, meteors, particles, running;
        let score, wave, lives;
        let keys = {}, fireTimer = 0, shieldActive = false;
        let upgrades = { speed: 0, fireRate: 0, spread: 0, damage: 0, homing: false, shield: 0 };

        // Full upgrade pool — Arch Heroes style
        const ALL_UPGRADES = [
            { id:'speed',   icon:'🚀', name:'Engine Boost',   desc:'Ship moves 25% faster',        rarity:'common',    apply: () => { upgrades.speed++; } },
            { id:'speed2',  icon:'💨', name:'Afterburner',    desc:'Another speed boost!',          rarity:'rare',      apply: () => { upgrades.speed += 2; } },
            { id:'fire1',   icon:'💥', name:'Rapid Fire',     desc:'Shoot 25% faster',              rarity:'common',    apply: () => { upgrades.fireRate++; } },
            { id:'fire2',   icon:'⚡', name:'Machine Gun',    desc:'Extreme fire rate boost',       rarity:'epic',      apply: () => { upgrades.fireRate += 3; } },
            { id:'spread1', icon:'🌀', name:'Split Shot',     desc:'Fire 3 bullets at once',        rarity:'rare',      apply: () => { upgrades.spread = Math.max(upgrades.spread, 1); } },
            { id:'spread2', icon:'🔱', name:'Wide Shot',      desc:'Fire 5 bullets in a spread',    rarity:'epic',      apply: () => { upgrades.spread = Math.max(upgrades.spread, 2); } },
            { id:'dmg1',    icon:'🔥', name:'Power Core',     desc:'Bullets deal 2x damage',        rarity:'rare',      apply: () => { upgrades.damage++; } },
            { id:'dmg2',    icon:'💎', name:'Overcharge',     desc:'Bullets deal 4x total damage',  rarity:'epic',      apply: () => { upgrades.damage += 2; } },
            { id:'homing',  icon:'🎯', name:'Homing Missiles',desc:'Bullets track meteors!',        rarity:'legendary', apply: () => { upgrades.homing = true; } },
            { id:'shield',  icon:'🛡️', name:'Energy Shield',  desc:'Block next 2 hits',             rarity:'rare',      apply: () => { upgrades.shield += 2; shieldActive = true; } },
            { id:'hp',      icon:'❤️', name:'Life Support',   desc:'+1 extra life',                 rarity:'common',    apply: () => { lives = Math.min(lives + 1, 6); updateHUD(); } },
            { id:'hp2',     icon:'💖', name:'Resurrection',   desc:'+2 extra lives',                rarity:'epic',      apply: () => { lives = Math.min(lives + 2, 6); updateHUD(); } },
            { id:'nuke',    icon:'☢️', name:'Shockwave',      desc:'Clear ALL meteors now!',        rarity:'legendary', apply: () => { meteors.forEach(m => spawnParticles(m.x, m.y, '#fbbf24', 12)); meteors = []; score += 50; updateHUD(); } },
        ];

        const RARITY_COLOR = { common: '#9ca3af', rare: '#60a5fa', epic: '#c084fc', legendary: '#fbbf24' };

        function pick3Upgrades() {
            const pool = [...ALL_UPGRADES];
            // Weight by rarity
            const weighted = pool.map(u => ({
                u, w: ({ common: 5, rare: 3, epic: 2, legendary: 1 }[u.rarity] || 1)
            }));
            const chosen = [];
            while (chosen.length < 3 && weighted.length > 0) {
                const total = weighted.reduce((s, x) => s + x.w, 0);
                let r = Math.random() * total;
                for (let i = 0; i < weighted.length; i++) {
                    r -= weighted[i].w;
                    if (r <= 0) { chosen.push(weighted[i].u); weighted.splice(i, 1); break; }
                }
            }
            return chosen;
        }

        function showUpgradeScreen() {
            wave++;
            document.getElementById('upg-wave-label').textContent = `Wave ${wave} incoming — Pick 1 for FREE!`;
            const cards = pick3Upgrades();
            document.getElementById('upg-cards').innerHTML = cards.map((u, i) => `
                <div class="ucard" onclick="applyUpgrade(${i})" data-idx="${i}">
                    <span class="icon">${u.icon}</span>
                    <div class="rarity rarity-${u.rarity}">${u.rarity.toUpperCase()}</div>
                    <div class="uname">${u.name}</div>
                    <div class="udesc">${u.desc}</div>
                </div>
            `).join('');
            document.getElementById('upgrade-screen').dataset.cards = JSON.stringify(cards.map(u => u.id));
            document.getElementById('upgrade-screen').style.display = 'flex';
            // Store for click handler
            window._upgradeCards = cards;
        }

        function applyUpgrade(idx) {
            const u = window._upgradeCards[idx];
            u.apply();
            document.getElementById('upgrade-screen').style.display = 'none';
            running = true;
            spawnWave();
            requestAnimationFrame(loop);
        }

        function startGame() {
            document.getElementById('overlay').style.display = 'none';
            ship = { x: W / 2, y: H - 70 };
            bullets = []; meteors = []; particles = [];
            score = 0; wave = 1; lives = 3;
            upgrades = { speed: 0, fireRate: 0, spread: 0, damage: 0, homing: false, shield: 0 };
            shieldActive = false;
            running = true;
            spawnWave();
            loop();
        }

        function spawnWave() {
            const count = 5 + wave * 2;
            for (let i = 0; i < count; i++) {
                setTimeout(() => {
                    meteors.push({ x: Math.random()*(W-40)+20, y:-30, r:14+Math.random()*12, speed:1.2+wave*0.28+Math.random()*0.5, rot:0, rotSpeed:(Math.random()-0.5)*6, hp:Math.ceil(wave/2) });
                }, i * 550);
            }
        }

        function shoot() {
            const angles = upgrades.spread >= 2 ? [-14,-7,0,7,14] : upgrades.spread === 1 ? [-10,0,10] : [0];
            const dmg = 1 + upgrades.damage;
            angles.forEach(a => {
                const rad = a * Math.PI / 180;
                bullets.push({ x: ship.x, y: ship.y-20, vx: Math.sin(rad)*7, vy: -13, pow: dmg, homing: upgrades.homing, target: null });
            });
        }

        let last = 0;
        function loop(ts = 0) {
            if (!running) return;
            const dt = Math.min((ts - last) / 16.7, 3);
            last = ts;

            ctx.fillStyle = '#000010'; ctx.fillRect(0, 0, W, H);
            drawStars();

            const spd = 4 + upgrades.speed * 1.5;
            if (keys['ArrowLeft']||keys['a']||keys['A']) ship.x -= spd*dt;
            if (keys['ArrowRight']||keys['d']||keys['D']) ship.x += spd*dt;
            ship.x = Math.max(20, Math.min(W-20, ship.x));

            const fireInterval = Math.max(5, 22 - upgrades.fireRate * 3);
            fireTimer += dt;
            if ((keys[' ']||keys['z']||pointerDown) && fireTimer > fireInterval) { shoot(); fireTimer = 0; }

            drawShip(ship.x, ship.y);

            // Homing: assign targets
            if (upgrades.homing && meteors.length > 0) {
                bullets.forEach(b => {
                    if (!b.target || !meteors.includes(b.target)) b.target = meteors[0];
                    if (b.target) {
                        const dx = b.target.x - b.x, dy = b.target.y - b.y;
                        const d = Math.hypot(dx, dy) || 1;
                        b.vx += (dx/d) * 0.8 * dt;
                        b.vy += (dy/d) * 0.8 * dt;
                        const spd2 = Math.hypot(b.vx, b.vy);
                        b.vx = b.vx/spd2*13; b.vy = b.vy/spd2*13;
                    }
                });
            }

            bullets = bullets.filter(b => {
                b.x += b.vx*dt; b.y += b.vy*dt;
                ctx.beginPath(); ctx.arc(b.x, b.y, upgrades.homing?5:4, 0, Math.PI*2);
                ctx.fillStyle = upgrades.homing ? '#f97316' : '#7dd3fc';
                ctx.shadowBlur = upgrades.homing?12:8; ctx.shadowColor = ctx.fillStyle;
                ctx.fill(); ctx.shadowBlur = 0;
                return b.y > -20 && b.y < H+20 && b.x > -20 && b.x < W+20;
            });

            meteors = meteors.filter(m => {
                m.y += m.speed*dt; m.rot += m.rotSpeed*dt*0.05;
                drawMeteor(m);
                for (let i = bullets.length-1; i>=0; i--) {
                    const b = bullets[i];
                    if (Math.hypot(b.x-m.x, b.y-m.y) < m.r+4) {
                        m.hp -= b.pow; bullets.splice(i,1); spawnParticles(m.x,m.y,'#f97316',5);
                        if (m.hp <= 0) { score += Math.ceil(m.r); spawnParticles(m.x,m.y,'#fbbf24',12); updateHUD(); return false; }
                    }
                }
                if (m.y > H-80 && Math.abs(m.x-ship.x)<m.r+20) {
                    if (upgrades.shield > 0) {
                        upgrades.shield--; shieldActive = upgrades.shield > 0;
                        spawnParticles(ship.x,ship.y,'#0ea5e9',15);
                    } else {
                        lives--; spawnParticles(ship.x,ship.y,'#ef4444',15); updateHUD();
                    }
                    if (lives <= 0) { gameOver(); return false; }
                    return false;
                }
                return m.y < H+40;
            });

            particles = particles.filter(p => {
                p.x+=p.vx*dt; p.y+=p.vy*dt; p.life-=dt;
                ctx.globalAlpha=p.life/p.maxLife; ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fillStyle=p.color; ctx.fill(); ctx.globalAlpha=1;
                return p.life>0;
            });

            if (meteors.length===0 && running) { running=false; showUpgradeScreen(); return; }
            updateHUD();
            requestAnimationFrame(loop);
        }

        function drawShip(x,y) {
            ctx.save(); ctx.translate(x,y);
            // Engine glow
            ctx.shadowBlur=20; ctx.shadowColor='#7dd3fc';
            ctx.fillStyle='#7dd3fc';
            ctx.beginPath(); ctx.moveTo(0,-22); ctx.lineTo(16,18); ctx.lineTo(0,8); ctx.lineTo(-16,18); ctx.closePath(); ctx.fill();
            ctx.shadowBlur=0;
            // Cockpit
            ctx.fillStyle='#0ea5e9'; ctx.beginPath(); ctx.ellipse(0,-4,6,10,0,0,Math.PI*2); ctx.fill();
            // Exhaust
            ctx.fillStyle='rgba(251,191,36,0.7)';
            ctx.beginPath(); ctx.ellipse(0,18,6,8+Math.random()*4,0,0,Math.PI*2); ctx.fill();
            // Shield
            if (shieldActive) {
                ctx.beginPath(); ctx.arc(0,0,30,0,Math.PI*2);
                ctx.strokeStyle='#0ea5e9'; ctx.lineWidth=2+Math.sin(Date.now()/200)*1;
                ctx.shadowBlur=15; ctx.shadowColor='#0ea5e9'; ctx.stroke(); ctx.shadowBlur=0;
            }
            ctx.restore();
        }

        function drawMeteor(m) {
            ctx.save(); ctx.translate(m.x,m.y); ctx.rotate(m.rot);
            ctx.beginPath();
            for (let i=0;i<8;i++) { const a=(i/8)*Math.PI*2, r=m.r*(0.75+0.25*Math.sin(i*1.7)); i===0?ctx.moveTo(Math.cos(a)*r,Math.sin(a)*r):ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r); }
            ctx.closePath();
            ctx.fillStyle='#78350f'; ctx.strokeStyle='#f97316'; ctx.lineWidth=2; ctx.fill(); ctx.stroke();
            // cratered look
            ctx.fillStyle='#57220688';
            ctx.beginPath(); ctx.arc(m.r*0.3, m.r*0.2, m.r*0.2, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(-m.r*0.35, -m.r*0.1, m.r*0.15, 0, Math.PI*2); ctx.fill();
            ctx.restore();
        }

        let starPositions = Array.from({length:120},()=>({x:Math.random(),y:Math.random(),r:Math.random()*1.8,b:Math.random()}));
        function drawStars() { starPositions.forEach(s=>{ctx.globalAlpha=0.3+0.7*s.b;ctx.fillStyle='#fff';ctx.fillRect(s.x*W,s.y*H,s.r,s.r);}); ctx.globalAlpha=1; }

        function spawnParticles(x,y,color,n) { for(let i=0;i<n;i++) particles.push({x,y,color,vx:(Math.random()-0.5)*6,vy:(Math.random()-0.5)*6,r:2+Math.random()*3,life:20+Math.random()*15,maxLife:35}); }

        function updateHUD() {
            document.getElementById('sc').textContent=score;
            document.getElementById('wv').textContent=wave;
            document.getElementById('lv').textContent='❤️'.repeat(Math.max(0,lives));
        }

        function gameOver() {
            running=false;
            const ov=document.getElementById('overlay');
            ov.innerHTML=`<h2>GAME OVER</h2><p>Wave ${wave} — Score: ${score}</p><button class="cta-btn" onclick="startGame()">RETRY</button>`;
            ov.style.display='flex';
        }

        window.addEventListener('keydown',e=>{keys[e.key]=true;});
        window.addEventListener('keyup',e=>{keys[e.key]=false;});
        let pointerDown=false;
        canvas.addEventListener('pointerdown',e=>{pointerDown=true;const r=canvas.getBoundingClientRect();if(ship)ship.x=e.clientX-r.left;});
        canvas.addEventListener('pointermove',e=>{if(!pointerDown)return;const r=canvas.getBoundingClientRect();if(ship)ship.x=e.clientX-r.left;});
        canvas.addEventListener('pointerup',()=>{pointerDown=false;});
    </script>

    <!-- wwg-mobile-patch-js-start -->
    <script>
        // Touch-to-Mouse Polyfill for legacy canvas interactives
        document.addEventListener('touchstart', function(e) {
            if(e.touches.length > 0) {
                const touch = e.touches[0];
                const mouseEvent = new MouseEvent('mousedown', {
                    clientX: touch.clientX,
                    clientY: touch.clientY,
                    bubbles: true,
                    cancelable: true
                });
                e.target.dispatchEvent(mouseEvent);
            }
        }, {passive: false});

        document.addEventListener('touchmove', function(e) {
            if(e.touches.length > 0) {
                const touch = e.touches[0];
                const mouseEvent = new MouseEvent('mousemove', {
                    clientX: touch.clientX,
                    clientY: touch.clientY,
                    bubbles: true,
                    cancelable: true
                });
                e.target.dispatchEvent(mouseEvent);
            }
        }, {passive: false});

        document.addEventListener('touchend', function(e) {
            const mouseEvent = new MouseEvent('mouseup', {
                bubbles: true,
                cancelable: true
            });
            e.target.dispatchEvent(mouseEvent);
        }, {passive: false});
    </script>
    <!-- wwg-mobile-patch-js-end -->

</body>

</html>
