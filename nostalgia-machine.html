<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Internet Nostalgia Machine — Time Travel Simulator</title>
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime&family=Comic+Neue:wght@700&family=Inter:wght@400;900&display=swap" rel="stylesheet">
    <style id="theme-styles">
        :root { --bg: #f0f0f0; --text: #000; }
        body { margin: 0; font-family: 'Inter', sans-serif; transition: 0.5s; }
        .controls { position: fixed; top: 0; width: 100%; background: #000; color: #fff; padding: 10px; display: flex; justify-content: center; gap: 20px; z-index: 1000; }
        .year-btn { background: #333; border: 1px solid #555; color: #fff; padding: 5px 15px; cursor: pointer; border-radius: 4px; }
        .year-btn.active { background: #007bff; border-color: #007bff; }
        .content { margin-top: 60px; padding: 40px; text-align: center; min-height: calc(100vh - 60px); }
        .back-link { position: fixed; bottom: 20px; right: 20px; color: #888; text-decoration: none; font-size: 0.8rem; z-index: 1001; }
    </style>
</head>
<body class="theme-2024">

    <div class="controls">
        <button class="year-btn" onclick="setYear(1995)">1995</button>
        <button class="year-btn" onclick="setYear(2004)">2004</button>
        <button class="year-btn" onclick="setYear(2008)">2008</button>
        <button class="year-btn" onclick="setYear(2012)">2012</button>
        <button class="year-btn active" onclick="setYear(2026)">NOW</button>
    </div>

    <a href="index.html" class="back-link">← RETURN_TO_PRESENT</a>

    <div class="content" id="content">
        <h1>Internet Nostalgia Machine</h1>
        <p>Select a year above to travel through web history.</p>
    </div>

    <script src="discovery.js"></script>
    <script>
        Discovery.unlock('nostalgia-machine');

                    h1 { color: #000080; text-decoration: underline; font-size: 1.5rem; }
                    marquee { background: #ffff00; padding: 5px; font-weight: bold; }
                    a { color: #0000ff; }
                `,
                html: `
                    <marquee>*** WELCOME TO THE WORLD WIDE WEB ***</marquee>

            2004: {

                    .content { background: #fff; border: 3px dotted #ff00ff; border-radius: 0; padding: 40px !important; }
                    h1 { font-size: 3rem; text-shadow: 2px 2px #ff99ff; }
                    .sparkle { font-size: 0.8rem; font-weight: bold; color: #ff00ff; }
                `,
                html: `
                    <p class="sparkle">✨ ~ * WELCOME TO MY PROFILE * ~ ✨</p>

                `
            },
            2008: {
                styles: `
                    body { background: #f1f1f1 !important; font-family: Arial, sans-serif !important; color: #333 !important; }
                    .content { max-width: 960px; margin: 80px auto !important; background: #fff; text-align: left !important; border: 1px solid #ccc; padding: 0 !important; }
                    .header { background: #fff; border-bottom: 2px solid #e2e2e2; padding: 15px; display: flex; align-items: center; gap: 20px; }
                    .logo { background: #ff0000; color: #fff; font-weight: bold; padding: 5px 10px; border-radius: 3px; }
                    .video-placeholder { width: 100%; aspect-ratio: 16/9; background: #000; display: flex; align-items: center; justify-content: center; color: #fff; }
                `,
                html: `
                    <div class="header">
                        <div class="logo">YouTube</div>
                        <input type="text" placeholder="Search" style="width: 400px; padding: 5px;">
                    </div>
                    <div style="padding: 20px;">
                        <div class="video-placeholder">▶ Play Video: Evolution of Dance</div>
                        <h1 style="font-size: 1.2rem; margin-top: 15px;">Evolution of Dance (LEGENDARY)</h1>
                        <p style="color: #666; font-size: 0.8rem;">Views: 12,401,922 | Posted: 2 years ago</p>

                        <p><strong>Comments (2,401)</strong></p>
                        <p>first!! lol</p>
                        <p>this is so funny haha</p>
                    </div>
                `
            },
            2012: {
                styles: `
                    body { background: #fff !important; font-family: 'Inter', sans-serif !important; }
                    .content { display: flex; flex-direction: column; align-items: center; justify-content: center; padding-top: 100px !important; }
                    .app-icon { width: 80px; height: 80px; background: linear-gradient(#55acee, #292f33); border-radius: 18px; box-shadow: inset 0 -4px 0 rgba(0,0,0,0.2); margin-bottom: 20px; }
                    h1 { font-weight: 900; letter-spacing: -2px; font-size: 4rem; margin: 0; }
                    p { font-size: 1.5rem; opacity: 0.5; }
                `,
                html: `
                    <div class="app-icon"></div>
                    <h1>Flat is the New Black.</h1>
                    <p>Everything is a card now. Everything is a gradient.</p>
                    <div style="display: flex; gap: 20px; margin-top: 40px;">
                        <div style="width: 150px; height: 150px; border-radius: 20px; background: #f5f5f5; border: 1px solid #ddd;"></div>
                        <div style="width: 150px; height: 150px; border-radius: 20px; background: #f5f5f5; border: 1px solid #ddd;"></div>
                        <div style="width: 150px; height: 150px; border-radius: 20px; background: #f5f5f5; border: 1px solid #ddd;"></div>
                    </div>
                `
            },
            2026: {
                styles: `
                    body { background: #000 !important; color: #fff !important; font-family: 'Inter', sans-serif !important; height: 100vh; display: flex; align-items: center; justify-content: center; }
                    .content { text-align: center; }
                    h1 { font-size: 5rem; font-weight: 900; background: linear-gradient(45deg, #ff00ff, #00ffff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
                `,
                html: `
                    <h1>The Future is Now.</h1>
                    <p>Total Immersive Web Experiences: 90</p>
                    <p>Hyper-personalized algorithm active.</p>
                `
            }
        };

        function setYear(year) {
            const data = YEAR_DATA[year];
            document.getElementById('theme-styles').textContent += `\n${data.styles}`;
            document.getElementById('content').innerHTML = data.html;
            
            document.querySelectorAll('.year-btn').forEach(btn => {
                btn.classList.toggle('active', btn.textContent == year || (year == 2026 && btn.textContent == 'NOW'));
            });
        }

        // Initial set
        setYear(2026);
    </script>
<script>
    if(/Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent)){
        document.body.innerHTML += '<a href="index.html" style="position:fixed;bottom:20px;right:20px;background:#000;color:#fff;padding:10px 20px;border-radius:30px;text-decoration:none;z-index:9999;border:1px solid #333;font-family:sans-serif;font-size:14px;">Back to Gallery</a>';
    }
</script>
</body>
</html>
