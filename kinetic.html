<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kinetic</title>
    <link rel="icon"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E⚡%3C/text%3E%3C/svg%3E">
    <style>
        body {
            margin: 0;
            background: #fafafa;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
        }

        .box {
            position: absolute;
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, #ff0f7b, #f89b29);
            border-radius: 12px;
            box-shadow: 0 10px 20px rgba(255, 15, 123, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-weight: bold;
            font-size: 1.5rem;
            user-select: none;
            transition: transform 0.1s;
        }

        .box:active {
            transform: scale(0.9);
        }

        h1 {
            position: absolute;
            top: 20px;
            color: #ccc;
            font-size: 8rem;
            z-index: -1;
            letter-spacing: -5px;
        }
    </style>
</head>

<body>
    <h1>KINETIC</h1>
    <script src="discovery.js"></script>
    <script>
        Discovery.unlock('kinetic');

        const boxes = [];
        const w = window.innerWidth;
        const h = window.innerHeight;

        function createBox(x, y) {
            const el = document.createElement('div');
            el.className = 'box';
            document.body.appendChild(el);

            const box = {
                el, x, y,
                vx: (Math.random() - 0.5) * 20,
                vy: (Math.random() - 0.5) * 20,
                rot: Math.random() * 360,
                vRot: (Math.random() - 0.5) * 10
            };
            boxes.push(box);
        }

        for (let i = 0; i < 5; i++) createBox(w / 2, h / 2);

        window.addEventListener('click', (e) => {
            createBox(e.clientX, e.clientY);
        });

        function update() {
            boxes.forEach(b => {
                b.vy += 0.5; // gravity
                b.x += b.vx;
                b.y += b.vy;
                b.rot += b.vRot;

                // Bounce walls
                if (b.x < 0) { b.x = 0; b.vx *= -0.8; b.vRot += b.vy * 0.1; }
                if (b.x > w - 50) { b.x = w - 50; b.vx *= -0.8; b.vRot -= b.vy * 0.1; }

                // Bounce floor/ceiling
                if (b.y < 0) { b.y = 0; b.vy *= -0.8; }
                if (b.y > h - 50) {
                    b.y = h - 50;
                    b.vy *= -0.8;
                    b.vx *= 0.98; // friction
                }

                b.el.style.transform = `translate(${b.x}px, ${b.y}px) rotate(${b.rot}deg)`;
            });
            requestAnimationFrame(update);
        }
        update();
    </script>
</body>

</html>
