<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crystal</title>
    <link rel="icon"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E💎%3C/text%3E%3C/svg%3E">
    <style>
        body {
            margin: 0;
            background: #050a15;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            flex-direction: column;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
        }

        .text {
            position: absolute;
            bottom: 30px;
            font-family: monospace;
            letter-spacing: 5px;
            color: #fff;
            opacity: 0.3;
            pointer-events: none;
        }
    </style>
</head>

<body>
    <canvas id="c"></canvas>
    <div class="text">CRYSTAL GROWTH</div>

    <script src="discovery.js"></script>
    <script>
        Discovery.unlock('crystal');
        const canvas = document.getElementById('c');
        const ctx = canvas.getContext('2d');
        let w = canvas.width = window.innerWidth;
        let h = canvas.height = window.innerHeight;

        const crystals = [];

        window.addEventListener('click', e => {
            crystals.push({
                x: e.clientX,
                y: e.clientY,
                points: [],
                size: 0,
                maxSize: Math.random() * 100 + 50,
                color: `hsl(${Math.random() * 60 + 180}, 100%, 70%)`,
                rotation: Math.random() * Math.PI * 2
            });
        });

        function draw() {
            ctx.fillStyle = 'rgba(5, 10, 21, 0.1)';
            ctx.fillRect(0, 0, w, h);

            crystals.forEach(c => {
                if (c.size < c.maxSize) c.size += 1;

                ctx.save();
                ctx.translate(c.x, c.y);
                ctx.rotate(c.rotation);

                ctx.beginPath();
                ctx.moveTo(0, -c.size);
                ctx.lineTo(c.size * 0.5, 0);
                ctx.lineTo(0, c.size * 0.8);
                ctx.lineTo(-c.size * 0.5, 0);
                ctx.closePath();

                ctx.fillStyle = c.color;
                ctx.globalAlpha = 0.5;
                ctx.fill();

                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 1;
                ctx.stroke();

                // inner facet lines
                ctx.beginPath();
                ctx.moveTo(0, -c.size);
                ctx.lineTo(0, c.size * 0.8);
                ctx.moveTo(-c.size * 0.5, 0);
                ctx.lineTo(c.size * 0.5, 0);
                ctx.stroke();

                ctx.restore();
            });

            requestAnimationFrame(draw);
        }
        draw();

        window.addEventListener('resize', () => {
            w = canvas.width = window.innerWidth;
            h = canvas.height = window.innerHeight;
        });
    </script>
</body>

</html>
