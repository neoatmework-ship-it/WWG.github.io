<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find the Difference — Visual Puzzle</title>
    <link rel="stylesheet" href="style.css">
    <style>
        :root {
            --diff-accent: #38bdf8;
            --diff-bg: #0f172a;
        }

        body {
            margin: 0;
            padding: 0;
            background: var(--diff-bg);
            color: #fff;
            font-family: 'Outfit', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .game-layout {
            display: flex;
            gap: 20px;
            margin: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .img-box {
            position: relative;
            width: 500px;
            height: 500px;
            background: #1e293b;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 2px solid rgba(255,255,255,0.05);
            user-select: none;
        }

        .img-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .difference-hotspot {
            position: absolute;
            border-radius: 50%;
            cursor: pointer;
            z-index: 10;
        }

        /* The actual visual differences (simulated by overlays) */
        .anomaly {
            position: absolute;
            background: inherit;
            pointer-events: none;
            display: none; /* Only hidden on the right side usually */
        }

        #right-img .anomaly {
            display: block;
            border-radius: 50%;
            filter: brightness(1.2) contrast(1.1);
            background-color: rgba(255,255,255,0.05);
        }

        /* Marker for found ones */
        .diff-marker {
            position: absolute;
            width: 40px;
            height: 40px;
            border: 3px solid #10b981;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            animation: ping 0.5s ease-out;
            pointer-events: none;
            box-shadow: 0 0 10px #10b981;
        }

        @keyframes ping { from { transform: translate(-50%, -50%) scale(2); opacity: 0; } to { transform: translate(-50%, -50%) scale(1); opacity: 1; } }

        .ui-panel {
            text-align: center;
            margin-bottom: 20px;
        }

        #find-count {
            font-size: 2rem;
            font-weight: 800;
            color: var(--diff-accent);
        }

        .back-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            color: rgba(255,255,255,0.4);
            text-decoration: none;
            font-size: 0.82rem;
        }

        #overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            display: none;
        }

        .btn {
            background: var(--diff-accent);
            color: #000;
            padding: 12px 30px;
            border-radius: 8px;
            border: none;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
        }

        @media (max-width: 1050px) {
            .img-box { width: 400px; height: 400px; }
        }
    </style>
</head>
<body>
    <a href="index.html" class="back-btn">← Back to Gallery</a>

    <div class="ui-panel">
        <h1 style="margin: 0; letter-spacing: 2px;">FIND THE DIFFERENCE</h1>
        <p style="opacity: 0.5; margin: 5px 0;">Spot all 3 small changes on the right image.</p>
        <div id="find-count">FOUND: 0 / 3</div>
    </div>

    <div class="game-layout">
        <div class="img-box" id="left-img">
            <img src="find-diff-base.png" alt="Original">
        </div>
        
        <div class="img-box" id="right-img" onclick="handleImageClick(event)">
            <img src="find-diff-base.png" alt="Distorted">
            
            <!-- These are the visual anomalies -->
            <!-- Difference 1: Small dark spot on a beaker -->
            <div class="anomaly" style="top: 245px; left: 132px; width: 12px; height: 12px; background: rgba(0,0,0,0.4);"></div>
            <!-- Difference 2: Extra highlight on a gear -->
            <div class="anomaly" style="top: 410px; left: 350px; width: 15px; height: 15px; background: rgba(255,255,255,0.3); box-shadow: 0 0 10px #fff;"></div>
            <!-- Difference 3: A tiny part of a wire missing/modified -->
            <div class="anomaly" style="top: 120px; left: 280px; width: 20px; height: 3px; background: var(--diff-bg); transform: rotate(45deg);"></div>

            <!-- Hotspots (for click detection) -->
            <div class="difference-hotspot" data-id="0" style="top: 240px; left: 127px; width: 25px; height: 25px;" onclick="spot(0, 245, 132, event)"></div>
            <div class="difference-hotspot" data-id="1" style="top: 405px; left: 345px; width: 25px; height: 25px;" onclick="spot(1, 410, 350, event)"></div>
            <div class="difference-hotspot" data-id="2" style="top: 115px; left: 275px; width: 30px; height: 15px;" onclick="spot(2, 120, 280, event)"></div>
        </div>
    </div>

    <div id="overlay">
        <h1 style="font-size: 3rem; color: #10b981;">SOLVED!</h1>
        <p style="opacity: 0.7;">Your eyes are sharp. Ready for more?</p>
        <button class="btn" onclick="location.reload()">Next Challenge</button>
    </div>

    <script src="discovery.js"></script>
    <script>
        let found = [false, false, false];
        let foundCount = 0;

        function spot(id, y, x, e) {
            e.stopPropagation();
            if (found[id]) return;

            found[id] = true;
            foundCount++;
            document.getElementById('find-count').textContent = `FOUND: ${foundCount} / 3`;

            // Add marker
            const marker = document.createElement('div');
            marker.className = 'diff-marker';
            marker.style.top = y + 'px';
            marker.style.left = x + 'px';
            document.getElementById('right-img').appendChild(marker);

            if (foundCount === 3) {
                setTimeout(() => {
                    document.getElementById('overlay').style.display = 'flex';
                }, 500);
            }
        }

        function handleImageClick(e) {
            // Missed click effect
            if (e.target.classList.contains('difference-hotspot')) return;
            
            const rect = e.currentTarget.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            
            const ripple = document.createElement('div');
            ripple.style.position = 'absolute';
            ripple.style.width = '10px';
            ripple.style.height = '10px';
            ripple.style.border = '2px solid rgba(255,0,0,0.5)';
            ripple.style.borderRadius = '50%';
            ripple.style.left = x + 'px';
            ripple.style.top = y + 'px';
            ripple.style.transform = 'translate(-50%, -50%)';
            ripple.style.pointerEvents = 'none';
            ripple.style.animation = 'rippleFade 0.3s forwards';
            e.currentTarget.appendChild(ripple);
            setTimeout(() => ripple.remove(), 300);
        }
    </script>
    <style>
        @keyframes rippleFade { from { transform: translate(-50%, -50%) scale(1); opacity: 1; } to { transform: translate(-50%, -50%) scale(3); opacity: 0; } }
    </style>
</body>
</html>
