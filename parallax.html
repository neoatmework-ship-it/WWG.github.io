<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parallax</title>
    <link rel="icon"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E👁️‍🗨️%3C/text%3E%3C/svg%3E">
    <style>
        body,
        html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            background: #000;
        }

        .layer {
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            pointer-events: none;
        }

        .bg {
            background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400"><circle cx="20" cy="20" r="1.5" fill="%23223"/><circle cx="150" cy="80" r="1" fill="%23223"/><circle cx="300" cy="200" r="2" fill="%23223"/></svg>') repeat;
        }

        .stars1 {
            background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300"><circle cx="50" cy="50" r="2" fill="%23446"/><circle cx="200" cy="150" r="2.5" fill="%23446"/></svg>') repeat;
        }

        .stars2 {
            background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200"><circle cx="100" cy="100" r="3" fill="%2388a"/><circle cx="50" cy="180" r="3.5" fill="%2388a"/></svg>') repeat;
        }

        .stars3 {
            background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100"><circle cx="20" cy="80" r="4" fill="%23fff"/></svg>') repeat;
        }

        .title {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-family: sans-serif;
            font-size: 5rem;
            letter-spacing: 2rem;
            font-weight: bold;
            mix-blend-mode: overlay;
            pointer-events: none;
        }
    </style>
</head>

<body>
    <div class="layer bg" id="l0"></div>
    <div class="layer stars1" id="l1"></div>
    <div class="layer stars2" id="l2"></div>
    <div class="layer stars3" id="l3"></div>
    <div class="title" id="t">PARALLAX</div>

    <script src="discovery.js"></script>
    <script>
        Discovery.unlock('parallax');
        const l0 = document.getElementById('l0');
        const l1 = document.getElementById('l1');
        const l2 = document.getElementById('l2');
        const l3 = document.getElementById('l3');
        const t = document.getElementById('t');

        window.addEventListener('mousemove', e => {
            const x = (e.clientX - window.innerWidth / 2) / 100;
            const y = (e.clientY - window.innerHeight / 2) / 100;

            l0.style.transform = `translate(${x * 1}px, ${y * 1}px)`;
            l1.style.transform = `translate(${x * 3}px, ${y * 3}px)`;
            l2.style.transform = `translate(${x * 6}px, ${y * 6}px)`;
            l3.style.transform = `translate(${x * 12}px, ${y * 12}px)`;
            t.style.transform = `translate(calc(-50% + ${x * -2}px), calc(-50% + ${y * -2}px))`;
        });
    </script>
</body>

</html>
