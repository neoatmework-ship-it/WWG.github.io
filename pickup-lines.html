            left: -100px;

            right: -80px;

            background: rgba(244, 114, 182, 0.05);
            top: 40%;
            left: 50%;
            transform: translateX(-50%);
            animation-delay: -8s;

            color: var(--text);

            position: fixed;

            }

    </style>
</head>

        function showLine(line, cat) {
            const textEl = document.getElementById('line-text');
            const badgeEl = document.getElementById('line-badge');
            const heartBtn = document.getElementById('heart-btn');

            textEl.classList.add('fade-out');
            setTimeout(() => {
                currentLine = line;
                textEl.textContent = line;
                badgeEl.textContent = cat === 'all' ? 'RANDOM' : cat.toUpperCase();
                textEl.classList.remove('fade-out');
                textEl.classList.add('fade-in');
                setTimeout(() => textEl.classList.remove('fade-in'), 400);

                // Update heart state
                heartBtn.textContent = favorites.includes(line) ? '❤️' : '🤍';
                heartBtn.classList.toggle('hearted', favorites.includes(line));
            }, 200);
        }

        // ── Generate ──
        document.getElementById('generate-btn').addEventListener('click', () => {
            const line = getLine();
            showLine(line, currentCat);
            spawnConfetti();

            // Reset copy button
            const copyBtn = document.getElementById('copy-btn');
            copyBtn.textContent = '📋';
            copyBtn.classList.remove('copied');
        });

        // ── Copy ──
        document.getElementById('copy-btn').addEventListener('click', () => {
            if (!currentLine) return;
            navigator.clipboard.writeText(currentLine).then(() => {
                const btn = document.getElementById('copy-btn');
                btn.textContent = '✅';
                btn.classList.add('copied');
                setTimeout(() => { btn.textContent = '📋'; btn.classList.remove('copied'); }, 1800);
            }).catch(() => {
                // Fallback
                const ta = document.createElement('textarea');
                ta.value = currentLine;
                document.body.appendChild(ta);
                ta.select();
                document.execCommand('copy');
                ta.remove();
            });
        });

        // ── Heart / Favorites ──
        document.getElementById('heart-btn').addEventListener('click', () => {
            if (!currentLine) return;
            const btn = document.getElementById('heart-btn');
            const idx = favorites.indexOf(currentLine);
            if (idx === -1) {
                favorites.unshift(currentLine);
                btn.textContent = '❤️';
                btn.classList.add('hearted');
            } else {
                favorites.splice(idx, 1);
                btn.textContent = '🤍';
                btn.classList.remove('hearted');
            }
            saveFavs();
            renderFavs();
        });

        function saveFavs() {
            localStorage.setItem('wwg_pickup_favs', JSON.stringify(favorites));
        }

        function renderFavs() {
            const body = document.getElementById('fav-body');
            const empty = document.getElementById('fav-empty');
            const countEl = document.getElementById('fav-count');
            countEl.textContent = favorites.length;

            const existing = body.querySelectorAll('.fav-item');
            existing.forEach(e => e.remove());
            empty.style.display = favorites.length === 0 ? 'block' : 'none';

            favorites.forEach((line, i) => {
                const div = document.createElement('div');
                div.className = 'fav-item';
                const span = document.createElement('span');
                span.textContent = `💘 ${line}`;
                const rm = document.createElement('span');
                rm.className = 'fav-remove';
                rm.textContent = '✕';
                rm.title = 'Remove';
                rm.addEventListener('click', () => {
                    favorites.splice(i, 1);
                    saveFavs();
                    renderFavs();
                    // Update heart btn if current line was removed
                    if (currentLine === line) {
                        document.getElementById('heart-btn').textContent = '🤍';
                        document.getElementById('heart-btn').classList.remove('hearted');
                    }
                });
                div.appendChild(span);
                div.appendChild(rm);
                body.appendChild(div);
            });
        }

        // ── Favorites drawer ──
        document.getElementById('fav-header').addEventListener('click', () => {
            const body = document.getElementById('fav-body');
            const chevron = document.getElementById('chevron');
            body.classList.toggle('open');
            chevron.classList.toggle('open');
        });

        // ── Confetti ──
        const CONFETTI_COLORS = ['#e879f9', '#f472b6', '#c084fc', '#f9a8d4', '#a78bfa', '#fbbf24'];
        function spawnConfetti() {
            const btn = document.getElementById('generate-btn');
            const rect = btn.getBoundingClientRect();
            for (let i = 0; i < 18; i++) {
                const piece = document.createElement('div');
                piece.className = 'confetti-piece';
                piece.style.left = (rect.left + Math.random() * rect.width) + 'px';
                piece.style.top = rect.top + 'px';
                piece.style.background = CONFETTI_COLORS[Math.floor(Math.random() * CONFETTI_COLORS.length)];
                piece.style.transform = `rotate(${Math.random() * 360}deg)`;
                piece.style.animationDelay = Math.random() * 0.3 + 's';
                document.body.appendChild(piece);
                setTimeout(() => piece.remove(), 1500);
            }
        }

        // ── Init ──
        renderFavs();
    </script>
