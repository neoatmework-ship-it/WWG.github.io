<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE BARRIER | TRUE GENOCIDE</title>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #000;
            --heart: #ff0000;
            --bone: #fff;
            --box: #fff;
            --blue: #3498db;
            --spear: #00f2ff;
        }

        body {
            background: var(--bg);
            color: #fff;
            font-family: 'VT323', monospace;
            margin: 0;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            user-select: none;
            transition: transform 0.1s;
        }

        .sans-container { margin-bottom: 20px; text-align: center; position: relative; height: 180px; display: flex; align-items: flex-end; justify-content: center; }
        .sans-battlesprite { width: 140px; image-rendering: pixelated; animation: jitter 0.05s infinite alternate; }
        .sans-eye { 
            position: absolute; top: 38%; left: 52%; transform: translateX(-50%);
            width: 8px; height: 8px; background: #0cf; border-radius: 50%;
            display: none; box-shadow: 0 0 15px #0cf; z-index: 10;
        }
        @keyframes jitter { to { transform: translate(2px, 2px); } }

        /* Battle Buttons */
        .battle-buttons {
            display: flex;
            gap: 20px;
            margin-top: 25px;
            width: 500px;
            justify-content: space-between;
        }

        .ut-btn {
            background: black;
            border: 2px solid #e27d31;
            color: #e27d31;
            font-family: inherit;
            font-size: 1.8rem;
            padding: 8px 15px;
            cursor: pointer;
            width: 110px;
            text-align: center;
            transition: 0.1s;
        }

        .ut-btn:hover {
            border-color: #ffff00;
            color: #ffff00;
            box-shadow: 0 0 10px rgba(255, 255, 0, 0.4);
        }

        .ut-btn:hover::before { content: '❤'; color: red; margin-right: 5px; }

        /* Action Menu Overlay */
        .battle-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #000;
            display: none;
            flex-direction: column;
            padding: 10px;
            z-index: 200;
            border: 2px solid #fff;
            box-sizing: border-box;
        }

        .battle-overlay.active { display: flex; }

        .menu-options { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .menu-opt {
            background: transparent; border: none; color: white;
            font-family: inherit; font-size: 1.5rem; text-align: left;
            cursor: pointer; display: flex; align-items: center; gap: 10px;
        }
        .menu-opt:hover { color: #ffff00; }
        .menu-opt:hover::before { content: '❤'; color: red; }

        #battle-box {
            width: 400px; height: 160px;
            border: 5px solid var(--box);
            position: relative; background: #000;
            overflow: hidden; transition: 0.3s;
        }

        #soul {
            width: 16px; height: 16px;
            background: var(--heart);
            position: absolute;
            clip-path: polygon(50% 0%, 100% 35%, 80% 100%, 50% 80%, 20% 100%, 0% 35%);
            z-index: 100; transition: background 0.2s, filter 0.1s;
        }
        #soul.blue { background: var(--blue); }

        .attack { position: absolute; background: var(--bone); z-index: 50; }
        .spear { 
            position: absolute; width: 4px; height: 30px; 
            background: var(--spear); z-index: 51;
            box-shadow: 0 0 10px var(--spear);
        }
        
        .blaster {
            position: absolute; width: 60px; height: 40px;
            background: #fff; border: 2px solid #0cf; border-radius: 10px;
            z-index: 60; opacity: 0; transform: scale(0.5);
            transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .blaster.charging { opacity: 1; transform: scale(1); }
        .beam {
            position: absolute; background: #fff;
            box-shadow: 0 0 20px #0cf, 0 0 40px #fff, 0 0 60px #0cf;
            z-index: 55; opacity: 0;
        }

        #dialogue-box {
            width: 500px; height: 100px; border: 5px solid #fff;
            margin-top: 20px; padding: 15px; font-size: 1.6rem;
            box-sizing: border-box; position: relative;
        }
        .stats { margin-top: 15px; font-size: 1.4rem; display: flex; gap: 30px; align-items: center; }
        .hp-bar { width: 120px; height: 18px; background: #f00; display: inline-block; position: relative; }
        .hp-fill { height: 100%; background: #ff0; width: 100%; }

        #overlay {
            position: fixed; inset: 0; background: #000;
            display: none; flex-direction: column; align-items: center; justify-content: center;
            z-index: 1000;
        }

        /* ── Gaster Effects ── */
        .glitch { filter: invert(1) grayscale(1) contrast(500%); }
    </style>
</head>
<body>

    <div id="music-container" style="position: absolute; visibility: hidden; pointer-events: none;">
        <audio id="bgm" loop src="megalovania but its a metal cover.mp3"></audio>
    </div>

    <div class="sans-container">
        <img src="https://undertale.wiki/images/Sans_battle_idle.gif" alt="Sans" class="sans-battlesprite" id="sans-sprite">
        <div id="sans-eye" class="sans-eye"></div>
    </div>

    <div id="battle-box">
        <div id="soul"></div>
    </div>

    <div id="dialogue-box">
        <span id="text"></span>
        <div id="battle-overlay" class="battle-overlay">
            <div id="menu-options" class="menu-options"></div>
            <div style="margin-top: auto; font-size: 1rem; color: #444; text-align: center;" onclick="closeMenu()">[BACK]</div>
        </div>
    </div>

    <div class="battle-buttons" id="battle-controls">
        <button class="ut-btn" onclick="startCombat('FIGHT')">FIGHT</button>
        <button class="ut-btn" onclick="openMenu('ACT')">ACT</button>
        <button class="ut-btn" onclick="openMenu('ITEM')">ITEM</button>
        <button class="ut-btn" onclick="startCombat('MERCY')">MERCY</button>
    </div>

    <div id="start-overlay" style="position: fixed; inset: 0; background: #000; z-index: 2000; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer;">
        <h1 style="font-size: 5rem; color: #fff; margin: 0;">BE READY.</h1>
        <p style="font-size: 2rem; color: #f00;">CLICK TO FACE JUDGEMENT</p>
    </div>

    <div class="stats">
        <span>FRISK LV 19</span>
        <span>HP <div class="hp-bar"><div id="hp-fill" class="hp-fill"></div></div></span>
        <span id="hp-text">92 / 92</span>
    </div>

    <div id="overlay">
        <h1 style="font-size: 4rem; color: #ff0;">DETERMINATION</h1>
        <p>YOU ARE THE ARCHIVE NOW. 🔥 SPECIAL AVATAR UNLOCKED: THE JUDGE.</p>
        <button onclick="window.location.href='underground.html'" style="margin-top: 20px; background: #000; border: 2px solid #fff; color: #fff; padding: 10px 30px; font-family: inherit; font-size: 1.2rem; cursor: pointer;">ENTER THE VOID</button>
    </div>

    <script src="discovery.js"></script>
    <script>
        const box = document.getElementById('battle-box');
        const soul = document.getElementById('soul');
        const textEl = document.getElementById('text');
        const hpFill = document.getElementById('hp-fill');
        const hpText = document.getElementById('hp-text');
        const eye = document.getElementById('sans-eye');
        const bgm = document.getElementById('bgm');

        let soulPos = { x: 192, y: 72 };
        let hp = 92;
        let isInvincible = false;
        let keys = {};
        let isBlue = false;
        let gravityDir = 'down'; // 'down', 'up', 'left', 'right'
        let velocity = 0;
        let accel = 0.35;
        let jumpPower = -6;
        let isGameOver = false;
        let turnCount = 0;
        let isSansTurn = false;

        window.addEventListener('keydown', e => keys[e.code] = true);
        window.addEventListener('keyup', e => keys[e.code] = false);

        function updateSoul() {
            if (isGameOver) return;
            const speed = 3;

            if (isBlue) {
                // Multi-directional Gravity
                if (gravityDir === 'down' || gravityDir === 'up') {
                    if (keys['ArrowLeft'] || keys['KeyA']) soulPos.x -= speed;
                    if (keys['ArrowRight'] || keys['KeyD']) soulPos.x += speed;
                    velocity += (gravityDir === 'down' ? accel : -accel);
                    soulPos.y += velocity;
                } else {
                    if (keys['ArrowUp'] || keys['KeyW']) soulPos.y -= speed;
                    if (keys['ArrowDown'] || keys['KeyS']) soulPos.y += speed;
                    velocity += (gravityDir === 'right' ? accel : -accel);
                    soulPos.x += velocity;
                }

                // Bounds & Jumping
                if (gravityDir === 'down' && soulPos.y >= 144) { soulPos.y = 144; velocity = 0; if (keys['ArrowUp'] || keys['KeyW']) velocity = jumpPower; }
                if (gravityDir === 'up' && soulPos.y <= 0) { soulPos.y = 0; velocity = 0; if (keys['ArrowDown'] || keys['KeyS']) velocity = -jumpPower; }
                if (gravityDir === 'right' && soulPos.x >= 384) { soulPos.x = 384; velocity = 0; if (keys['ArrowLeft'] || keys['KeyA']) velocity = jumpPower; }
                if (gravityDir === 'left' && soulPos.x <= 0) { soulPos.x = 0; velocity = 0; if (keys['ArrowRight'] || keys['KeyD']) velocity = -jumpPower; }
            } else {
                if (keys['ArrowUp'] || keys['KeyW']) soulPos.y -= speed;
                if (keys['ArrowDown'] || keys['KeyS']) soulPos.y += speed;
                if (keys['ArrowLeft'] || keys['KeyA']) soulPos.x -= speed;
                if (keys['ArrowRight'] || keys['KeyD']) soulPos.x += speed;
            }

            soulPos.x = Math.max(0, Math.min(384, soulPos.x));
            soulPos.y = Math.max(0, Math.min(144, soulPos.y));
            soul.style.left = soulPos.x + 'px';
            soul.style.top = soulPos.y + 'px';
        }

        function shake() {
            document.body.style.transform = `translate(${Math.random()*10-5}px, ${Math.random()*10-5}px)`;
            setTimeout(() => document.body.style.transform = '', 50);
        }

        function takeDamage() {
            if (isInvincible || isGameOver) return;
            hp = Math.max(0, hp - 12);
            hpFill.style.width = (hp / 92 * 100) + '%';
            hpText.innerText = `${hp} / 92`;
            shake();
            isInvincible = true;
            soul.style.filter = 'invert(1)';
            setTimeout(() => { isInvincible = false; soul.style.filter = 'none'; }, 40);
            if (hp <= 0) {
                 isGameOver = true;
                 textEl.innerText = "Y O U  A R E  D E A D .";
                 if (bgm) bgm.pause();
                 setTimeout(() => location.reload(), 2000);
            }
        }

        function spawnSpear() {
            const spear = document.createElement('div');
            spear.className = 'spear';
            const startX = Math.random() * 380;
            const startY = Math.random() * 140;
            spear.style.left = startX + 'px';
            spear.style.top = startY + 'px';
            spear.style.transform = `rotate(${Math.random()*360}deg) scale(0)`;
            box.appendChild(spear);

            setTimeout(() => {
                spear.style.transform += ' scale(1)';
                setTimeout(() => {
                    const targetX = soulPos.x;
                    const targetY = soulPos.y;
                    const angle = Math.atan2(targetY - startY, targetX - startX);
                    spear.style.transform = `rotate(${angle * 180 / Math.PI + 90}deg)`;
                    
                    let curX = startX, curY = startY;
                    const anim = setInterval(() => {
                        curX += Math.cos(angle) * 10;
                        curY += Math.sin(angle) * 10;
                        spear.style.left = curX + 'px';
                        spear.style.top = curY + 'px';
                        if (checkHit(spear)) takeDamage();
                        if (curX < -50 || curX > 450 || curY < -50 || curY > 200) { clearInterval(anim); spear.remove(); }
                    }, 16);
                }, 400);
            }, 100);
        }

        function spawnBone(dir = 'right', speed = 5, size = 70, offset = 0) {
            const bone = document.createElement('div');
            bone.className = 'attack';
            bone.style.width = '14px';
            bone.style.height = size + 'px';
            if (dir === 'right') { bone.style.left = '400px'; bone.style.bottom = offset + 'px'; }
            else { bone.style.left = '-20px'; bone.style.top = offset + 'px'; }
            box.appendChild(bone);

            let pos = dir === 'right' ? 400 : -20;
            const anim = setInterval(() => {
                pos += (dir === 'right' ? -speed : speed);
                bone.style.left = pos + 'px';
                if (checkHit(bone)) takeDamage();
                if (pos < -50 || pos > 450) { clearInterval(anim); bone.remove(); }
            }, 16);
        }

        function checkHit(el) {
            const s = soul.getBoundingClientRect();
            const e = el.getBoundingClientRect();
            return !(s.right < e.left || s.left > e.right || s.bottom < e.top || s.top > e.bottom);
        }

        async function fireBlaster(y = 50) {
            eye.style.display = 'block';
            const b = document.createElement('div');
            b.className = 'blaster';
            b.style.left = '320px'; b.style.top = y + 'px';
            box.appendChild(b);
            await new Promise(r => setTimeout(r, 400));
            b.classList.add('charging');
            await new Promise(r => setTimeout(r, 400));
            const beam = document.createElement('div');
            beam.className = 'beam';
            beam.style.left = '0px'; beam.style.top = (y+10)+'px';
            beam.style.width = '400px'; beam.style.height = '25px'; beam.style.opacity = '1';
            box.appendChild(beam);
            let ticks = 0;
            const check = setInterval(() => { if (checkHit(beam)) takeDamage(); if (++ticks > 15) clearInterval(check); }, 16);
            await new Promise(r => setTimeout(r, 200));
            beam.style.opacity = '0'; b.style.opacity = '0';
            setTimeout(() => { beam.remove(); b.remove(); eye.style.display='none'; }, 200);
        }

        async function typeText(str) {
            textEl.innerText = '';
            for (let char of str) {
                textEl.innerText += char;
                await new Promise(r => setTimeout(r, 30));
            }
        }

        async function runGame() {
            // Initial Menu Setup
            document.getElementById('battle-controls').style.display = 'flex';
            await typeText("* sans blocks the way.");
        }

        // --- Battle Menu Logic ---
        const overlay = document.getElementById('battle-overlay');
        const menuOpts = document.getElementById('menu-options');
        const options = {
            'ACT': ['Check', 'Joke', 'Insult', 'Flirt'],
            'ITEM': ['Sea Tea', 'Pie', 'Legend Hero', 'Ice Cream']
        };

        window.openMenu = function(type) {
            overlay.classList.add('active');
            menuOpts.innerHTML = '';
            options[type].forEach(opt => {
                const b = document.createElement('button');
                b.className = 'menu-opt';
                b.innerText = opt;
                b.onclick = () => handleChoice(opt);
                menuOpts.appendChild(b);
            });
        };

        window.closeMenu = function() {
            overlay.classList.remove('active');
        };

        window.handleChoice = async function(choice) {
            closeMenu();
            if (choice === 'Ice Cream') {
                await typeText("* You give sans the Ice Cream.");
                await new Promise(r => setTimeout(r, 1000));
                await typeText("* he looks 'cone'-vinced.");
                win();
            } else if (choice === 'Check') {
                await typeText("* SANS 1 ATK 1 DEF. The easiest enemy.");
                await new Promise(r => setTimeout(r, 1000));
                startSansTurn();
            } else {
                await typeText(`* You used ${choice}. * sans shrugs.`);
                await new Promise(r => setTimeout(r, 1000));
                startSansTurn();
            }
        };

        const SANS_LINES = [
            "* so... you finally arrived.",
            "* look, i'm gonna be honest.",
            "* i'm not a fan of this timeline.",
            "* you really like swinging that thing, huh?",
            "* guess i'm just too lazy to stop you.",
            "* or maybe i'm just waiting for the punchline.",
            "* tick tock, kid.",
            "* you look like you're having a bad time.",
            "* almost there.",
            "* this is it. the end of the line."
        ];

        window.startCombat = async function(type) {
            if (type === 'FIGHT') {
                await typeText("* SANS dodged.");
                await new Promise(r => setTimeout(r, 1000));
                startSansTurn();
            } else if (type === 'MERCY') {
                await typeText("* You spared sans.");
                await new Promise(r => setTimeout(r, 1000));
                await typeText("* he appreciates the sentiment.");
                await new Promise(r => setTimeout(r, 1000));
                startSansTurn();
            }
        };

        async function startSansTurn() {
            if (isGameOver) return;
            isSansTurn = true;
            turnCount++;
            document.getElementById('battle-controls').style.display = 'none';
            
            // Random Sans dialogue
            const line = SANS_LINES[Math.min(turnCount - 1, SANS_LINES.length - 1)];
            await typeText(line);
            await new Promise(r => setTimeout(r, 1000));

            // Start BGM if not playing
            if (bgm && bgm.paused) bgm.play();

            // Difficulty increase per turn
            const complexity = Math.min(turnCount, 10);
            
            if (turnCount === 10) {
                // Final Phase
                await typeText("T R U E  G E N O C I D E");
                const finalBones = setInterval(() => { spawnBone('right', 12, 70, 0); spawnBone('left', 12, 70, 0); }, 200);
                const finalSpears = setInterval(spawnSpear, 300);
                const finalBlasters = setInterval(() => fireBlaster(Math.random() * 120), 1000);
                const glitchItv = setInterval(() => document.body.classList.toggle('glitch'), 500);

                setTimeout(() => {
                    clearInterval(finalBones);
                    clearInterval(finalSpears);
                    clearInterval(finalBlasters);
                    clearInterval(glitchItv);
                    document.body.classList.remove('glitch');
                    win();
                }, 25000);
                return;
            }

            // Normal Turn Attacks
            let attackDuration = 3000 + (complexity * 1000);
            let intervals = [];

            if (turnCount % 3 === 1) {
                intervals.push(setInterval(() => spawnBone('right', 8 + complexity, 80, 0), 300 - (complexity * 10)));
            } else if (turnCount % 3 === 2) {
                intervals.push(setInterval(spawnSpear, 400 - (complexity * 15)));
            } else {
                isBlue = true; soul.classList.add('blue');
                const slams = ['down', 'right', 'up', 'left'].slice(0, Math.min(4, 2 + turnCount/3));
                for(let s of slams) {
                    gravityDir = s; velocity = 0;
                    shake();
                    await new Promise(r => setTimeout(r, 800));
                    fireBlaster(Math.random()*100);
                }
            }

            setTimeout(() => {
                intervals.forEach(clearInterval);
                isSansTurn = false;
                document.getElementById('battle-controls').style.display = 'flex';
                typeText("* Sans looks bored.");
            }, attackDuration);
        }

        function win() {
            if (isGameOver) return;
            Discovery.unlock('the-underground');
            
            // Special Avatar Reward: THE JUDGE
            const judgeAvatar = {
                emoji: '⚖️',
                aura: 'radial-gradient(circle, #0cf 0%, transparent 70%)',
                badge: 'JUDGEMENT',
                nickname: 'The_Judge',
                unlocked: ['the-judge']
            };
            localStorage.setItem('wwg_avatar_data', JSON.stringify(judgeAvatar));
            window.dispatchEvent(new CustomEvent('economyUpdate')); // Refresh header

            document.getElementById('overlay').style.display = 'flex';
            if (bgm) bgm.pause();
        }

        setInterval(updateSoul, 16);
        
        document.getElementById('start-overlay').onclick = function() {
            this.style.display = 'none';
            runGame();
        };
    </script>
</body>
</html>
