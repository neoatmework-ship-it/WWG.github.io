<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE BARRIER | SANS</title>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #000;
            --heart: #ff0000;
            --bone: #fff;
            --box: #fff;
        }

        body {
            background: var(--bg);
            color: #fff;
            font-family: 'VT323', monospace;
            margin: 0;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            user-select: none;
        }

        /* ── Sans Sprite area ── */
        .sans-container {
            margin-bottom: 40px;
            text-align: center;
            position: relative;
        }
        .sans-body {
            font-size: 5rem;
            animation: jitter 0.1s infinite alternate;
        }
        @keyframes jitter {
            to { transform: translate(1px, 1px); }
        }

        /* ── Battle UI ── */
        #battle-box {
            width: 400px;
            height: 200px;
            border: 5px solid var(--box);
            position: relative;
            background: #000;
            overflow: hidden;
        }

        #soul {
            width: 16px;
            height: 16px;
            background: var(--heart);
            position: absolute;
            clip-path: polygon(50% 0%, 100% 35%, 80% 100%, 50% 80%, 20% 100%, 0% 35%);
            z-index: 100;
        }

        .attack {
            position: absolute;
            background: var(--bone);
        }

        /* ── Dialogue ── */
        #dialogue-box {
            width: 500px;
            height: 120px;
            border: 5px solid #fff;
            margin-top: 30px;
            padding: 20px;
            font-size: 1.8rem;
            box-sizing: border-box;
            position: relative;
        }
        #text { display: inline; }
        .cursor { border-left: 2px solid #fff; animation: blink 0.8s infinite; }
        @keyframes blink { 50% { opacity: 0; } }

        /* ── Stats ── */
        .stats {
            margin-top: 20px;
            font-size: 1.5rem;
            display: flex;
            gap: 40px;
        }
        .hp-bar {
            width: 100px;
            height: 20px;
            background: #f00;
            margin-left: 10px;
            display: inline-block;
            vertical-align: middle;
            position: relative;
        }
        .hp-fill { height: 100%; background: #ff0; width: 100%; transition: width 0.3s; }

        /* ── Victory Overlay ── */
        #overlay {
            position: fixed; inset: 0; background: #000;
            display: none; flex-direction: column; align-items: center; justify-content: center;
            z-index: 1000; text-align: center;
        }
    </style>
</head>
<body>

    <div class="sans-container">
        <div class="sans-body">💀</div>
    </div>

    <div id="battle-box">
        <div id="soul"></div>
    </div>

    <div id="dialogue-box">
        <span id="text"></span><span class="cursor"></span>
    </div>

    <div class="stats">
        <span>FRISK LV 19</span>
        <span>HP <div class="hp-bar"><div id="hp-val" class="hp-fill"></div></div> 92/92</span>
    </div>

    <div id="overlay">
        <h1 style="font-size: 4rem; color: #ff0;">DETERMINATION</h1>
        <p style="font-size: 1.5rem;">THE BARRIER HAS BEEN SHATTERED.</p>
        <button onclick="window.location.href='underground.html'" style="margin-top: 30px; background: #000; border: 2px solid #fff; color: #fff; padding: 10px 40px; font-family: inherit; font-size: 1.5rem; cursor: pointer;">ENTER THE UNDERGROUND</button>
    </div>

    <script src="discovery.js"></script>
    <script>
        const box = document.getElementById('battle-box');
        const soul = document.getElementById('soul');
        const textEl = document.getElementById('text');
        const hpFill = document.getElementById('hp-val');
        const overlay = document.getElementById('overlay');

        let soulPos = { x: 192, y: 92 };
        let hp = 92;
        let isInvincible = false;
        let keys = {};
        let phase = 0;
        let attackInterval;

        const DIALOGUES = [
            "it's a beautiful day outside.",
            "birds are singing, flowers are blooming...",
            "on days like these, kids like you...",
            "S h o u l d  b e  b u r n i n g  i n  h e l l ."
        ];

        // ── Input ──
        window.addEventListener('keydown', e => keys[e.code] = true);
        window.addEventListener('keyup', e => keys[e.code] = false);

        function moveSoul() {
            const speed = 3;
            if (keys['ArrowUp'] || keys['KeyW']) soulPos.y -= speed;
            if (keys['ArrowDown'] || keys['KeyS']) soulPos.y += speed;
            if (keys['ArrowLeft'] || keys['KeyA']) soulPos.x -= speed;
            if (keys['ArrowRight'] || keys['KeyD']) soulPos.x += speed;

            // Constrain
            soulPos.x = Math.max(0, Math.min(384, soulPos.x));
            soulPos.y = Math.max(0, Math.min(184, soulPos.y));

            soul.style.left = soulPos.x + 'px';
            soul.style.top = soulPos.y + 'px';
        }

        // ── Attacks ──
        function spawnBone() {
            const bone = document.createElement('div');
            bone.className = 'attack';
            const height = 40 + Math.random() * 60;
            bone.style.width = '10px';
            bone.style.height = height + 'px';
            bone.style.left = '400px';
            bone.style.bottom = Math.random() > 0.5 ? '0' : 'auto';
            if (bone.style.bottom === 'auto') bone.style.top = '0';
            
            box.appendChild(bone);

            let bPos = 400;
            const bAnim = setInterval(() => {
                bPos -= 4;
                bone.style.left = bPos + 'px';
                
                // Collision
                if (checkCollision(soul, bone)) {
                    takeDamage();
                }

                if (bPos < -20) {
                    clearInterval(bAnim);
                    bone.remove();
                }
            }, 16);
        }

        function checkCollision(a, b) {
            const r1 = a.getBoundingClientRect();
            const r2 = b.getBoundingClientRect();
            return !(r1.right < r2.left || r1.left > r2.right || r1.bottom < r2.top || r1.top > r2.bottom);
        }

        function takeDamage() {
            if (isInvincible) return;
            hp -= 10;
            hpFill.style.width = Math.max(0, hp / 92 * 100) + '%';
            isInvincible = true;
            soul.style.opacity = '0.5';
            setTimeout(() => {
                isInvincible = false;
                soul.style.opacity = '1';
            }, 500);

            if (hp <= 0) {
                location.reload(); // Quick game over
            }
        }

        // ── Dialogue Engine ──
        async function typeText(str) {
            textEl.innerText = '';
            for (let char of str) {
                textEl.innerText += char;
                await new Promise(r => setTimeout(r, 50));
            }
        }

        // ── Game Loop ──
        async function startBattle() {
            for (let d of DIALOGUES) {
                await typeText(d);
                await new Promise(r => setTimeout(r, 1000));
            }
            
            textEl.innerText = "SANS IS ATTACKING!";
            attackInterval = setInterval(spawnBone, 800);
            
            setTimeout(() => {
                clearInterval(attackInterval);
                win();
            }, 15000); // Survive 15 seconds
        }

        function win() {
            Discovery.unlock('the-underground');
            overlay.style.display = 'flex';
        }

        startBattle();
        setInterval(moveSoul, 16);

    </script>
</body>
</html>
