<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE BARRIER | TRUE GENOCIDE</title>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #000;
            --heart: #ff0000;
            --bone: #fff;
            --box: #fff;
            --blue: #3498db;
            --spear: #00f2ff;
            --kr: #ff00ff;
        }

        body {
            background: var(--bg);
            color: #fff;
            font-family: 'VT323', monospace;
            margin: 0;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            user-select: none;
            transition: transform 0.1s;
        }

        .sans-container { margin-bottom: 20px; text-align: center; position: relative; height: 180px; display: flex; align-items: flex-end; justify-content: center; }
        .sans-battlesprite { width: 140px; image-rendering: pixelated; animation: jitter 0.05s infinite alternate; }
        .sans-eye { 
            position: absolute; top: 38%; left: 52%; transform: translateX(-50%);
            width: 8px; height: 8px; background: #0cf; border-radius: 50%;
            display: none; box-shadow: 0 0 15px #0cf; z-index: 10;
        }
        @keyframes jitter { to { transform: translate(2px, 2px); } }

        .battle-buttons { display: flex; gap: 20px; margin-top: 25px; width: 500px; justify-content: space-between; }
        .ut-btn {
            background: black; border: 2px solid #e27d31; color: #e27d31;
            font-family: inherit; font-size: 1.8rem; padding: 8px 15px;
            cursor: pointer; width: 110px; text-align: center; transition: 0.1s;
        }
        .ut-btn:hover { border-color: #ffff00; color: #ffff00; box-shadow: 0 0 10px rgba(255, 255, 0, 0.4); }
        .ut-btn:hover::before { content: '❤'; color: red; margin-right: 5px; }

        .battle-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; display: none; flex-direction: column; padding: 10px;
            z-index: 200; border: 2px solid #fff; box-sizing: border-box;
        }
        .battle-overlay.active { display: flex; }
        .menu-options { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .menu-opt { background: transparent; border: none; color: white; font-family: inherit; font-size: 1.5rem; text-align: left; cursor: pointer; display: flex; align-items: center; gap: 10px; }
        .menu-opt:hover { color: #ffff00; }
        .menu-opt:hover::before { content: '❤'; color: red; }

        #battle-box { width: 400px; height: 160px; border: 5px solid var(--box); position: relative; background: #000; overflow: hidden; transition: 0.3s; }
        #soul { width: 16px; height: 16px; background: var(--heart); position: absolute; clip-path: polygon(50% 0%, 100% 35%, 80% 100%, 50% 80%, 20% 100%, 0% 35%); z-index: 100; transition: background 0.2s, filter 0.1s; }
        #soul.blue { background: var(--blue); }

        .attack { position: absolute; background: var(--bone); z-index: 50; }
        .spear { position: absolute; width: 4px; height: 30px; background: var(--spear); z-index: 51; box-shadow: 0 0 10px var(--spear); }
        
        .blaster { position: absolute; width: 60px; height: 40px; background: #fff; border: 2px solid #0cf; border-radius: 10px; z-index: 60; opacity: 0; transform: scale(0.5); transition: 0.2s; }
        .blaster.charging { opacity: 1; transform: scale(1); }
        .beam { position: absolute; background: #fff; box-shadow: 0 0 20px #0cf, 0 0 40px #fff, 0 0 60px #0cf; z-index: 55; opacity: 0; }

        #dialogue-box { width: 500px; height: 100px; border: 5px solid #fff; margin-top: 20px; padding: 15px; font-size: 1.6rem; box-sizing: border-box; position: relative; }
        .stats { margin-top: 15px; font-size: 1.4rem; display: flex; gap: 30px; align-items: center; }
        #hp-bar-outer { width: 120px; height: 18px; background: #555; display: inline-block; position: relative; }
        #hp-fill { height: 100%; background: #ff0; width: 100%; position: absolute; left: 0; top: 0; z-index: 2; }
        #kr-fill { height: 100%; background: var(--kr); width: 0%; position: absolute; left: 0; top: 0; z-index: 1; }

        #overlay { position: fixed; inset: 0; background: #000; display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 1000; }
        .glitch { filter: invert(1) grayscale(1) contrast(500%); }
    </style>
</head>
<body>

    <div id="music-container" style="position: absolute; visibility: hidden; pointer-events: none;">
        <audio id="bgm" loop src="megalovania but its a metal cover.mp3"></audio>
    </div>

    <div class="sans-container">
        <img src="https://undertale.wiki/images/Sans_battle_idle.gif" alt="Sans" class="sans-battlesprite" id="sans-sprite">
        <div id="sans-eye" class="sans-eye"></div>
    </div>

    <div id="battle-box">
        <div id="soul"></div>
    </div>

    <div id="dialogue-box">
        <span id="text"></span>
        <div id="battle-overlay" class="battle-overlay">
            <div id="menu-options" class="menu-options"></div>
            <div style="margin-top: auto; font-size: 1rem; color: #444; text-align: center;" onclick="closeMenu()">[BACK]</div>
        </div>
    </div>

    <div class="battle-buttons" id="battle-controls">
        <button class="ut-btn" onclick="startCombat('FIGHT')">FIGHT</button>
        <button class="ut-btn" onclick="openMenu('ACT')">ACT</button>
        <button class="ut-btn" onclick="openMenu('ITEM')">ITEM</button>
        <button class="ut-btn" onclick="startCombat('MERCY')">MERCY</button>
    </div>

    <div id="start-overlay" style="position: fixed; inset: 0; background: #000; z-index: 2000; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer;">
        <h1 style="font-size: 5rem; color: #fff; margin: 0;">FINAL JUDGEMENT.</h1>
        <p style="font-size: 2rem; color: #f00;">ULTIMATE HARD MODE ENABLED</p>
    </div>

    <div class="stats">
        <span>FRISK LV 19</span>
        <span>HP <div id="hp-bar-outer"><div id="kr-fill"></div><div id="hp-fill"></div></div></span>
        <span id="hp-text">92 / 92</span>
        <span id="kr-text" style="color: var(--kr); font-size: 1rem; display: none;">KR</span>
    </div>

    <div id="overlay">
        <h1 style="font-size: 4rem; color: #ff0;">DETERMINATION</h1>
        <p>YOU SURVIVED THE IMPOSSIBLE. 🔥 SPECIAL AVATAR UNLOCKED: THE JUDGE.</p>
        <button onclick="window.location.href='index.html'" style="margin-top: 20px; background: #000; border: 2px solid #fff; color: #fff; padding: 10px 30px; font-family: inherit; font-size: 1.2rem; cursor: pointer;">RETURN TO REALITY</button>
    </div>

    <script src="discovery.js"></script>
    <script>
        const box = document.getElementById('battle-box');
        const soul = document.getElementById('soul');
        const textEl = document.getElementById('text');
        const hpFill = document.getElementById('hp-fill');
        const krFill = document.getElementById('kr-fill');
        const hpText = document.getElementById('hp-text');
        const krText = document.getElementById('kr-text');
        const eye = document.getElementById('sans-eye');
        const bgm = document.getElementById('bgm');

        let soulPos = { x: 192, y: 72 };
        let hp = 92;
        let kr = 0;
        let isInvincible = false;
        let keys = {};
        let isBlue = false;
        let gravityDir = 'down';
        let velocity = 0;
        let accel = 0.35;
        let jumpPower = -6;
        let isGameOver = false;
        let turnCount = 0;
        let isSansTurn = false;
        let menuAmbushItv = null;

        window.addEventListener('keydown', e => keys[e.code] = true);
        window.addEventListener('keyup', e => keys[e.code] = false);

        function updateSoul() {
            if (isGameOver) return;
            const speed = 3;
            if (isBlue) {
                if (gravityDir === 'down' || gravityDir === 'up') {
                    if (keys['ArrowLeft'] || keys['KeyA']) soulPos.x -= speed;
                    if (keys['ArrowRight'] || keys['KeyD']) soulPos.x += speed;
                    velocity += (gravityDir === 'down' ? accel : -accel);
                    soulPos.y += velocity;
                } else {
                    if (keys['ArrowUp'] || keys['KeyW']) soulPos.y -= speed;
                    if (keys['ArrowDown'] || keys['KeyS']) soulPos.y += speed;
                    velocity += (gravityDir === 'right' ? accel : -accel);
                    soulPos.x += velocity;
                }
                if (gravityDir === 'down' && soulPos.y >= 144) { soulPos.y = 144; velocity = 0; if (keys['ArrowUp'] || keys['KeyW']) velocity = jumpPower; }
                if (gravityDir === 'up' && soulPos.y <= 0) { soulPos.y = 0; velocity = 0; if (keys['ArrowDown'] || keys['KeyS']) velocity = -jumpPower; }
                if (gravityDir === 'right' && soulPos.x >= 384) { soulPos.x = 384; velocity = 0; if (keys['ArrowLeft'] || keys['KeyA']) velocity = jumpPower; }
                if (gravityDir === 'left' && soulPos.x <= 0) { soulPos.x = 0; velocity = 0; if (keys['ArrowRight'] || keys['KeyD']) velocity = -jumpPower; }
            } else {
                if (keys['ArrowUp'] || keys['KeyW']) soulPos.y -= speed;
                if (keys['ArrowDown'] || keys['KeyS']) soulPos.y += speed;
                if (keys['ArrowLeft'] || keys['KeyA']) soulPos.x -= speed;
                if (keys['ArrowRight'] || keys['KeyD']) soulPos.x += speed;
            }
            soulPos.x = Math.max(0, Math.min(384, soulPos.x));
            soulPos.y = Math.max(0, Math.min(144, soulPos.y));
            soul.style.left = soulPos.x + 'px';
            soul.style.top = soulPos.y + 'px';
        }

        function shake() {
            document.body.style.transform = `translate(${Math.random()*15-7}px, ${Math.random()*15-7}px)`;
            setTimeout(() => document.body.style.transform = '', 50);
        }

        function takeDamage() {
            if (isInvincible || isGameOver) return;
            kr = Math.min(40, kr + 10);
            hp = Math.max(1, hp - 5);
            updateHP();
            shake();
            isInvincible = true;
            soul.style.filter = 'invert(1)';
            setTimeout(() => { isInvincible = false; soul.style.filter = 'none'; }, 20); // Near zero i-frames
        }

        function updateHP() {
            hpFill.style.width = (hp / 92 * 100) + '%';
            krFill.style.width = ((hp + kr) / 92 * 100) + '%';
            hpText.innerText = `${Math.ceil(hp)} / 92`;
            if (kr > 0) krText.style.display = 'inline';
            else krText.style.display = 'none';
            if (hp <= 0) gameOver();
        }

        // Karma Drain logic
        setInterval(() => {
            if (kr > 0 && !isGameOver) {
                kr -= 0.5;
                hp -= 0.5;
                if (hp <= 0) gameOver();
                updateHP();
            }
        }, 100);

        function gameOver() {
            if (isGameOver) return;
            isGameOver = true;
            textEl.innerText = "Y O U  A R E  D E A D .";
            if (bgm) bgm.pause();
            setTimeout(() => location.reload(), 2000);
        }

        function spawnSpear() {
            const spear = document.createElement('div');
            spear.className = 'spear';
            const startX = Math.random() * 380, startY = Math.random() * 140;
            spear.style.left = startX + 'px'; spear.style.top = startY + 'px';
            spear.style.transform = `rotate(${Math.random()*360}deg) scale(0)`;
            box.appendChild(spear);
            setTimeout(() => {
                spear.style.transform += ' scale(1)';
                setTimeout(() => {
                    const angle = Math.atan2(soulPos.y - startY, soulPos.x - startX);
                    spear.style.transform = `rotate(${angle * 180 / Math.PI + 90}deg)`;
                    let curX = startX, curY = startY;
                    const anim = setInterval(() => {
                        curX += Math.cos(angle) * 12; curY += Math.sin(angle) * 12;
                        spear.style.left = curX + 'px'; spear.style.top = curY + 'px';
                        if (checkHit(spear)) takeDamage();
                        if (curX < -50 || curX > 450 || curY < -50 || curY > 200) { clearInterval(anim); spear.remove(); }
                    }, 16);
                }, 300);
            }, 50);
        }

        function spawnBone(dir = 'right', speed = 5, size = 70, offset = 0) {
            const bone = document.createElement('div');
            bone.className = 'attack';
            bone.style.width = '14px'; bone.style.height = size + 'px';
            if (dir === 'right') { bone.style.left = '400px'; bone.style.bottom = offset + 'px'; }
            else { bone.style.left = '-20px'; bone.style.top = offset + 'px'; }
            box.appendChild(bone);
            let pos = dir === 'right' ? 400 : -20;
            const anim = setInterval(() => {
                pos += (dir === 'right' ? -speed : speed);
                bone.style.left = pos + 'px';
                if (checkHit(bone)) takeDamage();
                if (pos < -50 || pos > 450) { clearInterval(anim); bone.remove(); }
            }, 16);
        }

        function checkHit(el) {
            const s = soul.getBoundingClientRect(); const e = el.getBoundingClientRect();
            return !(s.right < e.left || s.left > e.right || s.bottom < e.top || s.top > e.bottom);
        }

        async function fireBlaster(y = 50) {
            eye.style.display = 'block';
            const b = document.createElement('div');
            b.className = 'blaster'; b.style.left = '320px'; b.style.top = y + 'px';
            box.appendChild(b);
            await new Promise(r => setTimeout(r, 200)); // 200ms charge (Ultimate)
            b.classList.add('charging');
            await new Promise(r => setTimeout(r, 200));
            const beam = document.createElement('div');
            beam.className = 'beam';
            beam.style.left = '0px'; beam.style.top = (y+10)+'px';
            beam.style.width = '400px'; beam.style.height = '25px'; beam.style.opacity = '1';
            box.appendChild(beam);
            let ticks = 0;
            const check = setInterval(() => { if (checkHit(beam)) takeDamage(); if (++ticks > 10) clearInterval(check); }, 16);
            await new Promise(r => setTimeout(r, 150));
            beam.style.opacity = '0'; b.style.opacity = '0';
            setTimeout(() => { beam.remove(); b.remove(); eye.style.display='none'; }, 100);
        }

        async function typeText(str) {
            textEl.innerText = '';
            for (let char of str) { textEl.innerText += char; await new Promise(r => setTimeout(r, 30)); }
        }

        async function runGame() {
            document.getElementById('battle-controls').style.display = 'flex';
            await typeText("* sans blocks the way.");
        }

        const overlay = document.getElementById('battle-overlay');
        const menuOpts = document.getElementById('menu-options');
        const options = {
            'ACT': ['Check', 'Joke', 'Insult', 'Flirt'],
            'ITEM': ['Sea Tea', 'Pie', 'Legend Hero', 'Ice Cream']
        };

        window.openMenu = function(type) {
            overlay.classList.add('active'); menuOpts.innerHTML = '';
            options[type].forEach(opt => {
                const b = document.createElement('button'); b.className = 'menu-opt'; b.innerText = opt;
                b.onclick = () => handleChoice(opt); menuOpts.appendChild(b);
            });
        };

        window.closeMenu = function() { overlay.classList.remove('active'); };

        window.handleChoice = async function(choice) {
            closeMenu();
            if (choice === 'Ice Cream') {
                await typeText("* You give sans the Ice Cream."); await new Promise(r => setTimeout(r, 1000));
                await typeText("* he looks 'cone'-vinced."); win();
            } else if (choice === 'Check') {
                await typeText("* SANS 1 ATK 1 DEF. Still standard."); await new Promise(r => setTimeout(r, 1000));
                startSansTurn();
            } else {
                await typeText(`* You used ${choice}. * sans shrugs.`); await new Promise(r => setTimeout(r, 1000));
                startSansTurn();
            }
        };

        const SANS_LINES = ["* so... you finally arrived.", "* let's see if you can keep up.", "* that karma's a real pain, huh?", "* you look like you're sweating.", "* take a break. oh wait, you can't.", "* tick tock.", "* feeling blue yet?", "* almost there.", "* this is it.", "* DIE."];

        window.startCombat = async function(type) {
            if (type === 'FIGHT') { await typeText("* SANS dodged."); await new Promise(r => setTimeout(r, 1000)); startSansTurn(); }
            else if (type === 'MERCY') { await typeText("* You spared sans."); await new Promise(r => setTimeout(r, 1000)); startSansTurn(); }
        };

        async function startSansTurn() {
            if (isGameOver) return;
            isSansTurn = true; turnCount++;
            document.getElementById('battle-controls').style.display = 'none';
            if (menuAmbushItv) clearInterval(menuAmbushItv);

            await typeText(SANS_LINES[Math.min(turnCount - 1, 9)]);
            await new Promise(r => setTimeout(r, 800));
            if (bgm && bgm.paused) bgm.play();

            const complexity = Math.min(turnCount, 10);
            if (turnCount === 10) {
                await typeText("H E L L");
                const itvs = [
                    setInterval(() => { spawnBone('right', 14, 70, 0); spawnBone('left', 14, 70, 0); }, 150),
                    setInterval(spawnSpear, 250),
                    setInterval(() => fireBlaster(Math.random() * 120), 800),
                    setInterval(() => document.body.classList.toggle('glitch'), 500)
                ];
                setTimeout(() => { itvs.forEach(clearInterval); document.body.classList.remove('glitch'); win(); }, 30000);
                return;
            }

            let duration = 3000 + (complexity * 1000);
            let intervals = [];
            if (turnCount % 3 === 1) {
                intervals.push(setInterval(() => spawnBone('right', 10 + complexity, 80, 0), 200));
                if (turnCount > 5) intervals.push(setInterval(spawnSpear, 600)); // Combined
            } else if (turnCount % 3 === 2) {
                intervals.push(setInterval(spawnSpear, 250));
                if (turnCount > 5) intervals.push(setInterval(() => fireBlaster(Math.random()*100), 1500)); // Combined
            } else {
                isBlue = true; soul.classList.add('blue');
                const slams = ['down', 'right', 'up', 'left', 'down', 'up'].slice(0, 2 + complexity/2);
                for(let s of slams) {
                  gravityDir = s; velocity = 0; shake();
                  await new Promise(r => setTimeout(r, 600));
                  fireBlaster(Math.random()*100);
                }
            }

            setTimeout(() => {
                intervals.forEach(clearInterval); isSansTurn = false;
                document.getElementById('battle-controls').style.display = 'flex';
                typeText("* Sans is checking his watch.");
                // Menu Ambush after Turn 4
                if (turnCount >= 4) {
                    menuAmbushItv = setInterval(() => { if (!isSansTurn) spawnBone('right', 8, 40, Math.random()*100); }, 3000);
                }
            }, duration);
        }

        function win() {
            if (isGameOver) return;
            Discovery.unlock('the-underground');
            const data = JSON.parse(localStorage.getItem('wwg_avatar_data') || '{}');
            data.emoji = '⚖️'; data.aura = 'radial-gradient(circle, #0cf 0%, transparent 70%)';
            data.badge = 'JUDGEMENT'; data.nickname = 'The_Judge';
            data.unlocked = [...(data.unlocked || []), 'the-judge'];
            localStorage.setItem('wwg_avatar_data', JSON.stringify(data));
            window.dispatchEvent(new CustomEvent('economyUpdate'));
            document.getElementById('overlay').style.display = 'flex';
            if (bgm) bgm.pause();
        }

        setInterval(updateSoul, 16);
        document.getElementById('start-overlay').onclick = function() { this.style.display = 'none'; runGame(); };
    </script>
</body>
</html>
