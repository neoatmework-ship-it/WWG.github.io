<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Totem</title>
    <link rel="icon"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🗿%3C/text%3E%3C/svg%3E">
    <style>
        body {
            margin: 0;
            background: #62b1a8;
            overflow: hidden;
            height: 100vh;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            font-family: sans-serif;
        }

        .ground {
            position: absolute;
            bottom: 0;
            width: 100vw;
            height: 100px;
            background: #2f4f4f;
            border-top: 5px solid #1a2a2a;
        }

        #totem-pole {
            position: relative;
            bottom: 100px;
            width: 150px;
            display: flex;
            flex-direction: column-reverse;
            align-items: center;
            transition: transform 0.2s;
        }

        .block {
            width: 100px;
            height: 100px;
            background: #a0522d;
            border: 4px solid #5c2e16;
            border-radius: 10px;
            box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.5), 5px 5px 10px rgba(0, 0, 0, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            margin-bottom: -5px;
            /* overlap slightly */
            animation: dropIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            user-select: none;
            transition: 0.1s;
        }

        .block:active {
            transform: scale(0.95);
            filter: brightness(0.8);
        }

        @keyframes dropIn {
            0% {
                opacity: 0;
                transform: translateY(-200px) scale(1.5);
            }

            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .hint {
            position: absolute;
            top: 30px;
            letter-spacing: 5px;
            color: #1a2a2a;
            opacity: 0.5;
        }

        .score {
            position: absolute;
            top: 70px;
            font-size: 3rem;
            font-weight: bold;
            color: #1a2a2a;
        }
    </style>
</head>

<body>
    <div class="ground"></div>
    <div class="hint">CLICK TO STACK</div>
    <div class="score" id="s">0</div>

    <div id="totem-pole"></div>

    <script src="discovery.js"></script>
    <script>
        Discovery.unlock('totem');

        const pole = document.getElementById('totem-pole');
        const scoreEl = document.getElementById('s');

        const faces = ['🗿', '👹', '👺', '🦉', '🐻', '🐺', '🦅', '🐸', '🐢'];
        const colors = ['#a0522d', '#cd853f', '#d2b48c', '#deb887', '#f4a460'];

        let score = 0;

        window.addEventListener('mousedown', () => {
            const b = document.createElement('div');
            b.className = 'block';
            b.innerText = faces[Math.floor(Math.random() * faces.length)];
            b.style.background = colors[Math.floor(Math.random() * colors.length)];

            // Random slight rotation/offset for organic stack
            const rot = (Math.random() - 0.5) * 10;
            const off = (Math.random() - 0.5) * 10;
            b.style.transform = `rotate(${rot}deg) translateX(${off}px)`;

            pole.appendChild(b);

            score++;
            scoreEl.innerText = score;

            // Adjust camera view if it gets too high
            if (score * 100 > window.innerHeight - 300) {
                pole.style.transform = `translateY(${(score * 100) - (window.innerHeight - 300)}px)`;
            }
        });

        // Initial block
        const b = document.createElement('div');
        b.className = 'block';
        b.innerText = faces[0];
        pole.appendChild(b);
    </script>
</body>

</html>
