<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Life Online Calculator — Reality Check</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #000;
            --accent: #3b82f6;
            --text: #fff;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .container { width: 90%; max-width: 600px; text-align: center; }
        
        .calc-card {
            background: #0a0a0a;
            padding: 60px 40px;
            border-radius: 32px;
            border: 1px solid #111;
            position: relative;
        }

        h1 { font-size: 3rem; font-weight: 900; letter-spacing: -1px; margin-bottom: 40px; }

        .input-group { margin-bottom: 30px; text-align: left; }
        label { display: block; font-size: 0.8rem; text-transform: uppercase; color: #444; margin-bottom: 10px; font-weight: 700; }
        
        input {
            width: 100%;
            background: transparent;
            border: 2px solid #222;
            border-radius: 12px;
            padding: 15px;
            color: #fff;
            font-size: 1.2rem;
            outline: none;
            box-sizing: border-box;
        }
        input:focus { border-color: var(--accent); }

        .calc-btn {
            width: 100%;
            background: var(--accent);
            color: #fff;
            border: none;
            padding: 20px;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            margin-top: 20px;
        }

        .result { display: none; margin-top: 40px; }
        .res-val { font-size: 4rem; font-weight: 900; color: var(--accent); line-height: 1; }
        .res-text { font-size: 1.2rem; opacity: 0.6; margin-top: 10px; }

        .back-link { position: absolute; top: 20px; left: 20px; color: #222; text-decoration: none; font-size: 0.8rem; }
    </style>
</head>
<body>

    <div class="container">
        <div class="calc-card">
            <a href="index.html" class="back-link">← GALLERY</a>
            <h1>The Life<br>Online Calc.</h1>
            
            <div id="setup">
                <div class="input-group">
                    <label>How old are you?</label>
                    <input type="number" id="age" placeholder="Age">
                </div>
                <div class="input-group">
                    <label>Hours spent online per day?</label>
                    <input type="number" id="hours" placeholder="Hours (0-24)">
                </div>
                <button class="calc-btn" onclick="calculate()">CALCULATE THE COST</button>
            </div>

            <div class="result" id="result">
                <div class="res-val" id="years">4.2</div>
                <div class="res-text">YEARS SPENT ONLINE</div>
                <p style="margin-top: 30px; line-height: 1.6;">That is <span id="days">1,500</span> full days consumed by a digital void. You could have learned <span id="language">5</span> new languages in that time.</p>
                <button class="calc-btn" style="background: #111;" onclick="location.reload()">START OVER</button>
            </div>
        </div>
    </div>

    <script src="discovery.js"></script>
    <script>
        Discovery.unlock('life-online');

        function calculate() {
            const age = parseInt(document.getElementById('age').value);
            const hours = parseInt(document.getElementById('hours').value);
            
            if(isNaN(age) || isNaN(hours)) return;

            // Simple logic: Assume they started being 'online' at age 10
            const activeYears = Math.max(1, age - 10);
            const totalHours = activeYears * 365 * hours;
            const yearsOnline = (totalHours / (24 * 365)).toFixed(1);
            const daysOnline = Math.floor(totalHours / 24).toLocaleString();
            const languages = Math.floor(yearsOnline * 1.2);

            document.getElementById('setup').style.display = 'none';
            document.getElementById('result').style.display = 'block';
            
            document.getElementById('years').textContent = yearsOnline;
            document.getElementById('days').textContent = daysOnline;
            document.getElementById('language').textContent = Math.max(1, languages);
        }
    </script>
<script>
    if(/Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent)){
        document.body.innerHTML += '<a href="index.html" style="position:fixed;bottom:20px;right:20px;background:#000;color:#fff;padding:10px 20px;border-radius:30px;text-decoration:none;z-index:9999;border:1px solid #333;font-family:sans-serif;font-size:14px;">Back to Gallery</a>';
    }
</script>
</body>
</html>
