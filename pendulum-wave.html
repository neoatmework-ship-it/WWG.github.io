<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pendulum Wave — Hypnotic Motion</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{background:#0a0a12;overflow:hidden;display:flex;align-items:center;justify-content:center;height:100vh}
        canvas{display:block}
        .info{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);color:rgba(255,255,255,0.35);font-size:0.75rem;font-family:sans-serif}
    </style>

    <!-- wwg-mobile-patch-start -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        canvas {
            max-width: 100vw;
            max-height: 100vh;
            touch-action: none;
        }
    </style>
    <!-- wwg-mobile-patch-end -->

</head>
<body>
<style>
.wwg-back-btn{position:fixed;top:20px;left:20px;width:44px;height:44px;background:rgba(10,10,15,0.7);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,0.1);border-radius:50%;display:flex;align-items:center;justify-content:center;color:#a78bfa;z-index:99999;transition:all 0.3s;text-decoration:none}
.wwg-back-btn:hover{background:rgba(167,139,250,0.2);border-color:rgba(167,139,250,0.4);color:#fff}
</style>
<a href="index.html" class="wwg-back-btn" title="Back to Gallery"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg></a>
<canvas id="c"></canvas>
<div class="info">Click to reset · Watch the patterns emerge</div>
<script>
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
let W,H;
function resize(){W=canvas.width=innerWidth;H=canvas.height=innerHeight}
resize();window.onresize=resize;

const N=20;
const pendulums=[];
let t=0;

function init(){
    pendulums.length=0;
    for(let i=0;i<N;i++){
        const freq=0.5+i*0.03;
        const len=H*0.35;
        pendulums.push({freq,len,angle:Math.PI/3,trail:[]});
    }
    t=0;
}
init();
canvas.onclick=()=>init();

function draw(){
    ctx.fillStyle='rgba(10,10,18,0.08)';
    ctx.fillRect(0,0,W,H);

    const spacing=W/(N+1);
    const anchorY=H*0.12;

    for(let i=0;i<N;i++){
        const p=pendulums[i];
        const ax=spacing*(i+1);
        const angle=p.angle*Math.cos(p.freq*t);
        const bx=ax+Math.sin(angle)*p.len;
        const by=anchorY+Math.cos(angle)*p.len;

        p.trail.push({x:bx,y:by});
        if(p.trail.length>60)p.trail.shift();

        const hue=(i/N)*360;

        // Trail
        for(let j=1;j<p.trail.length;j++){
            ctx.beginPath();
            ctx.moveTo(p.trail[j-1].x,p.trail[j-1].y);
            ctx.lineTo(p.trail[j].x,p.trail[j].y);
            ctx.strokeStyle=`hsla(${hue},80%,60%,${j/p.trail.length*0.4})`;
            ctx.lineWidth=2;
            ctx.stroke();
        }

        // String
        ctx.beginPath();
        ctx.moveTo(ax,anchorY);
        ctx.lineTo(bx,by);
        ctx.strokeStyle=`hsla(${hue},30%,40%,0.5)`;
        ctx.lineWidth=1;
        ctx.stroke();

        // Bob
        ctx.beginPath();
        ctx.arc(bx,by,8,0,Math.PI*2);
        ctx.fillStyle=`hsl(${hue},80%,60%)`;
        ctx.fill();
        ctx.shadowColor=`hsl(${hue},80%,60%)`;
        ctx.shadowBlur=15;
        ctx.fill();
        ctx.shadowBlur=0;

        // Anchor
        ctx.beginPath();
        ctx.arc(ax,anchorY,3,0,Math.PI*2);
        ctx.fillStyle='rgba(255,255,255,0.3)';
        ctx.fill();
    }

    t+=0.03;
    requestAnimationFrame(draw);
}
draw();
</script>

    <script>
        // Touch-to-Mouse Polyfill for legacy canvas interactives
        document.addEventListener('touchstart', function(e) {
            if(e.touches.length > 0) {
                const touch = e.touches[0];
                const mouseEvent = new MouseEvent('mousedown', {
                    clientX: touch.clientX,
                    clientY: touch.clientY,
                    bubbles: true,
                    cancelable: true
                });
                e.target.dispatchEvent(mouseEvent);
            }
        }, {passive: false});

        document.addEventListener('touchmove', function(e) {
            if(e.touches.length > 0) {
                const touch = e.touches[0];
                const mouseEvent = new MouseEvent('mousemove', {
                    clientX: touch.clientX,
                    clientY: touch.clientY,
                    bubbles: true,
                    cancelable: true
                });
                e.target.dispatchEvent(mouseEvent);
            }
        }, {passive: false});

        document.addEventListener('touchend', function(e) {
            const mouseEvent = new MouseEvent('mouseup', {
                bubbles: true,
                cancelable: true
            });
            e.target.dispatchEvent(mouseEvent);
        }, {passive: false});
    </script>
    <!-- wwg-mobile-patch-js-end -->

</body>
</html>
