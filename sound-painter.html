<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOUND PAINTER — Audiosthetic Fun</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🎨%3C/text%3E%3C/svg%3E">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #000;
            --red: #ff4d4d;
            --blue: #4d94ff;
            --green: #4dff88;
        }

        * { margin:0; padding:0; box-sizing:border-box; }

        body {
            background: var(--bg);
            color: #fff;
            font-family: sans-serif;
            overflow: hidden;
            touch-action: none;
        }

        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }

        #ui {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 15px 30px;
            border-radius: 50px;
            display: flex;
            gap: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 100;
        }

        .color-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 2px solid transparent;
            cursor: pointer;
            transition: transform 0.2s, border-color 0.2s;
        }

        .color-btn:hover { transform: scale(1.1); }
        .color-btn.active { border-color: #fff; transform: scale(1.1); }

        #btn-red { background: var(--red); box-shadow: 0 0 15px var(--red); }
        #btn-blue { background: var(--blue); box-shadow: 0 0 15px var(--blue); }
        #btn-green { background: var(--green); box-shadow: 0 0 15px var(--green); }

        #overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.8);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 200;
            text-align: center;
            padding: 20px;
        }

        h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 2.5rem;
            margin-bottom: 10px;
            letter-spacing: 5px;
            background: linear-gradient(90deg, var(--red), var(--blue), var(--green));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p { color: #888; margin-bottom: 30px; }

        .start-btn {
            background: transparent;
            color: #fff;
            border: 1px solid #fff;
            padding: 15px 40px;
            border-radius: 10px;
            font-family: 'Orbitron', sans-serif;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .start-btn:hover { background: #fff; color: #000; }

        .controls-hint {
            position: fixed;
            top: 20px;
            right: 20px;
            text-align: right;
            color: #444;
            font-size: 0.7rem;
            letter-spacing: 2px;
        }

        .clear-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            background: none;
            border: 1px solid #222;
            color: #444;
            padding: 5px 15px;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 0.7rem;
            z-index: 100;
        }
        .clear-btn:hover { border-color: #fff; color: #fff; }
    </style>
</head>
<body>

    <div id="overlay">
        <h1>SOUND PAINTER</h1>
        <p>Draw to create music. Color changes the instrument.</p>
        <button class="start-btn" onclick="startApp()">Enter Studio</button>
    </div>

    <button class="clear-btn" onclick="clearCanvas()">CLEAR CANVAS</button>
    <div class="controls-hint">RED: KICK<br>BLUE: SYNTH<br>GREEN: PIANO</div>

    <canvas id="painter"></canvas>

    <div id="ui">
        <div id="btn-red" class="color-btn active" onclick="setColor('red')"></div>
        <div id="btn-blue" class="color-btn" onclick="setColor('blue')"></div>
        <div id="btn-green" class="color-btn" onclick="setColor('green')"></div>
    </div>

    <script src="discovery.js"></script>
    <script>
        Discovery.unlock('sound-painter');

        const canvas = document.getElementById('painter');
        const ctx = canvas.getContext('2d');
        let audioCtx;
        let isDrawing = false;
        let currentColor = 'red';
        let lastX, lastY;

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }
        window.onresize = resize;
        resize();

        function startApp() {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            document.getElementById('overlay').style.display = 'none';
        }

        function setColor(c) {
            currentColor = c;
            document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(`btn-${c}`).classList.add('active');
        }

        function clearCanvas() {
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        // --- Audio Logic ---
        function playSound(color, y) {
            if(!audioCtx) return;
            const freq = 100 + (1 - y/canvas.height) * 1000;

            if(color === 'red') {
                // Kick drum style hit
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(150, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
                gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.5);
            } else if(color === 'blue') {
                // Synth saw
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.5);
            } else if(color === 'green') {
                // "Piano" sine pluck
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 1.2);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 1.2);
            }
        }

        // --- Drawing Logic ---
        function startDrawing(e) {
            isDrawing = true;
            [lastX, lastY] = [e.clientX || e.touches[0].clientX, e.clientY || e.touches[0].clientY];
            playSound(currentColor, lastY);
        }

        function draw(e) {
            if(!isDrawing) return;
            const x = e.clientX || e.touches[0].clientX;
            const y = e.clientY || e.touches[0].clientY;

            ctx.beginPath();
            ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue(`--${currentColor}`);
            ctx.lineWidth = 15;
            ctx.lineCap = 'round';
            ctx.moveTo(lastX, lastY);
            ctx.lineTo(x, y);
            ctx.stroke();

            // Glow effect
            ctx.globalAlpha = 0.2;
            ctx.lineWidth = 30;
            ctx.stroke();
            ctx.globalAlpha = 1.0;

            // Only play sound occasionally while dragging
            if(Math.abs(x - lastX) > 50 || Math.abs(y - lastY) > 50) {
                playSound(currentColor, y);
                [lastX, lastY] = [x, y];
            }
        }

        function stopDrawing() { isDrawing = false; }

        canvas.addEventListener('mousedown', startDrawing);
        canvas.addEventListener('mousemove', draw);
        window.addEventListener('mouseup', stopDrawing);

        canvas.addEventListener('touchstart', startDrawing);
        canvas.addEventListener('touchmove', draw);
        window.addEventListener('touchend', stopDrawing);

    </script>
    <script>
        if(/Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent)){
            document.body.innerHTML += '<a href="index.html" style="position:fixed;bottom:20px;right:20px;background:#000;color:#fff;padding:10px 20px;border-radius:30px;text-decoration:none;z-index:9999;border:1px solid #333;font-family:sans-serif;font-size:14px;">Back to Gallery</a>';
        }
    </script>
</body>
</html>
