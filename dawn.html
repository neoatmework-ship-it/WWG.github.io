<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dawn</title>
    <link rel="icon"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🌅%3C/text%3E%3C/svg%3E">
    <style>
        body,
        html {
            margin: 0;
            padding: 0;
            min-height: 400vh;
            overflow-x: hidden;
            font-family: sans-serif;
        }

        .sky {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -2;
            background: linear-gradient(180deg, #020111 0%, #20124d 50%, #000022 100%);
            transition: background 0.1s;
        }

        .sun {
            position: fixed;
            left: 50%;
            transform: translateX(-50%);
            width: 300px;
            height: 300px;
            border-radius: 50%;
            background: linear-gradient(180deg, #ffdf00, #ff4500);
            box-shadow: 0 0 100px 20px rgba(255, 100, 0, 0.8);
            z-index: -1;
            bottom: -300px;
            /* Start hidden */
            transition: bottom 0.1s;
        }

        .mountain {
            position: fixed;
            bottom: 0;
            width: 100%;
            height: 200px;
            z-index: 10;
            background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200"><polygon points="0,200 50,50 100,150 150,80 200,200" fill="%23111"/></svg>') repeat-x;
        }

        .text {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: rgba(255, 255, 255, 0.2);
            font-size: 3rem;
            letter-spacing: 10px;
            z-index: 5;
            pointer-events: none;
        }

        .scroll {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            color: #fff;
            font-size: 0.8rem;
            letter-spacing: 2px;
        }
    </style>

    <!-- wwg-mobile-patch-start -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        canvas {
            max-width: 100vw;
            max-height: 100vh;
            touch-action: none;
        }
    </style>
    <!-- wwg-mobile-patch-end -->

</head>

<body>
    <div class="sky" id="sky"></div>
    <div class="sun" id="sun"></div>
    <div class="text">DAWN</div>
    <div class="mountain"></div>
    <div class="scroll">SCROLL DOWN</div>

    <script src="discovery.js"></script>
    <script>
        Discovery.unlock('dawn');

        const sky = document.getElementById('sky');
        const sun = document.getElementById('sun');
        const maxScroll = document.body.scrollHeight - window.innerHeight;

        window.addEventListener('scroll', () => {
            const scroll = window.scrollY;
            const progress = scroll / maxScroll; // 0 to 1

            // Move sun up
            const sunY = -300 + (progress * 600);
            sun.style.bottom = sunY + 'px';

            // Change sky colors
            if (progress < 0.3) {
                // Night
                sky.style.background = `linear-gradient(180deg, #020111 0%, #20124d 50%, #000022 100%)`;
            } else if (progress < 0.6) {
                // Dawn
                const mix = (progress - 0.3) / 0.3;
                sky.style.background = `linear-gradient(180deg, rgba(32,18,77,${1 - mix}) 0%, rgba(200,100,100,${mix}) 50%, #ff8c00 100%)`;
            } else {
                // Day
                const mix = (progress - 0.6) / 0.4;
                sky.style.background = `linear-gradient(180deg, rgba(135,206,235,${mix}) 0%, rgba(200,100,100,${1 - mix}) 50%, #ff8c00 100%)`;
            }
        });
    </script>

    <!-- wwg-mobile-patch-js-start -->
    <script>
        // Touch-to-Mouse Polyfill for legacy canvas interactives
        document.addEventListener('touchstart', function(e) {
            if(e.touches.length > 0) {
                const touch = e.touches[0];
                const mouseEvent = new MouseEvent('mousedown', {
                    clientX: touch.clientX,
                    clientY: touch.clientY,
                    bubbles: true,
                    cancelable: true
                });
                e.target.dispatchEvent(mouseEvent);
            }
        }, {passive: false});

        document.addEventListener('touchmove', function(e) {
            if(e.touches.length > 0) {
                const touch = e.touches[0];
                const mouseEvent = new MouseEvent('mousemove', {
                    clientX: touch.clientX,
                    clientY: touch.clientY,
                    bubbles: true,
                    cancelable: true
                });
                e.target.dispatchEvent(mouseEvent);
            }
        }, {passive: false});

        document.addEventListener('touchend', function(e) {
            const mouseEvent = new MouseEvent('mouseup', {
                bubbles: true,
                cancelable: true
            });
            e.target.dispatchEvent(mouseEvent);
        }, {passive: false});
    </script>
    <!-- wwg-mobile-patch-js-end -->

</body>

</html>
