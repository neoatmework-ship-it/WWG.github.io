<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kaleidoscope</title>
    <meta name="description" content="Draw beautiful, symmetrical, shifting mandala shapes.">
    <link rel="icon"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E💠%3C/text%3E%3C/svg%3E">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600&family=Inter:wght@400;500&display=swap"
        rel="stylesheet">
    <style>
        body {
            margin: 0;
            background: #0c0910;
            color: #fff;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        .top-bar {
            padding: 16px 24px;
            background: rgba(12, 9, 16, 0.8);
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: relative;
            z-index: 10;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .back {
            text-decoration: none;
            color: #a78bfa;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: 0.2s;
        }

        .back:hover {
            color: #c4b5fd;
            gap: 12px;
        }

        .controls {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .control-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .control-group label {
            font-size: 0.85rem;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        input[type="range"] {
            accent-color: #a78bfa;
        }

        input[type="color"] {
            background: none;
            border: none;
            width: 32px;
            height: 32px;
            padding: 0;
            cursor: pointer;
            border-radius: 4px;
            overflow: hidden;
        }

        input[type="color"]::-webkit-color-swatch-wrapper {
            padding: 0;
        }

        input[type="color"]::-webkit-color-swatch {
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 4px;
        }

        .btn {
            background: rgba(167, 139, 250, 0.1);
            color: #a78bfa;
            border: 1px solid rgba(167, 139, 250, 0.3);
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-family: 'Space Grotesk', sans-serif;
            transition: 0.2s;
        }

        .btn:hover {
            background: rgba(167, 139, 250, 0.2);
        }

        .hint {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.3);
            font-size: 0.9rem;
            pointer-events: none;
            letter-spacing: 1px;
        }

        canvas {
            display: block;
            flex-grow: 1;
            cursor: crosshair;
        }
    </style>

    <!-- wwg-mobile-patch-start -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        canvas {
            max-width: 100vw;
            max-height: 100vh;
            touch-action: none;
        }
    </style>
    <!-- wwg-mobile-patch-end -->

</head>

<body>
    <div class="top-bar">
        <a href="index.html" class="back">← Gallery</a>

        <div class="controls">
            <div class="control-group">
                <label>Mirrors (<span id="seg-val">12</span>)</label>
                <input type="range" id="segments" min="4" max="32" step="2" value="12">
            </div>
            <div class="control-group">
                <label>Size</label>
                <input type="range" id="size" min="1" max="20" value="4">
            </div>
            <div class="control-group">
                <label>Color</label>
                <input type="color" id="color" value="#a78bfa">
            </div>
            <button class="btn" id="clear">Clear</button>
            <button class="btn" id="save">Save Image</button>
        </div>
    </div>

    <canvas id="c"></canvas>
    <div class="hint">Draw on the canvas</div>

    <script>
        const canvas = document.getElementById('c');
        const ctx = canvas.getContext('2d');

        // Settings
        const config = {
            segments: 12,
            lineWidth: 4,
            color: '#a78bfa',
            isDrawing: false
        };

        let w, h, cx, cy;
        let lastX = 0;
        let lastY = 0;

        function resize() {
            w = canvas.width = window.innerWidth;
            h = canvas.height = window.innerHeight - 66; // minus top bar
            cx = w / 2;
            cy = h / 2;

            // Fill background
            ctx.fillStyle = '#0c0910';
            ctx.fillRect(0, 0, w, h);
        }

        window.addEventListener('resize', resize);
        resize();

        // Inputs
        document.getElementById('segments').addEventListener('input', e => {
            config.segments = parseInt(e.target.value);
            document.getElementById('seg-val').textContent = config.segments;
        });

        document.getElementById('size').addEventListener('input', e => {
            config.lineWidth = parseInt(e.target.value);
        });

        document.getElementById('color').addEventListener('input', e => {
            config.color = e.target.value;
        });

        document.getElementById('clear').addEventListener('click', () => {
            ctx.fillStyle = '#0c0910';
            ctx.fillRect(0, 0, w, h);
        });

        document.getElementById('save').addEventListener('click', () => {
            const link = document.createElement('a');
            link.download = `kaleidoscope-${Date.now()}.png`;
            link.href = canvas.toDataURL();
            link.click();
        });

        // Drawing
        function startDrawing(e) {
            config.isDrawing = true;
            const pos = getPos(e);
            lastX = pos.x;
            lastY = pos.y;
        }

        function stopDrawing() {
            config.isDrawing = false;
        }

        function getPos(e) {
            const rect = canvas.getBoundingClientRect();
            let clientX, clientY;

            if (e.touches && e.touches.length > 0) {
                clientX = e.touches[0].clientX;
                clientY = e.touches[0].clientY;
            } else {
                clientX = e.clientX;
                clientY = e.clientY;
            }
            // Account for top bar offset
            return {
                x: clientX - rect.left,
                y: clientY - rect.top
            };
        }

        function draw(e) {
            if (!config.isDrawing) return;
            e.preventDefault(); // prevent scrolling on touch

            const pos = getPos(e);
            const currentX = pos.x;
            const currentY = pos.y;

            const angle = (Math.PI * 2) / config.segments;

            // Map absolute coordinates to coordinates relative to center
            const relLastX = lastX - cx;
            const relLastY = lastY - cy;
            const relCurrX = currentX - cx;
            const relCurrY = currentY - cy;

            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.lineWidth = config.lineWidth;

            // Use glowing shadow
            ctx.shadowBlur = 10;
            ctx.shadowColor = config.color;

            for (let i = 0; i < config.segments; i++) {
                ctx.save();
                ctx.translate(cx, cy);
                ctx.rotate(i * angle);

                // Draw normal segment
                ctx.beginPath();
                ctx.moveTo(relLastX, relLastY);
                ctx.lineTo(relCurrX, relCurrY);
                ctx.strokeStyle = config.color;
                ctx.stroke();

                // Draw mirrored segment (so lines meet seamlessly at bounds)
                ctx.beginPath();
                // To mirror: flip X coordinate (scale(-1, 1))
                ctx.moveTo(-relLastX, relLastY);
                ctx.lineTo(-relCurrX, relCurrY);
                ctx.strokeStyle = config.color;
                ctx.stroke();

                ctx.restore();
            }

            lastX = currentX;
            lastY = currentY;
        }

        canvas.addEventListener('mousedown', startDrawing);
        canvas.addEventListener('mousemove', draw);
        canvas.addEventListener('mouseup', stopDrawing);
        canvas.addEventListener('mouseout', stopDrawing);

        canvas.addEventListener('touchstart', startDrawing, { passive: false });
        canvas.addEventListener('touchmove', draw, { passive: false });
        canvas.addEventListener('touchend', stopDrawing);
        canvas.addEventListener('touchcancel', stopDrawing);

    </script>

<style>
.wwg-nav {
    position: fixed;
    bottom: 20px;
    right: 20px;
    display: flex;
    gap: 10px;
    z-index: 99999;
}
.wwg-nav a {
    background: rgba(10, 10, 15, 0.7);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 255, 255, 0.1);
    color: #a78bfa;
    padding: 8px 16px;
    border-radius: 20px;
    font-family: 'Space Grotesk', sans-serif;
    font-size: 0.8rem;
    font-weight: 600;
    text-decoration: none;
    transition: all 0.3s ease;
}
.wwg-nav a:hover {
    background: rgba(167, 139, 250, 0.2);
    border-color: rgba(167, 139, 250, 0.4);
    color: #fff;
    transform: translateY(-2px);
    box-shadow: 0 4px 15px rgba(167, 139, 250, 0.3);
}
</style>
<script>
(function() {
    let sequence = '';
    const trigger = 'PNPNPN';
    document.querySelectorAll('.wwg-nav a').forEach(a => {
        a.addEventListener('click', (e) => {
            const type = a.innerText.includes('Prev') ? 'P' : 'N';
            sequence += type;
            if (sequence.length > 6) sequence = sequence.substring(1);
            if (sequence === trigger) {
                e.preventDefault();
                window.location.href = 'time-loop.html';
            }
        });
    });
})();
</script>
<div class="wwg-nav">

</div>

    <script>
        // Touch-to-Mouse Polyfill for legacy canvas interactives
        document.addEventListener('touchstart', function(e) {
            if(e.touches.length > 0) {
                const touch = e.touches[0];
                const mouseEvent = new MouseEvent('mousedown', {
                    clientX: touch.clientX,
                    clientY: touch.clientY,
                    bubbles: true,
                    cancelable: true
                });
                e.target.dispatchEvent(mouseEvent);
            }
        }, {passive: false});

        document.addEventListener('touchmove', function(e) {
            if(e.touches.length > 0) {
                const touch = e.touches[0];
                const mouseEvent = new MouseEvent('mousemove', {
                    clientX: touch.clientX,
                    clientY: touch.clientY,
                    bubbles: true,
                    cancelable: true
                });
                e.target.dispatchEvent(mouseEvent);
            }
        }, {passive: false});

        document.addEventListener('touchend', function(e) {
            const mouseEvent = new MouseEvent('mouseup', {
                bubbles: true,
                cancelable: true
            });
            e.target.dispatchEvent(mouseEvent);
        }, {passive: false});
    </script>
    <!-- wwg-mobile-patch-js-end -->

</body>

</html>
