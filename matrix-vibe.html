<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E💻%3C/text%3E%3C/svg%3E">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matrix // Vibe Injection</title>
    <style>
        body {
            margin: 0;
            background: black;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        canvas {
            display: block;
        }
        .ui {
            position: absolute;
            color: #0F0;
            font-family: 'Courier New', Courier, monospace;
            font-size: 1.2rem;
            pointer-events: none;
            text-shadow: 0 0 10px #0F0;
            opacity: 0.7;
        }
    </style>
</head>
<body>
    <div class="ui">TYPE TO INJECT INTO THE MATRIX...</div>
    <canvas id="canvas"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        canvas.height = window.innerHeight;
        canvas.width = window.innerWidth;

        const characters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789$+-*/%=<>!&|^~';
        const fontSize = 16;
        const columns = canvas.width / fontSize;
        const drops = [];

        // Custom strings to inject
        let customStrings = ["NEO", "VIBE", "CODER", "WWG"];
        let injectionIndex = 0;

        for (let x = 0; x < columns; x++) {
            drops[x] = 1;
        }

        function draw() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#0F0';
            ctx.font = fontSize + 'px arial';

            for (let i = 0; i < drops.length; i++) {
                // Determine character
                let text = characters.charAt(Math.floor(Math.random() * characters.length));
                
                // Occasionally inject custom words
                if (Math.random() > 0.98) {
                    text = customStrings[Math.floor(Math.random() * customStrings.length)];
                }

                ctx.fillText(text, i * fontSize, drops[i] * fontSize);

                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                    drops[i] = 0;
                }
                drops[i]++;
            }
        }

        window.addEventListener('resize', () => {
            canvas.height = window.innerHeight;
            canvas.width = window.innerWidth;
        });

        // Vibe Injection Logic
        let currentWord = "";
        window.addEventListener('keydown', (e) => {
            if (e.key.length === 1) {
                currentWord += e.key.toUpperCase();
                if (currentWord.length > 3) {
                    customStrings.push(currentWord);
                    if (customStrings.length > 20) customStrings.shift(); // Keep it clean
                    currentWord = "";
                }
            } else if (e.key === 'Enter') {
                if(currentWord) customStrings.push(currentWord);
                currentWord = "";
            }
        });

        setInterval(draw, 33);
    </script>
</body>
</html>
