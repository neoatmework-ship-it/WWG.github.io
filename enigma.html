<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enigma</title>
    <link rel="icon"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🔏%3C/text%3E%3C/svg%3E">
    <style>
        body {
            margin: 0;
            background: #2f3640;
            color: #f5f6fa;
            font-family: monospace;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }

        .machine {
            background: #353b48;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), inset 0 2px 10px rgba(255, 255, 255, 0.1);
            border: 2px solid #2f3640;
            text-align: center;
        }

        .rotors {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin-bottom: 40px;
        }

        .rotor {
            width: 50px;
            height: 100px;
            background: #2f3640;
            border-radius: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 10px 20px rgba(0, 0, 0, 0.8);
            cursor: ns-resize;
            user-select: none;
        }

        .rotor::before,
        .rotor::after {
            content: '';
            position: absolute;
            left: 0;
            width: 100%;
            height: 20px;
            background: linear-gradient(#111, transparent);
            z-index: 10;
            pointer-events: none;
        }

        .rotor::after {
            bottom: 0;
            top: auto;
            background: linear-gradient(transparent, #111);
        }

        .letter {
            position: absolute;
            transition: transform 0.2s;
        }

        .lightboard {
            display: grid;
            grid-template-columns: repeat(9, 1fr);
            gap: 10px;
            margin-bottom: 20px;
            justify-content: center;
        }

        .light {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #2f3640;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: #7f8fa6;
            box-shadow: inset 0 5px 10px rgba(0, 0, 0, 0.5);
            border: 2px solid #222;
            transition: 0.1s;
        }

        .light.on {
            background: #fbc531;
            color: #fff;
            box-shadow: 0 0 20px #fbc531;
            border-color: #fbc531;
        }

        .keyboard {
            display: grid;
            grid-template-columns: repeat(9, 1fr);
            gap: 10px;
            justify-content: center;
        }

        .key {
            width: 40px;
            height: 40px;
            border-radius: 5px;
            background: #f5f6fa;
            color: #2f3640;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 5px 0 #dcdde1;
            transition: 0.1s;
            user-select: none;
        }

        .key:active {
            transform: translateY(5px);
            box-shadow: 0 0 0 #dcdde1;
        }

        .output {
            margin-top: 30px;
            font-size: 1.5rem;
            letter-spacing: 5px;
            min-height: 40px;
            color: #fbc531;
        }
    </style>

    <!-- wwg-mobile-patch-start -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        canvas {
            max-width: 100vw;
            max-height: 100vh;
            touch-action: none;
        }
    </style>
    <!-- wwg-mobile-patch-end -->

</head>

<body>
    <div class="machine">
        <div class="rotors">
            <div class="rotor" id="r1">
                <div class="letter">A</div>
            </div>
            <div class="rotor" id="r2">
                <div class="letter">A</div>
            </div>
            <div class="rotor" id="r3">
                <div class="letter">A</div>
            </div>
        </div>

        <div class="lightboard" id="lights"></div>
        <div class="keyboard" id="keys"></div>

        <div class="output" id="out"></div>
    </div>

    <script src="discovery.js"></script>
    <script>
        Discovery.unlock('enigma');

        const ALPHABET = "QWERTYUIOPASDFGHJKLZXCVBNM".split('');
        const lBoard = document.getElementById('lights');
        const kBoard = document.getElementById('keys');
        const out = document.getElementById('out');

        // Setup boards
        ALPHABET.forEach(c => {
            const l = document.createElement('div');
            l.className = 'light';
            l.id = 'l_' + c;
            l.innerText = c;
            lBoard.appendChild(l);

            const k = document.createElement('div');
            k.className = 'key';
            k.innerText = c;

            k.addEventListener('mousedown', () => press(c));
            kBoard.appendChild(k);
        });

        // Setup Rotors
        let rPos = [0, 0, 0];
        const rotors = [document.getElementById('r1'), document.getElementById('r2'), document.getElementById('r3')];

        rotors.forEach((r, i) => {
            r.addEventListener('wheel', e => {
                rPos[i] = (rPos[i] + (e.deltaY > 0 ? 1 : -1) + 26) % 26;
                updateRotorViz(i);
            });
            r.addEventListener('click', () => {
                rPos[i] = (rPos[i] + 1) % 26;
                updateRotorViz(i);
            });
        });

        function updateRotorViz(i) {
            rotors[i].querySelector('.letter').innerText = String.fromCharCode(65 + rPos[i]);
        }

        // Cipher Logic (simplified fake enigma)
        let outputText = "";

        function press(char) {
            // Step rotors
            rPos[2] = (rPos[2] + 1) % 26;
            if (rPos[2] === 0) {
                rPos[1] = (rPos[1] + 1) % 26;
                if (rPos[1] === 0) rPos[0] = (rPos[0] + 1) % 26;
            }
            updateRotorViz(0); updateRotorViz(1); updateRotorViz(2);

            // Shift char
            let charCode = char.charCodeAt(0) - 65;

            // Pass through rotors
            charCode = (charCode + rPos[2]) % 26;
            charCode = (charCode + rPos[1]) % 26;
            charCode = (charCode + rPos[0]) % 26;

            // Reflector (A-Z flip)
            charCode = 25 - charCode;

            // Pass back
            charCode = (charCode - rPos[0] + 26) % 26;
            charCode = (charCode - rPos[1] + 26) % 26;
            charCode = (charCode - rPos[2] + 26) % 26;

            const resChar = String.fromCharCode(65 + charCode);

            // Light up
            const light = document.getElementById('l_' + resChar);
            if (light) {
                light.classList.add('on');
                setTimeout(() => light.classList.remove('on'), 200);
            }

            outputText += resChar;
            if (outputText.length > 20) outputText = outputText.substring(1);
            out.innerText = outputText;
        }

        document.addEventListener('keydown', e => {
            const char = e.key.toUpperCase();
            if (ALPHABET.includes(char)) press(char);
        });
    </script>

    <!-- wwg-mobile-patch-js-start -->
    <script>
        // Touch-to-Mouse Polyfill for legacy canvas interactives
        document.addEventListener('touchstart', function(e) {
            if(e.touches.length > 0) {
                const touch = e.touches[0];
                const mouseEvent = new MouseEvent('mousedown', {
                    clientX: touch.clientX,
                    clientY: touch.clientY,
                    bubbles: true,
                    cancelable: true
                });
                e.target.dispatchEvent(mouseEvent);
            }
        }, {passive: false});

        document.addEventListener('touchmove', function(e) {
            if(e.touches.length > 0) {
                const touch = e.touches[0];
                const mouseEvent = new MouseEvent('mousemove', {
                    clientX: touch.clientX,
                    clientY: touch.clientY,
                    bubbles: true,
                    cancelable: true
                });
                e.target.dispatchEvent(mouseEvent);
            }
        }, {passive: false});

        document.addEventListener('touchend', function(e) {
            const mouseEvent = new MouseEvent('mouseup', {
                bubbles: true,
                cancelable: true
            });
            e.target.dispatchEvent(mouseEvent);
        }, {passive: false});
    </script>
    <!-- wwg-mobile-patch-js-end -->

</body>

</html>
