<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E❓%3C/text%3E%3C/svg%3E">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>How Weird Are You? — The Scale</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #ffefd5;
            --accent: #ff69b4;
            --text: #4a4a4a;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Fredoka', sans-serif;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .quiz-card {
            background: #fff;
            padding: 40px;
            border-radius: 40px;
            width: 90%;
            max-width: 500px;
            box-shadow: 0 20px 0 rgba(0,0,0,0.05);
            text-align: center;
        }

        h1 { color: var(--accent); font-size: 2rem; margin-bottom: 30px; }
        
        .progress {
            width: 100%;
            height: 10px;
            background: #eee;
            border-radius: 10px;
            margin-bottom: 30px;
            overflow: hidden;
        }
        .progress-fill { height: 100%; background: var(--accent); width: 0%; transition: 0.3s; }

        .question { font-size: 1.3rem; font-weight: 700; margin-bottom: 30px; }

        .options { display: grid; gap: 10px; }
        .opt {
            background: #f8f8f8;
            border: 2px solid #eee;
            padding: 15px;
            border-radius: 20px;
            cursor: pointer;
            transition: 0.2s;
            font-family: inherit;
            font-weight: 700;
            color: var(--text);
        }
        .opt:hover { background: var(--accent); color: #fff; border-color: var(--accent); transform: scale(1.02); }

        .result-screen { display: none; }
        .res-type { font-size: 2.5rem; font-weight: 700; color: var(--accent); margin: 20px 0; }
        .res-desc { line-height: 1.6; opacity: 0.8; margin-bottom: 30px; }

        .back-link { position: fixed; top: 20px; left: 20px; color: #999; text-decoration: none; font-size: 0.8rem; }
    </style>
</head>
<body>

    <a href="index.html" class="back-link">← EXIT_NORMALITY</a>

    <div class="quiz-card">
        <div class="progress"><div class="progress-fill" id="progress"></div></div>

        <div id="quiz">
            <div class="question" id="q-text">Loading...</div>
            <div class="options" id="options"></div>
        </div>

        <div class="result-screen" id="result">
            <div style="text-transform: uppercase; font-size: 0.8rem; letter-spacing: 2px;">Your Weirdness Type:</div>
            <div class="res-type" id="res-type">Interdimensional Goblin</div>
            <div class="res-desc" id="res-desc">You are not from this world. Your habits defy logic, and your presence disrupts the matrix. Stay weird.</div>
            <button class="opt" style="width: 100%; background: var(--accent); color: #fff;" onclick="location.reload()">RE-CALIBRATE</button>
        </div>
    </div>

    <script src="discovery.js"></script>
    <script>
        Discovery.unlock('weird-test');

        const QUESTIONS = [
            { q: "Do you talk to yourself when you're alone?", a: [ "All the time (Full Conversations)", "Occasionally (Thinking out loud)", "Only when I'm mad", "Never, that's weird" ] },
            { q: "Do you smell books before reading them?", a: [ "Yes, it's mandatory", "If they're old", "Only if people aren't looking", "No, why would I do that?" ] },
            { q: "How do you eat a pizza?", a: [ "Crust first", "Folded in half", "With a knife and fork", "Normally (The boring way)" ] },
            { q: "Do you name your electronic devices?", a: [ "Everything has a name", "Just my car/laptop", "Maybe a nickname", "No, it's a tool" ] },
            { q: "Which of these interests you more?", a: [ "Aliens and Cryptids", "Quantum Physics", "Victorian Fashion", "Tax Returns" ] }
        ];

        const RESULTS = [
            { name: "Normal Human", desc: "You are suspiciously normal. Are you a robot? Your results match 99.9% of the population. Boring, but stable." },
            { name: "Certified Oddball", desc: "You have your quirks, but you're still grounded. You're the person who makes parties interesting but doesn't start a cult." },
            { name: "Interdimensional Goblin", desc: "You are purely chaotic. Your logic is alien to us. You probably thrive in the dark and eat cereal with orange juice." },
            { name: "The Main Character", desc: "You're not just weird, you're cinematic. Everything you do feels like an indie movie plot. Stay legendary." }
        ];

        let currentQ = 0;
        let score = 0;

        function loadQ() {
            const q = QUESTIONS[currentQ];
            document.getElementById('q-text').textContent = q.q;
            document.getElementById('progress').style.width = `${(currentQ / QUESTIONS.length) * 100}%`;
            
            const optWrap = document.getElementById('options');
            optWrap.innerHTML = '';
            q.a.forEach((ans, i) => {
                const btn = document.createElement('button');
                btn.className = 'opt';
                btn.textContent = ans;
                btn.onclick = () => answer(i);
                optWrap.appendChild(btn);
            });
        }

        function answer(idx) {
            score += idx; // 0 (Weird) to 3 (Normalish) reversed logic based on answers? No, let's say 0 is weirdest.
            currentQ++;
            if(currentQ < QUESTIONS.length) {
                loadQ();
            } else {
                showRes();
            }
        }

        function showRes() {
            document.getElementById('quiz').style.display = 'none';
            document.getElementById('result').style.display = 'block';
            document.getElementById('progress').style.width = '100%';
            
            // Map score to results
            // Max score is 3*5 = 15 (Normal), Min is 0 (Weird)
            let resIdx = 0;
            if(score > 12) resIdx = 0; // Normal
            else if(score > 8) resIdx = 1; // Oddball
            else if(score > 4) resIdx = 3; // Main Character
            else resIdx = 2; // Goblin

            document.getElementById('res-type').textContent = RESULTS[resIdx].name;
            document.getElementById('res-desc').textContent = RESULTS[resIdx].desc;
        }

        loadQ();
    </script>
<script>
    if(/Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent)){
        document.body.innerHTML += '<a href="index.html" style="position:fixed;bottom:20px;right:20px;background:#000;color:#fff;padding:10px 20px;border-radius:30px;text-decoration:none;z-index:9999;border:1px solid #333;font-family:sans-serif;font-size:14px;">Back to Gallery</a>';
    }
</script>
</body>
</html>
