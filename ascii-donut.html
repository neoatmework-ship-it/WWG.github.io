<style>
.wwg-back-btn{position:fixed;top:20px;left:20px;width:44px;height:44px;background:rgba(10,10,15,0.7);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,0.1);border-radius:50%;display:flex;align-items:center;justify-content:center;color:#a78bfa;z-index:99999;transition:all 0.3s;text-decoration:none}

<a href="index.html" class="wwg-back-btn" title="Back to Gallery"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg></a>
<pre id="d"></pre>
<div class="info">The classic spinning donut algorithm · Pure math</div>
<script>
const pre=document.getElementById('d');
let A=0,B=0;
const W=80,H=40;

function frame(){
    const b=new Array(W*H).fill(' ');
    const z=new Array(W*H).fill(0);
    const chars='.,-~:;=!*#$@';

    for(let j=0;j<6.28;j+=0.07){
        for(let i=0;i<6.28;i+=0.02){
            const c=Math.sin(i),d=Math.cos(j),e=Math.sin(A),f=Math.sin(j),g=Math.cos(A);
            const h=d+2,D=1/(c*h*e+f*g+5);
            const l=Math.cos(i),m=Math.cos(B),n=Math.sin(B);
            const t=c*h*g-f*e;
            const x=(W/2+30*D*(l*h*m-t*n))|0;
            const y=(H/2+15*D*(l*h*n+t*m))|0;
            const o=x+W*y;
            const N=(8*(f*e-c*d*g+c*d*g+l*d*e+f*g))|0;

            if(y>0&&y<H&&x>0&&x<W&&D>z[o]){
                z[o]=D;
                b[o]=chars[Math.max(0,N)];
            }
        }
    }

    let output='';
    for(let k=0;k<W*H;k++){
        output+=k%W?b[k]:'\n';
    }
    pre.textContent=output;

    A+=0.04;
    B+=0.02;
    requestAnimationFrame(frame);
}
frame();
</script>
