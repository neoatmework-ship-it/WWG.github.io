<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snow Globe — Shake for Snow</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{background:linear-gradient(180deg,#0a0a20,#1a1a40);height:100vh;overflow:hidden;display:flex;align-items:center;justify-content:center;font-family:sans-serif}
        canvas{display:block;border-radius:50%;border:8px solid rgba(255,255,255,0.08);box-shadow:0 0 60px rgba(100,150,255,0.1),inset 0 0 60px rgba(100,150,255,0.05)}
        .info{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);color:rgba(255,255,255,0.35);font-size:0.75rem;text-align:center}
        .base{position:fixed;bottom:calc(50vh - 230px);left:50%;transform:translateX(-50%);width:280px;height:40px;background:linear-gradient(180deg,#5a3a1a,#3a2510);border-radius:0 0 20px 20px;box-shadow:0 5px 20px rgba(0,0,0,0.4)}
    </style>

    <!-- wwg-mobile-patch-start -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        canvas {
            max-width: 100vw;
            max-height: 100vh;
            touch-action: none;
        }
    </style>
    <!-- wwg-mobile-patch-end -->

</head>
<body>
<style>
.wwg-back-btn{position:fixed;top:20px;left:20px;width:44px;height:44px;background:rgba(10,10,15,0.7);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,0.1);border-radius:50%;display:flex;align-items:center;justify-content:center;color:#a78bfa;z-index:99999;transition:all 0.3s;text-decoration:none}
.wwg-back-btn:hover{background:rgba(167,139,250,0.2);border-color:rgba(167,139,250,0.4);color:#fff}
</style>
<a href="index.html" class="wwg-back-btn" title="Back to Gallery"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg></a>
<canvas id="c" width="400" height="400"></canvas>
<div class="base"></div>
<div class="info">Click or shake to make it snow ❄️</div>
<script>
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
const S=400,R=S/2;
const snowflakes=[];

for(let i=0;i<200;i++){
    snowflakes.push(createFlake());
}

function createFlake(){
    const angle=Math.random()*Math.PI*2;
    const dist=Math.random()*R*0.9;
    return{
        x:R+Math.cos(angle)*dist,
        y:R+Math.sin(angle)*dist,
        r:Math.random()*2.5+0.5,
        vy:Math.random()*0.3+0.1,
        vx:0,
        drift:Math.random()*0.5-0.25,
        opacity:Math.random()*0.6+0.4
    };
}

function shake(){
    for(const f of snowflakes){
        f.vy=-Math.random()*4-2;
        f.vx=(Math.random()-0.5)*6;
    }
}

canvas.addEventListener('click',shake);
canvas.addEventListener('touchstart',e=>{e.preventDefault();shake()},{passive:false});

// Device motion
if(window.DeviceMotionEvent){
    let lastShake=0;
    window.addEventListener('devicemotion',e=>{
        const acc=e.accelerationIncludingGravity;
        if(acc){
            const total=Math.abs(acc.x)+Math.abs(acc.y)+Math.abs(acc.z);
            if(total>30&&Date.now()-lastShake>500){
                lastShake=Date.now();
                shake();
            }
        }
    });
}

function draw(){
    ctx.clearRect(0,0,S,S);

    // Globe background
    ctx.save();
    ctx.beginPath();
    ctx.arc(R,R,R-4,0,Math.PI*2);
    ctx.clip();

    // Sky gradient
    const grad=ctx.createLinearGradient(0,0,0,S);
    grad.addColorStop(0,'#0a1628');
    grad.addColorStop(1,'#1a2a50');
    ctx.fillStyle=grad;
    ctx.fillRect(0,0,S,S);

    // Ground (snow)
    ctx.fillStyle='#e8e8f0';
    ctx.beginPath();
    ctx.moveTo(0,S*0.75);
    ctx.quadraticCurveTo(S*0.3,S*0.7,S*0.5,S*0.72);
    ctx.quadraticCurveTo(S*0.7,S*0.74,S,S*0.71);
    ctx.lineTo(S,S);ctx.lineTo(0,S);
    ctx.fill();

    // Tree
    ctx.fillStyle='#1a5a2a';
    ctx.beginPath();
    ctx.moveTo(R,S*0.3);
    ctx.lineTo(R-40,S*0.65);
    ctx.lineTo(R+40,S*0.65);
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(R,S*0.38);
    ctx.lineTo(R-32,S*0.58);
    ctx.lineTo(R+32,S*0.58);
    ctx.fill();
    ctx.fillStyle='#5a2a0a';
    ctx.fillRect(R-6,S*0.65,12,20);

    // Star on tree
    ctx.fillStyle='#ffdd44';
    ctx.beginPath();
    ctx.arc(R,S*0.3,5,0,Math.PI*2);
    ctx.fill();
    ctx.shadowColor='#ffdd44';ctx.shadowBlur=10;ctx.fill();ctx.shadowBlur=0;

    // Snowflakes
    for(const f of snowflakes){
        f.vy+=0.005;
        f.vx*=0.99;
        f.x+=f.drift+f.vx;
        f.y+=f.vy;

        // Keep inside circle
        const dx=f.x-R,dy=f.y-R;
        const dist=Math.sqrt(dx*dx+dy*dy);
        if(dist>R-10){
            const angle=Math.atan2(dy,dx);
            f.x=R+Math.cos(angle)*(R-12);
            f.y=R+Math.sin(angle)*(R-12);
            f.vx*=-0.3;f.vy*=-0.3;
        }

        // Settle at bottom
        if(f.y>S*0.7&&f.vy>0){f.vy*=0.8;if(Math.abs(f.vy)<0.05)f.vy=0}

        ctx.beginPath();
        ctx.arc(f.x,f.y,f.r,0,Math.PI*2);
        ctx.fillStyle=`rgba(255,255,255,${f.opacity})`;
        ctx.fill();
    }

    ctx.restore();

    // Globe glass effect
    ctx.beginPath();
    ctx.arc(R,R,R-4,0,Math.PI*2);
    ctx.strokeStyle='rgba(255,255,255,0.08)';
    ctx.lineWidth=4;
    ctx.stroke();

    // Reflection
    ctx.beginPath();
    ctx.arc(R-50,R-60,40,0,Math.PI*2);
    ctx.fillStyle='rgba(255,255,255,0.04)';
    ctx.fill();

    requestAnimationFrame(draw);
}
draw();
</script>

    <!-- wwg-mobile-patch-js-start -->
    <script>
        // Touch-to-Mouse Polyfill for legacy canvas interactives
        document.addEventListener('touchstart', function(e) {
            if(e.touches.length > 0) {
                const touch = e.touches[0];
                const mouseEvent = new MouseEvent('mousedown', {
                    clientX: touch.clientX,
                    clientY: touch.clientY,
                    bubbles: true,
                    cancelable: true
                });
                e.target.dispatchEvent(mouseEvent);
            }
        }, {passive: false});

        document.addEventListener('touchmove', function(e) {
            if(e.touches.length > 0) {
                const touch = e.touches[0];
                const mouseEvent = new MouseEvent('mousemove', {
                    clientX: touch.clientX,
                    clientY: touch.clientY,
                    bubbles: true,
                    cancelable: true
                });
                e.target.dispatchEvent(mouseEvent);
            }
        }, {passive: false});

        document.addEventListener('touchend', function(e) {
            const mouseEvent = new MouseEvent('mouseup', {
                bubbles: true,
                cancelable: true
            });
            e.target.dispatchEvent(mouseEvent);
        }, {passive: false});
    </script>
    <!-- wwg-mobile-patch-js-end -->

</body>
</html>
