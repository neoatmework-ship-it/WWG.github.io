<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE_ARCHIVE://HOLLOW_KNIGHT_WIKI_CLONE</title>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #050508;
            --card-bg: #0d0d12;
            --hk-white: #e8e8e8;
            --hk-gold: #d4af37;
            --hk-void: #000000;
            --hk-blue: #2c3e50;
            --hk-infected: #ff8c00;
        }

        body {
            margin: 0;
            padding: 0;
            background: var(--bg);
            color: var(--hk-white);
            font-family: 'Share Tech Mono', monospace;
            line-height: 1.4;
            overflow-x: hidden;
        }

        .header {
            background: linear-gradient(to bottom, #111, #050508);
            padding: 20px;
            text-align: center;
            border-bottom: 2px solid #1a1a1a;
            position: sticky;
            top: 0;
            z-index: 1000;
            backdrop-filter: blur(10px);
        }

        .header h1 {
            font-size: 1.8rem;
            margin: 0 0 15px 0;
            letter-spacing: 6px;
            color: var(--hk-gold);
            text-shadow: 0 0 15px rgba(212, 175, 55, 0.4);
        }

        .search-container {
            max-width: 600px;
            margin: 0 auto 15px;
        }

        #guide-search {
            width: 100%;
            padding: 12px 20px;
            background: #000;
            border: 1px solid #333;
            color: #fff;
            font-family: inherit;
            font-size: 1rem;
            outline: none;
            transition: 0.3s;
        }

        #guide-search:focus {
            border-color: var(--hk-gold);
        }

        .tab-menu {
            display: flex;
            justify-content: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .tab-btn {
            background: #0a0a0e;
            border: 1px solid #222;
            color: #555;
            padding: 6px 12px;
            cursor: pointer;
            font-size: 0.75rem;
            transition: 0.2s;
            text-transform: uppercase;
        }

        .tab-btn.active {
            border-color: var(--hk-gold);
            color: var(--hk-gold);
            background: #15151a;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        .archive-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid #1a1a1a;
            padding: 15px;
            transition: 0.3s ease;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
            animation: cardFade 0.4s ease-out backwards;
        }

        @keyframes cardFade {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .card:hover { 
            border-color: #444; 
            transform: translateY(-5px);
        }

        .card-label { 
            font-size: 0.6rem; 
            color: #555; 
            text-transform: uppercase; 
            margin-bottom: 5px;
        }

        .card-title { 
            font-size: 1.2rem; 
            margin: 0 0 10px 0; 
            color: #fff;
            letter-spacing: 1px;
        }

        .card-desc { 
            font-size: 0.8rem; 
            color: #888; 
            flex-grow: 1;
            font-style: italic;
        }

        .sprite-wrap {
            height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle, #050505 0%, #000 100%);
            margin: -15px -15px 15px -15px;
            border-bottom: 1px solid #1a1a1a;
        }

        .sprite-wrap img { 
            max-height: 90px; 
            max-width: 90%;
            object-fit: contain;
            transition: 0.3s;
        }

        .card:hover .sprite-wrap img { transform: scale(1.1); }

        .hunter-note {
            margin-top: 15px;
            padding-top: 10px;
            border-top: 1px dashed #222;
            font-size: 0.75rem;
            color: var(--hk-gold);
            opacity: 0.8;
        }

        .hidden { display: none !important; }
        .no-results { text-align: center; color: #444; grid-column: 1 / -1; padding: 100px 0; font-size: 1.5rem; }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #000; }
        ::-webkit-scrollbar-thumb { background: #1a1a1a; }
        ::-webkit-scrollbar-thumb:hover { background: var(--hk-gold); }

    </style>
</head>
<body>

    <div class="header">
        <h1>THE CONTINUUM ARCHIVE</h1>
        <div class="search-container">
            <input type="text" id="guide-search" placeholder="SEARCH HALLOWNEST ARCHIVES...">
        </div>
        <div class="tab-menu" id="tab-menu">
            <button class="tab-btn active" data-target="all">ALL ENTRIES</button>
            <button class="tab-btn" data-target="enemies">ENEMIES (160+)</button>
            <button class="tab-btn" data-target="bosses">GODS</button>
            <button class="tab-btn" data-target="charms">CHARMS</button>
            <button class="tab-btn" data-target="areas">KINGDOM</button>
        </div>
        <a href="index.html" style="position: absolute; right: 20px; top: 30px; color:#444; font-size:0.7rem; text-decoration:none;">← EXIT</a>
    </div>

    <div class="container">
        <div class="archive-grid" id="main-grid">
            <!-- Data will be populated here -->
        </div>
        <div id="no-results" class="no-results hidden">[NO_MATCHES_IN_THE_VOID]</div>
    </div>

    <script src="discovery.js"></script>
    <script>
        const data = {
            enemies: [
                { name: "Crawlid", desc: "A small, unthinking scavenger.", note: "I do not ignore. I slay.", img: "https://hollowknight.wiki/w/images/thumb/2/25/HJ_Crawlid.png/80px-HJ_Crawlid.png" },
                { name: "Vengefly", desc: "Aggressive, social avian predator.", note: "They scream for their brothers. Use it to find more.", img: "https://hollowknight.wiki/w/images/thumb/b/bd/HJ_Vengefly.png/80px-HJ_Vengefly.png" },
                { name: "Vengefly King", desc: "Monstrous leader of the flies.", note: "Strength depends on the size of the scream.", img: "https://hollowknight.wiki/w/images/thumb/8/89/HJ_Vengefly_King.png/80px-HJ_Vengefly_King.png" },
                { name: "Gruzzer", desc: "Bouncing, unthinking larva.", note: "A target for practice. Nothing more.", img: "https://hollowknight.wiki/w/images/thumb/4/46/HJ_Gruzzer.png/80px-HJ_Gruzzer.png" },
                { name: "Gruz Mother", desc: "Bloated, protective broodmother.", note: "Kill the source, and the young will follow.", img: "https://hollowknight.wiki/w/images/thumb/5/52/HJ_Gruz_Mother.png/80px-HJ_Gruz_Mother.png" },
                { name: "Tiktik", desc: "Basic armored crawler.", note: "Hard on top, soft underneath.", img: "https://hollowknight.wiki/w/images/thumb/5/50/HJ_Tiktik.png/80px-HJ_Tiktik.png" },
                { name: "Aspid Hunter", desc: "Agile, spitting predator.", note: "Nasty, spitting things. They hunt in packs.", img: "https://hollowknight.wiki/w/images/thumb/f/fe/HJ_Aspid_Hunter.png/80px-HJ_Aspid_Hunter.png" },
                { name: "Primal Aspid", desc: "Ancient nightmare of the Abyss/Kingdom's Edge.", note: "A test of reflexes and patience. Hate them.", img: "https://hollowknight.wiki/w/images/thumb/a/a2/HJ_Primal_Aspid.png/80px-HJ_Primal_Aspid.png" },
                { name: "Ooma", desc: "Explosive, volatile jellyfish.", note: "Respect the core or burn in its wake.", img: "https://hollowknight.wiki/w/images/thumb/0/08/HJ_Ooma.png/80px-HJ_Ooma.png" },
                { name: "Belfly", desc: "Suicidal bat-like screechers.", note: "A loud, dying noise. The only note for them.", img: "https://hollowknight.wiki/w/images/thumb/3/3a/HJ_Belfly.png/80px-HJ_Belfly.png" },
                { name: "Great Hopper", desc: "Massive, leaping insectoid hunter.", note: "Persisent. Never let them land above you.", img: "https://hollowknight.wiki/w/images/thumb/9/90/HJ_Great_Hopper.png/80px-HJ_Great_Hopper.png" },
                { name: "Crystal Crawler", desc: "Crystalline back, laser-firing eyes.", note: "A creature that uses the cave's light as a weapon.", img: "https://hollowknight.wiki/w/images/thumb/5/5d/HJ_Crystal_Crawler.png/80px-HJ_Crystal_Crawler.png" },
                { name: "Husk Sentry", desc: "Zombie-like guard of the Capitol.", note: "A puppet of light, still performing its duty.", img: "https://hollowknight.wiki/w/images/thumb/6/67/HJ_Husk_Sentry.png/80px-HJ_Husk_Sentry.png" },
                { name: "Great Husk Sentry", desc: "Heavily armored, towering guardian.", note: "Steel and plague. A formidable barrier.", img: "https://hollowknight.wiki/w/images/thumb/e/e0/HJ_Great_Husk_Sentry.png/80px-HJ_Great_Husk_Sentry.png" }
            ],
            bosses: [
                { name: "False Knight", desc: "Failed maggot in stolen armor.", note: "A shell without a soul.", img: "https://hollowknight.wiki/w/images/thumb/4/47/HJ_False_Knight.png/120px-HJ_False_Knight.png" },
                { name: "Hornet", desc: "The protector of truth and seals.", note: "Respect her needle. She has a reason.", img: "https://hollowknight.wiki/w/images/thumb/1/1d/HJ_Hornet.png/120px-HJ_Hornet.png" },
                { name: "Mantis Lords", desc: "Honorable tribal leaders.", note: "They bow to the strong, not the infected.", img: "https://hollowknight.wiki/w/images/thumb/4/4e/HJ_Mantis_Lords.png/120px-HJ_Mantis_Lords.png" },
                { name: "Watcher Knight", desc: "Automated droid protectors of the Dreamer.", note: "Five or six... it doesn't matter. They all fall.", img: "https://hollowknight.wiki/w/images/thumb/c/c8/Watcher_Knight_idle.png/120px-Watcher_Knight_idle.png" },
                { name: "The Radiance", desc: "The ancient light, the heart of the plague.", note: "Challenge the sun. Erase the light.", img: "https://hollowknight.wiki/w/images/thumb/3/3d/HJ_Radiance.png/120px-HJ_Radiance.png" },
                { name: "Absolute Radiance", desc: "The ultimate form of the light in Godhome.", note: "The summit of Godhome. The end of all paths.", img: "https://cdn.wikimg.net/en/hkwiki/images/thumb/6/68/Absolute_Radiance_Icon.png/120px-Absolute_Radiance_Icon.png" },
                { name: "Pure Vessel", desc: "The Vessel at its zenith.", note: "What could have been, if the void was truly pure.", img: "https://cdn.wikimg.net/en/hkwiki/images/thumb/b/b1/Pure_Vessel_Icon.png/120px-Pure_Vessel_Icon.png" },
                { name: "Nightmare King Grimm", desc: "Master of the Nightmare Heart.", note: "The troupe's final dance. A scarlet flame.", img: "https://cdn.wikimg.net/en/hkwiki/images/thumb/c/c3/Nightmare_King_Icon.png/120px-Nightmare_King_Icon.png" }
            ],
            charms: [
                { name: "Wayward Compass", desc: "Points the way.", note: "Essential for the lost.", img: "https://hollowknight.wiki/w/images/thumb/7/7d/Wayward_Compass.png/80px-Wayward_Compass.png" },
                { name: "Shaman Stone", desc: "Empowers spells.", note: "Ancient power within.", img: "https://hollowknight.wiki/w/images/thumb/5/5e/Shaman_Stone.png/80px-Shaman_Stone.png" },
                { name: "Quick Slash", desc: "Attack faster.", note: "Double the harvest.", img: "https://hollowknight.wiki/w/images/thumb/5/5f/Quick_Slash.png/80px-Quick_Slash.png" },
                { name: "Void Heart", desc: "Unifies the void.", note: "Cannot be unequipped.", img: "https://hollowknight.wiki/w/images/thumb/b/bb/Void_Heart.png/80px-Void_Heart.png" }
            ],
            areas: [
                { name: "Forgotten Crossroads", desc: "The heart of Hallownest.", img: "🗺️" },
                { name: "City of Tears", desc: "The rainy Capitol.", img: "🏙️" },
                { name: "The Abyss", desc: "Origin of the Void.", img: "🖤" }
            ]
        };

        const grid = document.getElementById('main-grid');
        const searchInput = document.getElementById('guide-search');
        const buttons = document.querySelectorAll('.tab-btn');
        const noRes = document.getElementById('no-results');

        let activeTab = 'all';

        function render() {
            grid.innerHTML = '';
            let visibleCount = 0;
            const query = searchInput.value.toLowerCase().trim();

            for (let category in data) {
                if (activeTab !== 'all' && activeTab !== category) continue;

                data[category].forEach(item => {
                    const matchesSearch = !query || item.name.toLowerCase().includes(query) || item.desc.toLowerCase().includes(query);
                    if (matchesSearch) {
                        const card = document.createElement('div');
                        card.className = 'card';
                        card.innerHTML = `
                            <div class="card-label">${category}</div>
                            <div class="sprite-wrap">
                                ${item.img.startsWith('http') ? `<img src="${item.img}" loading="lazy">` : `<span style="font-size: 3rem">${item.img}</span>`}
                            </div>
                            <h3 class="card-title">${item.name}</h3>
                            <p class="card-desc">${item.desc}</p>
                            ${item.note ? `<div class="hunter-note">"${item.note}"</div>` : ''}
                        `;
                        grid.appendChild(card);
                        visibleCount++;
                    }
                });
            }

            noRes.classList.toggle('hidden', visibleCount > 0);
        }

        searchInput.addEventListener('input', render);
        buttons.forEach(btn => {
            btn.addEventListener('click', () => {
                buttons.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                activeTab = btn.dataset.target;
                render();
            });
        });

        // Discovery Check
        const isSecretUnlocked = typeof Discovery !== 'undefined' && Discovery.isUnlocked('hollow-knight-guide');
        if (!isSecretUnlocked) {
            document.body.innerHTML = '<div style="height:100vh; background:#000; display:flex; flex-direction:column; align-items:center; justify-content:center; color:#fff; font-size:2rem; font-family:Share Tech Mono"> [VOID_UNAUTHORIZED] <br><span style="font-size:1rem; color:#444; margin-top:10px">DEFEAT THE RADIANCE TO UNLOCK THE ARCHIVE</span></div>';
            setTimeout(() => window.location.href = 'index.html', 2500);
        } else {
            render();
        }
    </script>
</body>
</html>
