<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HACKING_IN_PROGRESS | TermOS_Gate</title>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --green: #00ff41;
            --bg: #030303;
            --danger: #ff3333;
            --accent: #22d3ee;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: var(--bg);
            color: var(--green);
            font-family: 'Share Tech Mono', monospace;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        /* CRT Effects */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.2) 50%),
                        linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.03));
            background-size: 100% 3px, 4px 100%;
            z-index: 1000;
            pointer-events: none;
        }

        .container {
            width: 800px;
            height: 500px;
            border: 2px solid var(--green);
            background: rgba(0, 255, 65, 0.02);
            position: relative;
            box-shadow: 0 0 40px rgba(0, 255, 65, 0.1);
        }

        .header {
            padding: 10px 20px;
            background: var(--green);
            color: #000;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
        }

        .os-msg {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 0.8rem;
            opacity: 0.6;
        }

        /* Phase 1: Node Breach */
        #phase-1 { display: none; height: 100%; position: relative; }
        .node {
            position: absolute;
            width: 50px;
            height: 50px;
            border: 2px solid var(--danger);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 0.7rem;
            transition: 0.1s;
            animation: flicker 0.2s infinite;
        }
        .node:hover { background: var(--danger); color: #000; }
        @keyframes flicker { 0% { opacity: 0.5; } 50% { opacity: 1; } 100% { opacity: 0.5; } }

        /* Phase 2: Matrix Decrypt */
        #phase-2 { display: none; height: 100%; flex-direction: column; align-items: center; justify-content: center; }
        .matrix-word { font-size: 3rem; letter-spacing: 15px; margin-bottom: 30px; color: var(--accent); }
        #matrix-input {
            background: transparent;
            border: 1px solid var(--accent);
            color: var(--accent);
            padding: 10px;
            font-family: inherit;
            font-size: 1.5rem;
            text-align: center;
            outline: none;
        }

        /* Phase 3: Patching */
        #phase-3 { display: none; height: 100%; flex-direction: column; align-items: center; justify-content: center; }
        .needle-box { width: 400px; height: 40px; border: 1px solid var(--green); position: relative; background: #000; }
        .target-zone { position: absolute; height: 100%; width: 40px; background: var(--green); opacity: 0.3; left: 180px; }
        .needle { position: absolute; height: 100%; width: 4px; background: var(--green); left: 0; box-shadow: 0 0 15px var(--green); }

        .progress-bar {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            width: 400px;
            height: 4px;
            background: #222;
        }
        #progress-fill { height: 100%; width: 0%; background: var(--green); transition: 0.3s; }

        .overlay {
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.9);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }

        .btn {
            background: transparent;
            border: 2px solid var(--green);
            color: var(--green);
            padding: 10px 30px;
            font-family: inherit;
            cursor: pointer;
            margin-top: 20px;
            font-weight: bold;
        }
        .btn:hover { background: var(--green); color: #000; }

        .glitch-text { animation: glitch 1s infinite; }
        @keyframes glitch {
            0% { transform: translate(0); }
            20% { transform: translate(-2px, 2px); }
            40% { transform: translate(-2px, -2px); }
            60% { transform: translate(2px, 2px); }
            80% { transform: translate(2px, -2px); }
            100% { transform: translate(0); }
        }
    </style>
</head>
<body>

    <div class="os-msg">TermOS v2.0 // BOOT_INTERCEPTED // UID: 0x99A3</div>

    <div class="container">
        <div class="header">
            <span>NETWORK_GAUNTLET.exe</span>
            <span id="timer">45.00s</span>
        </div>

        <!-- Start Screen -->
        <div id="start-screen" class="overlay">
            <h2 class="glitch-text" style="font-size: 2rem;">SECURITY ENFORCED</h2>
            <p style="margin-top: 10px; opacity: 0.7;">Complete 3 phases to gain ROOT ACCESS.</p>
            <button class="btn" onclick="startGame()">INITIATE BYPASS</button>
        </div>

        <!-- Phase 1 -->
        <div id="phase-1">
            <div style="padding: 20px;">PHASE_01: NODE_BREACH // CLEAR 10 NODES</div>
            <div id="node-container" style="width: 100%; height: 80%; position: relative;"></div>
        </div>

        <!-- Phase 2 -->
        <div id="phase-2">
            <div style="margin-bottom: 20px;">PHASE_02: MATRIX_DECRYPT // TYPE THE CODE</div>
            <div class="matrix-word" id="matrix-word">ACCESS</div>
            <input type="text" id="matrix-input" autocomplete="off">
        </div>

        <!-- Phase 3 -->
        <div id="phase-3">
             <div style="margin-bottom: 20px;">PHASE_03: KERNEL_PATCH // ALIGN NEEDLE [SPACE]</div>
             <div class="needle-box">
                 <div class="target-zone" id="target-zone"></div>
                 <div class="needle" id="needle"></div>
             </div>
             <p style="margin-top: 20px; font-size: 0.8rem; opacity: 0.5;">HITS REMAINING: <span id="hits-left">3</span></p>
        </div>

        <div class="progress-bar">
            <div id="progress-fill"></div>
        </div>
    </div>

    <script src="discovery.js"></script>
    <script src="tracker.js"></script>
    <script>
        let currentPhase = 0;
        let time = 45;
        let timer;
        let phase1Nodes = 0;
        let phase2Words = 0;
        let phase3Hits = 3;
        let gameActive = false;

        function startGame() {
            document.getElementById('start-screen').style.display = 'none';
            gameActive = true;
            nextPhase();
            timer = setInterval(() => {
                time -= 0.01;
                document.getElementById('timer').textContent = time.toFixed(2) + 's';
                if (time <= 0 && gameActive) gameOver("TIME_EXPIRED");
            }, 10);
        }

        function nextPhase() {
            if (currentPhase >= 3) { win(); return; }
            currentPhase++;
            document.getElementById('progress-fill').style.width = ((currentPhase-1) / 3 * 100) + '%';
            
            // Hide all phases
            document.getElementById('phase-1').style.display = 'none';
            document.getElementById('phase-2').style.display = 'none';
            document.getElementById('phase-3').style.display = 'none';

            if (currentPhase === 1) startPhase1();
            else if (currentPhase === 2) startPhase2();
            else if (currentPhase === 3) startPhase3();
        }

        // Phase 1: Node Breach
        function startPhase1() {
            document.getElementById('phase-1').style.display = 'block';
            for(let i=0; i<10; i++) spawnNode();
        }

        function spawnNode() {
            const node = document.createElement('div');
            node.className = 'node';
            node.style.left = Math.random() * (750 - 50) + 'px';
            node.style.top = Math.random() * (400 - 50) + 'px';
            node.textContent = '0x' + Math.floor(Math.random()*256).toString(16).toUpperCase();
            node.onclick = () => {
                node.remove();
                phase1Nodes++;
                if (phase1Nodes >= 10) nextPhase();
            };
            document.getElementById('node-container').appendChild(node);
        }

        // Phase 2: Matrix Decrypt
        const words = ["OVERRIDE", "PROTOCOL", "FIREWALL", "RUNTIME", "ENCRYPT", "BYPASS"];
        function startPhase2() {
            document.getElementById('phase-2').style.display = 'flex';
            const input = document.getElementById('matrix-input');
            input.focus();
            newWord();
            input.oninput = (e) => {
                if (e.target.value.toUpperCase() === document.getElementById('matrix-word').textContent) {
                    phase2Words++;
                    e.target.value = '';
                    if (phase2Words >= 3) nextPhase();
                    else newWord();
                }
            };
        }
        function newWord() {
            document.getElementById('matrix-word').textContent = words[Math.floor(Math.random() * words.length)];
        }

        // Phase 3: Kernel Patch
        let needlePos = 0;
        let needleSpeed = 5;
        function startPhase3() {
            document.getElementById('phase-3').style.display = 'flex';
            const needle = document.getElementById('needle');
            const target = document.getElementById('target-zone');
            let targetPos = Math.random() * 350;
            target.style.left = targetPos + 'px';

            function moveNeedle() {
                if (!gameActive || currentPhase !== 3) return;
                needlePos += needleSpeed;
                if (needlePos > 396 || needlePos < 0) needleSpeed *= -1;
                needle.style.left = needlePos + 'px';
                requestAnimationFrame(moveNeedle);
            }
            moveNeedle();

            window.onkeydown = (e) => {
                if (e.code === 'Space') {
                    if (Math.abs(needlePos - targetPos) < 40) {
                        phase3Hits--;
                        document.getElementById('hits-left').textContent = phase3Hits;
                        if (phase3Hits <= 0) nextPhase();
                        else {
                            targetPos = Math.random() * 350;
                            target.style.left = targetPos + 'px';
                            needleSpeed *= 1.3;
                        }
                    } else {
                        gameOver("KERNEL_PANIC: ALIGNMENT_ERROR");
                    }
                }
            };
        }

        function gameOver(reason) {
            gameActive = false;
            clearInterval(timer);
            alert("ACCESS_DENIED: " + reason);
            window.location.href = 'index.html';
        }

        function win() {
            gameActive = false;
            clearInterval(timer);
            document.getElementById('progress-fill').style.width = '100%';
            
            // Register Secret & Telemetry
            if(window.Discovery) Discovery.unlock('the-terminal');
            if(window.WWG_BEACON) WWG_BEACON('terminal_gauntlet_complete');

            const overlay = document.createElement('div');
            overlay.className = 'overlay';
            overlay.innerHTML = `
                <h2 style="color: var(--green); font-size: 2.5rem;">ROOT_ACCESS_GRANTED</h2>
                <p style="margin-top: 10px;">Security protocols bypassed successfully.</p>
                <p style="margin-top: 20px; font-size: 0.8rem; opacity: 0.5;">REDIRECTING TO SYSTERM_OS...</p>
            `;
            document.body.appendChild(overlay);

            setTimeout(() => {
                window.location.href = 'retro-boot.html';
            }, 3000);
        }
    </script>

</body>
</html>
