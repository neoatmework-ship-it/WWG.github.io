<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E😴%3C/text%3E%3C/svg%3E">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boredom Button — Infinite Escape</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #000;
            --accent: #fff;
        }

        body {
            background: var(--bg);
            color: #fff;
            font-family: 'Space Grotesk', sans-serif;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .btn-bored {
            width: 250px;
            height: 250px;
            background: transparent;
            border: 4px solid var(--accent);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
        }

        .btn-bored:hover {
            transform: scale(1.1);
            box-shadow: 0 0 50px rgba(255, 255, 255, 0.2);
        }

        .btn-text {
            font-size: 1.5rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 4px;
        }

        .ripple {
            position: absolute;
            border: 1px solid #fff;
            border-radius: 50%;
            animation: ripple 2s infinite;
            pointer-events: none;
        }

        @keyframes ripple {
            0% { width: 250px; height: 250px; opacity: 0.5; }
            100% { width: 500px; height: 500px; opacity: 0; }
        }

        .back-link { position: fixed; top: 30px; left: 30px; color: #333; text-decoration: none; font-size: 0.8rem; }
    </style>
</head>
<body>

    <a href="index.html" class="back-link">← EXIT_BORDOM</a>

    <div class="ripple" style="animation-delay: 0s"></div>
    <div class="ripple" style="animation-delay: 1s"></div>

    <div class="btn-bored" onclick="goRandom()">
        <span class="btn-text">ESC</span>
    </div>

    <script src="discovery.js"></script>
    <script>
        Discovery.unlock('boredom-button');

        const SITES = [
            "https://en.wikipedia.org/wiki/Special:Random",
            "https://www.google.com/search?q=weird+internet+artifacts",
            "https://www.youtube.com/results?search_query=strange+history",
            "https://quickdraw.withgoogle.com/",
            "http://pixelsfighting.com/",
            "https://www.window-swap.com/",
            "https://pointerpointer.com/",
            "https://theuselessweb.com/"
        ];

        function goRandom() {
            const url = SITES[Math.floor(Math.random() * SITES.length)];
            window.open(url, '_blank');
        }
    </script>
<script>
    if(/Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent)){
        document.body.innerHTML += '<a href="index.html" style="position:fixed;bottom:20px;right:20px;background:#000;color:#fff;padding:10px 20px;border-radius:30px;text-decoration:none;z-index:9999;border:1px solid #333;font-family:sans-serif;font-size:14px;">Back to Gallery</a>';
    }
</script>
</body>
</html>
