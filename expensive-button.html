<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E💰%3C/text%3E%3C/svg%3E">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The $1,000,000 Button — Luxury Interactive</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Inter:wght@300;600&display=swap');

        :root {
            --gold: linear-gradient(135deg, #bf953f, #fcf6ba, #b38728, #fcf6ba, #aa771c);
            --bg: #050505;
        }

        body {
            margin: 0;
            background: var(--bg);
            color: #fff;
            font-family: 'Inter', sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        #expensive-container {
            text-align: center;
            padding: 60px;
            border: 1px solid rgba(191, 149, 63, 0.3);
            background: radial-gradient(circle at center, #1a1a1a 0%, #000 100%);
            border-radius: 4px;
            box-shadow: 0 50px 100px rgba(0, 0, 0, 0.8), 0 0 50px rgba(191, 149, 63, 0.1);
        }

        h1 {
            font-family: 'Cinzel', serif;
            letter-spacing: 8px;
            color: #d4af37;
            margin-bottom: 40px;
            text-transform: uppercase;
        }

        .gold-button {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background: var(--gold);
            border: none;
            cursor: pointer;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5), inset 0 0 20px rgba(0, 0, 0, 0.2);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
        }

        .gold-button::before {
            content: '';
            position: absolute;
            inset: -10px;
            border: 1px solid rgba(191, 149, 63, 0.5);
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.5; }
            100% { transform: scale(1.3); opacity: 0; }
        }

        .gold-button:hover {
            transform: scale(1.1) rotate(5deg);
            filter: brightness(1.2);
        }

        .gold-button:active {
            transform: scale(0.9);
        }

        .security-step {
            display: none;
            margin-top: 20px;
            font-size: 0.8rem;
            letter-spacing: 2px;
            color: #888;
        }

        .back-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            color: #d4af37;
            text-decoration: none;
            font-size: 0.7rem;
            letter-spacing: 3px;
            opacity: 0.5;
        }
    </style>
</head>
<body>
    <a href="index.html" class="back-btn">[ RETURN TO GALLERY ]</a>
    
    <div id="expensive-container">
        <h1>PREMIUM</h1>
        <button class="gold-button" id="btn"></button>
        <div id="status" style="margin-top: 30px; font-weight: 300; opacity: 0.7;">CLICK TO INITIALIZE LUXURY</div>
        <div class="security-step" id="step1">VERIFYING NET WORTH...</div>
        <div class="security-step" id="step2">AUTHENTICATING GOLD RESERVE...</div>
        <div class="security-step" id="step3">CONFIRMING ELITE ACCESS...</div>
    </div>

    <script>
        const btn = document.getElementById('btn');
        const status = document.getElementById('status');
        const steps = ['step1', 'step2', 'step3'];
        let currentStep = 0;

        btn.onclick = () => {
            if (currentStep >= steps.length) {
                alert("ACCESS GRANTED. YOU ARE NOW 0.0001% MORE LUXURIOUS.");
                location.reload();
                return;
            }

            btn.style.pointerEvents = 'none';
            btn.style.opacity = '0.5';
            status.textContent = 'PROCESSING...';
            
            const stepEl = document.getElementById(steps[currentStep]);
            stepEl.style.display = 'block';
            
            setTimeout(() => {
                stepEl.textContent += ' [ OK ]';
                stepEl.style.color = '#4ade80';
                currentStep++;
                btn.style.pointerEvents = 'all';
                btn.style.opacity = '1';
                status.textContent = `STEP ${currentStep} COMPLETE`;
            }, 1500);
        };
    </script>
</body>
</html>
