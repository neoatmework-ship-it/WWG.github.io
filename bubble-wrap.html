<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bubble Wrap</title>
    <meta name="description" content="Infinite digital bubble wrap. Pop to your heart's content.">
    <link rel="icon"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🫧%3C/text%3E%3C/svg%3E">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600&family=Inter:wght@400;500&display=swap"
        rel="stylesheet">
    <style>
        body {
            margin: 0;
            background: #cce7e8;
            color: #2d4c4f;
            font-family: 'Inter', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
            padding: 40px 20px;
            box-sizing: border-box;
        }

        .back-link {
            position: absolute;
            top: 20px;
            left: 20px;
            text-decoration: none;
            color: #2d4c4f;
            font-weight: 500;
            font-size: 0.9rem;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .header h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 3rem;
            margin: 0 0 10px;
            color: #1a3335;
            letter-spacing: -1px;
        }

        .score {
            font-size: 1.2rem;
            font-weight: 600;
            background: rgba(255, 255, 255, 0.4);
            padding: 8px 16px;
            border-radius: 20px;
            display: inline-block;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
        }

        .wrapper {
            background: rgba(255, 255, 255, 0.2);
            padding: 24px;
            border-radius: 24px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08), inset 0 0 20px rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(10px);
        }

        .grid {
            display: grid;
            gap: 8px;
            grid-template-columns: repeat(auto-fill, minmax(60px, 1fr));
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
            justify-content: center;
        }

        /* Shift every other row for a hex pattern look */
        .grid .row {
            display: flex;
            gap: 8px;
            justify-content: center;
            margin-bottom: 8px;
        }

        .grid .row:nth-child(even) {
            margin-left: 34px;
        }

        .bubble {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.9), rgba(200, 230, 235, 0.3));
            box-shadow:
                -2px -2px 10px rgba(255, 255, 255, 0.8),
                4px 4px 10px rgba(0, 0, 0, 0.1),
                inset -6px -6px 15px rgba(0, 0, 0, 0.05),
                inset 4px 4px 15px rgba(255, 255, 255, 0.9);
            cursor: pointer;
            position: relative;
            transition: all 0.1s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            flex-shrink: 0;
            overflow: hidden;
        }

        .bubble::after {
            /* Specular highlight */
            content: '';
            position: absolute;
            top: 10px;
            left: 12px;
            width: 15px;
            height: 10px;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 50%;
            transform: rotate(-30deg);
        }

        .bubble.popped {
            background: linear-gradient(135deg, rgba(200, 230, 235, 0.2), rgba(255, 255, 255, 0.4));
            box-shadow:
                inset 2px 2px 5px rgba(0, 0, 0, 0.05),
                inset -2px -2px 5px rgba(255, 255, 255, 0.5);
            transform: scale(0.95);
            cursor: default;
        }

        .bubble.popped::after {
            opacity: 0.3;
            width: 8px;
            height: 5px;
            top: 25px;
            left: 25px;
            transform: rotate(0);
        }

        .controls {
            margin-top: 40px;
            text-align: center;
        }

        .btn {
            border: none;
            background: #2d4c4f;
            color: #fff;
            padding: 12px 24px;
            border-radius: 12px;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 4px 15px rgba(45, 76, 79, 0.3);
            font-weight: 600;
        }

        .btn:hover {
            background: #1a3335;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(26, 51, 53, 0.4);
        }

        .btn:active {
            transform: translateY(0);
        }
    </style>
</head>

<body>
    <a href="index.html" class="back-link">← Gallery</a>

    <div class="header">
        <h1>Bubble Wrap</h1>
        <div class="score">Popped: <span id="score-val">0</span></div>
    </div>

    <div class="wrapper" id="wrap-container"></div>

    <div class="controls">
        <button class="btn" id="reset-btn">New Sheet 🫧</button>
    </div>

    <!-- Audio Synthesis -->
    <script>
        const actx = new (window.AudioContext || window.webkitAudioContext)();

        function playPop() {
            if (actx.state === 'suspended') actx.resume();

            const t = actx.currentTime;

            // Oscillator for the "thwack" body
            const osc = actx.createOscillator();
            const gain = actx.createGain();

            osc.connect(gain);
            gain.connect(actx.destination);

            // Pitch drop for the hollow pop
            osc.type = 'sine';
            const baseFreq = 600 + Math.random() * 200;
            osc.frequency.setValueAtTime(baseFreq, t);
            osc.frequency.exponentialRampToValueAtTime(100, t + 0.05);

            // Fast attack and decay
            gain.gain.setValueAtTime(0, t);
            gain.gain.linearRampToValueAtTime(1, t + 0.01);
            gain.gain.exponentialRampToValueAtTime(0.01, t + 0.08);

            osc.start(t);
            osc.stop(t + 0.1);

            // Added subtle noise "crinkle"
            const bufferSize = actx.sampleRate * 0.05; // 50ms
            const buffer = actx.createBuffer(1, bufferSize, actx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) { data[i] = Math.random() * 2 - 1; }

            const noise = actx.createBufferSource();
            noise.buffer = buffer;
            const noiseFilter = actx.createBiquadFilter();
            noiseFilter.type = 'highpass';
            noiseFilter.frequency.value = 5000;
            const noiseGain = actx.createGain();
            noiseGain.gain.setValueAtTime(0.1, t);
            noiseGain.gain.exponentialRampToValueAtTime(0.01, t + 0.04);

            noise.connect(noiseFilter);
            noiseFilter.connect(noiseGain);
            noiseGain.connect(actx.destination);
            noise.start(t);
        }

        let score = 0;
        const scoreEl = document.getElementById('score-val');
        const container = document.getElementById('wrap-container');

        function getSheetSize() {
            // roughly calculate how many bubbles fit nicely
            const w = Math.min(window.innerWidth - 80, 800);
            const bubblesPerRow = Math.floor(w / 68);
            return { cols: bubblesPerRow, rows: 8 };
        }

        function buildSheet() {
            container.innerHTML = '';
            const size = getSheetSize();

            for (let r = 0; r < size.rows; r++) {
                const rowEl = document.createElement('div');
                rowEl.className = 'row';
                const count = (r % 2 === 0) ? size.cols : size.cols - 1;

                for (let c = 0; c < count; c++) {
                    const b = document.createElement('div');
                    b.className = 'bubble';

                    // Interaction
                    const pop = (e) => {
                        e.preventDefault(); // prevent mouse/touch overlap
                        if (!b.classList.contains('popped')) {
                            b.classList.add('popped');
                            score++;
                            scoreEl.textContent = score;
                            playPop();
                        }
                    };

                    b.addEventListener('mousedown', pop);
                    b.addEventListener('touchstart', pop);
                    // allow sweeping pop
                    b.addEventListener('mouseenter', (e) => {
                        if (e.buttons === 1) pop(e);
                    });

                    rowEl.appendChild(b);
                }
                container.appendChild(rowEl);
            }
        }

        document.getElementById('reset-btn').addEventListener('click', () => {
            buildSheet();
        });

        // Initialize
        buildSheet();

        // Rebuild slightly on large resizes
        let resizeTimer;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(buildSheet, 200);
        });

    </script>

<style>
.wwg-nav {
    position: fixed;
    bottom: 20px;
    right: 20px;
    display: flex;
    gap: 10px;
    z-index: 99999;
}

    background: rgba(10, 10, 15, 0.7);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 255, 255, 0.1);
    color: #a78bfa;
    padding: 8px 16px;
    border-radius: 20px;
    font-family: 'Space Grotesk', sans-serif;
    font-size: 0.8rem;
    font-weight: 600;
    text-decoration: none;
    transition: all 0.3s ease;
}
.wwg-nav a:hover {
    background: rgba(167, 139, 250, 0.2);
    border-color: rgba(167, 139, 250, 0.4);
    color: #fff;
    transform: translateY(-2px);
    box-shadow: 0 4px 15px rgba(167, 139, 250, 0.3);
}
</style>
<script>
(function() {
    let sequence = '';
    const trigger = 'PNPNPN';
    document.querySelectorAll('.wwg-nav a').forEach(a => {
        a.addEventListener('click', (e) => {
            const type = a.innerText.includes('Prev') ? 'P' : 'N';
            sequence += type;
            if (sequence.length > 6) sequence = sequence.substring(1);
            if (sequence === trigger) {
                e.preventDefault();
                window.location.href = 'time-loop.html';
            }
        });
    });
})();
</script>

    <a href="dessert-oracle.html">← Prev</a>

</div>

</html>
