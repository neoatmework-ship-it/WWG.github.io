<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🗺️%3C/text%3E%3C/svg%3E">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Where Is This? — Global Photo Challenge</title>
    <link rel="stylesheet" href="style.css">
    <style>
        :root {
            --geo-accent: #10b981;
            --geo-bg: #0f172a;
        }

        body {
            margin: 0;
            padding: 0;
            background: var(--geo-bg);
            color: #fff;
            font-family: 'Outfit', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }

        .photo-container {
            width: 90%;
            max-width: 800px;
            height: 450px;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.1);
            position: relative;
            background: #1e293b;
        }

        #location-photo {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: opacity 0.5s;
        }

        .controls {
            margin-top: 30px;
            width: 90%;
            max-width: 800px;
            text-align: center;
        }

        .options-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-top: 20px;
        }

        .opt-btn {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 15px;
            border-radius: 12px;
            color: #fff;
            cursor: pointer;
            font-size: 1.1rem;
            font-weight: 600;
            transition: 0.2s;
        }

        .opt-btn:hover {
            background: var(--geo-accent);
            border-color: #34d399;
            transform: scale(1.02);
        }

        .opt-btn.correct { background: #10b981 !important; border-color: #34d399; }
        .opt-btn.wrong { background: #ef4444 !important; border-color: #f87171; }

        #score-board {
            position: fixed;
            top: 30px;
            right: 30px;
            text-align: right;
        }

        #score-val {
            font-size: 2.5rem;
            font-weight: 900;
            color: var(--geo-accent);
            text-shadow: 0 0 20px rgba(16, 185, 129, 0.3);
        }

        .back-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            color: rgba(255,255,255,0.4);
            text-decoration: none;
            font-size: 0.9rem;
        }

        .back-btn:hover { color: #fff; }

        #result-text {
            margin-top: 20px;
            font-size: 1.2rem;
            font-weight: bold;
            height: 24px;
            opacity: 0;
            transition: 0.3s;
        }

        .next-btn {
            background: #fff;
            color: #000;
            border: none;
            padding: 12px 30px;
            border-radius: 12px;
            font-weight: 800;
            cursor: pointer;
            margin-top: 20px;
            display: none;
            animation: fadeIn 0.5s forwards;
        }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        @media (max-width: 600px) {
            .photo-container { height: 250px; }
            .options-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <a href="index.html" class="back-btn">← Back to Gallery</a>
    
    <div id="score-board">
        <div id="score-val">0</div>
        <div style="font-size: 0.7rem; opacity: 0.5; letter-spacing: 2px;">SCORE</div>
    </div>

    <div class="photo-container">
        <img id="location-photo" src="" alt="Location">
    </div>

    <div class="controls">
        <h1 style="margin: 0; font-size: 1.8rem; letter-spacing: 1px;">Where was this taken?</h1>
        <div id="result-text">Correct! That's France.</div>
        
        <div class="options-grid" id="options">
            <!-- Dynamic Buttons -->
        </div>

        <button class="next-btn" id="next-btn" onclick="nextRound()">Continue Journey →</button>
    </div>

    <script src="discovery.js"></script>
    <script>
        const LOCATIONS = [
            { image: 'where-paris.png', country: 'France', options: ['France', 'Italy', 'Spain', 'Germany'] },
            { image: 'where-japan.png', country: 'Japan', options: ['Japan', 'China', 'South Korea', 'Taiwan'] },
            { image: 'where-australia.png', country: 'Australia', options: ['Australia', 'New Zealand', 'Singapore', 'UK'] },
            { image: 'where-nyc.png', country: 'USA', options: ['USA', 'Canada', 'Panama', 'Brazil'] }
        ];

        let currentIdx = -1;
        let score = 0;

        function nextRound() {
            currentIdx = (currentIdx + 1) % LOCATIONS.length;
            const loc = LOCATIONS[currentIdx];
            
            const img = document.getElementById('location-photo');
            img.style.opacity = 0;
            
            setTimeout(() => {
                img.src = loc.image;
                img.style.opacity = 1;
                
                const grid = document.getElementById('options');
                grid.innerHTML = '';
                
                // Shuffle options
                const opts = [...loc.options].sort(() => Math.random() - 0.5);
                
                opts.forEach(opt => {
                    const btn = document.createElement('button');
                    btn.className = 'opt-btn';
                    btn.textContent = opt;
                    btn.onclick = () => checkAnswer(opt, btn);
                    grid.appendChild(btn);
                });

                document.getElementById('result-text').style.opacity = 0;
                document.getElementById('next-btn').style.display = 'none';
            }, 500);
        }

        function checkAnswer(answer, btn) {
            const loc = LOCATIONS[currentIdx];
            const btns = document.querySelectorAll('.opt-btn');
            btns.forEach(b => b.disabled = true);

            const resText = document.getElementById('result-text');
            resText.style.opacity = 1;

            if (answer === loc.country) {
                btn.classList.add('correct');
                score += 100;
                document.getElementById('score-val').textContent = score;
                resText.textContent = `Correct! That is ${loc.country}.`;
                resText.style.color = '#10b981';
            } else {
                btn.classList.add('wrong');
                resText.textContent = `Wrong. That was ${loc.country}.`;
                resText.style.color = '#ef4444';
                
                btns.forEach(b => {
                    if (b.textContent === loc.country) b.classList.add('correct');
                });
            }

            document.getElementById('next-btn').style.display = 'inline-block';
        }

        // Initialize
        nextRound();
    </script>
</body>
</html>
