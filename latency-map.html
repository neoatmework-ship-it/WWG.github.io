<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LATENCY MAP — Global Ping Visualizer</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🌍%3C/text%3E%3C/svg%3E">
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #000805;
            --green: #00ff88;
            --dim: #003311;
            --mid: #00cc66;
            --panel: rgba(0, 40, 20, 0.4);
        }

        * { margin:0; padding:0; box-sizing:border-box; }

        body {
            background: var(--bg);
            color: var(--green);
            font-family: 'Share Tech Mono', monospace;
            min-height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        header {
            padding: 30px;
            text-align: center;
            z-index: 10;
        }

        h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.5rem;
            letter-spacing: 5px;
            text-shadow: 0 0 20px var(--green);
        }

        #map-container {
            flex: 1;
            position: relative;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        svg {
            width: 90%;
            height: 80%;
            filter: drop-shadow(0 0 10px rgba(0, 255, 136, 0.2));
        }

        .land {
            fill: #001a0a;
            stroke: var(--dim);
            stroke-width: 0.5;
        }

        .data-line {
            fill: none;
            stroke: var(--green);
            stroke-width: 1;
            stroke-dasharray: 1000;
            stroke-dashoffset: 1000;
            opacity: 0.3;
            transition: opacity 0.5s;
        }

        .data-line.active {
            animation: flow 2s linear infinite;
            opacity: 0.8;
        }

        @keyframes flow {
            from { stroke-dashoffset: 1000; }
            to { stroke-dashoffset: 0; }
        }

        .target-dot {
            fill: var(--green);
            filter: drop-shadow(0 0 5px var(--green));
        }

        .user-dot {
            fill: #fff;
            filter: drop-shadow(0 0 10px #fff);
        }

        #ui-panel {
            position: fixed;
            bottom: 30px;
            left: 30px;
            background: var(--panel);
            backdrop-filter: blur(10px);
            border: 1px solid var(--dim);
            padding: 20px;
            border-radius: 10px;
            width: 300px;
            z-index: 20;
        }

        .stat-row {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            margin-bottom: 10px;
            letter-spacing: 1px;
        }

        .stat-val { color: #fff; font-weight: bold; }

        .test-btn {
            width: 100%;
            padding: 12px;
            background: var(--green);
            border: none;
            color: #000;
            font-family: 'Orbitron', sans-serif;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            border-radius: 5px;
            transition: all 0.3s;
        }

        .test-btn:hover {
            filter: brightness(1.2);
            box-shadow: 0 0 20px var(--green);
        }

        .test-btn:disabled {
            background: var(--dim);
            color: var(--mid);
            cursor: not-allowed;
            box-shadow: none;
        }

        .log {
            position: fixed;
            bottom: 30px;
            right: 30px;
            text-align: right;
            font-size: 0.7rem;
            color: var(--dim);
        }

        .back-link {
            position: fixed;
            top: 20px;
            left: 20px;
            color: #555;
            text-decoration: none;
            font-size: 0.8rem;
        }
        .back-link:hover { color: var(--green); }
    </style>
</head>
<body>

    <a href="index.html" class="back-link">← DISCONNECT</a>

    <header>
        <h1>LATENCY MAP</h1>
        <p style="font-size: 0.7rem; color: var(--mid); letter-spacing: 2px; margin-top: 5px;">PROBING GLOBAL NODE LATENCY...</p>
    </header>

    <div id="map-container">
        <svg id="world-map" viewBox="0 0 1000 500">
            <!-- Background / Grid -->
            <path class="land" d="M10,10 L990,10 L990,490 L10,490 ZM50,50 L950,50 L950,450 L50,450 Z" />
            
            <!-- Nodes (Approximate Coordinates) -->
            <g id="nodes">
                <!-- Data lines will be injected here -->
            </g>
            
            <circle id="user-node" cx="500" cy="250" r="5" class="user-dot" style="display:none;"/>
        </svg>
    </div>

    <div id="ui-panel">
        <div class="stat-row"><span>LOCAL IP:</span> <span class="stat-val" id="ip-val">DETECTING...</span></div>
        <div class="stat-row"><span>AVG PING:</span> <span class="stat-val" id="avg-ping">-- ms</span></div>
        <div class="stat-row"><span>NODES:</span> <span class="stat-val" id="node-count">0/8 Online</span></div>
        <div style="height: 10px;"></div>
        <button class="test-btn" id="test-btn" onclick="runTest()">INITIATE TRACEROUTE</button>
    </div>

    <div class="log" id="log-display">TERMINAL READY // STANDING BY...</div>

    <script src="discovery.js"></script>
    <script>
        Discovery.unlock('latency-map');

        const NODES = [
            { id: 'USA-EAST', name: 'N. Virginia, US', x: 280, y: 160, testUrl: 'https://ec2.us-east-1.amazonaws.com/ping' },
            { id: 'USA-WEST', name: 'Oregon, US', x: 120, y: 140, testUrl: 'https://ec2.us-west-2.amazonaws.com/ping' },
            { id: 'EU-WEST', name: 'London, UK', x: 480, y: 120, testUrl: 'https://ec2.eu-west-2.amazonaws.com/ping' },
            { id: 'EU-CENT', name: 'Frankfurt, DE', x: 520, y: 125, testUrl: 'https://ec2.eu-central-1.amazonaws.com/ping' },
            { id: 'ASIA-EAST', name: 'Tokyo, JP', x: 880, y: 160, testUrl: 'https://ec2.ap-northeast-1.amazonaws.com/ping' },
            { id: 'ASIA-SOUTH', name: 'Mumbai, IN', x: 720, y: 220, testUrl: 'https://ec2.ap-south-1.amazonaws.com/ping' },
            { id: 'AUS-SOUTHEAST', name: 'Sydney, AU', x: 920, y: 400, testUrl: 'https://ec2.ap-southeast-2.amazonaws.com/ping' },
            { id: 'SA-EAST', name: 'São Paulo, BR', x: 350, y: 350, testUrl: 'https://ec2.sa-east-1.amazonaws.com/ping' }
        ];

        // Draw initial nodes
        const nodesGroup = document.getElementById('nodes');
        NODES.forEach(node => {
            const circle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
            circle.setAttribute("cx", node.x);
            circle.setAttribute("cy", node.y);
            circle.setAttribute("r", 3);
            circle.setAttribute("class", "target-dot");
            circle.setAttribute("id", `dot-${node.id}`);
            nodesGroup.appendChild(circle);
        });

        async function detectIP() {
            try {
                const res = await fetch('https://api.ipify.org?format=json');
                const data = await res.json();
                document.getElementById('ip-val').textContent = data.ip;
            } catch(e) {
                document.getElementById('ip-val').textContent = 'ANONYMOUS';
            }
        }
        detectIP();

        async function pingNode(node) {
            const start = Date.now();
            try {
                // Using a cache-busting fetching of a small resource
                await fetch(node.testUrl, { mode: 'no-cors', cache: 'no-cache' });
                return Date.now() - start;
            } catch(e) {
                return 999;
            }
        }

        async function runTest() {
            const btn = document.getElementById('test-btn');
            btn.disabled = true;
            btn.textContent = "PROBING...";

            const log = document.getElementById('log-display');
            let totalLatency = 0;
            let count = 0;

            // Simple "user" position based on timezone as a fallback for pure visual fun
            const timezoneOffset = new Date().getTimezoneOffset();
            const userX = 500 - (timezoneOffset / 1440) * 1000;
            const userY = 250;
            const userDot = document.getElementById('user-node');
            userDot.setAttribute('cx', userX);
            userDot.setAttribute('cy', userY);
            userDot.style.display = 'block';

            for (let node of NODES) {
                log.textContent = `PINGING ${node.id} [${node.name}]...`;
                
                // Draw path line
                const line = document.createElementNS("http://www.w3.org/2000/svg", "path");
                const d = `M${userX},${userY} Q${(userX + node.x)/2},${Math.min(userY, node.y)-50} ${node.x},${node.y}`;
                line.setAttribute("d", d);
                line.setAttribute("class", "data-line");
                nodesGroup.appendChild(line);

                const latency = await pingNode(node);
                
                if (latency < 1000) {
                    line.classList.add('active');
                    totalLatency += latency;
                    count++;
                }
                
                document.getElementById('avg-ping').textContent = `${Math.round(totalLatency / (count || 1))} ms`;
                document.getElementById('node-count').textContent = `${count}/${NODES.length} Online`;
                
                await new Promise(r => setTimeout(r, 200));
            }

            log.textContent = "GLOBAL HANDSHAKE COMPLETE.";
            btn.textContent = "RE-SCAN NETWORK";
            btn.disabled = false;
        }
    </script>
    <script>
        if(/Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent)){
            document.body.innerHTML += '<a href="index.html" style="position:fixed;bottom:20px;right:20px;background:#000;color:#fff;padding:10px 20px;border-radius:30px;text-decoration:none;z-index:9999;border:1px solid #333;font-family:sans-serif;font-size:14px;">Back to Gallery</a>';
        }
    </script>
</body>
</html>
