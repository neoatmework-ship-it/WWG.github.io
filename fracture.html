<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fracture</title>
    <link rel="icon"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🔨%3C/text%3E%3C/svg%3E">
    <style>
        body {
            margin: 0;
            background: #111;
            overflow: hidden;
            height: 100vh;
            cursor: crosshair;
        }

        .glass {
            position: absolute;
            inset: 0;
            background: rgba(255, 255, 255, 0.05);
            filter: drop-shadow(0 0 10px rgba(0, 0, 0, 0.5));
            pointer-events: none;
        }

        .text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #333;
            font-family: sans-serif;
            font-size: 5rem;
            font-weight: bold;
            letter-spacing: 10px;
            z-index: -1;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            pointer-events: none;
            mix-blend-mode: screen;
        }
    </style>
</head>

<body>
    <div class="text">FRAGILE</div>
    <div class="glass"></div>
    <canvas id="c"></canvas>

    <script src="discovery.js"></script>
    <script>
        Discovery.unlock('fracture');

        const canvas = document.getElementById('c');
        const ctx = canvas.getContext('2d');
        let w = canvas.width = window.innerWidth;
        let h = canvas.height = window.innerHeight;

        const cracks = [];

        window.addEventListener('click', e => {
            const numCracks = Math.ceil(Math.random() * 5 + 5);
            for (let i = 0; i < numCracks; i++) {
                cracks.push({
                    x: e.clientX,
                    y: e.clientY,
                    angle: Math.random() * Math.PI * 2,
                    length: 0,
                    maxLength: Math.random() * 500 + 100,
                    speed: Math.random() * 20 + 10,
                    branches: 0 // track splits
                });
            }

            // Draw bullet hole
            ctx.beginPath();
            ctx.arc(e.clientX, e.clientY, 5, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(255,255,255,0.8)';
            ctx.fill();
        });

        function draw() {
            // Draw cracks
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
            ctx.lineWidth = 1.5;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'miter';

            for (let i = 0; i < cracks.length; i++) {
                const c = cracks[i];
                if (c.length >= c.maxLength) continue;

                // Old position
                const startX = c.x + Math.cos(c.angle) * c.length;
                const startY = c.y + Math.sin(c.angle) * c.length;

                // Jagged path
                if (Math.random() > 0.8) c.angle += (Math.random() - 0.5) * 0.5;

                c.length += c.speed;

                // New position
                const endX = c.x + Math.cos(c.angle) * c.length;
                const endY = c.y + Math.sin(c.angle) * c.length;

                ctx.beginPath();
                ctx.moveTo(startX, startY);
                ctx.lineTo(endX, endY);
                ctx.stroke();

                // Small chance to split (branching cracks)
                if (Math.random() > 0.95 && c.branches < 3 && c.length < c.maxLength * 0.8) {
                    c.branches++;
                    cracks.push({
                        x: endX,
                        y: endY,
                        angle: c.angle + (Math.random() > 0.5 ? 1 : -1) * (Math.random() * 0.5 + 0.2),
                        length: 0,
                        maxLength: c.maxLength - c.length,
                        speed: c.speed * 0.8,
                        branches: c.branches
                    });
                }
            }

            requestAnimationFrame(draw);
        }
        draw();

        window.addEventListener('resize', () => {
            w = canvas.width = window.innerWidth;
            h = canvas.height = window.innerHeight;
            // Clears glass on resize, which actually fits the fragile theme
        });
    </script>
</body>

</html>
