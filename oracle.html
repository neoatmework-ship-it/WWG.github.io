<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oracle</title>
    <link rel="icon"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🔮%3C/text%3E%3C/svg%3E">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&display=swap');

        body {
            margin: 0;
            background: #050110;
            color: #d4c4f0;
            font-family: 'Cinzel', serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }

        .orb {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #a275f0, #361475);
            box-shadow: 0 0 50px #5f24cc, inset -20px -20px 40px rgba(0, 0, 0, 0.5);
            margin-bottom: 40px;
            position: relative;
            cursor: pointer;
            animation: float 4s ease-in-out infinite;
        }

        .orb::after {
            content: '';
            position: absolute;
            top: 10%;
            left: 15%;
            width: 40px;
            height: 20px;
            background: rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            transform: rotate(-30deg);
        }

        .prophecy {
            max-width: 600px;
            text-align: center;
            font-size: 1.5rem;
            letter-spacing: 2px;
            line-height: 1.8;
            min-height: 100px;
            opacity: 0;
            transition: opacity 2s;
        }

        @keyframes float {
            50% {
                transform: translateY(-20px);
                box-shadow: 0 20px 60px #5f24cc, inset -20px -20px 40px rgba(0, 0, 0, 0.5);
            }
        }

        .hint {
            margin-top: 40px;
            font-size: 0.8rem;
            color: #5f24cc;
            letter-spacing: 4px;
        }
    </style>

    <!-- wwg-mobile-patch-start -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        canvas {
            max-width: 100vw;
            max-height: 100vh;
            touch-action: none;
        }
    </style>
    <!-- wwg-mobile-patch-end -->

</head>

<body>
    <div class="orb" id="orb"></div>
    <div class="prophecy" id="out">The fog is thick...</div>
    <div class="hint">SEEK THE ORACLE</div>

    <script src="discovery.js"></script>
    <script>
        Discovery.unlock('oracle');

        const fortunes = [
            "A shift in gravity precedes a grand revelation.",
            "The truth you seek is buried where the numbers glitch.",
            "Water and sand remember what the clouds forgot.",
            "Three clicks upon the darkest void will open the door.",
            "Hold Shift while the world resizes to see underneath.",
            "The terminal awaits a familiar pin code."
        ];

        document.getElementById('orb').addEventListener('click', () => {
            const out = document.getElementById('out');
            out.style.opacity = '0';
            setTimeout(() => {
                out.innerText = fortunes[Math.floor(Math.random() * fortunes.length)];
                out.style.opacity = '1';
            }, 1000);
        });
    </script>

    <!-- wwg-mobile-patch-js-start -->
    <script>
        // Touch-to-Mouse Polyfill for legacy canvas interactives
        document.addEventListener('touchstart', function(e) {
            if(e.touches.length > 0) {
                const touch = e.touches[0];
                const mouseEvent = new MouseEvent('mousedown', {
                    clientX: touch.clientX,
                    clientY: touch.clientY,
                    bubbles: true,
                    cancelable: true
                });
                e.target.dispatchEvent(mouseEvent);
            }
        }, {passive: false});

        document.addEventListener('touchmove', function(e) {
            if(e.touches.length > 0) {
                const touch = e.touches[0];
                const mouseEvent = new MouseEvent('mousemove', {
                    clientX: touch.clientX,
                    clientY: touch.clientY,
                    bubbles: true,
                    cancelable: true
                });
                e.target.dispatchEvent(mouseEvent);
            }
        }, {passive: false});

        document.addEventListener('touchend', function(e) {
            const mouseEvent = new MouseEvent('mouseup', {
                bubbles: true,
                cancelable: true
            });
            e.target.dispatchEvent(mouseEvent);
        }, {passive: false});
    </script>
    <!-- wwg-mobile-patch-js-end -->

</body>

</html>
