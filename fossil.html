<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fossil</title>
    <link rel="icon"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🦖%3C/text%3E%3C/svg%3E">
    <style>
        body {
            margin: 0;
            background: #3b2f2f;
            overflow: hidden;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .bone {
            position: absolute;
            z-index: 1;
            opacity: 0.8;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            z-index: 5;
            cursor: crosshair;
        }

        .hint {
            position: absolute;
            top: 30px;
            font-family: monospace;
            color: #fff;
            z-index: 10;
            letter-spacing: 5px;
            pointer-events: none;
        }
    </style>

    <!-- wwg-mobile-patch-start -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        canvas {
            max-width: 100vw;
            max-height: 100vh;
            touch-action: none;
        }
    </style>
    <!-- wwg-mobile-patch-end -->

</head>

<body>
    <!-- Simple CSS/SVG T-Rex Skull -->
    <div class="bone" style="width: 300px; height: 150px; background: url('data:image/svg+xml;utf8,<svg xmlns="
        http://www.w3.org/2000/svg" viewBox="0 0 200 100">
        <path d="M10,50 Q40,30 100,30 T180,60 Q150,90 100,80 T30,90 Z" fill="%23ddd" />
        <path d="M130,50 Q140,50 140,60 Q130,60 130,50 Z" fill="%233b2f2f" />
        <path d="M20,70 L25,80 L35,65 M40,65 L45,80 L55,65 M60,65 L65,75 L75,60" stroke="%233b2f2f" stroke-width="3"
            fill="none" /></svg>') no-repeat center; filter: drop-shadow(5px 5px 10px rgba(0,0,0,0.5)); transform:
        rotate(-10deg);">
    </div>

    <div class="hint">EXCAVATE THE REMAINS</div>
    <canvas id="c"></canvas>

    <script src="discovery.js"></script>
    <script>
        Discovery.unlock('fossil');

        const canvas = document.getElementById('c');
        const ctx = canvas.getContext('2d');
        let w = canvas.width = window.innerWidth;
        let h = canvas.height = window.innerHeight;

        // Fill canvas with "dirt"
        ctx.fillStyle = '#654321';
        ctx.fillRect(0, 0, w, h);

        // Add dirt texture
        for (let i = 0; i < 10000; i++) {
            const x = Math.random() * w;
            const y = Math.random() * h;
            ctx.fillStyle = Math.random() > 0.5 ? '#5c3a18' : '#734d26';
            ctx.fillRect(x, y, Math.random() * 5, Math.random() * 5);
        }

        let isDigging = false;

        // Brush properties (globalCompositeOperation = destination-out acts as eraser)
        ctx.globalCompositeOperation = 'destination-out';

        function dig(x, y) {
            ctx.beginPath();
            ctx.arc(x, y, 40, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(0,0,0,1)';
            ctx.fill();
        }

        window.addEventListener('mousedown', e => { isDigging = true; dig(e.clientX, e.clientY); });
        window.addEventListener('mouseup', () => isDigging = false);
        window.addEventListener('mousemove', e => {
            if (isDigging) dig(e.clientX, e.clientY);
        });

        // Resize will redraw dirt and cover it back up
        window.addEventListener('resize', () => {
            w = canvas.width = window.innerWidth;
            h = canvas.height = window.innerHeight;
            ctx.globalCompositeOperation = 'source-over';
            ctx.fillStyle = '#654321';
            ctx.fillRect(0, 0, w, h);
            ctx.globalCompositeOperation = 'destination-out';
        });
    </script>

    <!-- wwg-mobile-patch-js-start -->
    <script>
        // Touch-to-Mouse Polyfill for legacy canvas interactives
        document.addEventListener('touchstart', function(e) {
            if(e.touches.length > 0) {
                const touch = e.touches[0];
                const mouseEvent = new MouseEvent('mousedown', {
                    clientX: touch.clientX,
                    clientY: touch.clientY,
                    bubbles: true,
                    cancelable: true
                });
                e.target.dispatchEvent(mouseEvent);
            }
        }, {passive: false});

        document.addEventListener('touchmove', function(e) {
            if(e.touches.length > 0) {
                const touch = e.touches[0];
                const mouseEvent = new MouseEvent('mousemove', {
                    clientX: touch.clientX,
                    clientY: touch.clientY,
                    bubbles: true,
                    cancelable: true
                });
                e.target.dispatchEvent(mouseEvent);
            }
        }, {passive: false});

        document.addEventListener('touchend', function(e) {
            const mouseEvent = new MouseEvent('mouseup', {
                bubbles: true,
                cancelable: true
            });
            e.target.dispatchEvent(mouseEvent);
        }, {passive: false});
    </script>
    <!-- wwg-mobile-patch-js-end -->

</body>

</html>
