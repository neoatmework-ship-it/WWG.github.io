<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E😑%3C/text%3E%3C/svg%3E">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Boringest Website — Milestone 100</title>
    <style>
        body {
            margin: 0;
            background: #dcdcdc;
            color: #444;
            font-family: serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }
        #clock { font-size: 1.2rem; margin-top: 20px; color: #888; }
        .beige-note {
            background: #f5f5dc;
            padding: 2px 10px;
            margin-top: 100px;
            font-size: 0.8rem;
            border: 1px solid #ccc;
        }
        .back-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            color: #666;
            text-decoration: none;
            font-size: 0.8rem;
        }
    </style>
</head>
<body>
    <a href="index.html" class="back-btn">Go back</a>
    
    <h1 style="font-weight: normal;">This is a website.</h1>
    <p>Nothing is happening right now.</p>
    
    <div id="clock">Current Time: --:--:--</div>

    <div class="container">
        <h1>This page is intentionally boring.</h1>
        Stat: Currently 102 sites in the gallery. This is one of them.
    </div>

    <script>
        function update() {
            const now = new Date();
            document.getElementById('clock').textContent = 'Current Time: ' + now.toLocaleTimeString();
        }
        setInterval(update, 1000);
        update();

        // Occasionally change the background to a slightly different grey
        setInterval(() => {
            const shades = ['#dcdcdc', '#d8d8d8', '#dfdfdf'];
            document.body.style.backgroundColor = shades[Math.floor(Math.random() * shades.length)];
        }, 10000);
    </script>
</body>
</html>
