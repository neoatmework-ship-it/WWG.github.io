<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crystal Comet | WWG</title>
    <link rel="stylesheet" href="sprite-arcade.css">
</head>
<body class="arcade-game">
    <canvas id="game" class="game-canvas"></canvas>
    <a href="index.html" class="wwg-back-btn" title="Back to Gallery">&larr;</a>
    <header class="game-hud">
        <div class="game-title">
            <h1>Crystal Comet</h1>
            <p>Steer the comet trail, collect bright crystals, and blast through storm clouds.</p>
        </div>
        <div class="stat-bar">
            <div class="stat">Score <span data-score>0</span></div>
            <div class="stat">Lives <span data-lives>3</span></div>
            <div class="stat">Sector <span data-level>1</span></div>
            <button class="restart-btn" data-restart>Restart</button>
        </div>
    </header>
    <div class="game-toast" data-toast></div>
    <script src="sprite-games.js"></script>
    <script>WWGSpriteGames.crystalComet("game");</script>
</body>
</html>
