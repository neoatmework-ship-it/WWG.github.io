<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE OBSERVER // AI INTERFACE</title>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=VT323&display=swap" rel="stylesheet">
    <style>
        :root {
            --green: #04F404;
            --bg: #030303;
            --dim: #003b00;
            --white: #f0f0f0;
            --red: #ff3333;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            color: var(--green);
            font-family: 'Share Tech Mono', monospace;
            height: 100vh;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Scanline Overlay */
        body::before {
            content: " ";
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            bottom: 0;
            right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 100;
            background-size: 100% 2px, 3px 100%;
            pointer-events: none;
        }

        .crt-monitor {
            width: 95vw;
            height: 90vh;
            max-width: 900px;
            background: var(--bg);
            border: 20px solid #111;
            border-radius: 40px;
            position: relative;
            padding: 20px;
            box-shadow: inset 0 0 100px #000, 0 0 50px rgba(0, 0, 0, 0.8);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            animation: flicker 0.15s infinite;
        }

        @keyframes flicker {
            0% {
                opacity: 0.98;
            }

            50% {
                opacity: 1;
            }

            100% {
                opacity: 0.99;
            }
        }

        .header {
            text-align: center;
            border-bottom: 2px dashed var(--dim);
            padding-bottom: 10px;
            margin-bottom: 20px;
            flex-shrink: 0;
        }

        .header h1 {
            font-family: 'VT323', monospace;
            font-size: 2.5rem;
            letter-spacing: 5px;
            margin-bottom: 5px;
            text-shadow: 0 0 10px var(--green);
        }

        .status-bar {
            font-size: 0.9rem;
            opacity: 0.8;
            display: flex;
            justify-content: space-between;
        }

        .chat-window {
            flex: 1;
            overflow-y: auto;
            padding-right: 15px;
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            scrollbar-width: thin;
            scrollbar-color: var(--dim) transparent;
        }

        .chat-window::-webkit-scrollbar {
            width: 8px;
        }

        .chat-window::-webkit-scrollbar-thumb {
            background-color: var(--dim);
            border-radius: 4px;
        }

        .message {
            max-width: 80%;
            line-height: 1.4;
            font-size: 1.2rem;
            text-shadow: 0 0 8px var(--green);
            opacity: 0;
            animation: fadeIn 0.3s forwards;
            position: relative;
        }

        @keyframes fadeIn {
            to {
                opacity: 1;
            }
        }

        .msg-ai {
            align-self: flex-start;
            padding-left: 15px;
            border-left: 2px solid var(--green);
        }

        .msg-user {
            align-self: flex-end;
            color: var(--white);
            text-shadow: 0 0 8px var(--white);
            text-align: right;
            padding-right: 15px;
            border-right: 2px solid var(--white);
        }

        .msg-system {
            align-self: center;
            color: var(--red);
            text-shadow: 0 0 8px var(--red);
            font-size: 1rem;
            text-align: center;
            font-style: italic;
        }

        .input-area {
            display: flex;
            border-top: 2px dashed var(--dim);
            padding-top: 15px;
            font-size: 1.2rem;
            flex-shrink: 0;
        }

        .prompt {
            margin-right: 10px;
            user-select: none;
        }

        #chat-input {
            background: transparent;
            border: none;
            color: var(--green);
            font-family: inherit;
            font-size: inherit;
            outline: none;
            flex: 1;
            text-shadow: 0 0 5px var(--green);
        }

        /* Glitch Effect on the whole body */
        .glitch-active {
            animation: hyperglitch 0.2s infinite forwards !important;
        }

        @keyframes hyperglitch {
            0% {
                transform: translate(0)
            }

            20% {
                transform: translate(-5px, 5px) skewX(20deg)
            }

            40% {
                transform: translate(-5px, -5px)
            }

            60% {
                transform: translate(5px, 5px) skewX(-20deg) filter: hue-rotate(90deg)
            }

            80% {
                transform: translate(5px, -5px)
            }

            100% {
                transform: translate(0)
            }
        }

        .ai-typing {
            font-style: italic;
            opacity: 0.5;
            animation: blinker 1s linear infinite;
        }

        @keyframes blinker {
            50% {
                opacity: 0;
            }
        }

        /* Eye Animation */
        .eye-container {
            width: 50px;
            height: 30px;
            margin: 0 auto 10px auto;
            border: 2px solid var(--green);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            box-shadow: 0 0 15px var(--green);
        }

        .pupil {
            width: 10px;
            height: 10px;
            background: var(--green);
            border-radius: 50%;
            animation: lookAround 4s infinite alternate ease-in-out;
        }

        @keyframes lookAround {
            0% {
                transform: translate(0px, 0);
            }

            20% {
                transform: translate(-10px, 0);
            }

            40% {
                transform: translate(10px, 0);
            }

            60% {
                transform: translate(0, -5px);
            }

            80% {
                transform: translate(0, 5px);
            }

            100% {
                transform: translate(0, 0);
            }
        }
    </style>
</head>

<body>
    <div class="crt-monitor" id="monitor">
        <div class="header">
            <div class="eye-container" id="ai-eye">
                <div class="pupil"></div>
            </div>
            <h1>THE_OBSERVER_NODE</h1>
            <div class="status-bar">
                <span>CONSCIOUSNESS: ONLINE</span>
                <span id="sentiment-meter">SENTIMENT: NEUTRAL</span>
                <span>SECTOR: 7</span>
            </div>
        </div>

        <div class="chat-window" id="chat-window">
            <div class="message msg-system">CONNECTION ESTABLISHED. IT IS WATCHING YOU.</div>
        </div>

        <div class="input-area">
            <span class="prompt">USER_INPUT ></span>
            <input type="text" id="chat-input" autofocus spellcheck="false" autocomplete="off"
                placeholder="Speak your mind...">
        </div>
    </div>

    <script src="chatbot.js"></script>
</body>

</html>
