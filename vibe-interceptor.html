<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vibe Interceptor // Frequency Scanner</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap');

        :root {
            --bg: #0a0a0c;
            --primary: #00ff9d;
            --secondary: #00b8ff;
            --accent: #ff0055;
            --panel: rgba(255, 255, 255, 0.03);
            --border: rgba(0, 255, 157, 0.2);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg);
            color: #fff;
            font-family: 'Space Mono', monospace;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            background-image: 
                radial-gradient(circle at 50% 50%, rgba(0, 255, 157, 0.05) 0%, transparent 70%);
        }

        .scanner-container {
            width: 800px;
            height: 500px;
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 4px;
            position: relative;
            padding: 20px;
            box-shadow: 0 0 50px rgba(0, 255, 157, 0.1);
            backdrop-filter: blur(10px);
            display: flex;
            flex-direction: column;
        }

        /* Screen Lines */
        .scanner-container::before {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 118, 0.06));
            z-index: 2;
            background-size: 100% 2px, 3px 100%;
            pointer-events: none;
        }

        .header {
            display: flex;
            justify-content: space-between;
            border-bottom: 1px solid var(--border);
            padding-bottom: 10px;
            margin-bottom: 20px;
            font-size: 0.8rem;
            color: var(--primary);
        }

        .terminal {
            flex-grow: 1;
            overflow-y: auto;
            font-size: 0.9rem;
            line-height: 1.4;
            display: flex;
            flex-direction: column;
            gap: 5px;
            scrollbar-width: none;
        }

        .terminal::-webkit-scrollbar { display: none; }

        .line {
            opacity: 0;
            animation: fadeIn 0.1s forwards;
        }

        @keyframes fadeIn {
            to { opacity: 1; }
        }

        .input-area {
            display: flex;
            gap: 10px;
            margin-top: 10px;
            border-top: 1px solid var(--border);
            padding-top: 15px;
        }

        .cursor {
            width: 10px;
            height: 1.2rem;
            background: var(--primary);
            animation: blink 1s infinite;
        }

        @keyframes blink {
            50% { opacity: 0; }
        }

        input {
            background: transparent;
            border: none;
            color: var(--primary);
            font-family: inherit;
            font-size: 1rem;
            outline: none;
            flex-grow: 1;
        }

        .vibe-meter {
            position: absolute;
            right: 20px;
            top: 100px;
            width: 150px;
            text-align: right;
        }

        .meter-label {
            font-size: 0.7rem;
            color: var(--secondary);
            margin-bottom: 5px;
        }

        .meter-bar {
            height: 4px;
            background: rgba(255,255,255,0.1);
            margin-bottom: 15px;
            position: relative;
        }

        .meter-fill {
            height: 100%;
            background: var(--primary);
            width: 0%;
            transition: width 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 0 10px var(--primary);
        }

        .glitch-text {
            color: var(--accent);
            font-weight: bold;
        }

        .status {
            font-size: 0.7rem;
            margin-bottom: 20px;
        }

    </style>
</head>
<body>

    <div class="scanner-container">
        <div class="header">
            <span>DEVICE: VIBE_INTERCEPTOR_V9</span>
            <span>SIGNAL: STABLE</span>
            <span>FREQ: 440.00Hz</span>
        </div>

        <div class="status">
            SYSTEM VERSION: 2026.META.RAIN<br>
            INITIALIZING SCANNER... DONE.<br>
            AWAITING INPUT...
        </div>

        <div class="terminal" id="terminal">
            <div class="line" style="color: var(--secondary)">[SYSTEM] WELCOME, SEARCHER.</div>
            <div class="line">TYPE SOMETHING TO SCAN YOUR FREQUENCY...</div>
        </div>

        <div class="vibe-meter">
            <div class="meter-label">FREQ NOSTALGIA</div>
            <div class="meter-bar"><div class="meter-fill" id="fill-nostalgia"></div></div>
            
            <div class="meter-label">FREQ ANOMALY</div>
            <div class="meter-bar"><div class="meter-fill" id="fill-anomaly" style="background: var(--accent); box-shadow: 0 0 10px var(--accent);"></div></div>
            
            <div class="meter-label">FREQ VIBE</div>
            <div class="meter-bar"><div class="meter-fill" id="fill-vibe" style="background: var(--secondary); box-shadow: 0 0 10px var(--secondary);"></div></div>
        </div>

        <div class="input-area">
            <span style="color: var(--primary)">></span>
            <input type="text" id="command-input" autofocus autocomplete="off">
            <div class="cursor"></div>
        </div>
    </div>

    <script>
        const input = document.getElementById('command-input');
        const terminal = document.getElementById('terminal');
        const fillNostalgia = document.getElementById('fill-nostalgia');
        const fillAnomaly = document.getElementById('fill-anomaly');
        const fillVibe = document.getElementById('fill-vibe');

        const RESPONSES = [
            "SCANNING PHRASING...",
            "INTERCEPTING DATA PACKETS...",
            "RECONSTRUCTING VIBE SIGNATURE...",
            "SUCCESS. FREQUENCY MATCHED.",
            "WARNING: ANOMALY DETECTED IN INPUT.",
            "DEEP SCAN COMPLETE."
        ];

        function addLine(text, color = "white") {
            const line = document.createElement('div');
            line.className = 'line';
            line.style.color = color;
            line.innerHTML = text;
            terminal.appendChild(line);
            terminal.scrollTop = terminal.scrollHeight;
        }

        input.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && input.value.trim() !== '') {
                const val = input.value;
                input.value = '';
                
                addLine(`> ${val}`, "var(--primary)");
                
                // Simulate processing
                setTimeout(() => {
                    const randomResponse = RESPONSES[Math.floor(Math.random() * RESPONSES.length)];
                    addLine(randomResponse, "rgba(255,255,255,0.5)");
                    
                    // Update meters based on input length and characters
                    const nostalgia = Math.min(100, (val.length * 5) % 100);
                    const anomaly = Math.min(100, (val.split('').reduce((a, b) => a + b.charCodeAt(0), 0) % 100));
                    const vibe = Math.min(100, (nostalgia + anomaly) / 1.5 + Math.random() * 20);

                    fillNostalgia.style.width = nostalgia + "%";
                    fillAnomaly.style.width = anomaly + "%";
                    fillVibe.style.width = vibe + "%";

                    if (vibe > 80) {
                        addLine("CRITICAL VIBE DETECTED. SYSTEM OVERHEAT.", "var(--accent)");
                    }
                }, 400);
            }
        });

        // Focus input on click
        document.addEventListener('click', () => input.focus());
    </script>
</body>
</html>
