<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🥷%3C/text%3E%3C/svg%3E">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Typing Ninja — Arcade Word Combat</title>
    <link rel="stylesheet" href="style.css">
    <style>
        :root {
            --ninja-red: #ff3e3e;
            --ninja-gold: #ffd700;
            --ninja-dark: #0a0a0a;
        }

        body {
            margin: 0;
            padding: 0;
            background: var(--ninja-dark);
            color: #fff;
            font-family: 'Outfit', sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        #game-container {
            position: relative;
            flex-grow: 1;
            width: 100%;
            background: radial-gradient(circle at center, #1a1a1a 0%, #0a0a0a 100%);
            border-bottom: 4px solid var(--ninja-red);
        }

        .word {
            position: absolute;
            font-size: 1.5rem;
            font-weight: 800;
            padding: 8px 15px;
            background: rgba(0,0,0,0.8);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 4px;
            white-space: nowrap;
            pointer-events: none;
            transition: transform 0.1s linear;
        }

        .word span.typed {
            color: var(--ninja-red);
            text-shadow: 0 0 10px var(--ninja-red);
        }

        .word.target {
            border-color: var(--ninja-gold);
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.3);
        }

        #stats {
            padding: 20px;
            display: flex;
            justify-content: space-around;
            background: #000;
            font-size: 1.2rem;
            font-weight: bold;
            border-top: 2px solid rgba(255,255,255,0.1);
        }

        .stat-item span {
            color: var(--ninja-red);
            margin-left: 10px;
        }

        #ui-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(0,0,0,0.85);
            z-index: 100;
            backdrop-filter: blur(5px);
        }

        .btn-start {
            padding: 15px 40px;
            font-size: 1.5rem;
            background: var(--ninja-red);
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn-start:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(255, 62, 62, 0.5);
        }

        #input-display {
            position: absolute;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 2rem;
            font-weight: 900;
            color: var(--ninja-gold);
            text-transform: uppercase;
            letter-spacing: 4px;
            min-height: 2.5rem;
            text-shadow: 0 0 15px rgba(255, 215, 0, 0.5);
        }

        .slash {
            position: absolute;
            height: 2px;
            background: #fff;
            transform-origin: left center;
            pointer-events: none;
            box-shadow: 0 0 10px #fff;
            animation: slashAnim 0.3s ease-out forwards;
        }

        @keyframes slashAnim {
            0% { width: 0; opacity: 1; }
            100% { width: 200px; opacity: 0; }
        }

        .explosion {
            position: absolute;
            width: 100px;
            height: 100px;
            background: radial-gradient(circle, var(--ninja-red) 0%, transparent 70%);
            transform: translate(-50%, -50%);
            pointer-events: none;
            animation: explode 0.4s ease-out forwards;
        }

        @keyframes explode {
            0% { transform: translate(-50%, -50%) scale(0); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(1.5); opacity: 0; }
        }

        .back-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            color: #fff;
            text-decoration: none;
            background: rgba(255,255,255,0.1);
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 0.9rem;
            z-index: 200;
            transition: 0.3s;
        }

        .back-btn:hover {
            background: var(--ninja-red);
        }
    </style>
</head>
<body>
    <a href="index.html" class="back-btn">← Back to Gallery</a>

    <div id="game-container">
        <div id="ui-overlay">
            <h1 style="font-size: 4rem; margin-bottom: 10px; text-shadow: 0 0 30px var(--ninja-red);">TYPING NINJA</h1>
            <p style="margin-bottom: 30px; opacity: 0.7;">Type the words before they hit the ground.</p>
            <button class="btn-start" onclick="startGame()">Begin Training</button>
            <div id="game-over-info" style="display:none; text-align:center; margin-top:20px;">
                <h2 style="color: var(--ninja-red);">DEFEATED</h2>
                <p id="final-score"></p>
            </div>
        </div>
        <div id="input-display"></div>
    </div>

    <div id="stats">
        <div class="stat-item">SCORE: <span id="score-val">0</span></div>
        <div class="stat-item">LEVEL: <span id="level-val">1</span></div>
        <div class="stat-item">HEALTH: <span id="health-val">100</span>%</div>
    </div>

    <script src="discovery.js"></script>
    <script>
        const WORDS = ["NINJA", "SHADOW", "BLADE", "TYPING", "STRIKE", "KATANA", "STEALTH", "SPEED", "LEGEND", "SILENT", "FOCUS", "SPIRIT", "COMBAT", "WARRIOR", "SWIFT", "MASTER", "CHALLENGE", "POWER", "QUICK", "REFLEX", "DRAGON", "SMOKE", "ZENITH", "VORTEX", "PHANTOM", "STORM", "HIDDEN", "STRENGTH", "WISDOM", "HONOR"];
        
        let score = 0;
        let health = 100;
        let level = 1;
        let gameActive = false;
        let spawnRate = 2000;
        let fallSpeed = 1;
        let wordsOnScreen = [];
        let currentInput = "";
        let spawnInterval;

        const container = document.getElementById('game-container');
        const scoreEl = document.getElementById('score-val');
        const healthEl = document.getElementById('health-val');
        const levelEl = document.getElementById('level-val');
        const overlay = document.getElementById('ui-overlay');
        const inputDisplay = document.getElementById('input-display');

        function startGame() {
            score = 0;
            health = 100;
            level = 1;
            spawnRate = 2000;
            fallSpeed = 1;
            gameActive = true;
            wordsOnScreen = [];
            currentInput = "";
            
            overlay.style.display = 'none';
            scoreEl.textContent = score;
            healthEl.textContent = health;
            levelEl.textContent = level;
            
            // Clear previous
            const existing = document.querySelectorAll('.word');
            existing.forEach(e => e.remove());
            
            spawnInterval = setInterval(spawnWord, spawnRate);
            requestAnimationFrame(update);
        }

        function spawnWord() {
            if (!gameActive) return;
            
            const text = WORDS[Math.floor(Math.random() * WORDS.length)];
            const wordEl = document.createElement('div');
            wordEl.className = 'word';
            wordEl.textContent = text;
            
            const x = Math.random() * (container.offsetWidth - 150) + 20;
            wordEl.style.left = x + 'px';
            wordEl.style.top = '-50px';
            
            container.appendChild(wordEl);
            wordsOnScreen.push({
                el: wordEl,
                text: text,
                y: -50,
                speed: fallSpeed + Math.random() * 0.5
            });

            // Gradually increase difficulty
            if (spawnRate > 600) {
                clearInterval(spawnInterval);
                spawnRate *= 0.98;
                spawnInterval = setInterval(spawnWord, spawnRate);
            }
        }

        function update() {
            if (!gameActive) return;

            for (let i = wordsOnScreen.length - 1; i >= 0; i--) {
                const w = wordsOnScreen[i];
                w.y += w.speed;
                w.el.style.transform = `translateY(${w.y}px)`;

                if (w.y > container.offsetHeight - 40) {
                    takeDamage(10);
                    w.el.remove();
                    wordsOnScreen.splice(i, 1);
                }
            }

            requestAnimationFrame(update);
        }

        function takeDamage(amt) {
            health -= amt;
            healthEl.textContent = Math.max(0, health);
            container.style.boxShadow = 'inset 0 0 50px rgba(255,0,0,0.5)';
            setTimeout(() => container.style.boxShadow = 'none', 100);

            if (health <= 0) {
                endGame();
            }
        }

        function endGame() {
            gameActive = false;
            clearInterval(spawnInterval);
            overlay.style.display = 'flex';
            document.getElementById('game-over-info').style.display = 'block';
            document.getElementById('final-score').textContent = `Final Score: ${score} | Level: ${level}`;
            inputDisplay.textContent = "";
        }

        window.addEventListener('keydown', (e) => {
            if (!gameActive) return;
            
            const char = e.key.toUpperCase();
            
            // Handle backspace or just ignore? Let's allow typing and matching.
            if (char.length === 1 && char >= 'A' && char <= 'Z') {
                currentInput += char;
                inputDisplay.textContent = currentInput;
                checkMatch();
            } else if (e.key === 'Backspace') {
                currentInput = currentInput.slice(0, -1);
                inputDisplay.textContent = currentInput;
                checkMatch();
            }
        });

        function checkMatch() {
            let matched = false;
            
            // Highlight matching words
            wordsOnScreen.forEach(w => {
                if (w.text.startsWith(currentInput)) {
                    w.el.classList.add('target');
                    w.el.innerHTML = `<span class="typed">${currentInput}</span>${w.text.substring(currentInput.length)}`;
                } else {
                    w.el.classList.remove('target');
                    w.el.textContent = w.text;
                }
            });

            // Complete match
            const index = wordsOnScreen.findIndex(w => w.text === currentInput);
            if (index !== -1) {
                const w = wordsOnScreen[index];
                
                // Visual Slice
                createSliceEffect(w.el);
                
                score += currentInput.length * 10;
                scoreEl.textContent = score;
                
                w.el.remove();
                wordsOnScreen.splice(index, 1);
                currentInput = "";
                inputDisplay.textContent = "";

                // Level up
                if (score > level * 500) {
                    level++;
                    levelEl.textContent = level;
                    fallSpeed += 0.2;
                }
            }
        }

        function createSliceEffect(el) {
            const rect = el.getBoundingClientRect();
            const cx = rect.left + rect.width / 2;
            const cy = rect.top + rect.height / 2;

            // Explosion
            const exp = document.createElement('div');
            exp.className = 'explosion';
            exp.style.left = cx + 'px';
            exp.style.top = cy + 'px';
            document.body.appendChild(exp);
            setTimeout(() => exp.remove(), 400);

            // Slash line
            const slash = document.createElement('div');
            slash.className = 'slash';
            slash.style.left = (cx - 100) + 'px';
            slash.style.top = cy + 'px';
            slash.style.transform = `rotate(${Math.random() * 360}deg)`;
            document.body.appendChild(slash);
            setTimeout(() => slash.remove(), 300);
        }
    </script>
</body>
</html>
