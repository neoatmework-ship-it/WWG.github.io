<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UNDERGROUND_MANUAL://MONSTER_ARCHIVE</title>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #000;
            --text: #fff;
            --accent: #ffff00;
            --ruins: #9d5ba3;
            --snowdin: #5ea6d1;
            --waterfall: #2424b3;
            --hotland: #e98d2a;
            --core: #2b545e;
            --boss: #fdfdfd;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'VT323', monospace;
            margin: 0;
            padding: 0;
            background-color: #000;
            overflow-x: hidden;
        }

        /* ──── GLITCH AESTHETIC ──── */
        .crt-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 2px, 3px 100%;
            pointer-events: none; z-index: 1000;
        }

        header {
            text-align: center;
            padding: 60px 20px;
            border-bottom: 2px solid var(--accent);
            background: #050505;
        }

        h1 {
            font-size: 6rem;
            margin: 0;
            letter-spacing: 12px;
            color: var(--accent);
            text-shadow: 2px 2px #ff0000, -2px -2px #0000ff;
        }

        .search-container {
            max-width: 800px;
            margin: 40px auto;
            position: relative;
        }

        #monster-search {
            width: 100%;
            background: #111;
            border: 3px solid #333;
            color: var(--text);
            font-family: inherit;
            font-size: 2rem;
            padding: 15px 25px;
            outline: none;
            box-sizing: border-box;
        }

        #monster-search:focus { border-color: var(--accent); }

        .filter-tabs {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 40px;
        }

        .tab {
            background: transparent;
            border: 2px solid #333;
            color: #666;
            padding: 8px 25px;
            font-family: inherit;
            font-size: 1.5rem;
            cursor: pointer;
            transition: 0.2s;
            text-transform: uppercase;
        }

        .tab.active { border-color: var(--accent); color: var(--accent); box-shadow: 0 0 15px rgba(255,255,0,0.3); }
        .tab:hover { border-color: #fff; color: #fff; }

        .monster-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 40px;
            padding: 40px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .monster-card {
            background: #050505;
            border: 2px solid #222;
            padding: 30px;
            position: relative;
            transition: 0.3s;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .monster-card:hover { border-color: var(--accent); transform: translateY(-5px); }

        .sprite-wrap {
            height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
        }

        .sprite {
            max-width: 100%;
            max-height: 100%;
            image-rendering: pixelated;
        }

        .monster-name {
            font-size: 2.5rem;
            color: var(--accent);
            margin: 10px 0;
            text-transform: uppercase;
        }

        .monster-area {
            font-size: 1.2rem;
            letter-spacing: 2px;
            margin-bottom: 15px;
            opacity: 0.8;
        }

        .monster-desc {
            font-size: 1.3rem;
            line-height: 1.4;
            text-align: center;
            color: #ccc;
            flex-grow: 1;
        }

        .stats-bar {
            width: 100%;
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 20px 0;
            font-size: 1.2rem;
            color: var(--accent);
        }

        .btn-row {
            display: flex;
            gap: 10px;
            width: 100%;
        }

        .action-btn {
            flex: 1;
            background: transparent;
            border: 2px solid #444;
            color: #888;
            padding: 8px;
            font-family: inherit;
            font-size: 1.2rem;
            cursor: pointer;
        }

        .action-btn:hover { border-color: #fff; color: #fff; }
        
        .glitch-active {
            animation: glitch-shake 0.1s infinite;
            filter: invert(1) contrast(2);
        }
        @keyframes glitch-shake {
            0% { transform: translate(2px, 2px); }
            50% { transform: translate(-2px, -2px); }
            100% { transform: translate(2px, -2px); }
        }

    </style>
</head>
<body>

    <div class="crt-overlay"></div>

    <header>
        <a href="index.html" style="position: absolute; top: 20px; left: 20px; color:#444; font-size:1.5rem; text-decoration:none;">← HUB</a>
        <h1>MONSTER_MANUAL</h1>
        <p style="font-size: 1.5rem; color: #666;">ARCHIVE_STABILIZED // 100%_ENCYCLOPEDIA</p>

        <div class="search-container">
            <input type="text" id="monster-search" placeholder="SEARCH_DATABASE..." autocomplete="off">
        </div>

        <div class="filter-tabs" id="filter-tabs">
            <button class="tab active" data-area="all">TOTAL</button>
            <button class="tab" data-area="Ruins">RUINS</button>
            <button class="tab" data-area="Snowdin">SNOWDIN</button>
            <button class="tab" data-area="Waterfall">WATERFALL</button>
            <button class="tab" data-area="Hotland">HOTLAND</button>
            <button class="tab" data-area="CORE">CORE</button>
            <button class="tab" data-area="Boss">BOSSES</button>
        </div>
    </header>

    <div class="monster-grid" id="monster-grid">
        <!-- Monster Cards dynamically populated -->
    </div>

    <script>
        const MONSTERS = [
            // RUINS
            { name: "Froggit", area: "Ruins", atk: 4, def: 4, desc: "Life is tough for a beginner. Ribbit, ribbit.", sprite: "https://static.wikia.nocookie.net/undertale/images/a/a2/Froggit_battle.gif" },
            { name: "Whimsun", area: "Ruins", atk: 5, def: 0, desc: "Too sensitive to fight. Already considering an apology.", sprite: "https://static.wikia.nocookie.net/undertale/images/1/11/Whimsun_battle.gif" },
            { name: "Moldsmal", area: "Ruins", atk: 6, def: 0, desc: "Stereotypical: No mind, all lime. Burp.", sprite: "https://static.wikia.nocookie.net/undertale/images/4/4c/Moldsmal_battle.gif" },
            { name: "Loox", area: "Ruins", atk: 6, def: 6, desc: "Don't pick on him. Especially don't pick on his family name.", sprite: "https://static.wikia.nocookie.net/undertale/images/4/4c/Loox_battle.gif" },
            { name: "Napstablook", area: "Ruins", atk: 10, def: 10, desc: "This monster doesn't seem to have a sense of humor.", sprite: "https://static.wikia.nocookie.net/undertale/images/f/f0/Napstablook_battle.gif" },
            { name: "Toriel", area: "Boss", desc: "Knows what's best for you. Don't worry, my child.", sprite: "https://static.wikia.nocookie.net/undertale/images/c/c5/Toriel_battle.gif" },

            // SNOWDIN
            { name: "Snowdrake", area: "Snowdin", atk: 6, def: 2, desc: "This teen comedian is looking for an audience.", sprite: "https://static.wikia.nocookie.net/undertale/images/6/69/Snowdrake_battle.gif" },
            { name: "Ice Cap", area: "Snowdin", atk: 7, def: 2, desc: "Wants you to ignore its hat. Please ignore its hat.", sprite: "https://static.wikia.nocookie.net/undertale/images/3/30/Ice_Cap_battle.gif" },
            { name: "Lesser Dog", area: "Snowdin", atk: 7, def: 0, desc: "Wields a shield made of dog treats.", sprite: "https://static.wikia.nocookie.net/undertale/images/b/be/Lesser_Dog_battle.gif" },
            { name: "Greater Dog", area: "Snowdin", atk: 9, def: 4, desc: "It's so excited that it thinks everything is a game.", sprite: "https://static.wikia.nocookie.net/undertale/images/b/b3/Greater_Dog_battle.gif" },
            { name: "Papyrus", area: "Boss", desc: "Likes spaghetti and capture humans. NYEH HEH HEH!", sprite: "https://static.wikia.nocookie.net/undertale/images/3/3b/Papyrus_battle.gif" },

            // WATERFALL
            { name: "Aaron", area: "Waterfall", atk: 7, def: 2, desc: "Flexing is just a natural reaction for him. ;)", sprite: "https://static.wikia.nocookie.net/undertale/images/8/87/Aaron_battle.gif" },
            { name: "Woshua", area: "Waterfall", atk: 7, def: 1, desc: "This monster is obsessed with cleanliness.", sprite: "https://static.wikia.nocookie.net/undertale/images/b/bc/Woshua_battle.gif" },
            { name: "Temmie", area: "Waterfall", atk: 7, def: -20, desc: "hOI! i'm tEMMIE!!", sprite: "https://static.wikia.nocookie.net/undertale/images/a/a2/Temmie_battle.gif" },
            { name: "Undyne", area: "Boss", desc: "The heroine that never reforms. Battle against a true justice.", sprite: "https://static.wikia.nocookie.net/undertale/images/3/34/Undyne_battle.gif" },

            // HOTLAND / CORE
            { name: "Vulkin", area: "Hotland", atk: 8, def: -10, desc: "Mistakes its lava for healing hugs.", sprite: "https://static.wikia.nocookie.net/undertale/images/f/f6/Vulkin_battle.gif" },
            { name: "Tsunderplane", area: "Hotland", atk: 8, def: 6, desc: "It's not like she wants you to notice her or anything.", sprite: "https://static.wikia.nocookie.net/undertale/images/3/36/Tsunderplane_battle.gif" },
            { name: "Muffet", area: "Boss", desc: "Spider bake sale enthusiast. Don't worry, she doesn't bite.", sprite: "https://static.wikia.nocookie.net/undertale/images/5/52/Muffet_battle.gif" },
            { name: "Mettaton EX", area: "Boss", desc: "Who needs arms with legs like these?", sprite: "https://static.wikia.nocookie.net/undertale/images/f/f1/Mettaton_EX_battle.gif" },
            { name: "Knight Knight", area: "CORE", atk: 8, def: 2, desc: "Just wants to take a nap... in a giant armor.", sprite: "https://static.wikia.nocookie.net/undertale/images/f/f8/Knight_Knight_battle.gif" },

            // FINAL BOSSES
            { name: "Asgore", area: "Boss", desc: "The King of the monsters. He just wants to see the surface.", sprite: "https://static.wikia.nocookie.net/undertale/images/5/5b/Asgore_battle.gif" },
            { name: "Flowey", area: "Boss", desc: "Your best friend! It's kill or be killed.", sprite: "https://static.wikia.nocookie.net/undertale/images/d/d4/Flowey_battle.png" },
            { name: "Sans", area: "Boss", desc: "Easiest enemy. Can only deal 1 damage. don't ask why he's so tired.", sprite: "https://static.wikia.nocookie.net/undertale/images/3/3e/Sans_battle.gif" },
            { name: "Asriel Dreemurr", area: "Boss", desc: "The God of Hyperdeath. The absolute end of the timeline.", sprite: "https://static.wikia.nocookie.net/undertale/images/d/df/Asriel_battle.gif" }
        ];

        const grid = document.getElementById('monster-grid');
        const search = document.getElementById('monster-search');
        const tabs = document.querySelectorAll('.tab');

        let currentFilter = 'all';

        function renderMonsters() {
            const query = search.value.toLowerCase().trim();
            grid.innerHTML = '';

            const filtered = MONSTERS.filter(m => {
                const matchesArea = currentFilter === 'all' || m.area === currentFilter;
                const matchesSearch = m.name.toLowerCase().includes(query);
                return matchesArea && matchesSearch;
            });

            filtered.forEach(m => {
                const card = document.createElement('div');
                card.className = 'monster-card';
                if (m.name === 'Sans') card.id = 'sans-card';
                
                card.innerHTML = `
                    <div class="sprite-wrap">
                        <img src="${m.sprite}" alt="${m.name}" class="sprite">
                    </div>
                    <div class="monster-name">${m.name}</div>
                    <div class="monster-area" style="color: var(--${m.area.toLowerCase()})">AREA:// ${m.area.toUpperCase()}</div>
                    <div class="monster-desc" id="${m.name === 'Sans' ? 'sans-desc' : ''}">${m.desc}</div>
                    ${m.atk ? `<div class="stats-bar"><span>ATK: ${m.atk}</span><span>DEF: ${m.def}</span></div>` : '<div class="stats-bar">STAT_DATA_UNKNOWN</div>'}
                    <div class="btn-row">
                        <button class="action-btn" onclick="handleMonsterAction('${m.name}', 'FIGHT', this)">FIGHT</button>
                        <button class="action-btn" onclick="handleMonsterAction('${m.name}', 'MERCY', this)">MERCY</button>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        window.handleMonsterAction = function(name, action, btn) {
            if (name === 'Sans') {
                const desc = document.getElementById('sans-desc');
                if (action === 'FIGHT') {
                    desc.innerText = "* SANS dodged. * you're gonna have a bad time.";
                    desc.style.color = "#f00";
                    document.body.classList.add('glitch-active');
                    setTimeout(() => {
                        if (confirm("D O  Y O U  W A N T  T O  F A C E  H I M ?")) {
                            window.location.href = 'sans-fight.html';
                        }
                        document.body.classList.remove('glitch-active');
                        desc.style.color = "";
                        desc.innerText = "Easiest enemy. Can only deal 1 damage. don't ask why he's so tired.";
                    }, 1000);
                } else {
                    desc.innerText = "* SANS shrugs. 'take it easy, kid.'";
                }
            } else {
                alert(`${name} was ${action === 'FIGHT' ? 'defeated' : 'spared'}!`);
            }
        }

        search.addEventListener('input', renderMonsters);

        tabs.forEach(tab => {
            tab.addEventListener('click', () => {
                tabs.forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                currentFilter = tab.dataset.area;
                renderMonsters();
            });
        });

        // Initialize
        renderMonsters();

    </script>
</body>
</html>
