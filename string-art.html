<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>String Art</title>
    <meta name="description" content="Meditative geometric canvas generator.">
    <link rel="icon"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🧶%3C/text%3E%3C/svg%3E">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600&family=Inter:wght@400;500&display=swap"
        rel="stylesheet">
    <style>
        body {
            margin: 0;
            background: #eef2f5;
            color: #334155;
            font-family: 'Inter', sans-serif;
            display: flex;
            overflow: hidden;
            height: 100vh;
        }

        /* GUI sidebar */
        .sidebar {
            width: 300px;
            background: #fff;
            box-shadow: 2px 0 20px rgba(0, 0, 0, 0.05);
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            z-index: 10;
        }

        .back {
            text-decoration: none;
            color: #3b82f6;
            font-weight: 500;
            margin-bottom: 30px;
            display: inline-block;
            font-size: 0.9rem;
        }

        .back:hover {
            text-decoration: underline;
        }

        h1 {
            margin: 0 0 20px;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 2rem;
            color: #0f172a;
        }

        .control-group {
            margin-bottom: 24px;
        }

        .control-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            color: #64748b;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .range-wrapper {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        input[type="range"] {
            flex: 1;
            accent-color: #3b82f6;
        }

        .val {
            font-family: monospace;
            font-size: 0.9rem;
            font-weight: 500;
            min-width: 30px;
            text-align: right;
        }

        input[type="color"] {
            border: none;
            width: 100%;
            height: 40px;
            border-radius: 8px;
            cursor: pointer;
            padding: 0;
        }

        input[type="color"]::-webkit-color-swatch-wrapper {
            padding: 0;
        }

        input[type="color"]::-webkit-color-swatch {
            border: 1px solid #e2e8f0;
            border-radius: 8px;
        }

        .btn {
            background: #3b82f6;
            color: #fff;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            margin-top: auto;
        }

        .btn:hover {
            background: #2563eb;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
        }

        /* Canvas area */
        .canvas-area {
            flex: 1;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f8fafc;
        }

        canvas {
            background: #fff;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08);
            border-radius: 50%;
        }
    </style>
</head>

<body>
    <div class="sidebar">
        <a href="index.html" class="back">← Gallery</a>
        <h1>String Art</h1>

        <div class="control-group">
            <label>Points</label>
            <div class="range-wrapper">
                <input type="range" id="pts" min="10" max="400" value="200">
                <span class="val" id="pts-v">200</span>
            </div>
        </div>

        <div class="control-group">
            <label>Multiplier</label>
            <div class="range-wrapper">
                <input type="range" id="mult" min="1" max="150" step="0.1" value="2">
                <span class="val" id="mult-v">2</span>
            </div>
        </div>

        <div class="control-group">
            <label>String Thread Color</label>
            <input type="color" id="col" value="#3b82f6">
        </div>

        <button class="btn" id="animate-btn">Auto Animate</button>
    </div>

    <div class="canvas-area" id="ca">
        <canvas id="c"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('c');
        const ctx = canvas.getContext('2d');
        const ca = document.getElementById('ca');

        const inputs = {
            pts: document.getElementById('pts'),
            mult: document.getElementById('mult'),
            col: document.getElementById('col')
        };
        const vals = {
            pts: document.getElementById('pts-v'),
            mult: document.getElementById('mult-v')
        };

        let size = 0;
        let r = 0;
        let isAnimating = false;
        let animFrame;

        function resize() {
            const pad = 80;
            const minDim = Math.min(ca.clientWidth, ca.clientHeight);
            size = minDim - pad;
            r = size / 2;

            // Adjust for retina displays
            const dpr = window.devicePixelRatio || 1;
            canvas.width = size * dpr;
            canvas.height = size * dpr;
            canvas.style.width = size + 'px';
            canvas.style.height = size + 'px';

            ctx.scale(dpr, dpr);
            draw();
        }

        window.addEventListener('resize', resize);

        function draw() {
            const p = parseInt(inputs.pts.value);
            const m = parseFloat(inputs.mult.value);
            const c = inputs.col.value;

            // Update UI
            vals.pts.textContent = p;
            vals.mult.textContent = m.toFixed(1);

            ctx.clearRect(0, 0, size, size);

            // Translate to center
            ctx.save();
            ctx.translate(r, r);

            ctx.lineWidth = 0.5;
            // Add extremely subtle opacity so lines blend
            ctx.strokeStyle = c;
            ctx.globalAlpha = 0.6;

            for (let i = 0; i < p; i++) {
                const angle1 = (i / p) * Math.PI * 2;
                const nextI = (i * m) % p;
                const angle2 = (nextI / p) * Math.PI * 2;

                const x1 = Math.cos(angle1) * (r - 2);
                const y1 = Math.sin(angle1) * (r - 2);
                const x2 = Math.cos(angle2) * (r - 2);
                const y2 = Math.sin(angle2) * (r - 2);

                ctx.beginPath();
                ctx.moveTo(x1, y1);
                ctx.lineTo(x2, y2);
                ctx.stroke();
            }

            ctx.restore();
        }

        // Listeners
        inputs.pts.addEventListener('input', () => { draw(); isAnimating = false; });
        inputs.mult.addEventListener('input', () => { draw(); isAnimating = false; });
        inputs.col.addEventListener('input', draw);

        document.getElementById('animate-btn').addEventListener('click', () => {
            isAnimating = !isAnimating;
            if (isAnimating) {
                document.getElementById('animate-btn').textContent = "Stop Animation";
                loop();
            } else {
                document.getElementById('animate-btn').textContent = "Auto Animate";
                cancelAnimationFrame(animFrame);
            }
        });

        function loop() {
            if (!isAnimating) return;
            let m = parseFloat(inputs.mult.value);
            m += 0.05;
            if (m > 150) m = 1;
            inputs.mult.value = m;
            draw();
            animFrame = requestAnimationFrame(loop);
        }

        // Init
        resize();
    </script>

<style>
.wwg-nav {
    position: fixed;
    bottom: 20px;
    right: 20px;
    display: flex;
    gap: 10px;
    z-index: 99999;
}
.wwg-nav a {
    background: rgba(10, 10, 15, 0.7);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 255, 255, 0.1);
    color: #a78bfa;
    padding: 8px 16px;
    border-radius: 20px;
    font-family: 'Space Grotesk', sans-serif;
    font-size: 0.8rem;
    font-weight: 600;
    text-decoration: none;
    transition: all 0.3s ease;
}
.wwg-nav a:hover {
    background: rgba(167, 139, 250, 0.2);
    border-color: rgba(167, 139, 250, 0.4);
    color: #fff;
    transform: translateY(-2px);
    box-shadow: 0 4px 15px rgba(167, 139, 250, 0.3);
}
</style>
<script>
(function() {
    let sequence = '';
    const trigger = 'PNPNPN';
    document.querySelectorAll('.wwg-nav a').forEach(a => {
        a.addEventListener('click', (e) => {
            const type = a.innerText.includes('Prev') ? 'P' : 'N';
            sequence += type;
            if (sequence.length > 6) sequence = sequence.substring(1);
            if (sequence === trigger) {
                e.preventDefault();
                window.location.href = 'time-loop.html';
            }
        });
    });
})();
</script>
<div class="wwg-nav">
    <a href="slime-mold.html">← Prev</a>
    <a href="pickup-lines.html">Next →</a>
</div>
<!-- WWG_NAV_END -->
</body>

</html>
