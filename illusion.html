<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Illusion</title>
    <link rel="icon"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E👁️%3C/text%3E%3C/svg%3E">
    <style>
        body {
            margin: 0;
            background: #fff;
            overflow: hidden;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            cursor: none;
        }

        .grid {
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            pointer-events: none;
        }

        .cell {
            float: left;
            width: 50px;
            height: 50px;
            background: #000;
            border-radius: 50%;
            transform: scale(0.5);
            transition: transform 0.2s cubic-bezier(0.1, 2, 0.5, 1);
        }

        .cell.alt {
            background: #fff;
            border: 2px solid #000;
            box-sizing: border-box;
        }

        .cursor {
            position: absolute;
            width: 0;
            height: 0;
            pointer-events: none;
            z-index: 10;
        }

        .text {
            position: absolute;
            z-index: 5;
            font-size: 5rem;
            letter-spacing: 20px;
            font-family: sans-serif;
            font-weight: bold;
            color: #fff;
            mix-blend-mode: difference;
            pointer-events: none;
        }
    </style>

    <!-- wwg-mobile-patch-start -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        canvas {
            max-width: 100vw;
            max-height: 100vh;
            touch-action: none;
        }
    </style>
    <!-- wwg-mobile-patch-end -->

</head>

<body>
    <div class="grid" id="grid"></div>
    <div class="text">STARE</div>

    <script src="discovery.js"></script>
    <script>
        Discovery.unlock('illusion');
        const grid = document.getElementById('grid');

        const cols = Math.ceil(window.innerWidth / 50);
        const rows = Math.ceil(window.innerHeight / 50);
        const cells = [];

        for (let y = 0; y < rows; y++) {
            for (let x = 0; x < cols; x++) {
                const c = document.createElement('div');
                c.className = 'cell';
                if ((x + y) % 2 === 0) c.classList.add('alt');

                // Store center position of cell
                c.dataset.cx = x * 50 + 25;
                c.dataset.cy = y * 50 + 25;

                grid.appendChild(c);
                cells.push(c);
            }
        }

        window.addEventListener('mousemove', e => {
            const mx = e.clientX;
            const my = e.clientY;

            // Bulge effect based on mouse distance
            for (let i = 0; i < cells.length; i++) {
                const c = cells[i];
                const cx = parseFloat(c.dataset.cx);
                const cy = parseFloat(c.dataset.cy);

                const dist = Math.sqrt(Math.pow(mx - cx, 2) + Math.pow(my - cy, 2));

                // Inverse distance transform
                let scale = 0.5;
                if (dist < 200) {
                    scale = 0.5 + (200 - dist) / 100; // max scale 2.5
                }

                c.style.transform = `scale(${scale})`;
            }
        });

        setInterval(() => {
            // Auto wiggle if mouse is still
            cells.forEach(c => {
                if (Math.random() > 0.99) {
                    const curr = parseFloat(c.style.transform.replace('scale(', '').replace(')', '')) || 0.5;
                    c.style.transform = `scale(${curr * (Math.random() * 0.5 + 0.8)})`;
                    setTimeout(() => c.style.transform = `scale(${curr})`, 200);
                }
            });
        }, 100);
    </script>

    <!-- wwg-mobile-patch-js-start -->
    <script>
        // Touch-to-Mouse Polyfill for legacy canvas interactives
        document.addEventListener('touchstart', function(e) {
            if(e.touches.length > 0) {
                const touch = e.touches[0];
                const mouseEvent = new MouseEvent('mousedown', {
                    clientX: touch.clientX,
                    clientY: touch.clientY,
                    bubbles: true,
                    cancelable: true
                });
                e.target.dispatchEvent(mouseEvent);
            }
        }, {passive: false});

        document.addEventListener('touchmove', function(e) {
            if(e.touches.length > 0) {
                const touch = e.touches[0];
                const mouseEvent = new MouseEvent('mousemove', {
                    clientX: touch.clientX,
                    clientY: touch.clientY,
                    bubbles: true,
                    cancelable: true
                });
                e.target.dispatchEvent(mouseEvent);
            }
        }, {passive: false});

        document.addEventListener('touchend', function(e) {
            const mouseEvent = new MouseEvent('mouseup', {
                bubbles: true,
                cancelable: true
            });
            e.target.dispatchEvent(mouseEvent);
        }, {passive: false});
    </script>
    <!-- wwg-mobile-patch-js-end -->

</body>

</html>
