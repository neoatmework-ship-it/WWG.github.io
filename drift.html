<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drift</title>
    <link rel="icon"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🚀%3C/text%3E%3C/svg%3E">
    <style>
        body {
            margin: 0;
            background: #000;
            overflow: hidden;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        canvas {
            display: block;
            filter: blur(1px);
        }

        .text {
            position: absolute;
            color: rgba(255, 255, 255, 0.1);
            font-family: monospace;
            font-size: 5rem;
            letter-spacing: 20px;
            pointer-events: none;
            z-index: 0;
        }

        .hud {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #0f0;
            font-family: monospace;
            font-size: 0.8rem;
            pointer-events: none;
        }
    </style>

    <!-- wwg-mobile-patch-start -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        canvas {
            max-width: 100vw;
            max-height: 100vh;
            touch-action: none;
        }
    </style>
    <!-- wwg-mobile-patch-end -->

</head>

<body>
    <div class="text">DRIFT</div>
    <div class="hud">SPEED: <span id="spd">1.0</span>c<br>DIR: <span id="dir">0.0</span></div>
    <canvas id="c"></canvas>

    <script src="discovery.js"></script>
    <script>
        Discovery.unlock('drift');
        const canvas = document.getElementById('c');
        const ctx = canvas.getContext('2d');
        const spdText = document.getElementById('spd');
        const dirText = document.getElementById('dir');

        let w = canvas.width = window.innerWidth;
        let h = canvas.height = window.innerHeight;

        const stars = [];
        for (let i = 0; i < 1500; i++) {
            stars.push({
                x: Math.random() * w * 4 - w * 1.5,
                y: Math.random() * h * 4 - h * 1.5,
                z: Math.random() * w,
                color: `hsl(${Math.random() * 60 + 200}, 100%, 80%)`
            });
        }

        let mouseX = w / 2;
        let mouseY = h / 2;
        let speed = 2; // base warp speed

        window.addEventListener('mousemove', e => {
            mouseX = e.clientX;
            mouseY = e.clientY;

            // distance from center controls speed
            const dist = Math.sqrt(Math.pow(mouseX - w / 2, 2) + Math.pow(mouseY - h / 2, 2));
            speed = Math.max(1, dist * 0.05);
            spdText.innerText = (speed * 0.5).toFixed(2);

            // X offset controls direction
            const dir = (mouseX - w / 2) * 0.01;
            dirText.innerText = dir.toFixed(2);
        });

        function draw() {
            ctx.fillStyle = 'rgba(0,0,0,0.3)';
            ctx.fillRect(0, 0, w, h);

            const dx = (mouseX - w / 2) * 0.05;
            const dy = (mouseY - h / 2) * 0.05;

            for (let i = 0; i < stars.length; i++) {
                const s = stars[i];
                s.z -= speed;
                s.x -= dx;
                s.y -= dy;

                if (s.z <= 0) {
                    s.x = Math.random() * w * 4 - w * 1.5;
                    s.y = Math.random() * h * 4 - h * 1.5;
                    s.z = w;
                }

                // Project
                const fov = 300;
                const scale = fov / s.z;
                const x2d = (s.x - w / 2) * scale + w / 2;
                const y2d = (s.y - h / 2) * scale + h / 2;

                // Draw line from previous position for motion blur feel
                const prevScale = fov / (s.z + speed);
                const prevX2d = (s.x + dx - w / 2) * prevScale + w / 2;
                const prevY2d = (s.y + dy - h / 2) * prevScale + h / 2;

                ctx.beginPath();
                ctx.moveTo(prevX2d, prevY2d);
                ctx.lineTo(x2d, y2d);
                ctx.strokeStyle = s.color;
                ctx.lineWidth = scale * 2;
                ctx.stroke();
            }
            requestAnimationFrame(draw);
        }
        draw();

        window.addEventListener('resize', () => {
            w = canvas.width = window.innerWidth;
            h = canvas.height = window.innerHeight;
        });
    </script>

    <!-- wwg-mobile-patch-js-start -->
    <script>
        // Touch-to-Mouse Polyfill for legacy canvas interactives
        document.addEventListener('touchstart', function(e) {
            if(e.touches.length > 0) {
                const touch = e.touches[0];
                const mouseEvent = new MouseEvent('mousedown', {
                    clientX: touch.clientX,
                    clientY: touch.clientY,
                    bubbles: true,
                    cancelable: true
                });
                e.target.dispatchEvent(mouseEvent);
            }
        }, {passive: false});

        document.addEventListener('touchmove', function(e) {
            if(e.touches.length > 0) {
                const touch = e.touches[0];
                const mouseEvent = new MouseEvent('mousemove', {
                    clientX: touch.clientX,
                    clientY: touch.clientY,
                    bubbles: true,
                    cancelable: true
                });
                e.target.dispatchEvent(mouseEvent);
            }
        }, {passive: false});

        document.addEventListener('touchend', function(e) {
            const mouseEvent = new MouseEvent('mouseup', {
                bubbles: true,
                cancelable: true
            });
            e.target.dispatchEvent(mouseEvent);
        }, {passive: false});
    </script>
    <!-- wwg-mobile-patch-js-end -->

</body>

</html>
