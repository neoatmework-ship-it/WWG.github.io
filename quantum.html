<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quantum</title>
    <link rel="icon"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E⚛️%3C/text%3E%3C/svg%3E">
    <style>
        body {
            margin: 0;
            background: #000;
            overflow: hidden;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .text {
            color: #fff;
            font-family: monospace;
            font-size: 3rem;
            letter-spacing: 15px;
            z-index: 10;
            pointer-events: none;
            mix-blend-mode: difference;
        }

        .q-part {
            position: absolute;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #0ff;
            box-shadow: 0 0 20px #0ff;
            mix-blend-mode: screen;
            transition: transform 0.1s linear;
        }
    </style>

    <!-- wwg-mobile-patch-start -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        canvas {
            max-width: 100vw;
            max-height: 100vh;
            touch-action: none;
        }
    </style>
    <!-- wwg-mobile-patch-end -->

</head>

<body>
    <div class="text">OBSERVE</div>

    <script src="discovery.js"></script>
    <script>
        Discovery.unlock('quantum');

        const numParticles = 100;
        const pArray = [];

        // Heisenberg Uncertainty: If we look closely (mouse near), position is fixed but velocity jumps
        // If we don't look, position is probability cloud

        for (let i = 0; i < numParticles; i++) {
            const p = document.createElement('div');
            p.className = 'q-part';

            // Random color
            const hue = Math.random() > 0.5 ? 180 : 300; // Cyan or Magenta
            p.style.background = `hsl(${hue}, 100%, 50%)`;
            p.style.boxShadow = `0 0 20px hsl(${hue}, 100%, 50%)`;

            document.body.appendChild(p);

            pArray.push({
                el: p,
                baseX: window.innerWidth / 2,
                baseY: window.innerHeight / 2,
                angle: Math.random() * Math.PI * 2,
                dist: Math.random() * 300 + 50
            });
        }

        let mouseX = window.innerWidth / 2;
        let mouseY = window.innerHeight / 2;

        window.addEventListener('mousemove', e => {
            mouseX = e.clientX;
            mouseY = e.clientY;
        });

        function animate() {
            pArray.forEach((p, i) => {
                // Orbit base
                p.angle += 0.05 + (i * 0.001);

                let targetX = p.baseX + Math.cos(p.angle) * p.dist;
                let targetY = p.baseY + Math.sin(p.angle) * p.dist * 0.5; // elliptical

                const dMouse = Math.sqrt(Math.pow(mouseX - targetX, 2) + Math.pow(mouseY - targetY, 2));

                if (dMouse < 200) {
                    // "Observed" - position locks, but jitters heavily (uncertainty)
                    targetX += (Math.random() - 0.5) * 50;
                    targetY += (Math.random() - 0.5) * 50;
                    p.el.style.transform = `translate(${targetX}px, ${targetY}px) scale(2)`;
                    p.el.style.opacity = 1;
                } else {
                    // "Unobserved" - wave function spreads out / teleports
                    if (Math.random() > 0.8) {
                        // Teleporting probability cloud
                        targetX += (Math.random() - 0.5) * 400;
                        targetY += (Math.random() - 0.5) * 400;
                        p.el.style.transform = `translate(${targetX}px, ${targetY}px) scale(0.5)`;
                        p.el.style.opacity = 0.3;
                    }
                }
            });

            requestAnimationFrame(animate);
        }
        animate();
    </script>

    <!-- wwg-mobile-patch-js-start -->
    <script>
        // Touch-to-Mouse Polyfill for legacy canvas interactives
        document.addEventListener('touchstart', function(e) {
            if(e.touches.length > 0) {
                const touch = e.touches[0];
                const mouseEvent = new MouseEvent('mousedown', {
                    clientX: touch.clientX,
                    clientY: touch.clientY,
                    bubbles: true,
                    cancelable: true
                });
                e.target.dispatchEvent(mouseEvent);
            }
        }, {passive: false});

        document.addEventListener('touchmove', function(e) {
            if(e.touches.length > 0) {
                const touch = e.touches[0];
                const mouseEvent = new MouseEvent('mousemove', {
                    clientX: touch.clientX,
                    clientY: touch.clientY,
                    bubbles: true,
                    cancelable: true
                });
                e.target.dispatchEvent(mouseEvent);
            }
        }, {passive: false});

        document.addEventListener('touchend', function(e) {
            const mouseEvent = new MouseEvent('mouseup', {
                bubbles: true,
                cancelable: true
            });
            e.target.dispatchEvent(mouseEvent);
        }, {passive: false});
    </script>
    <!-- wwg-mobile-patch-js-end -->

</body>

</html>
