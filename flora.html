<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flora</title>
    <link rel="icon"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🌿%3C/text%3E%3C/svg%3E">
    <style>
        body {
            margin: 0;
            background: #0c1a12;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        canvas {
            display: block;
            cursor: crosshair;
        }

        .hint {
            position: absolute;
            bottom: 30px;
            font-family: monospace;
            color: #a4d4a4;
            opacity: 0.5;
            pointer-events: none;
            letter-spacing: 5px;
        }
    </style>
</head>

<body>
    <div class="hint">PLANT SEEDS</div>
    <canvas id="c"></canvas>

    <script src="discovery.js"></script>
    <script>
        Discovery.unlock('flora');

        const canvas = document.getElementById('c');
        const ctx = canvas.getContext('2d');
        let w = canvas.width = window.innerWidth;
        let h = canvas.height = window.innerHeight;

        const plants = [];

        window.addEventListener('click', e => {
            plants.push({
                x: e.clientX,
                y: e.clientY,
                length: 0,
                maxLength: Math.random() * 50 + 50,
                angle: -Math.PI / 2, // point up
                width: Math.random() * 5 + 5,
                color: `hsl(${Math.random() * 60 + 90}, 60%, 40%)`,
                branches: []
            });
        });

        function grow(branch, depth = 0) {
            if (branch.length >= branch.maxLength) return;

            // Random sway
            branch.angle += (Math.random() - 0.5) * 0.2;
            branch.length += 2;

            // Branch off
            if (depth < 4 && Math.random() > 0.9 && branch.length > branch.maxLength * 0.3) {
                const dir = Math.random() > 0.5 ? 1 : -1;
                const newB = {
                    x: branch.x + Math.cos(branch.angle) * branch.length,
                    y: branch.y + Math.sin(branch.angle) * branch.length,
                    length: 0,
                    maxLength: branch.maxLength * (Math.random() * 0.3 + 0.5),
                    angle: branch.angle + (Math.random() * 0.5 + 0.2) * dir,
                    width: Math.max(1, branch.width * 0.7),
                    color: `hsl(${Math.random() * 60 + 90}, 60%, 40%)`,
                    branches: []
                };
                branch.branches.push(newB);
            }

            // Grow children
            branch.branches.forEach(b => grow(b, depth + 1));
        }

        function drawBranch(branch) {
            ctx.beginPath();
            ctx.moveTo(branch.x, branch.y);

            const endX = branch.x + Math.cos(branch.angle) * branch.length;
            const endY = branch.y + Math.sin(branch.angle) * branch.length;

            ctx.lineTo(endX, endY);
            ctx.lineWidth = branch.width;
            ctx.strokeStyle = branch.color;
            ctx.lineCap = 'round';
            ctx.stroke();

            // Leaf at end
            if (branch.length >= branch.maxLength && branch.branches.length === 0) {
                ctx.beginPath();
                ctx.arc(endX, endY, branch.width * 1.5, 0, Math.PI * 2);
                ctx.fillStyle = `hsl(${Math.random() * 60 + 90}, 80%, 50%)`;
                ctx.fill();
            }

            branch.branches.forEach(b => drawBranch(b));
        }

        function draw() {
            ctx.fillStyle = 'rgba(12, 26, 18, 0.1)';
            ctx.fillRect(0, 0, w, h);

            plants.forEach(p => {
                grow(p);
                drawBranch(p);
            });

            requestAnimationFrame(draw);
        }
        draw();

        window.addEventListener('resize', () => {
            w = canvas.width = window.innerWidth;
            h = canvas.height = window.innerHeight;
            ctx.clearRect(0, 0, w, h); // clear on resize
        });
    </script>
</body>

</html>
