<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Decay</title>
    <link rel="icon"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🍂%3C/text%3E%3C/svg%3E">
    <style>
        body {
            margin: 0;
            background: #ddd;
            color: #333;
            font-family: serif;
            padding: 50px;
            overflow: hidden;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 1s, color 1s;
        }

        .doc {
            max-width: 600px;
            background: #fff;
            padding: 40px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            transition: 1s;
            border: 1px solid #ccc;
            position: relative;
        }

        h1 {
            font-size: 3rem;
            margin-top: 0;
        }

        p {
            font-size: 1.2rem;
            line-height: 1.6;
        }

        .rust {
            position: absolute;
            background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100"><circle cx="50" cy="50" r="40" fill="%238a3324" opacity="0.3" filter="blur(10px)"/></svg>');
            mix-blend-mode: multiply;
            pointer-events: none;
            opacity: 0;
            transition: opacity 2s;
        }

        .hole {
            position: absolute;
            background: #000;
            border-radius: 50%;
            box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.8);
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.5s, transform 0.5s;
            transform: scale(0);
        }
    </style>
</head>

<body>
    <div class="doc" id="doc">
        <h1>Eternal Document</h1>
        <p>This text is meant to last forever. Secured in a digital vault, untouched by wind, water, or time. The
            characters are immutable, the layout flawless. Nothing can erode the structure bounds of this perfect
            representation of thought.</p>
        <p>Or so we foolishly believed.</p>
    </div>

    <script src="discovery.js"></script>
    <script>
        Discovery.unlock('decay');

        const doc = document.getElementById('doc');
        let stage = 0;

        // Start decay process
        setInterval(() => {
            stage++;

            // Add rust spots
            if (stage % 2 === 0 && stage < 20) {
                const r = document.createElement('div');
                r.className = 'rust';
                r.style.width = (Math.random() * 100 + 50) + 'px';
                r.style.height = (Math.random() * 100 + 50) + 'px';
                r.style.left = Math.random() * 100 + '%';
                r.style.top = Math.random() * 100 + '%';
                r.style.transform = `translate(-50%, -50%) rotate(${Math.random() * 360}deg)`;
                doc.appendChild(r);

                setTimeout(() => r.style.opacity = 1, 50);
            }

            // Background dims
            if (stage === 5) {
                document.body.style.background = '#8a8a83';
                doc.style.background = '#e3ded1';
            }

            // Text falls off
            if (stage > 10) {
                const ps = doc.querySelectorAll('p, h1');
                if (ps.length > 0) {
                    const el = ps[Math.floor(Math.random() * ps.length)];
                    const text = el.innerText;
                    if (text.length > 0) {
                        const idx = Math.floor(Math.random() * text.length);
                        el.innerHTML = text.slice(0, idx) + '<span style="opacity:0; position:relative; top:20px; transition:0.5s;">' + text[idx] + '</span>' + text.slice(idx + 1);
                    }
                }
            }

            // Holes appear
            if (stage > 15 && stage % 3 === 0) {
                const h = document.createElement('div');
                h.className = 'hole';
                h.style.width = (Math.random() * 30 + 10) + 'px';
                h.style.height = (Math.random() * 30 + 10) + 'px';
                h.style.left = Math.random() * 100 + '%';
                h.style.top = Math.random() * 100 + '%';
                doc.appendChild(h);

                setTimeout(() => {
                    h.style.opacity = 1;
                    h.style.transform = 'scale(1)';
                }, 50);
            }

            // Final darkness
            if (stage === 40) {
                document.body.style.background = '#000';
                doc.style.opacity = 0;
            }

        }, 1000);
    </script>
</body>

</html>
