<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nebula</title>
    <link rel="icon"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🌌%3C/text%3E%3C/svg%3E">
    <style>
        body,
        html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #010108;
            overflow: hidden;
        }

        .canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            filter: blur(20px) contrast(3);
        }

        .label {
            position: absolute;
            bottom: 30px;
            left: 30px;
            font-family: monospace;
            color: rgba(255, 255, 255, 0.3);
            font-size: 2rem;
            letter-spacing: 1rem;
            pointer-events: none;
        }
    </style>
</head>

<body>
    <div class="canvas-container">
        <canvas id="c"></canvas>
    </div>
    <div class="label">NEBULA</div>

    <script src="discovery.js"></script>
    <script>
        Discovery.unlock('nebula');

        const canvas = document.getElementById('c');
        const ctx = canvas.getContext('2d');
        let w = canvas.width = window.innerWidth;
        let h = canvas.height = window.innerHeight;

        const orbs = [];
        for (let i = 0; i < 30; i++) {
            orbs.push({
                x: Math.random() * w, y: Math.random() * h,
                r: Math.random() * 150 + 50,
                vx: (Math.random() - 0.5) * 2, vy: (Math.random() - 0.5) * 2,
                color: `hsl(${Math.random() * 60 + 240}, 100%, 50%)`
            });
        }

        function draw() {
            ctx.fillStyle = '#010108';
            ctx.fillRect(0, 0, w, h);
            ctx.globalCompositeOperation = 'screen';

            orbs.forEach(orb => {
                orb.x += orb.vx; orb.y += orb.vy;
                if (orb.x < 0 || orb.x > w) orb.vx *= -1;
                if (orb.y < 0 || orb.y > h) orb.vy *= -1;

                const grad = ctx.createRadialGradient(orb.x, orb.y, 0, orb.x, orb.y, orb.r);
                grad.addColorStop(0, orb.color);
                grad.addColorStop(1, 'transparent');

                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.arc(orb.x, orb.y, orb.r, 0, Math.PI * 2);
                ctx.fill();
            });

            requestAnimationFrame(draw);
        }
        draw();
    </script>
</body>

</html>
