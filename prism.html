<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prism</title>
    <link rel="icon"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E▽%3C/text%3E%3C/svg%3E">
    <style>
        body {
            margin: 0;
            background: #050510;
            overflow: hidden;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        canvas {
            display: block;
            mix-blend-mode: screen;
            filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.2));
        }

        .prism {
            position: absolute;
            width: 0;
            height: 0;
            border-left: 100px solid transparent;
            border-right: 100px solid transparent;
            border-bottom: 173.2px solid rgba(255, 255, 255, 0.1);
            filter: drop-shadow(0 0 20px rgba(255, 255, 255, 0.3));
            pointer-events: none;
            z-index: 10;
            cursor: move;
            border-bottom-color: rgba(200, 200, 255, 0.2);
        }

        .prism::before {
            content: '';
            position: absolute;
            top: 10px;
            left: -80px;
            width: 0;
            height: 0;
            border-left: 80px solid transparent;
            border-right: 80px solid transparent;
            border-bottom: 138px solid rgba(255, 255, 255, 0.05);
        }
    </style>
</head>

<body>
    <div class="prism" id="prism"></div>
    <canvas id="c"></canvas>

    <script src="discovery.js"></script>
    <script>
        Discovery.unlock('prism');
        const prism = document.getElementById('prism');
        const canvas = document.getElementById('c');
        const ctx = canvas.getContext('2d');

        let w = canvas.width = window.innerWidth;
        let h = canvas.height = window.innerHeight;

        let mouseX = 100;
        let mouseY = h / 2;

        // Center prism initially
        let px = w / 2;
        let py = h / 2 - 86.6; // half height

        prism.style.left = (px - 100) + 'px';
        prism.style.top = py + 'px';

        window.addEventListener('mousemove', e => {
            // Mouse acts as light source origin if left of prism, else just aim
            if (!isDragging) {
                mouseX = e.clientX;
                mouseY = e.clientY;
            }
        });

        // Makeshift drag for prism (optional enhancement, sticking to mouse interaction for beam)
        let isDragging = false;
        prism.style.pointerEvents = 'auto'; // allow dragging

        prism.addEventListener('mousedown', e => {
            isDragging = true;
        });
        window.addEventListener('mouseup', () => isDragging = false);
        window.addEventListener('mousemove', e => {
            if (isDragging) {
                px = e.clientX;
                py = e.clientY - 86.6;
                prism.style.left = (px - 100) + 'px';
                prism.style.top = py + 'px';
            }
        });

        function draw() {
            ctx.clearRect(0, 0, w, h);

            // Light source position (fixed left side tracking mouse Y)
            let lx = 0;
            let ly = mouseY;

            // Beam hits prism center
            let targetX = px;
            let targetY = py + 86.6;

            ctx.lineWidth = 4;
            ctx.shadowBlur = 10;

            // 1. Draw incoming white light
            ctx.beginPath();
            ctx.moveTo(lx, ly);
            ctx.lineTo(targetX, targetY);
            ctx.strokeStyle = '#fff';
            ctx.shadowColor = '#fff';
            ctx.stroke();

            // 2. Diffract into colors if beam actually hits the prism boundary
            // We assume it always hits roughly for the effect

            const colors = ['#f00', '#f80', '#ff0', '#0f0', '#00f', '#4b0082', '#ee82ee'];
            const spread = 0.5; // arc spread

            // Angle of incidence
            const angleIn = Math.atan2(targetY - ly, targetX - lx);

            colors.forEach((col, i) => {
                // Bend angle based on wavelength (spectrum index)
                const angleOut = angleIn + (i - colors.length / 2) * 0.05 + 0.2; // slight downward bend + spread

                ctx.beginPath();
                ctx.moveTo(targetX, targetY);
                // Draw to edge of screen
                const dist = w;
                ctx.lineTo(targetX + Math.cos(angleOut) * dist, targetY + Math.sin(angleOut) * dist);

                ctx.strokeStyle = col;
                ctx.shadowColor = col;
                ctx.lineWidth = 10;
                ctx.stroke();
            });

            requestAnimationFrame(draw);
        }
        draw();

        window.addEventListener('resize', () => {
            w = canvas.width = window.innerWidth;
            h = canvas.height = window.innerHeight;
        });
    </script>
</body>

</html>
