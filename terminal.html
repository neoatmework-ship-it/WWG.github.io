<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WWG Internal Terminal | v3.2</title>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=VT323&display=swap" rel="stylesheet">
    <script src="discovery.js"></script>
    <style>
        :root {
            --green: #00ff41;
            --bg: #030303;
            --dim: #003b00;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            color: var(--green);
            font-family: 'Share Tech Mono', monospace;
            height: 100vh;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .crt-monitor {
            width: 95vw;
            height: 90vh;
            background: var(--bg);
            border: 20px solid #111;
            border-radius: 40px;
            position: relative;
            padding: 40px;
            box-shadow: inset 0 0 100px #000, 0 0 50px rgba(0, 0, 0, 0.8);
            overflow: hidden;
        }

        .crt-monitor::after {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 2px, 3px 100%;
            z-index: 10;
            pointer-events: none;
        }

        #terminal-output {
            height: calc(100% - 40px);
            overflow-y: auto;
            white-space: pre-wrap;
            font-size: 1.2rem;
            text-shadow: 0 0 10px var(--green);
            scrollbar-width: none;
        }

        #terminal-output::-webkit-scrollbar {
            display: none;
        }

        .input-area {
            display: flex;
            font-size: 1.2rem;
            margin-top: 10px;
        }

        .prompt {
            margin-right: 10px;
        }

        #command-input {
            background: transparent;
            border: none;
            color: var(--green);
            font-family: inherit;
            font-size: inherit;
            outline: none;
            flex: 1;
            text-shadow: 0 0 5px var(--green);
        }

        .boot-screen {
            position: absolute;
            inset: 0;
            background: #000;
            z-index: 100;
            display: flex;
            flex-direction: column;
            padding: 40px;
            font-size: 1rem;
            color: #fff;
        }

        .cursor {
            display: inline-block;
            width: 10px;
            height: 1.2rem;
            background: var(--green);
            margin-left: 5px;
            animation: blink 1s infinite;
        }

        @keyframes blink {
            50% {
                opacity: 0;
            }
        }

        .secret-file {
            color: #d33682;
        }

        .dir {
            color: #268bd2;
        }

        /* Dashboard Styles */
        .dashboard-container {
            display: none;
            width: 100%;
            max-width: 1100px;
            padding: 40px;
            position: relative;
            z-index: 10;
            font-family: 'Inter', sans-serif;
            color: #f0eef5;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-bottom: 40px;
        }

        .header-bg {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .live-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 12px;
            background: rgba(74, 222, 128, 0.1);
            border: 1px solid rgba(74, 222, 128, 0.2);
            border-radius: 100px;
            color: #4ade80;
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .dot {
            width: 8px;
            height: 8px;
            background: #4ade80;
            border-radius: 50%;
            box-shadow: 0 0 10px #4ade80;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% {
                transform: scale(0.95);
                opacity: 0.5;
            }

            50% {
                transform: scale(1.1);
                opacity: 1;
            }

            100% {
                transform: scale(0.95);
                opacity: 0.5;
            }
        }

        .dashboard-container h1 {
            font-family: 'Share Tech Mono', monospace;
            /* Kept WWG theme */
            font-size: 2.5rem;
            margin: 0;
            background: linear-gradient(135deg, #fff, #8888a0);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 20px;
        }

        .metric-card {
            background: rgba(20, 20, 25, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 30px;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            display: flex;
            flex-direction: column;
            gap: 10px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            transition: transform 0.3s ease;
        }

        .metric-card:hover {
            transform: translateY(-4px);
            border-color: rgba(255, 255, 255, 0.15);
        }

        .card-label {
            font-size: 0.85rem;
            color: #8888a0;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-weight: 600;
            font-family: 'Share Tech Mono', monospace;
        }

        .card-value {
            font-family: 'Share Tech Mono', monospace;
            font-size: 3.5rem;
            font-weight: 700;
            line-height: 1;
            color: #fff;
            background: linear-gradient(135deg, #fff 0%, #a78bfa 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .metric-card.wide {
            grid-column: 1 / -1;
            flex-direction: row;
            justify-content: space-between;
        }

        .chart-container {
            width: 100%;
            margin-top: 15px;
        }

        .bar-wrap {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 12px;
        }

        .bar-label {
            width: 150px;
            font-family: 'Share Tech Mono', monospace;
            font-size: 0.9rem;
            color: #f0eef5;
        }

        .bar-track {
            flex: 1;
            height: 12px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            overflow: hidden;
        }

        .bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #a78bfa, #60a5fa);
            border-radius: 10px;
            width: 0%;
            transition: width 1.5s cubic-bezier(0.23, 1, 0.32, 1);
        }

        .bar-percent {
            width: 50px;
            text-align: right;
            font-size: 0.85rem;
            color: #8888a0;
            font-family: 'Share Tech Mono', monospace;
        }

        .loading-text {
            color: #8888a0;
            font-size: 1rem;
            font-style: italic;
        }

        .close-btn {
            background: transparent;
            color: #8888a0;
            border: none;
            cursor: pointer;
            font-family: 'Share Tech Mono', monospace;
            font-size: 1rem;
            margin-bottom: 10px;
            text-transform: uppercase;
            display: inline-block;
        }

        .close-btn:hover {
            color: #fff;
        }
    </style>
</head>

<body>
    <div class="crt-monitor">
        <div id="boot" class="boot-screen"></div>
        <div id="terminal-output"></div>
        <div class="input-area">
            <span class="prompt" id="prompt-text">root@wwg:~$</span>
            <input type="text" id="command-input" autofocus spellcheck="false" autocomplete="off">
        </div>
    </div>

    <div class="dashboard-container" id="beacon-dashboard">
        <button class="close-btn" onclick="closeDashboard()">[x] Terminate Session</button>
        <div class="header">
            <div class="header-bg">
                <h1>WWG TELEMETRY HUB</h1>
                <div class="live-indicator">
                    <div class="dot"></div> LIVE NOW
                </div>
            </div>
        </div>

        <div class="dashboard-grid">
            <div class="metric-card">
                <div class="card-label">Unique Visitors</div>
                <div class="card-value" id="val-visitors"><span class="loading-text">SYNCING...</span></div>
            </div>
            <div class="metric-card">
                <div class="card-label">Total Clicks</div>
                <div class="card-value" id="val-clicks"><span class="loading-text">SYNCING...</span></div>
            </div>
            <div class="metric-card">
                <div class="card-label">System Active</div>
                <div class="card-value" id="val-active"
                    style="background: linear-gradient(135deg, #fff 0%, #4ade80 100%); -webkit-background-clip: text; background-clip: text;">
                    ONLINE</div>
            </div>

            <div class="metric-card wide">
                <div style="flex: 1;">
                    <div class="card-label" style="margin-bottom: 20px;">Top Click Targets</div>

                    <div class="chart-container" id="chart-targets">
                        <!-- Bars injected by JS -->
                        <span class="loading-text" id="chart-loading">GATHERING METRICS...</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const output = document.getElementById('terminal-output');
        const input = document.getElementById('command-input');
        const boot = document.getElementById('boot');
        const promptText = document.getElementById('prompt-text');

        const fs = {
            'root': {
                'manifesto.txt': 'The Weird Website Gallery is a live organ.\nCreated in 1983. Found in 2024.\nIt does not want to be organized.',
                'staff': {
                    'pikav.log': 'Observer Pikav detected in Sector 7.\nPermission level: CRYSTAL.',
                    'admin.note': 'The glitch is intentional. Stop trying to "fix" it.'
                },
                'secrets': {
                    'void.key': 'Code: [VOID]\nFound in the vacuum of searching.',
                    'ghost.bin': 'Status: [ACTIVE]\nLocation: ghost.html',
                    'matrix.src': 'The core grid is a shell. The real code is underneath.'
                }
            }
        };

        let currentDir = fs.root;
        let currentPath = '~';
        let awaitingPassword = false;
        let passwordContext = '';

        const bootLines = [
            "WWG BIOS v3.2.1",
            "CPU: VIRTUAL_NEURON_777 @ 0Hz",
            "MEMORY: TOTAL_ENTROPY",
            "LOADING OS components...",
            "Checking drive C: [OK]",
            "Mounting /secrets/ [OK]",
            "Sanitizing data stream... [FAILED]",
            "IGNORING ERRORS...",
            "READY."
        ];

        async function startBoot() {
            for (let line of bootLines) {
                const p = document.createElement('p');
                p.textContent = '> ' + line;
                boot.appendChild(p);
                await new Promise(r => setTimeout(r, 200 + Math.random() * 500));
            }
            boot.style.display = 'none';
        }

        startBoot();

        input.onkeydown = (e) => {
            if (e.key === 'Enter') {
                const raw = input.value;
                input.value = '';

                if (awaitingPassword) {
                    writeToTerminal(`<span style="opacity: 0.5;">${promptText.textContent} ********</span>`);
                    handlePassword(raw);
                } else {
                    const [cmd, ...args] = raw.trim().split(' ');
                    writeToTerminal(`<span style="opacity: 0.5;">${promptText.textContent} ${raw}</span>`);
                    handleCommand(cmd.toLowerCase(), args);
                }
            }
        };

        function handlePassword(pwd) {
            awaitingPassword = false;
            input.type = 'text'; // Reset to normal text

            if (passwordContext === 'beacon' && pwd === 'IlikeFeet') {
                writeToTerminal('[!] ACCESS GRANTED. INITIATING DASHBOARD OVERRIDE...');
                setTimeout(() => {
                    document.querySelector('.crt-monitor').style.display = 'none';
                    document.getElementById('beacon-dashboard').style.display = 'block';
                    loadTelemetryData();
                }, 1500);
            } else {
                writeToTerminal('[!] ERROR: INVALID CREDENTIALS. ACCESS DENIED.');
            }
            passwordContext = '';
        }

        function closeDashboard() {
            document.getElementById('beacon-dashboard').style.display = 'none';
            document.querySelector('.crt-monitor').style.display = 'block';
            input.focus();
            writeToTerminal('[!] SESSION TERMINATED. RETURNED TO LOCAL SHELL.');
        }

        async function fetchCount(api, key) {
            try {
                const res = await fetch(`${api}/${key}`);
                if (!res.ok) return 0;
                const data = await res.json();
                return data.count || 0;
            } catch (e) {
                return 0;
            }
        }

        async function loadTelemetryData() {
            const NAMESPACE = 'wwg_gallery_pikav_uuid';
            const API = `https://api.counterapi.dev/v1/${NAMESPACE}`;

            try {
                const visitors = await fetchCount(API, 'visitors');
                const clicks = await fetchCount(API, 'clicks');
                const cards = await fetchCount(API, 'click_card');
                const title = await fetchCount(API, 'click_title');
                const filter = await fetchCount(API, 'click_filter');
                const nav = await fetchCount(API, 'click_nav');

                // Animate numbers
                animateValue("val-visitors", 0, visitors, 1500);
                animateValue("val-clicks", 0, clicks, 1500);

                // Calculate percentages
                const totalTargetClicks = cards + title + filter + nav || 1; // avoid /0

                const targets = [
                    { name: "div.card (Gallery)", percent: Math.round((cards / totalTargetClicks) * 100) },
                    { name: "h1#wwg-title", percent: Math.round((title / totalTargetClicks) * 100) },
                    { name: "button.filter-pill", percent: Math.round((filter / totalTargetClicks) * 100) },
                    { name: "a.wwg-nav", percent: Math.round((nav / totalTargetClicks) * 100) }
                ].sort((a, b) => b.percent - a.percent);

                const chart = document.getElementById('chart-targets');
                document.getElementById('chart-loading').style.display = 'none';
                chart.innerHTML = '';

                targets.forEach((t, i) => {
                    chart.innerHTML += `
                        <div class="bar-wrap">
                            <div class="bar-label">${t.name}</div>
                            <div class="bar-track">
                                <div class="bar-fill" id="bar-${i}" style="width: 0%;"></div>
                            </div>
                            <div class="bar-percent">${t.percent || 0}%</div>
                        </div>
                    `;
                });

                // Trigger animations
                setTimeout(() => {
                    targets.forEach((t, i) => {
                        document.getElementById(`bar-${i}`).style.width = `${t.percent || 0}%`;
                    });
                }, 100);

            } catch (e) {
                console.error('Error fetching telemetry:', e);
                document.getElementById('val-visitors').innerText = 'ERROR';
                document.getElementById('val-clicks').innerText = 'ERROR';
                document.getElementById('chart-loading').innerText = 'FAILED TO INGEST.';
            }
        }

        // Number counter animation
        function animateValue(id, start, end, duration) {
            let obj = document.getElementById(id);
            let startTimestamp = null;
            const step = (timestamp) => {
                if (!startTimestamp) startTimestamp = timestamp;
                const progress = Math.min((timestamp - startTimestamp) / duration, 1);
                const ease = 1 - Math.pow(1 - progress, 4);
                obj.innerHTML = Math.floor(ease * (end - start) + start).toLocaleString();
                if (progress < 1) {
                    window.requestAnimationFrame(step);
                }
            };
            window.requestAnimationFrame(step);
        }

        function handleCommand(cmd, args) {
            switch (cmd) {
                case 'help':
                    writeToTerminal('Available commands: HELP, LS, CD, CAT, CLEAR, EXIT, WHOAMI');
                    break;
                case 'ls':
                    let items = Object.keys(currentDir).map(k => {
                        return typeof currentDir[k] === 'object' ? `<span class="dir">${k}/</span>` : k;
                    });
                    writeToTerminal(items.join('  '));
                    break;
                case 'cd':
                    if (!args[0] || args[0] === '..') {
                        currentDir = fs.root;
                        currentPath = '~';
                    } else if (currentDir[args[0]] && typeof currentDir[args[0]] === 'object') {
                        currentDir = currentDir[args[0]];
                        currentPath += '/' + args[0];
                    } else {
                        writeToTerminal(`Error: Directory '${args[0]}' not found.`);
                    }
                    promptText.textContent = `root@wwg:${currentPath}$`;
                    break;
                case 'cat':
                    if (currentDir[args[0]] && typeof currentDir[args[0]] === 'string') {
                        writeToTerminal(currentDir[args[0]]);
                    } else {
                        writeToTerminal(`Error: File '${args[0]}' not found.`);
                    }
                    break;
                case '3sc4p3r34lity':
                    writeToTerminal('[!] SYNCRONIZING_ALL_FRAGMENTS...');
                    writeToTerminal('[!] GLOBAL_RESTRICTIONS_LIFTED.');
                    Discovery.cheat_unlock_all();
                    break;
                case 'ch33t4tmygam3':
                    writeToTerminal('[!] DISCOVERY_GUIDE_UNLOCKED.');
                    writeToTerminal('[!] ACCESS_GRANTED_VIA_VAULT.');
                    Discovery.unlockCheatsheet();
                    break;
                case '1234':
                    writeToTerminal('[!] DECRYPTING_FRAGMENTS...');
                    setTimeout(() => window.location.href = 'cipher.html', 1000);
                    break;
                case 'clear':
                    output.innerHTML = '';
                    break;
                case 'whoami':
                    writeToTerminal('AUTHENTICATED_FRAGMENT // SECTOR_07');
                    break;
                case 'beacon':
                    writeToTerminal('TELEMETRY MODULE LOCKED.');
                    writeToTerminal('ENTER AUTHORIZATION PASSWORD:');
                    awaitingPassword = true;
                    passwordContext = 'beacon';
                    input.type = 'password'; // Obscure input
                    break;
                case 'exit':
                    window.location.href = 'index.html';
                    break;
                default:
                    if (cmd) writeToTerminal(`Command not found: ${cmd}`);
            }
        }

        function writeToTerminal(text) {
            output.innerHTML += text + '\n';
            output.scrollTop = output.scrollHeight;
            playTypingSound();
        }

        function playTypingSound() {
            try {
                const ac = new AudioContext();
                const osc = ac.createOscillator();
                const gain = ac.createGain();
                osc.type = 'square';
                osc.frequency.setValueAtTime(400 + Math.random() * 200, ac.currentTime);
                gain.gain.setValueAtTime(0.02, ac.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + 0.05);
                osc.connect(gain); gain.connect(ac.destination);
                osc.start(); osc.stop(ac.currentTime + 0.05);
            } catch (e) { }
        }

        document.onclick = () => input.focus();
    </script>
</body>

</html>
