<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Horizon</title>
    <link rel="icon"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🌅%3C/text%3E%3C/svg%3E">
    <style>
        body {
            margin: 0;
            background: #000;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        .blackhole {
            width: 300px;
            height: 300px;
            background: #000;
            border-radius: 50%;
            position: relative;
            box-shadow: 0 0 50px 20px #ff6600, 0 0 150px 40px rgba(255, 100, 0, 0.4);
            animation: pulse 4s ease-in-out infinite alternate;
        }

        .accretion-disk {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 800px;
            height: 150px;
            border-radius: 50%;
            border: 20px solid rgba(255, 150, 50, 0.8);
            transform: translate(-50%, -50%) rotateX(70deg);
            box-shadow: 0 0 40px 10px #ffaa00 inset, 0 0 100px 20px rgba(255, 60, 0, 0.6);
            animation: spin 10s linear infinite;
        }

        @keyframes spin {
            100% {
                transform: translate(-50%, -50%) rotateX(70deg) rotateZ(360deg);
            }
        }

        @keyframes pulse {
            100% {
                box-shadow: 0 0 80px 30px #ff4400, 0 0 200px 60px rgba(255, 80, 0, 0.5);
            }
        }

        .label {
            position: absolute;
            bottom: 40px;
            color: rgba(255, 200, 100, 0.5);
            font-family: sans-serif;
            letter-spacing: 5px;
            text-transform: uppercase;
        }
    </style>
</head>

<body>
    <div class="blackhole">
        <div class="accretion-disk"></div>
    </div>
    <div class="label">EVENT HORIZON</div>
    <script src="discovery.js"></script>
    <script>Discovery.unlock('horizon');</script>
</body>

</html>
