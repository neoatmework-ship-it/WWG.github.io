<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crypt</title>
    <link rel="icon"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🗝️%3C/text%3E%3C/svg%3E">
    <style>
        body {
            margin: 0;
            background: #0a0a0a;
            color: #555;
            font-family: monospace;
            overflow: hidden;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }

        .door {
            width: 200px;
            height: 300px;
            border: 4px solid #333;
            border-radius: 100px 100px 0 0;
            background: repeating-linear-gradient(90deg, #111, #111 20px, #0a0a0a 20px, #0a0a0a 22px);
            position: relative;
            transition: 2s ease-in-out;
            box-shadow: inset 0 0 50px #000, 0 0 20px rgba(0, 0, 0, 0.8);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .keypad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 5px;
            background: #222;
            padding: 10px;
            border-radius: 5px;
            border: 2px solid #444;
        }

        .key {
            width: 30px;
            height: 30px;
            background: #111;
            border: 1px solid #333;
            color: #888;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            user-select: none;
        }

        .key:active {
            background: #333;
        }

        .display {
            grid-column: 1 / 4;
            height: 20px;
            background: #000;
            color: #f00;
            text-align: center;
            margin-bottom: 10px;
            font-family: monospace;
            letter-spacing: 5px;
        }

        .door.open {
            transform: translateY(-300px);
            opacity: 0;
        }

        .treasure {
            position: absolute;
            z-index: -1;
            font-size: 5rem;
            text-shadow: 0 0 50px #ff0;
            opacity: 0;
            transition: 2s 1s;
        }

        .door.open~.treasure {
            opacity: 1;
            transform: scale(1.5);
        }
    </style>

    <!-- wwg-mobile-patch-start -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        canvas {
            max-width: 100vw;
            max-height: 100vh;
            touch-action: none;
        }
    </style>
    <!-- wwg-mobile-patch-end -->

</head>

<body>
    <div class="door" id="door">
        <div class="keypad">
            <div class="display" id="disp"></div>
            <div class="key">1</div>
            <div class="key">2</div>
            <div class="key">3</div>
            <div class="key">4</div>
            <div class="key">5</div>
            <div class="key">6</div>
            <div class="key">7</div>
            <div class="key">8</div>
            <div class="key">9</div>
            <div class="key">*</div>
            <div class="key">0</div>
            <div class="key">#</div>
        </div>
    </div>
    <div class="treasure">💎</div>

    <script src="discovery.js"></script>
    <script>
        Discovery.unlock('crypt');
        const disp = document.getElementById('disp');
        let code = '';
        const TARGET = '1337';

        document.querySelectorAll('.key').forEach(k => {
            k.addEventListener('click', () => {
                const val = k.innerText;
                if (val === '*' || val === '#') code = '';
                else {
                    code += val;
                    if (code.length > 4) code = code.substring(1);
                }
                disp.innerText = code.split('').map(() => '*').join('');

                if (code === TARGET) {
                    disp.style.color = '#0f0';
                    setTimeout(() => document.getElementById('door').classList.add('open'), 500);
                }
            });
        });
    </script>

    <!-- wwg-mobile-patch-js-start -->
    <script>
        // Touch-to-Mouse Polyfill for legacy canvas interactives
        document.addEventListener('touchstart', function(e) {
            if(e.touches.length > 0) {
                const touch = e.touches[0];
                const mouseEvent = new MouseEvent('mousedown', {
                    clientX: touch.clientX,
                    clientY: touch.clientY,
                    bubbles: true,
                    cancelable: true
                });
                e.target.dispatchEvent(mouseEvent);
            }
        }, {passive: false});

        document.addEventListener('touchmove', function(e) {
            if(e.touches.length > 0) {
                const touch = e.touches[0];
                const mouseEvent = new MouseEvent('mousemove', {
                    clientX: touch.clientX,
                    clientY: touch.clientY,
                    bubbles: true,
                    cancelable: true
                });
                e.target.dispatchEvent(mouseEvent);
            }
        }, {passive: false});

        document.addEventListener('touchend', function(e) {
            const mouseEvent = new MouseEvent('mouseup', {
                bubbles: true,
                cancelable: true
            });
            e.target.dispatchEvent(mouseEvent);
        }, {passive: false});
    </script>
    <!-- wwg-mobile-patch-js-end -->

</body>

</html>
