<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fault</title>
    <link rel="icon"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E⚡%3C/text%3E%3C/svg%3E">
    <style>
        body {
            margin: 0;
            background: #2c3e50;
            color: #ecf0f1;
            font-family: monospace;
            overflow: hidden;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            transition: transform 0.1s;
        }

        .text {
            font-size: 5rem;
            letter-spacing: 20px;
            font-weight: bold;
            text-shadow: 2px 2px 0 #000;
        }

        .hint {
            font-size: 1rem;
            color: #95a5a6;
            margin-top: 20px;
        }

        .crack {
            position: absolute;
            background: #fff;
            box-shadow: 0 0 10px #fff, 0 0 20px #e74c3c;
            z-index: -1;
            transform-origin: left;
            opacity: 0;
            pointer-events: none;
        }
    </style>

    <!-- wwg-mobile-patch-start -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        canvas {
            max-width: 100vw;
            max-height: 100vh;
            touch-action: none;
        }
    </style>
    <!-- wwg-mobile-patch-end -->

</head>

<body>
    <div class="text">FAULT LINE</div>
    <div class="hint">CLICK TO RUPTURE</div>

    <script src="discovery.js"></script>
    <script>
        Discovery.unlock('fault');

        let shakeIntensity = 0;

        // Shake loop
        function shake() {
            if (shakeIntensity > 0) {
                const x = (Math.random() - 0.5) * shakeIntensity;
                const y = (Math.random() - 0.5) * shakeIntensity;
                document.body.style.transform = `translate(${x}px, ${y}px)`;
                shakeIntensity *= 0.9; // decay
                if (shakeIntensity < 0.5) shakeIntensity = 0;
            } else {
                document.body.style.transform = `translate(0px, 0px)`;
            }
            requestAnimationFrame(shake);
        }
        shake();

        window.addEventListener('click', e => {
            shakeIntensity = 50; // trigger quake

            // Generate crack
            const c = document.createElement('div');
            c.className = 'crack';
            c.style.left = e.clientX + 'px';
            c.style.top = e.clientY + 'px';
            c.style.width = '10px';
            c.style.height = (Math.random() * 5 + 1) + 'px';

            // Random direction
            const rot = Math.random() * 360;
            c.style.transform = `rotate(${rot}deg)`;
            document.body.appendChild(c);

            // Animate crack spreading
            const anim = c.animate([
                { width: '10px', opacity: 1 },
                { width: (Math.random() * 500 + 200) + 'px', opacity: 1 },
            ], { duration: 200, easing: 'ease-out', fill: 'forwards' });

            // Crack fades over time
            setTimeout(() => {
                c.style.transition = 'opacity 5s';
                c.style.opacity = 0;
                setTimeout(() => c.remove(), 5000);
            }, 2000);
        });
    </script>

    <!-- wwg-mobile-patch-js-start -->
    <script>
        // Touch-to-Mouse Polyfill for legacy canvas interactives
        document.addEventListener('touchstart', function(e) {
            if(e.touches.length > 0) {
                const touch = e.touches[0];
                const mouseEvent = new MouseEvent('mousedown', {
                    clientX: touch.clientX,
                    clientY: touch.clientY,
                    bubbles: true,
                    cancelable: true
                });
                e.target.dispatchEvent(mouseEvent);
            }
        }, {passive: false});

        document.addEventListener('touchmove', function(e) {
            if(e.touches.length > 0) {
                const touch = e.touches[0];
                const mouseEvent = new MouseEvent('mousemove', {
                    clientX: touch.clientX,
                    clientY: touch.clientY,
                    bubbles: true,
                    cancelable: true
                });
                e.target.dispatchEvent(mouseEvent);
            }
        }, {passive: false});

        document.addEventListener('touchend', function(e) {
            const mouseEvent = new MouseEvent('mouseup', {
                bubbles: true,
                cancelable: true
            });
            e.target.dispatchEvent(mouseEvent);
        }, {passive: false});
    </script>
    <!-- wwg-mobile-patch-js-end -->

</body>

</html>
