<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elevator to Nowhere | WWG</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --bg: #06070a;
            --panel: #11151d;
            --line: rgba(255,255,255,.12);
            --gold: #f9c74f;
            --cyan: #4cc9f0;
            --red: #ff4d6d;
            --text: #f5f7fb;
            --muted: #9aa3b2;
        }
        body {
            min-height: 100vh;
            font-family: Inter, system-ui, sans-serif;
            color: var(--text);
            background:
                linear-gradient(90deg, rgba(255,255,255,.04) 1px, transparent 1px) 0 0 / 54px 54px,
                radial-gradient(circle at 30% 20%, rgba(76,201,240,.18), transparent 36%),
                radial-gradient(circle at 70% 80%, rgba(249,199,79,.16), transparent 34%),
                var(--bg);
            overflow-x: hidden;
        }
        .back {
            position: fixed; top: 18px; left: 18px; z-index: 20;
            width: 44px; height: 44px; border-radius: 50%;
            display: grid; place-items: center; color: var(--text);
            text-decoration: none; border: 1px solid var(--line);
            background: rgba(6,7,10,.72); backdrop-filter: blur(12px);
        }
        main {
            width: min(1120px, calc(100% - 32px));
            margin: 0 auto;
            min-height: 100vh;
            display: grid;
            grid-template-columns: minmax(280px, 1fr) 340px;
            gap: 24px;
            align-items: center;
            padding: 72px 0 36px;
        }
        .shaft {
            min-height: 620px;
            border: 1px solid var(--line);
            background:
                repeating-linear-gradient(0deg, rgba(255,255,255,.035) 0 2px, transparent 2px 84px),
                linear-gradient(180deg, #161b24, #090b0f);
            position: relative;
            overflow: hidden;
            box-shadow: 0 30px 80px rgba(0,0,0,.45);
        }
        .floor-lines {
            position: absolute; inset: 0;
            background: linear-gradient(90deg, transparent 0 48%, rgba(249,199,79,.18) 48% 52%, transparent 52%);
            transform: translateY(var(--shift, 0px));
            transition: transform 1.7s cubic-bezier(.2,.8,.2,1);
        }
        .cab {
            position: absolute;
            left: 50%; top: 50%;
            transform: translate(-50%, -50%);
            width: min(430px, 82vw);
            aspect-ratio: 1 / 1.16;
            border: 1px solid rgba(249,199,79,.35);
            background: linear-gradient(180deg, #30333a, #11151c);
            box-shadow: inset 0 0 0 10px rgba(0,0,0,.28), 0 18px 60px rgba(0,0,0,.55);
            overflow: hidden;
        }
        .display {
            position: absolute; left: 50%; top: 18px; transform: translateX(-50%);
            min-width: 150px;
            padding: 10px 16px;
            text-align: center;
            color: var(--gold);
            border: 1px solid rgba(249,199,79,.35);
            background: #050607;
            font-family: "Courier New", monospace;
            letter-spacing: 3px;
            z-index: 4;
        }
        .doors { position: absolute; inset: 64px 18px 18px; overflow: hidden; }
        .door {
            position: absolute; top: 0; bottom: 0; width: 51%;
            background:
                linear-gradient(90deg, rgba(255,255,255,.08), transparent 18%, rgba(0,0,0,.24) 82%, rgba(255,255,255,.06)),
                linear-gradient(180deg, #252b34, #12161d);
            border: 1px solid rgba(255,255,255,.08);
            transition: transform .75s cubic-bezier(.7,0,.2,1);
        }
        .door.left { left: 0; transform: translateX(-88%); }
        .door.right { right: 0; transform: translateX(88%); }
        .doors.closed .left, .doors.closed .right { transform: translateX(0); }
        .void-view {
            height: 100%;
            display: grid;
            place-items: center;
            text-align: center;
            padding: 32px;
            background:
                radial-gradient(circle, rgba(76,201,240,.2), transparent 26%),
                radial-gradient(circle at 70% 20%, rgba(255,77,109,.22), transparent 24%),
                #030407;
        }
        .void-view strong {
            display: block;
            font-size: clamp(2rem, 5vw, 4.8rem);
            letter-spacing: -2px;
            line-height: .95;
        }
        .void-view span { color: var(--muted); max-width: 28ch; margin-top: 18px; display: block; }
        .panel {
            border: 1px solid var(--line);
            background: rgba(17,21,29,.84);
            backdrop-filter: blur(16px);
            padding: 20px;
            box-shadow: 0 24px 70px rgba(0,0,0,.35);
        }
        h1 { font-size: clamp(2.1rem, 5vw, 4rem); line-height: .95; letter-spacing: -2px; margin-bottom: 12px; }
        .intro { color: var(--muted); line-height: 1.6; margin-bottom: 20px; }
        .buttons {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin: 18px 0;
        }
        button {
            min-height: 54px;
            border: 1px solid var(--line);
            border-radius: 50%;
            background: linear-gradient(180deg, #1e2530, #0d1118);
            color: var(--text);
            font: 700 1rem "Courier New", monospace;
            cursor: pointer;
            transition: transform .18s, border-color .18s, box-shadow .18s;
        }
        button:hover, button.active {
            transform: translateY(-2px);
            border-color: rgba(249,199,79,.75);
            box-shadow: 0 0 24px rgba(249,199,79,.22);
        }
        .status {
            min-height: 104px;
            border: 1px solid var(--line);
            padding: 14px;
            background: rgba(0,0,0,.24);
            color: var(--muted);
            line-height: 1.5;
        }
        .status b { color: var(--cyan); }
        .log {
            margin-top: 14px;
            font: 12px/1.55 "Courier New", monospace;
            color: rgba(255,255,255,.54);
            max-height: 170px;
            overflow: auto;
        }
        .meter {
            height: 8px;
            background: rgba(255,255,255,.08);
            margin-top: 16px;
            overflow: hidden;
        }
        .meter span {
            display: block; height: 100%; width: 8%;
            background: linear-gradient(90deg, var(--cyan), var(--gold), var(--red));
            transition: width .8s;
        }
        @media (max-width: 860px) {
            main { grid-template-columns: 1fr; }
            .shaft { min-height: 520px; }
            .panel { order: -1; }
        }
    </style>
</head>
<body>
    <a class="back" href="index.html" title="Back to Gallery">&larr;</a>
    <main>
        <section class="shaft" aria-label="Elevator shaft">
            <div class="floor-lines" id="floor-lines"></div>
            <div class="cab">
                <div class="display" id="readout">IDLE</div>
                <div class="doors" id="doors">
                    <div class="void-view">
                        <div>
                            <strong id="floor-title">Between floors</strong>
                            <span id="floor-copy">Choose a button. The building will invent the destination afterward.</span>
                        </div>
                    </div>
                    <div class="door left"></div>
                    <div class="door right"></div>
                </div>
            </div>
        </section>
        <aside class="panel">
            <h1>Elevator to Nowhere</h1>
            <p class="intro">A vertical transport system for places that definitely failed inspection.</p>
            <div class="buttons">
                <button data-stop="B4">B4</button>
                <button data-stop="0">0</button>
                <button data-stop="13">13</button>
                <button data-stop="404">404</button>
                <button data-stop="??">??</button>
                <button data-stop="UP">UP</button>
                <button data-stop="NO">NO</button>
                <button data-stop="8">8</button>
                <button data-stop="OUT">OUT</button>
            </div>
            <div class="status" id="status">Awaiting a destination with at least one questionable premise.</div>
            <div class="meter"><span id="meter"></span></div>
            <div class="log" id="log">SYSTEM: doors politely open.<br></div>
        </aside>
    </main>
    <script>
        const destinations = [
            ["Floor 404", "The hallway is here, but all doors return a missing response."],
            ["Lobby of Echoes", "Every exit sign points back to the button panel."],
            ["Maintenance Moon", "A tiny maintenance crew has left only a clipboard and a humming light."],
            ["Basement Zero", "The floor number is negative but the carpet remains optimistic."],
            ["Observation Deck", "You can see yesterday from here. It looks slightly undercooked."],
            ["The Sideways Level", "Gravity is contractually present but emotionally unavailable."],
            ["Almost Outside", "Fresh air is visible through a window labeled concept art."],
            ["Penthouse B", "Luxury silence. Complimentary suspicious button."],
            ["The Long Pause", "The elevator waits until someone in another timeline apologizes."]
        ];
        const readout = document.getElementById("readout");
        const doors = document.getElementById("doors");
        const title = document.getElementById("floor-title");
        const copy = document.getElementById("floor-copy");
        const status = document.getElementById("status");
        const log = document.getElementById("log");
        const meter = document.getElementById("meter");
        const floorLines = document.getElementById("floor-lines");
        let trips = 0;

        function addLog(text) {
            log.innerHTML = `${text}<br>${log.innerHTML}`;
        }

        function ride(label, btn) {
            document.querySelectorAll("button").forEach(button => button.classList.remove("active"));
            btn.classList.add("active");
            trips++;
            doors.classList.add("closed");
            readout.textContent = label;
            status.innerHTML = `Routing to <b>${label}</b>. Please keep expectations inside the cab.`;
            meter.style.width = `${Math.min(100, trips * 13)}%`;
            floorLines.style.setProperty("--shift", `${trips * -86}px`);
            addLog(`REQUEST ${String(trips).padStart(2, "0")}: destination ${label}`);

            setTimeout(() => {
                const pick = destinations[(Math.floor(Math.random() * destinations.length) + trips) % destinations.length];
                title.textContent = pick[0];
                copy.textContent = pick[1];
                status.innerHTML = `Arrived at <b>${pick[0]}</b>. The elevator refuses to explain the math.`;
                doors.classList.remove("closed");
                addLog(`ARRIVAL: ${pick[0]}`);
            }, 950);
        }

        document.querySelectorAll("[data-stop]").forEach(btn => {
            btn.addEventListener("click", () => ride(btn.dataset.stop, btn));
        });
    </script>
    <script src="transitions.js"></script>
</body>
</html>
