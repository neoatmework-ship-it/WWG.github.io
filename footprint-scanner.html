<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Footprint Scanner — Who Tracks You?</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #050505;
            --accent: #00ff41;
            --text: #00ff41;
            --dim: #003b00;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'JetBrains Mono', monospace;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .scanner-box {
            width: 90%;
            max-width: 600px;
            border: 1px solid var(--accent);
            padding: 40px;
            background: rgba(0, 20, 0, 0.9);
            box-shadow: 0 0 50px rgba(0, 255, 65, 0.1);
            position: relative;
        }

        .scanner-box::before {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 2px;
            background: var(--accent);
            animation: scan 4s linear infinite;
            box-shadow: 0 0 15px var(--accent);
            z-index: 10;
        }

        @keyframes scan {
            0% { top: 0; }
            100% { top: 100%; }
        }

        h1 { font-size: 1.2rem; text-transform: uppercase; letter-spacing: 4px; border-bottom: 2px solid var(--accent); padding-bottom: 10px; margin-bottom: 30px; }

        .input-wrap { display: flex; gap: 10px; margin-bottom: 20px; }
        input {
            flex: 1;
            background: transparent;
            border: 1px solid var(--dim);
            color: var(--accent);
            padding: 12px;
            font-family: inherit;
            outline: none;
        }
        input:focus { border-color: var(--accent); }

        .btn {
            background: var(--accent);
            color: #000;
            border: none;
            padding: 12px 24px;
            font-weight: 700;
            cursor: pointer;
            text-transform: uppercase;
        }

        .terminal {
            height: 200px;
            overflow-y: hidden;
            font-size: 0.85rem;
            color: var(--accent);
            background: #000;
            padding: 15px;
            border: 1px solid var(--dim);
            display: none;
        }

        .log-entry { margin-bottom: 5px; }
        .log-entry span { opacity: 0.5; margin-right: 10px; }

        .result { display: none; text-align: center; margin-top: 30px; animation: fadeIn 1s; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .persona { font-size: 2rem; font-weight: 700; text-transform: uppercase; margin: 15px 0; color: #fff; text-shadow: 0 0 10px var(--accent); }
        .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin: 20px 0; font-size: 0.9rem; }
        .stat-box { border: 1px solid var(--dim); padding: 15px; }

        .back-link { position: fixed; top: 20px; left: 20px; color: var(--dim); text-decoration: none; font-size: 0.7rem; }
    </style>
</head>
<body>

    <a href="index.html" class="back-link">← TERMINATE_SESSION</a>

    <div class="scanner-box">
        <h1>Digital Footprint Indexer v2.0</h1>
        
        <div id="setup">
            <p style="font-size: 0.8rem; opacity: 0.7; margin-bottom: 20px;">Enter a handle to aggregate cross-platform behavioral metadata.</p>
            <div class="input-wrap">
                <input type="text" id="username" placeholder="USERNAME / HANDLE">
                <button class="btn" onclick="startScan()">SCAN</button>
            </div>
        </div>

        <div class="terminal" id="terminal"></div>

        <div class="result" id="result">
            <div style="font-size: 0.7rem; opacity: 0.6;">ANALYSIS COMPLETE: PERSONA IDENTIFIED</div>
            <div class="persona" id="res-persona">NIGHT SCROLL GOBLIN</div>
            
            <div class="stats">
                <div class="stat-box">
                    <div style="opacity:0.5; font-size: 0.6rem;">ACCOUNTS DETECTED</div>
                    <div id="res-accounts">24</div>
                </div>
                <div class="stat-box">
                    <div style="opacity:0.5; font-size: 0.6rem;">EST. TIME CONSUMED</div>
                    <div id="res-hours">12,400 hrs</div>
                </div>
            </div>

            <p id="res-desc" style="font-size: 0.8rem; opacity: 0.8; line-height: 1.6;"></p>
            <button class="btn" style="margin-top: 30px; background: transparent; border: 1px solid var(--accent); color: var(--accent);" onclick="location.reload()">ERASE RECORD</button>
        </div>
    </div>

    <script src="discovery.js"></script>
    <script>
        Discovery.unlock('footprint-scanner');

        const LOGS = [
            "Initializing deep search protocols...",
            "Ping: Reddit (124ms) - Match found.",
            "Ping: Twitter/X (89ms) - Metadata leak detected.",
            "Analyzing peak activity timestamps...",
            "Decrypting browser fingerprint hashes...",
            "Correlating ghost accounts...",
            "Mapping behavioral silos...",
            "Calculating attention retention rate...",
            "Finalizing psychological profile..."
        ];

        const PERSONAS = [
            { name: "Night Scroll Goblin", desc: "Your accounts remain dormant until 1:00 AM. You thrive in the blue light of the infinite feed. Warning: Extreme susceptibility to impulse purchases." },
            { name: "The Quiet Archivist", desc: "You have 10,000 bookmarks you never read. You collect digital artifacts like they are physical treasures. You are the internet's librarian." },
            { name: "Ghost of the Feed", desc: "You leave no comments. You never like. You exist only as a metric in a database. Pure observation. Pure mystery." },
            { name: "The Algorithm Whisperer", desc: "Your feed is perfectly curated. You know exactly what to click to keep the AI happy. You don't browse the web; the web browses you." }
        ];

        async function startScan() {
            const user = document.getElementById('username').value;
            if(!user) return;

            document.getElementById('setup').style.display = 'none';
            const term = document.getElementById('terminal');
            term.style.display = 'block';

            for(let log of LOGS) {
                const entry = document.createElement('div');
                entry.className = 'log-entry';
                entry.innerHTML = `<span>[${new Date().toLocaleTimeString()}]</span> ${log}`;
                term.appendChild(entry);
                term.scrollTop = term.scrollHeight;
                await new Promise(r => setTimeout(r, 400 + Math.random() * 600));
            }

            showResult();
        }

        function showResult() {
            document.getElementById('terminal').style.display = 'none';
            document.getElementById('result').style.display = 'block';
            
            const persona = PERSONAS[Math.floor(Math.random() * PERSONAS.length)];
            document.getElementById('res-persona').textContent = persona.name;
            document.getElementById('res-desc').textContent = persona.desc;
            document.getElementById('res-accounts').textContent = Math.floor(Math.random() * 50) + 10;
            document.getElementById('res-hours').textContent = (Math.floor(Math.random() * 20000) + 5000).toLocaleString() + " hrs";
        }
    </script>
<script>
    if(/Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent)){
        document.body.innerHTML += '<a href="index.html" style="position:fixed;bottom:20px;right:20px;background:#000;color:#fff;padding:10px 20px;border-radius:30px;text-decoration:none;z-index:9999;border:1px solid #333;font-family:sans-serif;font-size:14px;">Back to Gallery</a>';
    }
</script>
</body>
</html>
