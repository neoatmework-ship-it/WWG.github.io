<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mirage</title>
    <link rel="icon"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🐪%3C/text%3E%3C/svg%3E">
    <style>
        body {
            margin: 0;
            background: #e6c280;
            overflow: hidden;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .desert {
            width: 100vw;
            height: 100vh;
            position: absolute;
            background: linear-gradient(180deg, #87CEEB 0%, #fff 50%, #e6c280 50%, #c49a45 100%);
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            pointer-events: none;
            mix-blend-mode: overlay;
            opacity: 0.5;
        }

        .mirage-text {
            position: absolute;
            top: 40%;
            font-family: serif;
            font-size: 8rem;
            color: #87CEEB;
            letter-spacing: 20px;
            text-shadow: 0 20px 20px rgba(0, 0, 0, 0.2);
            filter: url(#heat);
            animation: sway 5s ease-in-out infinite alternate;
            pointer-events: none;
        }

        @keyframes sway {
            0% {
                transform: skewX(-5deg);
            }

            100% {
                transform: skewX(5deg);
            }
        }
    </style>

    <!-- wwg-mobile-patch-start -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        canvas {
            max-width: 100vw;
            max-height: 100vh;
            touch-action: none;
        }
    </style>
    <!-- wwg-mobile-patch-end -->

</head>

<body>
    <div class="desert"></div>
    <div class="mirage-text" id="mt">WATER</div>
    <canvas id="c"></canvas>

    <svg style="visibility: hidden; position: absolute;" width="0" height="0">
        <defs>
            <filter id="heat">
                <feTurbulence type="fractalNoise" baseFrequency="0.01 0.1" numOctaves="2" result="noise">
                    <animate attributeName="baseFrequency" values="0.01 0.1; 0.02 0.2; 0.01 0.1" keyTimes="0; 0.5; 1"
                        dur="2s" repeatCount="indefinite" />
                </feTurbulence>
                <feDisplacementMap in="SourceGraphic" in2="noise" scale="20" xChannelSelector="R"
                    yChannelSelector="G" />
                <feGaussianBlur stdDeviation="2" />
            </filter>
        </defs>
    </svg>

    <script src="discovery.js"></script>
    <script>
        Discovery.unlock('mirage');

        const mt = document.getElementById('mt');
        window.addEventListener('mousemove', e => {
            // Text runs away from mouse
            const dx = e.clientX - window.innerWidth / 2;
            const dy = e.clientY - window.innerHeight / 2;
            const dist = Math.sqrt(dx * dx + dy * dy);

            if (dist < 300) {
                mt.style.opacity = dist / 300;
                mt.style.filter = `url(#heat) blur(${(300 - dist) / 20}px)`;
            } else {
                mt.style.opacity = 1;
                mt.style.filter = `url(#heat)`;
            }
        });

        // Heat waves on canvas
        const canvas = document.getElementById('c');
        const ctx = canvas.getContext('2d');
        let w = canvas.width = window.innerWidth;
        let h = canvas.height = window.innerHeight;

        let time = 0;
        function draw() {
            ctx.clearRect(0, 0, w, h);
            time += 0.05;

            ctx.fillStyle = '#fff';
            for (let y = h / 2; y < h; y += 20) {
                ctx.beginPath();
                for (let x = 0; x <= w; x += 50) {
                    const wave = Math.sin(x * 0.01 + time + y * 0.1) * 10;
                    if (x === 0) ctx.moveTo(x, y + wave);
                    else ctx.lineTo(x, y + wave);
                }
                ctx.lineTo(w, h);
                ctx.lineTo(0, h);
                ctx.globalAlpha = 0.05 + ((y - h / 2) / h) * 0.1;
                ctx.fill();
            }
            requestAnimationFrame(draw);
        }
        draw();

        window.addEventListener('resize', () => {
            w = canvas.width = window.innerWidth;
            h = canvas.height = window.innerHeight;
        });
    </script>

    <!-- wwg-mobile-patch-js-start -->
    <script>
        // Touch-to-Mouse Polyfill for legacy canvas interactives
        document.addEventListener('touchstart', function(e) {
            if(e.touches.length > 0) {
                const touch = e.touches[0];
                const mouseEvent = new MouseEvent('mousedown', {
                    clientX: touch.clientX,
                    clientY: touch.clientY,
                    bubbles: true,
                    cancelable: true
                });
                e.target.dispatchEvent(mouseEvent);
            }
        }, {passive: false});

        document.addEventListener('touchmove', function(e) {
            if(e.touches.length > 0) {
                const touch = e.touches[0];
                const mouseEvent = new MouseEvent('mousemove', {
                    clientX: touch.clientX,
                    clientY: touch.clientY,
                    bubbles: true,
                    cancelable: true
                });
                e.target.dispatchEvent(mouseEvent);
            }
        }, {passive: false});

        document.addEventListener('touchend', function(e) {
            const mouseEvent = new MouseEvent('mouseup', {
                bubbles: true,
                cancelable: true
            });
            e.target.dispatchEvent(mouseEvent);
        }, {passive: false});
    </script>
    <!-- wwg-mobile-patch-js-end -->

</body>

</html>
