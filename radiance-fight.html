<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DREAM_ARENA://THE_RADIANCE</title>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #000;
            --radiance-gold: #ffcc00;
            --radiance-white: #ffffff;
            --void-black: #050505;
        }

        body {
            margin: 0;
            padding: 0;
            background: var(--bg);
            color: #fff;
            font-family: 'Share Tech Mono', monospace;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        #game-container {
            position: relative;
            width: 800px;
            height: 600px;
            border: 4px solid rgba(255, 255, 255, 0.1);
            background: radial-gradient(circle, #1a1a1a 0%, #000 100%);
            box-shadow: 0 0 50px rgba(255, 204, 0, 0.1);
        }

        canvas {
            display: block;
        }

        /* UI Overlays */
        #ui-layer {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            pointer-events: none;
        }

        .masks {
            display: flex;
            gap: 10px;
        }

        .mask {
            width: 30px;
            height: 30px;
            background: #fff;
            clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%);
            box-shadow: 0 0 10px rgba(255,255,255,0.5);
            transition: 0.3s;
        }

        .mask.broken {
            background: #333;
            box-shadow: none;
            opacity: 0.3;
        }

        .boss-health-container {
            width: 300px;
            height: 10px;
            background: rgba(255,255,255,0.1);
            border-radius: 5px;
            overflow: hidden;
        }

        #boss-health-bar {
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, #ffcc00, #ff9900);
            transition: 0.1s;
        }

        #overlay {
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.8);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            text-align: center;
            transition: 0.5s;
        }

        .btn {
            background: #fff;
            color: #000;
            border: none;
            padding: 15px 40px;
            font-family: inherit;
            font-weight: bold;
            font-size: 1.2rem;
            cursor: pointer;
            margin-top: 20px;
            letter-spacing: 2px;
        }

        .btn:hover {
            background: var(--radiance-gold);
        }

        #intro-text {
            color: var(--radiance-gold);
            font-size: 1.5rem;
            margin-bottom: 10px;
        }

        /* Visual Effects */
        .white-flash {
            position: fixed;
            inset: 0;
            background: #fff;
            z-index: 9999;
            pointer-events: none;
            opacity: 0;
        }

        @keyframes flash {
            0% { opacity: 0; }
            10% { opacity: 1; }
            100% { opacity: 0; }
        }
    </style>
</head>
<body>

    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
        
        <div id="ui-layer">
            <div class="masks" id="masks">
                <div class="mask"></div>
                <div class="mask"></div>
                <div class="mask"></div>
                <div class="mask"></div>
                <div class="mask"></div>
            </div>
            <div class="boss-health-container">
                <div id="boss-health-bar"></div>
            </div>
        </div>

        <div id="overlay">
            <div id="intro-text">ANCIENT ENEMY AWAKENS</div>
            <h1 style="font-size: 3rem; margin: 0; letter-spacing: 5px;">THE RADIANCE</h1>
            <button class="btn" onclick="startGame()">CHALLENGE</button>
            <p style="margin-top: 40px; color: #666; font-size: 0.8rem;">
                WASD/ARROWS to Move | SPACE to Jump/Dash (Double) | CLICK to Slash<br>
                Survive the dream. Erase the light.
            </p>
        </div>
    </div>

    <div class="white-flash" id="flash"></div>

    <script src="discovery.js"></script>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const overlay = document.getElementById('overlay');
        const flash = document.getElementById('flash');
        const bossBar = document.getElementById('boss-health-bar');
        const maskPool = document.getElementById('masks');

        canvas.width = 800;
        canvas.height = 600;

        // Assets
        const knightSprite = new Image();
        knightSprite.src = 'https://hollowknight.wiki/w/images/0/07/Knight_idle.gif';
        const radianceSprite = new Image();
        radianceSprite.src = 'https://hollowknight.wiki/w/images/f/f9/Radiance_intro.png';

        // Platforms
        const platforms = [
            { x: 100, y: 400, w: 150, h: 10 },
            { x: 550, y: 400, w: 150, h: 10 },
            { x: 325, y: 280, w: 150, h: 10 },
            { x: 150, y: 160, w: 120, h: 10 },
            { x: 530, y: 160, w: 120, h: 10 }
        ];

        // Constants
        const GRAVITY = 0.5;
        const JUMP_FORCE = -12;
        const DASH_SPEED = 15;
        const MOVE_SPEED = 5;

        // State
        let gameRunning = false;
        let p, boss, particles = [], projectiles = [];
        let keys = {};
        let gamepad = null;

        class Player {
            constructor() {
                this.x = 400;
                this.y = 500;
                this.w = 40;
                this.h = 60;
                this.vx = 0;
                this.vy = 0;
                this.grounded = false;
                this.health = 5;
                this.invuln = 0;
                this.dashing = 0;
                this.lastDir = 1;
                this.canJump = true;
                this.jumps = 0;
                this.slashTime = 0;
            }

            update() {
                if (this.invuln > 0) this.invuln--;
                if (this.dashing > 0) this.dashing--;
                if (this.slashTime > 0) this.slashTime--;

                // Gamepad Polling
                pollGamepad();

                // Movement (Keyboard or Gamepad)
                if (this.dashing === 0) {
                    let moveX = 0;
                    if (keys['a'] || keys['ArrowLeft'] || keys['A']) moveX = -MOVE_SPEED;
                    else if (keys['d'] || keys['ArrowRight'] || keys['D']) moveX = MOVE_SPEED;
                    
                    // Controller Axis
                    if (gamepad) {
                        const axis = gamepad.axes[0];
                        if (Math.abs(axis) > 0.3) moveX = axis * MOVE_SPEED;
                    }

                    if (moveX !== 0) {
                        this.vx = moveX;
                        this.lastDir = moveX > 0 ? 1 : -1;
                    } else {
                        this.vx *= 0.8;
                    }
                }

                this.x += this.vx;
                this.vy += GRAVITY;
                this.y += this.vy;

                // One-way Platform Collision
                this.grounded = false;
                if (this.vy >= 0) { // Only collide while falling
                    // Floor
                    if (this.y > 540) {
                        this.y = 540;
                        this.vy = 0;
                        this.grounded = true;
                        this.jumps = 0;
                    }
                    // Platforms
                    platforms.forEach(plt => {
                        if (this.x + this.w > plt.x && this.x < plt.x + plt.w) {
                            if (this.y + this.h > plt.y && this.y + this.h < plt.y + 20 && this.vy >= 0) {
                                this.y = plt.y - this.h;
                                this.vy = 0;
                                this.grounded = true;
                                this.jumps = 0;
                            }
                        }
                    });
                }

                // Boundaries
                if (this.x < 0) this.x = 0;
                if (this.x > 760) this.x = 760;
                if (this.y > 650) this.takeDamage(); // Void Fall
            }

            draw() {
                ctx.save();
                // Draw Platforms
                ctx.fillStyle = 'rgba(255, 255, 255, 0.2)';
                ctx.shadowBlur = 10;
                ctx.shadowColor = '#fff';
                platforms.forEach(plt => {
                    ctx.fillRect(plt.x, plt.y, plt.w, plt.h);
                });
                ctx.shadowBlur = 0;

                if (this.invuln % 10 < 5) {
                    ctx.fillStyle = '#fff';
                    ctx.translate(this.x + this.w/2, this.y + this.h/2);
                    if (this.lastDir === -1) ctx.scale(-1, 1);
                    ctx.fillRect(-this.w/2, -this.h/2, this.w, this.h);
                    
                    // Eyes
                    ctx.fillStyle = '#000';
                    ctx.fillRect(5, -15, 8, 12);
                    ctx.fillRect(18, -15, 8, 12);
                }

                // Slash Effect
                if (this.slashTime > 0) {
                    ctx.fillStyle = 'rgba(255,255,255,0.7)';
                    ctx.beginPath();
                    ctx.arc(this.lastDir * 40, 0, 30, -Math.PI/2, Math.PI/2);
                    ctx.fill();
                }
                ctx.restore();
            }

            jump() {
                if (this.jumps < 2) {
                    this.vy = JUMP_FORCE;
                    this.jumps++;
                    this.grounded = false;
                }
            }

            dash() {
                if (this.dashing === 0) {
                    this.dashing = 15;
                    this.vx = this.lastDir * DASH_SPEED;
                    this.vy = 0;
                }
            }

            slash() {
                if (this.slashTime === 0) {
                    this.slashTime = 10;
                    // Check hit on boss
                    const dx = (this.x + this.w/2 + this.lastDir * 50) - (boss.x);
                    const dy = (this.y + this.h/2) - (boss.y + boss.h/2);
                    const dist = Math.sqrt(dx*dx + dy*dy);
                    if (dist < 150) {
                        boss.takeDamage(1);
                    }
                }
            }

            takeDamage() {
                if (this.invuln === 0) {
                    this.health--;
                    this.invuln = 100;
                    updateMasks();
                    // Knockback
                    this.vx = (this.x < boss.x ? -10 : 10);
                    this.vy = -5;
                    if (this.health <= 0) gameOver();
                }
            }
        }

        class Boss {
            constructor() {
                this.x = 400;
                this.y = 150;
                this.w = 120;
                this.h = 150;
                this.health = 40;
                this.maxHealth = 40;
                this.timer = 0;
                this.phase = 1;
                this.floatY = 0;
                this.attackState = 0;
            }

            update() {
                this.timer++;
                this.floatY = Math.sin(this.timer * 0.05) * 20;

                // AI Logic
                if (this.timer % 150 === 0) {
                    this.attack();
                }
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y + this.floatY);
                
                // Wings (glow)
                const glow = ctx.createRadialGradient(0,0,10,0,0,150);
                glow.addColorStop(0, 'rgba(255, 204, 0, 0.5)');
                glow.addColorStop(1, 'transparent');
                ctx.fillStyle = glow;
                ctx.beginPath();
                ctx.arc(0,0, 150, 0, Math.PI*2);
                ctx.fill();

                // Body
                ctx.fillStyle = '#fff';
                ctx.beginPath();
                ctx.moveTo(-40, 60);
                ctx.lineTo(0, -60);
                ctx.lineTo(40, 60);
                ctx.fill();

                // Eyes
                ctx.fillStyle = '#ff9900';
                ctx.beginPath(); ctx.arc(-10, -20, 5, 0, Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.arc(10, -20, 5, 0, Math.PI*2); ctx.fill();

                ctx.restore();
            }

            attack() {
                const rand = Math.random();
                if (rand < 0.6) this.swordBurst();
                else this.beamAttack();
            }

            swordBurst() {
                for(let i=0; i<8; i++) {
                    const angle = (i / 8) * Math.PI * 2;
                    projectiles.push(new Projectile(this.x, this.y + this.floatY, Math.cos(angle)*6, Math.sin(angle)*6, 'sword'));
                }
            }

            beamAttack() {
                const targetX = p.x + 20;
                projectiles.push(new Projectile(targetX, 0, 0, 0, 'beam_charge'));
                setTimeout(() => {
                    projectiles = projectiles.filter(pr => pr.type !== 'beam_charge');
                    projectiles.push(new Projectile(targetX, 0, 0, 0, 'beam'));
                    setTimeout(() => {
                        projectiles = projectiles.filter(pr => pr.type !== 'beam');
                    }, 500);
                }, 1000);
            }

            takeDamage(dmg) {
                this.health -= dmg;
                bossBar.style.width = (this.health / this.maxHealth * 100) + '%';
                if (this.health <= 0) winGame();
            }
        }

        class Projectile {
            constructor(x, y, vx, vy, type) {
                this.x = x;
                this.y = y;
                this.vx = vx;
                this.vy = vy;
                this.type = type;
                this.timer = 0;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.timer++;

                // Collision
                if (this.type === 'sword') {
                    const dx = this.x - (p.x + p.w/2);
                    const dy = this.y - (p.y + p.h/2);
                    if (Math.abs(dx) < 20 && Math.abs(dy) < 30) p.takeDamage();
                } else if (this.type === 'beam') {
                    if (p.x + p.w > this.x - 20 && p.x < this.x + 20) p.takeDamage();
                }
            }

            draw() {
                if (this.type === 'sword') {
                    ctx.save();
                    ctx.translate(this.x, this.y);
                    ctx.rotate(Math.atan2(this.vy, this.vx));
                    ctx.fillStyle = '#fff';
                    ctx.fillRect(-20, -2, 40, 4);
                    ctx.restore();
                } else if (this.type === 'beam_charge') {
                    ctx.fillStyle = 'rgba(255, 204, 0, 0.2)';
                    ctx.fillRect(this.x - 20, 0, 40, canvas.height);
                } else if (this.type === 'beam') {
                    ctx.fillStyle = '#fff';
                    ctx.fillRect(this.x - 20, 0, 40, canvas.height);
                    ctx.shadowBlur = 20;
                    ctx.shadowColor = '#ffcc00';
                    ctx.fillRect(this.x - 10, 0, 20, canvas.height);
                    ctx.shadowBlur = 0;
                }
            }
        }

        function pollGamepad() {
            const gamepads = navigator.getGamepads();
            if (gamepads[0]) {
                gamepad = gamepads[0];
                
                // Jump (A / Cross)
                if (gamepad.buttons[0].pressed && !p.buttonPressed0) {
                    p.jump();
                    p.buttonPressed0 = true;
                } else if (!gamepad.buttons[0].pressed) {
                    p.buttonPressed0 = false;
                }

                // Slash (X / Square)
                if (gamepad.buttons[2].pressed && !p.buttonPressed2) {
                    p.slash();
                    p.buttonPressed2 = true;
                } else if (!gamepad.buttons[2].pressed) {
                    p.buttonPressed2 = false;
                }

                // Dash (B or Shoulders)
                if ((gamepad.buttons[1].pressed || gamepad.buttons[4].pressed || gamepad.buttons[5].pressed) && !p.buttonPressedB) {
                    p.dash();
                    p.buttonPressedB = true;
                } else if (!gamepad.buttons[1].pressed && !gamepad.buttons[4].pressed && !gamepad.buttons[5].pressed) {
                    p.buttonPressedB = false;
                }
            }
        }

        function updateMasks() {
            const masks = maskPool.querySelectorAll('.mask');
            masks.forEach((m, i) => {
                if (i >= p.health) m.classList.add('broken');
                else m.classList.remove('broken');
            });
        }

        window.addEventListener("gamepadconnected", (e) => {
            console.log("Gamepad connected at index %d: %s. %d buttons, %d axes.",
                e.gamepad.index, e.gamepad.id,
                e.gamepad.buttons.length, e.gamepad.axes.length);
            gamepad = e.gamepad;
        });

        window.addEventListener("gamepaddisconnected", (e) => {
            console.log("Gamepad disconnected from index %d: %s",
                e.gamepad.index, e.gamepad.id);
            gamepad = null;
        });

        function startGame() {
            gameRunning = true;
            overlay.style.opacity = '0';
            setTimeout(() => overlay.style.display = 'none', 500);
            
            p = new Player();
            boss = new Boss();
            particles = [];
            projectiles = [];
            updateMasks();
            
            requestAnimationFrame(gameLoop);
        }

        function gameLoop() {
            if (!gameRunning) return;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // BG Particles
            if (Math.random() < 0.1) particles.push({x: Math.random()*800, y: 600, v: Math.random()*2+1});
            ctx.fillStyle = 'rgba(255, 255, 255, 0.1)';
            particles.forEach((pt, i) => {
                pt.y -= pt.v;
                ctx.fillRect(pt.x, pt.y, 2, 2);
                if (pt.y < 0) particles.splice(i, 1);
            });

            p.update();
            p.draw();

            boss.update();
            boss.draw();

            projectiles.forEach((pr) => {
                pr.update();
                pr.draw();
            });
            // Cleanup swords
            projectiles = projectiles.filter(pr => pr.type !== 'sword' || (pr.x > -50 && pr.x < 850 && pr.y > -50 && pr.y < 650));

            requestAnimationFrame(gameLoop);
        }

        window.addEventListener('keydown', (e) => { 
            keys[e.key] = true; 
            if (e.key === ' ' || e.key === 'w' || e.key === 'ArrowUp' || e.key === 'W') p.jump(); 
            if (e.key === 'Shift') p.dash(); 
        });
        window.addEventListener('keyup', (e) => keys[e.key] = false);
        window.addEventListener('mousedown', (e) => {
            if (gameRunning) p.slash();
        });

        function gameOver() {
            gameRunning = false;
            flash.style.opacity = '1';
            setTimeout(() => {
                flash.style.opacity = '0';
                overlay.style.display = 'flex';
                overlay.style.opacity = '1';
                document.getElementById('intro-text').textContent = 'VOID_CONSUMED_YOU';
                document.querySelector('.btn').textContent = 'RETRY';
            }, 500);
        }

        function winGame() {
            gameRunning = false;
            flash.style.background = '#ffd700';
            flash.style.opacity = '1';
            
            if (typeof Discovery !== 'undefined') {
                Discovery.unlock('hollow-knight-guide');
            }
            
            setTimeout(() => {
                window.location.href = 'hollow-knight-guide.html';
            }, 1500);
        }

    </script>
</body>
</html>
