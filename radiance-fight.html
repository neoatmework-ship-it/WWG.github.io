<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DREAM_ARENA://THE_RADIANCE_ASCENDED</title>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #000;
            --radiance-gold: #ffcc00;
            --radiance-white: #ffffff;
            --void-black: #050505;
        }

        body {
            margin: 0;
            padding: 0;
            background: var(--bg);
            color: #fff;
            font-family: 'Share Tech Mono', monospace;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        #game-container {
            position: relative;
            width: 800px;
            height: 600px;
            border: 4px solid rgba(255, 255, 255, 0.1);
            background: radial-gradient(circle, #1a1a1a 0%, #000 100%);
            box-shadow: 0 0 50px rgba(255, 204, 0, 0.1);
            overflow: hidden;
        }

        canvas {
            display: block;
        }

        /* UI Overlays */
        #ui-layer {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            pointer-events: none;
            z-index: 100;
        }

        .masks {
            display: flex;
            gap: 10px;
        }

        .mask {
            width: 30px;
            height: 30px;
            background: #fff;
            clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%);
            box-shadow: 0 0 10px rgba(255,255,255,0.5);
            transition: 0.3s;
        }

        .mask.broken {
            background: #333;
            box-shadow: none;
            opacity: 0.3;
        }

        .boss-health-container {
            width: 300px;
            height: 6px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,204,0,0.2);
            border-radius: 3px;
            overflow: hidden;
        }

        #boss-health-bar {
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, #ffcc00, #ff9900);
            box-shadow: 0 0 10px #ffcc00;
            transition: 0.2s;
        }

        #overlay {
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.9);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            text-align: center;
        }

        .btn {
            background: #fff;
            color: #000;
            border: none;
            padding: 15px 40px;
            font-family: inherit;
            font-weight: bold;
            font-size: 1.2rem;
            cursor: pointer;
            margin-top: 20px;
            letter-spacing: 2px;
            transition: 0.2s;
        }

        .btn:hover { background: var(--radiance-gold); color: #000; box-shadow: 0 0 20px var(--radiance-gold); }

        .phase-announcement {
            position: absolute;
            top: 40%;
            width: 100%;
            text-align: center;
            font-size: 4rem;
            color: #fff;
            letter-spacing: 15px;
            pointer-events: none;
            opacity: 0;
            z-index: 50;
            text-shadow: 0 0 30px var(--radiance-gold);
            font-weight: bold;
        }

        .white-flash {
            position: fixed;
            inset: 0;
            background: #fff;
            z-index: 9999;
            pointer-events: none;
            opacity: 0;
        }

        @keyframes phaseFade {
            0% { opacity: 0; letter-spacing: 40px; transform: scale(1.5); }
            10% { opacity: 1; letter-spacing: 15px; transform: scale(1); }
            90% { opacity: 1; }
            100% { opacity: 0; }
        }

    </style>
</head>
<body>

    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
        <div id="phase-label" class="phase-announcement">ASCENDED</div>
        
        <div id="ui-layer">
            <div class="masks" id="masks">
                <div class="mask"></div>
                <div class="mask"></div>
                <div class="mask"></div>
                <div class="mask"></div>
                <div class="mask"></div>
            </div>
            <div class="boss-health-container">
                <div id="boss-health-bar"></div>
                <div style="font-size: 0.5rem; text-align: right; color: #666; margin-top: 2px;">GOD_OF_LIGHT</div>
            </div>
        </div>

        <div id="overlay">
            <h1 style="font-size: 1.2rem; color: var(--radiance-gold); margin: 0;">ANCIENT EMNITY AWAKENS</h1>
            <h2 style="font-size: 4rem; margin: 10px 0; letter-spacing: 8px;">THE RADIANCE</h2>
            <button class="btn" onclick="startGame()">CHALLENGE</button>
            <p style="margin-top: 40px; color: #444; font-size: 0.7rem;">
                WASD / ARROWS: Move | SPACE: Jump (Double) | SHIFT: Dash | CLICK: Slash<br>
                Survive the Three Phases. Erase the blinding light.
            </p>
        </div>
    </div>

    <div class="white-flash" id="flash"></div>

    <script src="discovery.js"></script>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const overlay = document.getElementById('overlay');
        const flash = document.getElementById('flash');
        const bossBar = document.getElementById('boss-health-bar');
        const maskPool = document.getElementById('masks');
        const phaseLabel = document.getElementById('phase-label');

        canvas.width = 800;
        canvas.height = 600;

        // Assets
        const knightSprite = new Image();
        knightSprite.src = 'https://static.wikia.nocookie.net/hollowknight/images/0/07/Knight_idle.gif';
        const radianceSprite = new Image();
        radianceSprite.src = 'https://static.wikia.nocookie.net/hollowknight/images/b/b5/Radiance_Intro.gif';

        // Constants
        const GRAVITY = 0.5;
        const JUMP = -12;
        const DASH_SPEED = 18;
        const SPEED = 6;
        
        // Game State
        let gameRunning = false;
        let player, boss, particles = [], projectiles = [], floorY = 540;
        let keys = {}, camShake = 0, phase = 1, frame = 0;

        class Player {
            constructor() {
                this.reset();
            }

            reset() {
                this.x = 400; this.y = 500;
                this.w = 32; this.h = 48;
                this.vx = 0; this.vy = 0;
                this.hp = 5; this.invuln = 0;
                this.dashing = 0; this.lastDir = 1;
                this.jumps = 0; this.grounded = false;
                this.slashTime = 0;
            }

            update() {
                if (this.invuln > 0) this.invuln--;
                if (this.dashing > 0) this.dashing--;
                if (this.slashTime > 0) this.slashTime--;

                // Movement
                if (this.dashing === 0) {
                    let move = 0;
                    if (keys['a'] || keys['ArrowLeft']) move = -SPEED;
                    if (keys['d'] || keys['ArrowRight']) move = SPEED;
                    
                    if (move !== 0) {
                        this.vx = move;
                        this.lastDir = move > 0 ? 1 : -1;
                    } else {
                        this.vx *= 0.82;
                    }
                }

                this.vy += GRAVITY;
                this.x += this.vx;
                this.y += this.vy;

                // Collisions (Floor / Phase Spikes)
                this.grounded = false;
                let currentFloor = (phase === 2 && frame % 120 < 60) ? 999 : floorY; // Phase 2 Spikes
                
                if (this.y + this.h > floorY) {
                    if (phase === 2 && frame % 120 < 60) {
                         this.takeDamage(); // Floor is spikes in P2
                    } else {
                        this.y = floorY - this.h;
                        this.vy = 0;
                        this.grounded = true;
                        this.jumps = 0;
                    }
                }

                // Wrap-around or Boundaries
                if (this.x < 0) this.x = 0;
                if (this.x > 768) this.x = 768;
                if (this.y > 650) { this.takeDamage(); this.y = 300; this.vy = -10; } // Pit Fall
            }

            draw() {
                ctx.save();
                if (this.invuln % 6 < 3) {
                    if (knightSprite.complete) {
                        ctx.save();
                        ctx.translate(this.x + this.w/2, this.y + this.h/2);
                        if (this.lastDir === -1) ctx.scale(-1, 1);
                        ctx.drawImage(knightSprite, -this.w/2 - 10, -this.h/2 - 10, this.w + 20, this.h + 20);
                        ctx.restore();
                    } else {
                        ctx.fillStyle = '#fff';
                        ctx.shadowBlur = 10; ctx.shadowColor = '#fff';
                        ctx.fillRect(this.x, this.y, this.w, this.h);
                        
                        // Eyes
                        ctx.fillStyle = '#000';
                        ctx.fillRect(this.x + (this.lastDir > 0 ? 18 : 6), this.y + 12, 6, 10);
                        ctx.fillRect(this.x + (this.lastDir > 0 ? 6 : 18), this.y + 12, 6, 10);
                    }
                }

                // Slash Effect
                if (this.slashTime > 0) {
                    ctx.strokeStyle = 'rgba(255,255,255,0.8)';
                    ctx.lineWidth = 4;
                    ctx.beginPath();
                    ctx.arc(this.x + 16 + (this.lastDir * 40), this.y + 24, 30, -Math.PI/2, Math.PI/2, this.lastDir < 0);
                    ctx.stroke();
                }
                ctx.restore();
            }

            takeDamage() {
                if (this.invuln === 0) {
                    this.hp--;
                    this.invuln = 80;
                    this.vy = -8;
                    camShake = 15;
                    updateMasks();
                    if (this.hp <= 0) gameOver();
                }
            }
        }

        class Boss {
            constructor() {
                this.x = 400; this.y = 150;
                this.hp = 60; this.max = 60;
                this.timer = 0;
                this.float = 0;
                this.state = 'idle';
                this.targetX = 400;
            }

            update() {
                this.timer++;
                this.float = Math.sin(this.timer * 0.04) * 30;
                
                // Teleport Logic
                if (this.timer % 200 === 0) {
                    this.targetX = 150 + Math.random() * 500;
                    this.state = 'teleport';
                }

                if (this.state === 'teleport') {
                    this.x += (this.targetX - this.x) * 0.1;
                    if (Math.abs(this.x - this.targetX) < 1) this.state = 'idle';
                }

                // Attack Patterns based on Phase
                if (this.timer % 140 === 0) this.attack();
                
                // Phase Check
                if (phase === 1 && this.hp < 40) setPhase(2);
                if (phase === 2 && this.hp < 15) setPhase(3);
            }

            attack() {
                const r = Math.random();
                if (r < 0.4) this.beamBurst();
                else if (r < 0.7) this.swordWall();
                else this.orbAttack();
            }

            beamBurst() {
                const beams = 8;
                for (let i = 0; i < beams; i++) {
                    const angle = (i / beams) * Math.PI * 2 + (this.timer * 0.01);
                    projectiles.push(new Projectile(this.x, this.y + this.float, Math.cos(angle)*8, Math.sin(angle)*8, 'beam'));
                }
            }

            swordWall() {
                const side = Math.random() > 0.5 ? 1 : -1;
                for (let i = 0; i < 5; i++) {
                    projectiles.push(new Projectile(side > 0 ? -50 : 850, 100 + i*100, side * 6, 0, 'sword'));
                }
            }

            orbAttack() {
                projectiles.push(new Projectile(this.x, this.y, 0, 0, 'orb'));
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y + this.float);
                
                // Core Aura
                const grad = ctx.createRadialGradient(0,0,0,0,0,150);
                grad.addColorStop(0, 'rgba(255,204,0,0.4)');
                grad.addColorStop(1, 'transparent');
                ctx.fillStyle = grad;
                ctx.beginPath(); ctx.arc(0,0, 150, 0, Math.PI*2); ctx.fill();

                if (radianceSprite.complete) {
                    ctx.drawImage(radianceSprite, -100, -100, 200, 200);
                } else {
                    // Wings
                    ctx.fillStyle = '#fff';
                    ctx.shadowBlur = 20; ctx.shadowColor = '#fff';
                    for(let i=-1; i<=1; i+=2) {
                        ctx.beginPath();
                        ctx.ellipse(i * 60, 0, 80, 20, i * 0.5, 0, Math.PI*2);
                        ctx.fill();
                    }

                    // Head
                    ctx.beginPath();
                    ctx.moveTo(-30, 20); ctx.lineTo(0, -60); ctx.lineTo(30, 20); ctx.fill();
                    
                    // Eyes
                    ctx.fillStyle = '#ff9900';
                    ctx.beginPath(); ctx.arc(-10, -10, 5, 0, Math.PI*2); ctx.fill();
                    ctx.beginPath(); ctx.arc(10, -10, 5, 0, Math.PI*2); ctx.fill();
                }

                ctx.restore();
            }

            takeDamage(amt) {
                this.hp -= amt;
                camShake = 10;
                createParticles(this.x, this.y + this.float, '#ffcc00', 10);
                bossBar.style.width = (this.hp / this.max * 100) + '%';
                if (this.hp <= 0) winGame();
            }
        }

        class Projectile {
            constructor(x, y, vx, vy, type) {
                this.x = x; this.y = y; this.vx = vx; this.vy = vy; this.type = type;
                this.t = 0; this.active = false;
            }

            update() {
                this.t++;
                if (this.type === 'beam') {
                    if (this.t > 40) { this.active = true; this.x += this.vx; this.y += this.vy; }
                } else if (this.type === 'orb') {
                     let dx = player.x - this.x, dy = player.y - this.y;
                     let dist = Math.sqrt(dx*dx+dy*dy);
                     this.vx = (dx/dist) * 3; this.vy = (dy/dist) * 3;
                     this.x += this.vx; this.y += this.vy;
                     this.active = true;
                } else {
                    this.active = true; this.x += this.vx; this.y += this.vy;
                }

                // Collisions
                if (this.active) {
                    let dx = this.x - (player.x + 16), dy = this.y - (player.y + 24);
                    if (Math.abs(dx) < 20 && Math.abs(dy) < 30) player.takeDamage();
                }
            }

            draw() {
                ctx.save();
                if (this.type === 'beam' && !this.active) {
                    ctx.strokeStyle = 'rgba(255,204,0,0.2)';
                    ctx.beginPath(); ctx.moveTo(this.x, this.y); ctx.lineTo(this.x + this.vx*100, this.y + this.vy*100); ctx.stroke();
                } else if (this.active) {
                    ctx.fillStyle = this.type === 'orb' ? '#ff9900' : '#fff';
                    ctx.shadowBlur = 15; ctx.shadowColor = ctx.fillStyle;
                    ctx.beginPath(); ctx.arc(this.x, this.y, 8, 0, Math.PI*2); ctx.fill();
                }
                ctx.restore();
            }
        }

        function createParticles(x, y, color, count) {
            for(let i=0; i<count; i++) {
                particles.push({ 
                    x, y, vx: (Math.random()-0.5)*10, vy: (Math.random()-0.5)*10, 
                    life: 30, color 
                });
            }
        }

        function setPhase(p) {
            phase = p;
            flash.style.opacity = '1';
            setTimeout(() => flash.style.opacity = '0', 200);
            
            phaseLabel.style.animation = 'none';
            void phaseLabel.offsetWidth; 
            phaseLabel.style.animation = 'phaseFade 3s forwards';
            
            if (p === 2) phaseLabel.textContent = 'INFECTED';
            if (p === 3) phaseLabel.textContent = 'ASCENDED';
        }

        function startGame() {
            overlay.style.display = 'none';
            player = new Player();
            boss = new Boss();
            gameRunning = true;
            updateMasks();
            requestAnimationFrame(loop);
        }

        function loop() {
            if (!gameRunning) return;
            frame++;
            if (camShake > 0) camShake--;

            ctx.save();
            if (camShake > 0) ctx.translate((Math.random()-0.5)*camShake, (Math.random()-0.5)*camShake);
            
            ctx.clearRect(0,0,800,600);
            
            // Draw BG details
            ctx.fillStyle = 'rgba(255,255,255,0.05)';
            if (phase === 2 && frame % 120 < 60) {
                ctx.fillStyle = 'rgba(255,140,0,0.1)';
                ctx.fillRect(0, floorY, 800, 60); // Spike Indicator
            }
            ctx.fillRect(0, floorY, 800, 2);

            player.update();
            player.draw();
            boss.update();
            boss.draw();

            projectiles = projectiles.filter(p => {
                p.update(); p.draw();
                return p.x > -100 && p.x < 900 && p.y > -100 && p.y < 700 && p.t < 300;
            });

            particles = particles.filter(p => {
                p.x += p.vx; p.y += p.vy; p.life--;
                ctx.fillStyle = p.color; ctx.globalAlpha = p.life/30;
                ctx.fillRect(p.x, p.y, 4, 4);
                return p.life > 0;
            });

            ctx.restore();
            requestAnimationFrame(loop);
        }

        function updateMasks() {
            const masks = maskPool.querySelectorAll('.mask');
            masks.forEach((m, i) => m.classList.toggle('broken', i >= player.hp));
        }

        window.addEventListener('keydown', (e) => { 
            keys[e.key] = true;
            if (e.key === ' ' && player.jumps < 2) { player.vy = JUMP; player.jumps++; }
            if (e.key === 'Shift') { player.dashing = 10; player.vx = player.lastDir * DASH_SPEED; player.vy = 0; }
        });
        window.addEventListener('keyup', (e) => keys[e.key] = false);
        window.addEventListener('mousedown', () => {
            if (!gameRunning) return;
            player.slashTime = 10;
            const dx = (player.x + 16 + (player.lastDir * 40)) - boss.x;
            const dy = (player.y + 24) - (boss.y + boss.float);
            if (Math.sqrt(dx*dx+dy*dy) < 120) boss.takeDamage(1);
        });

        function gameOver() {
            gameRunning = false;
            flash.style.opacity = '1';
            setTimeout(() => {
                flash.style.opacity = '0';
                overlay.style.display = 'flex';
                document.querySelector('h2').textContent = 'VOID CONSUMED YOU';
                document.querySelector('.btn').textContent = 'CHALLENGE AGAIN';
            }, 600);
        }

        function winGame() {
            gameRunning = false;
            flash.style.background = '#fff';
            flash.style.opacity = '1';
            if (typeof Discovery !== 'undefined') Discovery.unlock('mini-silksong');
            setTimeout(() => window.location.href = 'mini-silksong.html', 1500);
        }

    </script>
</body>
</html>
