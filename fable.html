<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fable</title>
    <link rel="icon"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E📚%3C/text%3E%3C/svg%3E">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,700;1,400&display=swap');

        body {
            margin: 0;
            background: #26211a;
            color: #dacdb5;
            font-family: 'Cormorant Garamond', serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
        }

        .page {
            max-width: 600px;
            padding: 40px;
            margin: 20px;
            border: 1px solid #4a3e2f;
            background: #1a1610;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            cursor: pointer;
            user-select: none;
        }

        h1 {
            font-size: 2.5rem;
            border-bottom: 1px solid #4a3e2f;
            padding-bottom: 20px;
            margin-bottom: 20px;
            font-weight: 700;
            font-style: italic;
        }

        p {
            font-size: 1.5rem;
            line-height: 1.6;
        }

        .instruction {
            font-size: 1rem;
            color: #6b5c46;
            margin-top: 40px;
            font-style: italic;
        }
    </style>
</head>

<body>
    <div class="page" id="fable-box">
        <h1 id="title">The Fable</h1>
        <p id="story">Click to write...</p>
        <div class="instruction">Click the page to generate a new fable</div>
    </div>
    <script src="discovery.js"></script>
    <script>
        Discovery.unlock('fable');

        const subjects = ["fox", "crow", "king", "beggar", "owl", "oak tree", "river", "wind", "child", "wolf", "star"];
        const actions = ["who wanted the moon", "who forgot how to sing", "that spoke in riddles", "who sought the horizon", "that wept gold", "who traded their shadow"];
        const conflicts = ["but was tricked by a clever shadow.", "and thus lost everything trying to keep it.", "until the snows came and taught them patience.", "but found that some treasures are better left buried.", "only to realize they had what they needed all along."];

        const titleEl = document.getElementById('title');
        const storyEl = document.getElementById('story');

        function generate() {
            const s = subjects[Math.floor(Math.random() * subjects.length)];
            const a = actions[Math.floor(Math.random() * actions.length)];
            const c = conflicts[Math.floor(Math.random() * conflicts.length)];

            titleEl.innerText = `The Tale of the ${s.charAt(0).toUpperCase() + s.slice(1)}`;
            storyEl.innerText = `There once was a ${s} ${a}, ${c}`;
        }

        document.getElementById('fable-box').addEventListener('click', generate);
        generate();
    </script>
</body>

</html>
