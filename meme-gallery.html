<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meme Gallery - WWG</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0f0f0f; color: #eee; font-family: 'Inter', sans-serif; min-height: 100vh; }

        header {
            padding: 16px 24px;
            background: #181818;
            border-bottom: 1px solid #2a2a2a;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky; top: 0; z-index: 100;
        }

        header h1 { font-size: 1.4rem; background: linear-gradient(135deg, #f59e0b, #ef4444); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }

        .back-link { text-decoration: none; color: #666; font-size: 0.85rem; transition: color 0.2s; }
        .back-link:hover { color: #eee; }

        .controls {
            padding: 14px 24px;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            align-items: center;
            background: #141414;
            border-bottom: 1px solid #222;
        }

        .filter-btn {
            background: #222; border: 1px solid #333; color: #ccc;
            padding: 7px 14px; border-radius: 20px; cursor: pointer;
            font-size: 0.8rem; transition: all 0.2s;
        }
        .filter-btn:hover, .filter-btn.active { background: #f59e0b; border-color: #f59e0b; color: #000; font-weight: 600; }

        .random-btn {
            margin-left: auto; background: linear-gradient(135deg, #7c3aed, #db2777);
            border: none; color: white; padding: 7px 16px; border-radius: 20px;
            cursor: pointer; font-size: 0.8rem; font-weight: 600; transition: opacity 0.2s;
        }
        .random-btn:hover { opacity: 0.85; }

        .gallery {
            columns: 4 220px; column-gap: 12px;
            padding: 14px 20px 40px;
        }

        .meme-card {
            break-inside: avoid; margin-bottom: 12px;
            border-radius: 10px; overflow: hidden;
            cursor: pointer; position: relative; background: #1a1a1a;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .meme-card:hover { transform: scale(1.025); box-shadow: 0 8px 30px rgba(0,0,0,0.6); }
        .meme-card img { width: 100%; display: block; object-fit: cover; min-height: 120px; background: #1a1a1a; }

        .meme-overlay {
            position: absolute; bottom: 0; left: 0; right: 0;
            background: linear-gradient(transparent, rgba(0,0,0,0.85));
            padding: 20px 10px 8px; opacity: 0; transition: opacity 0.2s;
        }
        .meme-card:hover .meme-overlay { opacity: 1; }
        .meme-label { font-size: 0.72rem; color: #f59e0b; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }

        .cat-badge {
            position: absolute; top: 8px; left: 8px;
            background: rgba(0,0,0,0.7); backdrop-filter: blur(4px);
            color: #f59e0b; font-size: 0.65rem; font-weight: 700;
            padding: 3px 7px; border-radius: 10px; text-transform: uppercase;
        }

        /* Lightbox */
        .lightbox { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.94); z-index: 1000; align-items: center; justify-content: center; flex-direction: column; gap: 12px; }
        .lightbox.open { display: flex; }
        .lightbox img { max-width: 92vw; max-height: 84vh; border-radius: 10px; object-fit: contain; }
        .lightbox-title { color: #f59e0b; font-weight: 700; font-size: 1rem; letter-spacing: 0.5px; }
        .lightbox-close { position: absolute; top: 16px; right: 20px; font-size: 2rem; cursor: pointer; color: #fff; background: none; border: none; }

        #loader { text-align: center; padding: 60px; color: #555; font-size: 1rem; }
        .spinner { border: 3px solid #333; border-top-color: #f59e0b; border-radius: 50%; width: 40px; height: 40px; animation: spin 0.8s linear infinite; margin: 0 auto 15px; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>

    <!-- wwg-mobile-patch-start -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        canvas {
            max-width: 100vw;
            max-height: 100vh;
            touch-action: none;
        }
    </style>
    <!-- wwg-mobile-patch-end -->

</head>
<body>
    <header>
        <h1>🐸 Meme Gallery</h1>
        <a href="index.html" class="back-link">← Back to Gallery</a>
    </header>

    <div class="controls">
        <button class="filter-btn active" id="btn-all" onclick="setFilter('all', this)">All</button>
        <button class="filter-btn" id="btn-memes" onclick="setFilter('memes', this)">🔥 Hot</button>
        <button class="filter-btn" id="btn-dankmemes" onclick="setFilter('dankmemes', this)">💀 Dank</button>
        <button class="filter-btn" id="btn-me_irl" onclick="setFilter('me_irl', this)">😔 Relatable</button>
        <button class="filter-btn" id="btn-wholesomememes" onclick="setFilter('wholesomememes', this)">🥺 Wholesome</button>
        <button class="random-btn" onclick="randomMeme()">🎲 Random</button>
    </div>

    <div id="loader"><div class="spinner"></div>Loading memes from the internet...</div>
    <div class="gallery" id="gallery"></div>

    <div class="lightbox" id="lightbox" onclick="closeLightbox(event)">
        <button class="lightbox-close" onclick="closeLightbox()">×</button>
        <img id="lightbox-img" src="" alt="meme">
        <div class="lightbox-title" id="lightbox-title"></div>
    </div>

    <script>
        let allMemes = [];
        let currentFilter = 'all';

        const subs = ['memes', 'dankmemes', 'me_irl', 'wholesomememes'];

        async function loadMemes() {
            const results = await Promise.allSettled(
                subs.map(sub =>
                    fetch(`https://meme-api.com/gimme/${sub}/12`)
                        .then(r => r.json())
                        .then(d => d.memes.map(m => ({ ...m, sub })))
                )
            );
            allMemes = results.flatMap(r => r.status === 'fulfilled' ? r.value : []);
            // de-dupe and filter videos
            allMemes = allMemes.filter((m, i, a) => !m.url.includes('.gif') && a.findIndex(x => x.postLink === m.postLink) === i);
            document.getElementById('loader').style.display = 'none';
            renderGallery();
        }

        function renderGallery() {
            const filtered = currentFilter === 'all' ? allMemes : allMemes.filter(m => m.sub === currentFilter);
            const gallery = document.getElementById('gallery');
            gallery.innerHTML = filtered.map(m => `
                <div class="meme-card" onclick="openLightbox('${m.url.replace(/'/g,"\\'")}', '${m.title.replace(/'/g,"\\'").substring(0,50)}')">
                    <span class="cat-badge">${subEmoji(m.sub)} ${m.sub}</span>
                    <img src="${m.url}" alt="${m.title}" loading="lazy" onerror="this.parentElement.style.display='none'">
                    <div class="meme-overlay"><div class="meme-label">${m.title.substring(0, 40)}</div></div>
                </div>
            `).join('');
        }

        function subEmoji(sub) {
            return { memes: '🔥', dankmemes: '💀', me_irl: '😔', wholesomememes: '🥺' }[sub] || '😂';
        }

        function setFilter(filter, btn) {
            currentFilter = filter;
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderGallery();
        }

        function openLightbox(url, title) {
            document.getElementById('lightbox-img').src = url;
            document.getElementById('lightbox-title').textContent = title;
            document.getElementById('lightbox').classList.add('open');
        }

        function closeLightbox(e) {
            if (!e || e.target !== document.getElementById('lightbox-img'))
                document.getElementById('lightbox').classList.remove('open');
        }

        function randomMeme() {
            if (!allMemes.length) return;
            const m = allMemes[Math.floor(Math.random() * allMemes.length)];
            openLightbox(m.url, m.title);
        }

        loadMemes();
    </script>

    <!-- wwg-mobile-patch-js-start -->
    <script>
        // Touch-to-Mouse Polyfill for legacy canvas interactives
        document.addEventListener('touchstart', function(e) {
            if(e.touches.length > 0) {
                const touch = e.touches[0];
                const mouseEvent = new MouseEvent('mousedown', {
                    clientX: touch.clientX,
                    clientY: touch.clientY,
                    bubbles: true,
                    cancelable: true
                });
                e.target.dispatchEvent(mouseEvent);
            }
        }, {passive: false});

        document.addEventListener('touchmove', function(e) {
            if(e.touches.length > 0) {
                const touch = e.touches[0];
                const mouseEvent = new MouseEvent('mousemove', {
                    clientX: touch.clientX,
                    clientY: touch.clientY,
                    bubbles: true,
                    cancelable: true
                });
                e.target.dispatchEvent(mouseEvent);
            }
        }, {passive: false});

        document.addEventListener('touchend', function(e) {
            const mouseEvent = new MouseEvent('mouseup', {
                bubbles: true,
                cancelable: true
            });
            e.target.dispatchEvent(mouseEvent);
        }, {passive: false});
    </script>
    <!-- wwg-mobile-patch-js-end -->

</body>
</html>
