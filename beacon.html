<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beacon</title>
    <link rel="icon"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🗼%3C/text%3E%3C/svg%3E">
    <style>
        body {
            margin: 0;
            background: #000;
            overflow: hidden;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .beacon-core {
            width: 40px;
            height: 40px;
            background: #fff;
            border-radius: 50%;
            box-shadow: 0 0 50px 20px rgba(255, 255, 255, 0.8);
            z-index: 10;
            position: relative;
        }

        .beam {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 200vw;
            height: 100px;
            background: linear-gradient(90deg, rgba(255, 255, 255, 0.8), transparent);
            transform-origin: left center;
            animation: sweep 4s linear infinite;
            filter: blur(10px);
            mix-blend-mode: screen;
            margin-top: -50px;
        }

        @keyframes sweep {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        .pulse {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 40px;
            height: 40px;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            border: 2px solid white;
            animation: pulseOut 2s ease-out infinite;
        }

        @keyframes pulseOut {
            0% {
                width: 40px;
                height: 40px;
                opacity: 1;
                border-width: 5px;
            }

            100% {
                width: 500px;
                height: 500px;
                opacity: 0;
                border-width: 0px;
            }
        }

        .floor {
            position: absolute;
            bottom: -50vh;
            width: 200vw;
            height: 100vh;
            background: radial-gradient(circle at top center, rgba(100, 200, 255, 0.1), transparent 50%);
            transform: rotateX(80deg);
            opacity: 0.5;
            pointer-events: none;
        }
    </style>
</head>

<body>
    <div class="beacon-core"></div>
    <div class="beam"></div>
    <div class="pulse"></div>
    <div class="floor"></div>
    <script src="discovery.js"></script>
    <script>Discovery.unlock('beacon');</script>
</body>

</html>
