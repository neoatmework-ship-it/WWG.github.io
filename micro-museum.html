<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Micro Museum | WWG</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --bg: #f3efe6;
            --ink: #191816;
            --muted: #665f55;
            --glass: rgba(255,255,255,.58);
            --line: rgba(25,24,22,.18);
            --blue: #3657ff;
            --rose: #c43a63;
            --green: #246b50;
        }
        body {
            min-height: 100vh;
            font-family: Georgia, "Times New Roman", serif;
            color: var(--ink);
            background:
                linear-gradient(90deg, rgba(25,24,22,.045) 1px, transparent 1px) 0 0 / 38px 38px,
                linear-gradient(180deg, #fff7e8, var(--bg));
        }
        .back {
            position: fixed; top: 18px; left: 18px; z-index: 10;
            width: 44px; height: 44px; border-radius: 50%;
            display: grid; place-items: center; color: var(--ink);
            background: rgba(255,255,255,.72); border: 1px solid var(--line);
            text-decoration: none; backdrop-filter: blur(12px);
        }
        main {
            width: min(1180px, calc(100% - 32px));
            margin: 0 auto;
            padding: 86px 0 36px;
            display: grid;
            grid-template-columns: 340px 1fr;
            gap: 26px;
        }
        h1 {
            font-size: clamp(2.6rem, 7vw, 6rem);
            line-height: .82;
            letter-spacing: -4px;
            margin-bottom: 18px;
        }
        .intro { color: var(--muted); line-height: 1.65; font-family: Inter, system-ui, sans-serif; }
        .controls { display: flex; gap: 10px; flex-wrap: wrap; margin: 22px 0; }
        button {
            border: 1px solid var(--line);
            background: #191816;
            color: #fff7e8;
            padding: 11px 14px;
            font: 700 .78rem Inter, system-ui, sans-serif;
            letter-spacing: .08em;
            text-transform: uppercase;
            cursor: pointer;
        }
        .plaque {
            border: 1px solid var(--line);
            background: rgba(255,255,255,.62);
            padding: 18px;
            min-height: 220px;
            box-shadow: 0 20px 60px rgba(25,24,22,.08);
        }
        .plaque small {
            font: 700 .72rem Inter, system-ui, sans-serif;
            color: var(--rose);
            letter-spacing: .12em;
            text-transform: uppercase;
        }
        .plaque h2 { font-size: 1.8rem; line-height: 1; margin: 10px 0; }
        .plaque p { color: var(--muted); line-height: 1.6; font-family: Inter, system-ui, sans-serif; }
        .gallery {
            display: grid;
            grid-template-columns: repeat(3, minmax(160px, 1fr));
            gap: 16px;
            align-content: start;
        }
        .exhibit {
            min-height: 220px;
            border: 1px solid var(--line);
            background: var(--glass);
            backdrop-filter: blur(8px);
            padding: 14px;
            display: grid;
            grid-template-rows: 1fr auto;
            cursor: pointer;
            box-shadow: 0 18px 44px rgba(25,24,22,.08);
            transition: transform .22s, box-shadow .22s, border-color .22s;
        }
        .exhibit:hover, .exhibit.active {
            transform: translateY(-4px);
            border-color: rgba(54,87,255,.42);
            box-shadow: 0 22px 54px rgba(54,87,255,.14);
        }
        .object {
            display: grid;
            place-items: center;
            font: 900 clamp(3.3rem, 9vw, 7rem) Inter, system-ui, sans-serif;
            color: var(--blue);
            letter-spacing: -6px;
            text-shadow: 8px 8px 0 rgba(196,58,99,.12);
        }
        .caption {
            border-top: 1px solid var(--line);
            padding-top: 12px;
            font: 700 .76rem/1.35 Inter, system-ui, sans-serif;
            text-transform: uppercase;
            letter-spacing: .08em;
        }
        .ticket {
            margin-top: 18px;
            padding: 14px;
            border: 1px dashed rgba(25,24,22,.32);
            font: 12px/1.55 "Courier New", monospace;
            color: var(--green);
            background: rgba(255,255,255,.35);
        }
        @media (max-width: 900px) {
            main { grid-template-columns: 1fr; }
            .gallery { grid-template-columns: repeat(2, minmax(140px, 1fr)); }
        }
        @media (max-width: 540px) {
            .gallery { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <a class="back" href="index.html" title="Back to Gallery">&larr;</a>
    <main>
        <section>
            <h1>Micro Museum</h1>
            <p class="intro">A rotating exhibit of almost-important artifacts. Each object has been carefully mislabeled by the curator on duty.</p>
            <div class="controls">
                <button id="reshuffle">New Exhibit</button>
                <button id="stamp">Stamp Ticket</button>
            </div>
            <div class="plaque" id="plaque">
                <small>Gallery Note</small>
                <h2>Select an object</h2>
                <p>Tap any case to read the official interpretation. Official does not mean accurate.</p>
            </div>
            <div class="ticket" id="ticket">ADMISSION 0001 // STATUS: UNSTAMPED</div>
        </section>
        <section class="gallery" id="gallery" aria-label="Museum exhibits"></section>
    </main>
    <script>
        const nouns = ["Key", "Signal", "Receipt", "Switch", "Button", "Map", "Clock", "Window", "Receipt", "Label"];
        const moods = ["Borrowed", "Obsolete", "Invisible", "Nervous", "Polite", "Unfinished", "Sideways", "Quiet", "Unlicensed"];
        const shapes = ["01", "X", "II", "0", "7", "NO", "OK", "?", "//"];
        const notes = [
            "Believed to have powered a machine that made very small decisions on behalf of strangers.",
            "Recovered from a drawer that was larger on the inside only during office hours.",
            "The object hums when ignored, which is how most experts prefer to study it.",
            "A rare example of practical nonsense from the late browser period.",
            "Its original purpose is unknown, but it clearly wanted better lighting.",
            "Donated anonymously by someone who wrote return to sender on the museum itself."
        ];
        const gallery = document.getElementById("gallery");
        const plaque = document.getElementById("plaque");
        const ticket = document.getElementById("ticket");
        let ticketNo = 1;

        function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

        function makeArtifact(i) {
            return {
                id: String(i + 1).padStart(3, "0"),
                name: `${pick(moods)} ${pick(nouns)}`,
                mark: pick(shapes),
                note: pick(notes)
            };
        }

        function selectArtifact(artifact, el) {
            document.querySelectorAll(".exhibit").forEach(item => item.classList.toggle("active", item === el));
            plaque.innerHTML = `<small>Accession ${artifact.id}</small><h2>${artifact.name}</h2><p>${artifact.note}</p>`;
        }

        function render() {
            gallery.innerHTML = "";
            const items = Array.from({ length: 9 }, (_, i) => makeArtifact(i));
            items.forEach((artifact, i) => {
                const el = document.createElement("button");
                el.className = "exhibit";
                el.type = "button";
                el.innerHTML = `<span class="object">${artifact.mark}</span><span class="caption">${artifact.name}<br>No. ${artifact.id}</span>`;
                el.addEventListener("click", () => selectArtifact(artifact, el));
                gallery.appendChild(el);
                if (i === 0) selectArtifact(artifact, el);
            });
        }

        document.getElementById("reshuffle").addEventListener("click", render);
        document.getElementById("stamp").addEventListener("click", () => {
            ticketNo++;
            ticket.textContent = `ADMISSION ${String(ticketNo).padStart(4, "0")} // STATUS: STAMPED BY A SMALL DESK`;
        });
        render();
    </script>
    <script src="transitions.js"></script>
</body>
</html>
