<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bones</title>
    <link rel="icon"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🦴%3C/text%3E%3C/svg%3E">
    <style>
        body {
            margin: 0;
            background: #1a1a1a;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            flex-direction: column;
            overflow: hidden;
        }

        .spine {
            width: 10px;
            height: 400px;
            background: #eee;
            position: relative;
            border-radius: 5px;
            box-shadow: inset 0 0 10px #aaa;
        }

        .rib {
            height: 20px;
            background: #eee;
            border-radius: 10px;
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            cursor: pointer;
            transition: 0.1s;
            box-shadow: 2px 5px 10px rgba(0, 0, 0, 0.5), inset 0 0 5px #ccc;
        }

        .rib:active {
            transform: translateX(-50%) scale(0.95);
            background: #ddd;
        }

        .hint {
            color: #555;
            position: absolute;
            bottom: 30px;
            font-family: sans-serif;
            letter-spacing: 5px;
            text-transform: uppercase;
        }
    </style>

    <!-- wwg-mobile-patch-start -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        canvas {
            max-width: 100vw;
            max-height: 100vh;
            touch-action: none;
        }
    </style>
    <!-- wwg-mobile-patch-end -->

</head>

<body>
    <div class="spine" id="spine"></div>
    <div class="hint">Play the Ribs</div>

    <script src="discovery.js"></script>
    <script>
        Discovery.unlock('bones');

        const spine = document.getElementById('spine');
        const actx = new (window.AudioContext || window.webkitAudioContext)();

        const notes = [
            261.63, // C4
            293.66, // D4
            329.63, // E4
            349.23, // F4
            392.00, // G4
            440.00, // A4
            493.88, // B4
            523.25  // C5
        ];

        for (let i = 0; i < 8; i++) {
            const rib = document.createElement('div');
            rib.className = 'rib';
            rib.style.top = (i * 40 + 40) + 'px';
            // Ribs get smaller
            const w = 300 - (i * 20);
            rib.style.width = w + 'px';

            rib.addEventListener('mousedown', () => playNote(notes[i]));
            spine.appendChild(rib);
        }

        function playNote(freq) {
            if (actx.state === 'suspended') actx.resume();

            const osc = actx.createOscillator();
            const gain = actx.createGain();

            // Xylophone-like tone
            osc.type = 'triangle';
            osc.frequency.value = freq;

            gain.gain.setValueAtTime(0, actx.currentTime);
            gain.gain.linearRampToValueAtTime(1, actx.currentTime + 0.01);
            gain.gain.exponentialRampToValueAtTime(0.01, actx.currentTime + 0.5);

            osc.connect(gain);
            gain.connect(actx.destination);

            osc.start(actx.currentTime);
            osc.stop(actx.currentTime + 0.5);
        }
    </script>

    <!-- wwg-mobile-patch-js-start -->
    <script>
        // Touch-to-Mouse Polyfill for legacy canvas interactives
        document.addEventListener('touchstart', function(e) {
            if(e.touches.length > 0) {
                const touch = e.touches[0];
                const mouseEvent = new MouseEvent('mousedown', {
                    clientX: touch.clientX,
                    clientY: touch.clientY,
                    bubbles: true,
                    cancelable: true
                });
                e.target.dispatchEvent(mouseEvent);
            }
        }, {passive: false});

        document.addEventListener('touchmove', function(e) {
            if(e.touches.length > 0) {
                const touch = e.touches[0];
                const mouseEvent = new MouseEvent('mousemove', {
                    clientX: touch.clientX,
                    clientY: touch.clientY,
                    bubbles: true,
                    cancelable: true
                });
                e.target.dispatchEvent(mouseEvent);
            }
        }, {passive: false});

        document.addEventListener('touchend', function(e) {
            const mouseEvent = new MouseEvent('mouseup', {
                bubbles: true,
                cancelable: true
            });
            e.target.dispatchEvent(mouseEvent);
        }, {passive: false});
    </script>
    <!-- wwg-mobile-patch-js-end -->

</body>

</html>
