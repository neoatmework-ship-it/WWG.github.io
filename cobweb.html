<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cobweb</title>
    <link rel="icon"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🕸️%3C/text%3E%3C/svg%3E">
    <style>
        body {
            margin: 0;
            background: #0f172a;
            overflow: hidden;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: sans-serif;
        }

        canvas {
            display: block;
            position: absolute;
            inset: 0;
            z-index: 1;
        }

        .text {
            color: rgba(255, 255, 255, 0.05);
            font-size: 5rem;
            letter-spacing: 20px;
            z-index: 0;
            pointer-events: none;
        }
    </style>
</head>

<body>
    <div class="text">COBWEB</div>
    <canvas id="c"></canvas>
    <script src="discovery.js"></script>
    <script>
        Discovery.unlock('cobweb');
        const canvas = document.getElementById('c');
        const ctx = canvas.getContext('2d');
        let w = canvas.width = window.innerWidth;
        let h = canvas.height = window.innerHeight;

        const points = [];

        window.addEventListener('mousemove', e => {
            if (Math.random() > 0.6) {
                points.push({ x: e.clientX, y: e.clientY });
                if (points.length > 50) points.shift(); // keep trail length
            }
        });

        function draw() {
            ctx.clearRect(0, 0, w, h);

            ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)';
            ctx.lineWidth = 0.5;

            for (let i = 0; i < points.length; i++) {
                // Connect to random recent points
                for (let j = Math.max(0, i - 5); j < i; j++) {
                    ctx.beginPath();
                    ctx.moveTo(points[i].x, points[i].y);

                    // Create curved web connections
                    const cpX = (points[i].x + points[j].x) / 2 + (Math.random() - 0.5) * 20;
                    const cpY = (points[i].y + points[j].y) / 2 + (Math.random() - 0.5) * 20;

                    ctx.quadraticCurveTo(cpX, cpY, points[j].x, points[j].y);
                    ctx.stroke();
                }
            }
            requestAnimationFrame(draw);
        }
        draw();

        window.addEventListener('resize', () => {
            w = canvas.width = window.innerWidth;
            h = canvas.height = window.innerHeight;
            points.length = 0;
        });
    </script>
</body>

</html>
