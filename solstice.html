<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solstice</title>
    <link rel="icon"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E☀️%3C/text%3E%3C/svg%3E">
    <style>
        body {
            margin: 0;
            background: #000;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        .sun {
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, #fff 0%, #ffeb3b 40%, #f44336 80%, #000 100%);
            border-radius: 50%;
            box-shadow: 0 0 100px 50px rgba(255, 200, 0, 0.8), 0 0 200px 100px rgba(255, 100, 0, 0.4);
            animation: pulse-sun 4s infinite alternate;
            position: relative;
        }

        .sun::before,
        .sun::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 800px;
            height: 10px;
            background: linear-gradient(90deg, transparent, rgba(255, 200, 0, 0.5), transparent);
            animation: spin 20s linear infinite;
        }

        .sun::after {
            transform: translate(-50%, -50%) rotate(90deg);
            animation-duration: 15s;
        }

        @keyframes pulse-sun {
            100% {
                transform: scale(1.1);
                box-shadow: 0 0 150px 70px rgba(255, 230, 0, 0.9), 0 0 250px 150px rgba(255, 80, 0, 0.6);
            }
        }

        @keyframes spin {
            100% {
                transform: translate(-50%, -50%) rotate(360deg);
            }
        }

        .title {
            position: absolute;
            bottom: 50px;
            color: #ffca28;
            font-family: 'Times New Roman', serif;
            font-size: 3rem;
            letter-spacing: 15px;
            text-shadow: 0 0 20px #ff0;
            pointer-events: none;
        }
    </style>

    <!-- wwg-mobile-patch-start -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        canvas {
            max-width: 100vw;
            max-height: 100vh;
            touch-action: none;
        }
    </style>
    <!-- wwg-mobile-patch-end -->

</head>

<body>
    <div class="sun"></div>
    <div class="title">SOLSTICE</div>
    <script src="discovery.js"></script>
    <script>Discovery.unlock('solstice');</script>

    <!-- wwg-mobile-patch-js-start -->
    <script>
        // Touch-to-Mouse Polyfill for legacy canvas interactives
        document.addEventListener('touchstart', function(e) {
            if(e.touches.length > 0) {
                const touch = e.touches[0];
                const mouseEvent = new MouseEvent('mousedown', {
                    clientX: touch.clientX,
                    clientY: touch.clientY,
                    bubbles: true,
                    cancelable: true
                });
                e.target.dispatchEvent(mouseEvent);
            }
        }, {passive: false});

        document.addEventListener('touchmove', function(e) {
            if(e.touches.length > 0) {
                const touch = e.touches[0];
                const mouseEvent = new MouseEvent('mousemove', {
                    clientX: touch.clientX,
                    clientY: touch.clientY,
                    bubbles: true,
                    cancelable: true
                });
                e.target.dispatchEvent(mouseEvent);
            }
        }, {passive: false});

        document.addEventListener('touchend', function(e) {
            const mouseEvent = new MouseEvent('mouseup', {
                bubbles: true,
                cancelable: true
            });
            e.target.dispatchEvent(mouseEvent);
        }, {passive: false});
    </script>
    <!-- wwg-mobile-patch-js-end -->

</body>

</html>
