<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chronos</title>
    <link rel="icon"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E⏳%3C/text%3E%3C/svg%3E">
    <style>
        body {
            margin: 0;
            background: #ece5dd;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            flex-direction: column;
        }

        .clock {
            width: 300px;
            height: 300px;
            border-radius: 50%;
            border: 10px solid #2c3e50;
            position: relative;
            background: #fff;
            box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.1), 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .center-dot {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 16px;
            height: 16px;
            background: #e74c3c;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
        }

        .hand {
            position: absolute;
            bottom: 50%;
            left: 50%;
            transform-origin: bottom center;
            background: #2c3e50;
            transform: translateX(-50%) rotate(0deg);
            pointer-events: none;
        }

        .hand.hour {
            width: 8px;
            height: 80px;
            background: #2c3e50;
        }

        .hand.minute {
            width: 6px;
            height: 120px;
            background: #34495e;
        }

        .hand.second {
            width: 2px;
            height: 140px;
            background: #e74c3c;
            pointer-events: auto;
        }

        .tick {
            position: absolute;
            width: 4px;
            height: 10px;
            background: #95a5a6;
            top: 10px;
            left: 50%;
            transform-origin: 50% 140px;
        }

        .hint {
            margin-top: 40px;
            color: #7f8c8d;
            font-family: monospace;
            letter-spacing: 2px;
        }

        /* Time reverse effect */
        .invert {
            filter: invert(1) hue-rotate(180deg);
        }
    </style>

    <!-- wwg-mobile-patch-start -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        canvas {
            max-width: 100vw;
            max-height: 100vh;
            touch-action: none;
        }
    </style>
    <!-- wwg-mobile-patch-end -->

</head>

<body>
    <div class="clock" id="clock">
        <!-- Marks generated by JS -->
        <div class="hand hour" id="h"></div>
        <div class="hand minute" id="m"></div>
        <div class="hand second" id="s"></div>
        <div class="center-dot"></div>
    </div>
    <div class="hint">DRAG TO REVERSE</div>

    <script src="discovery.js"></script>
    <script>
        Discovery.unlock('chronos');

        const clock = document.getElementById('clock');
        const hh = document.getElementById('h');
        const mm = document.getElementById('m');
        const ss = document.getElementById('s');

        for (let i = 0; i < 12; i++) {
            const tk = document.createElement('div');
            tk.className = 'tick';
            tk.style.transform = `translateX(-50%) rotate(${i * 30}deg)`;
            clock.appendChild(tk);
        }

        let timeOffset = 0;
        let isDragging = false;
        let lastAngle = 0;

        function updateClock() {
            if (!isDragging && timeOffset < 0) {
                // Return to normal time slowly
                timeOffset += (0 - timeOffset) * 0.1;
            }

            const now = new Date();
            const ms = now.getTime() + timeOffset;
            const fakeNow = new Date(ms);

            const s = fakeNow.getSeconds() + fakeNow.getMilliseconds() / 1000;
            const m = fakeNow.getMinutes() + s / 60;
            const h = fakeNow.getHours() % 12 + m / 60;

            ss.style.transform = `translateX(-50%) rotate(${s * 6}deg)`;
            mm.style.transform = `translateX(-50%) rotate(${m * 6}deg)`;
            hh.style.transform = `translateX(-50%) rotate(${h * 30}deg)`;

            if (timeOffset < -50000) document.body.classList.add('invert');
            else document.body.classList.remove('invert');

            requestAnimationFrame(updateClock);
        }

        updateClock();

        document.addEventListener('mousedown', e => { isDragging = true; lastAngle = getAngle(e); });
        document.addEventListener('mouseup', () => isDragging = false);
        document.addEventListener('mousemove', e => {
            if (!isDragging) return;
            const currentAngle = getAngle(e);
            let diff = currentAngle - lastAngle;

            // Handle wrap around
            if (diff > 180) diff -= 360;
            if (diff < -180) diff += 360;

            timeOffset += diff * 10000; // Dragging goes very fast
            lastAngle = currentAngle;
        });

        function getAngle(e) {
            const rect = clock.getBoundingClientRect();
            const cx = rect.left + rect.width / 2;
            const cy = rect.top + rect.height / 2;
            let a = Math.atan2(e.clientY - cy, e.clientX - cx) * 180 / Math.PI;
            return a < 0 ? a + 360 : a;
        }
    </script>

    <!-- wwg-mobile-patch-js-start -->
    <script>
        // Touch-to-Mouse Polyfill for legacy canvas interactives
        document.addEventListener('touchstart', function(e) {
            if(e.touches.length > 0) {
                const touch = e.touches[0];
                const mouseEvent = new MouseEvent('mousedown', {
                    clientX: touch.clientX,
                    clientY: touch.clientY,
                    bubbles: true,
                    cancelable: true
                });
                e.target.dispatchEvent(mouseEvent);
            }
        }, {passive: false});

        document.addEventListener('touchmove', function(e) {
            if(e.touches.length > 0) {
                const touch = e.touches[0];
                const mouseEvent = new MouseEvent('mousemove', {
                    clientX: touch.clientX,
                    clientY: touch.clientY,
                    bubbles: true,
                    cancelable: true
                });
                e.target.dispatchEvent(mouseEvent);
            }
        }, {passive: false});

        document.addEventListener('touchend', function(e) {
            const mouseEvent = new MouseEvent('mouseup', {
                bubbles: true,
                cancelable: true
            });
            e.target.dispatchEvent(mouseEvent);
        }, {passive: false});
    </script>
    <!-- wwg-mobile-patch-js-end -->

</body>

</html>
