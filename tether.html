<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tether</title>
    <link rel="icon"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🔗%3C/text%3E%3C/svg%3E">
    <style>
        body {
            margin: 0;
            background: #222;
            overflow: hidden;
            cursor: none;
        }

        canvas {
            display: block;
        }

        .orb {
            position: absolute;
            width: 60px;
            height: 60px;
            background: radial-gradient(circle, #fff, #f0f);
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 30px #f0f;
            pointer-events: none;
        }

        .title {
            position: absolute;
            bottom: 30px;
            width: 100%;
            text-align: center;
            color: rgba(255, 255, 255, 0.2);
            font-family: monospace;
            font-size: 2rem;
            letter-spacing: 8px;
            pointer-events: none;
        }
    </style>
</head>

<body>
    <div class="title">TETHER</div>
    <canvas id="c"></canvas>
    <div class="orb" id="orb"></div>

    <script src="discovery.js"></script>
    <script>
        Discovery.unlock('tether');
        const canvas = document.getElementById('c');
        const ctx = canvas.getContext('2d');
        const orb = document.getElementById('orb');
        let w = canvas.width = window.innerWidth;
        let h = canvas.height = window.innerHeight;

        let mouse = { x: w / 2, y: h / 2 };
        let box = { x: w / 2, y: h / 2, vx: 0, vy: 0 };

        window.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });

        function draw() {
            ctx.clearRect(0, 0, w, h);

            // Spring physics
            const dx = mouse.x - box.x;
            const dy = mouse.y - box.y;
            box.vx += dx * 0.05;
            box.vy += dy * 0.05;
            box.vx *= 0.8;
            box.vy *= 0.8;
            box.x += box.vx;
            box.y += box.vy;

            // Draw elastic
            ctx.beginPath();
            ctx.moveTo(mouse.x, mouse.y);
            ctx.lineTo(box.x, box.y);
            ctx.strokeStyle = '#f0f';
            ctx.lineWidth = 4;
            ctx.stroke();

            orb.style.left = box.x + 'px';
            orb.style.top = box.y + 'px';

            requestAnimationFrame(draw);
        }
        draw();
    </script>
</body>

</html>
