<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meteor</title>
    <link rel="icon"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E☄️%3C/text%3E%3C/svg%3E">
    <style>
        body {
            margin: 0;
            background: #000;
            color: #fff;
            font-family: monospace;
            overflow: hidden;
            height: 100vh;
        }

        canvas {
            display: block;
        }

        .hud {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 1.5rem;
            letter-spacing: 5px;
            color: #0ff;
            text-shadow: 0 0 10px #0ff;
            pointer-events: none;
        }

        .controls {
            position: absolute;
            bottom: 20px;
            width: 100%;
            text-align: center;
            color: #555;
            pointer-events: none;
        }

        #gameover {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.8);
            display: none;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            z-index: 100;
        }

        h1 {
            font-size: 4rem;
            color: #f00;
            margin-bottom: 10px;
        }

        button {
            padding: 10px 20px;
            background: transparent;
            border: 2px solid #0ff;
            color: #0ff;
            font-family: monospace;
            font-size: 1.2rem;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            background: #0ff;
            color: #000;
        }
    </style>
</head>

<body>
    <div class="hud">SCORE: <span id="score">0</span></div>
    <div class="controls">MOUSE TO AIM | CLICK TO SHOOT</div>
    <canvas id="c"></canvas>
    <div id="gameover">
        <h1>IMPACT</h1>
        <button onclick="resetGame()">RETRY</button>
    </div>

    <script src="discovery.js"></script>
    <script>
        Discovery.unlock('meteor');
        const canvas = document.getElementById('c');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');
        const goScreen = document.getElementById('gameover');

        let w = canvas.width = window.innerWidth;
        let h = canvas.height = window.innerHeight;

        let score = 0;
        let state = 'play'; // play, over

        // Player turret base
        const turret = { x: w / 2, y: h - 30, angle: -Math.PI / 2 };

        let bullets = [];
        let meteors = [];
        let particles = [];

        let mouseX = w / 2;
        let mouseY = h / 2;

        window.addEventListener('mousemove', e => {
            mouseX = e.clientX;
            mouseY = e.clientY;
            turret.angle = Math.atan2(mouseY - turret.y, mouseX - turret.x);
        });

        window.addEventListener('mousedown', () => {
            if (state !== 'play') return;
            bullets.push({
                x: turret.x + Math.cos(turret.angle) * 30,
                y: turret.y + Math.sin(turret.angle) * 30,
                vx: Math.cos(turret.angle) * 15,
                vy: Math.sin(turret.angle) * 15,
                life: 100
            });
        });

        function spawnMeteor() {
            if (state !== 'play') return;
            const size = Math.random() * 30 + 15;
            meteors.push({
                x: Math.random() * w,
                y: -100,
                vx: (Math.random() - 0.5) * 2,
                vy: Math.random() * 2 + 1 + (score * 0.05), // gets faster
                size: size,
                hp: size > 35 ? 2 : 1
            });
        }

        function explode(x, y, color, num) {
            for (let i = 0; i < num; i++) {
                particles.push({
                    x, y,
                    vx: (Math.random() - 0.5) * 10,
                    vy: (Math.random() - 0.5) * 10,
                    life: 1, color,
                    size: Math.random() * 3 + 1
                });
            }
        }

        setInterval(spawnMeteor, 1000);

        function draw() {
            ctx.fillStyle = 'rgba(0,0,0,0.3)';
            ctx.fillRect(0, 0, w, h);

            if (state === 'play') {
                // Determine collisions
                for (let i = meteors.length - 1; i >= 0; i--) {
                    const m = meteors[i];
                    m.x += m.vx; m.y += m.vy;

                    // Out of bounds (hit ground)
                    if (m.y > h) {
                        state = 'over';
                        goScreen.style.display = 'flex';
                        explode(m.x, h, '#f00', 50);
                    }

                    // Draw meteor
                    ctx.beginPath();
                    ctx.arc(m.x, m.y, m.size, 0, Math.PI * 2);
                    ctx.fillStyle = '#f40';
                    ctx.shadowBlur = 20;
                    ctx.shadowColor = '#f00';
                    ctx.fill();
                    ctx.shadowBlur = 0;

                    // Check bullets
                    for (let j = bullets.length - 1; j >= 0; j--) {
                        const b = bullets[j];
                        const dist = Math.sqrt(Math.pow(b.x - m.x, 2) + Math.pow(b.y - m.y, 2));

                        if (dist < m.size + 2) {
                            m.hp--;
                            bullets.splice(j, 1);
                            explode(b.x, b.y, '#ff0', 5);

                            if (m.hp <= 0) {
                                meteors.splice(i, 1);
                                score += Math.floor(m.size);
                                scoreEl.innerText = score;
                                explode(m.x, m.y, '#f80', 20);
                                break;
                            }
                        }
                    }
                }

                // Draw Bullets
                ctx.fillStyle = '#0ff';
                for (let j = bullets.length - 1; j >= 0; j--) {
                    const b = bullets[j];
                    b.x += b.vx; b.y += b.vy; b.life--;
                    if (b.life <= 0 || b.x < 0 || b.x > w || b.y < 0 || b.y > h) { bullets.splice(j, 1); continue; }
                    ctx.beginPath(); ctx.arc(b.x, b.y, 3, 0, Math.PI * 2); ctx.fill();
                }

                // Draw Turret
                ctx.fillStyle = '#444';
                ctx.fillRect(w / 2 - 20, h - 30, 40, 30);

                ctx.save();
                ctx.translate(turret.x, turret.y);
                ctx.rotate(turret.angle);
                ctx.fillStyle = '#888';
                ctx.fillRect(0, -5, 30, 10);
                ctx.restore();
            }

            // Draw particles
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx; p.y += p.vy;
                p.life -= 0.02;
                if (p.life <= 0) { particles.splice(i, 1); continue; }
                ctx.globalAlpha = p.life;
                ctx.fillStyle = p.color;
                ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
            }
            ctx.globalAlpha = 1;

            requestAnimationFrame(draw);
        }
        draw();

        window.resetGame = function () {
            score = 0; scoreEl.innerText = 0;
            meteors = []; bullets = []; particles = [];
            state = 'play';
            goScreen.style.display = 'none';
        };

        window.addEventListener('resize', () => {
            w = canvas.width = window.innerWidth;
            h = canvas.height = window.innerHeight;
            turret.x = w / 2; turret.y = h - 30;
        });
    </script>
</body>

</html>
