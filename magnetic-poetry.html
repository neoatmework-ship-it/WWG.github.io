<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Magnetic Poetry — Drag Words</title>
    <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{background:#2c2c3a;min-height:100vh;font-family:'Inter',sans-serif;overflow:hidden}
        .fridge{width:100vw;height:100vh;position:relative;background:linear-gradient(135deg,#3a3a4a,#2c2c3a);cursor:default}
        .word{position:absolute;padding:6px 14px;background:#f5f5e8;color:#222;font-family:'Patrick Hand',cursive;font-size:1.1rem;border-radius:3px;cursor:grab;user-select:none;box-shadow:1px 2px 4px rgba(0,0,0,0.3);transition:box-shadow 0.2s;z-index:1}
        .word:hover{box-shadow:2px 4px 8px rgba(0,0,0,0.4)}
        .word.dragging{cursor:grabbing;box-shadow:3px 6px 15px rgba(0,0,0,0.5);z-index:1000;transform:scale(1.05)}
        .tray{position:fixed;bottom:0;left:0;right:0;height:70px;background:rgba(20,20,30,0.9);backdrop-filter:blur(10px);border-top:1px solid rgba(255,255,255,0.08);display:flex;align-items:center;gap:8px;padding:0 16px;overflow-x:auto;z-index:500}
        .tray-word{padding:6px 14px;background:#f5f5e8;color:#222;font-family:'Patrick Hand',cursive;font-size:0.95rem;border-radius:3px;cursor:grab;user-select:none;box-shadow:1px 1px 3px rgba(0,0,0,0.2);flex-shrink:0;transition:transform 0.2s}
        .tray-word:hover{transform:translateY(-3px)}
        .info{position:fixed;top:20px;right:20px;color:rgba(255,255,255,0.3);font-size:0.7rem;font-family:sans-serif;text-align:right}
    </style>

    <!-- wwg-mobile-patch-start -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        canvas {
            max-width: 100vw;
            max-height: 100vh;
            touch-action: none;
        }
    </style>
    <!-- wwg-mobile-patch-end -->

</head>
<body>
<style>
.wwg-back-btn{position:fixed;top:20px;left:20px;width:44px;height:44px;background:rgba(10,10,15,0.7);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,0.1);border-radius:50%;display:flex;align-items:center;justify-content:center;color:#a78bfa;z-index:99999;transition:all 0.3s;text-decoration:none}
.wwg-back-btn:hover{background:rgba(167,139,250,0.2);border-color:rgba(167,139,250,0.4);color:#fff}
</style>
<a href="index.html" class="wwg-back-btn" title="Back to Gallery"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg></a>
<div class="info">Drag words from the tray<br>to the board</div>

<div class="fridge" id="fridge"></div>
<div class="tray" id="tray"></div>

<script>
const WORDS=['the','a','an','I','you','we','they','is','are','was','will','be','have','has','do','can','not','and','but','or','if','in','on','at','to','from','with','for','of','my','your','our','it','this','that','love','hate','dream','sleep','run','fly','fall','dark','light','moon','sun','star','sky','rain','fire','ocean','world','time','heart','soul','mind','body','ghost','shadow','whisper','scream','beautiful','broken','lost','found','never','always','forever','nothing','everything','maybe','why','how','where','who','what','silent','loud','cold','warm','strange','magic','wonder','secret','door','key','road','end','begin','again','blue','red','black','white','deep','wild','free','still','gone','here','now','day','night','dance','sing','cry','smile','breathe','touch','feel','know','think','want','need','see','hear'];

const fridge=document.getElementById('fridge');
const tray=document.getElementById('tray');

// Populate tray
WORDS.forEach(w=>{
    const el=document.createElement('div');
    el.className='tray-word';
    el.textContent=w;
    el.draggable=false;

    let isDragging=false,clone=null;

    const startDrag=(startX,startY)=>{
        isDragging=true;
        clone=document.createElement('div');
        clone.className='word dragging';
        clone.textContent=w;
        clone.style.left=(startX-30)+'px';
        clone.style.top=(startY-15)+'px';
        fridge.appendChild(clone);
    };

    const moveDrag=(cx,cy)=>{
        if(!isDragging||!clone)return;
        clone.style.left=(cx-30)+'px';
        clone.style.top=(cy-15)+'px';
    };

    const endDrag=()=>{
        if(!isDragging||!clone)return;
        isDragging=false;
        clone.classList.remove('dragging');
        makeDraggable(clone);
        clone=null;
    };

    el.addEventListener('mousedown',e=>{startDrag(e.clientX,e.clientY)});
    el.addEventListener('touchstart',e=>{e.preventDefault();startDrag(e.touches[0].clientX,e.touches[0].clientY)},{passive:false});

    document.addEventListener('mousemove',e=>{moveDrag(e.clientX,e.clientY)});
    document.addEventListener('touchmove',e=>{moveDrag(e.touches[0].clientX,e.touches[0].clientY)},{passive:true});
    document.addEventListener('mouseup',endDrag);
    document.addEventListener('touchend',endDrag);

    tray.appendChild(el);
});

function makeDraggable(el){
    let ox,oy,startX,startY;

    const start=(cx,cy)=>{
        el.classList.add('dragging');
        ox=el.offsetLeft;oy=el.offsetTop;
        startX=cx;startY=cy;

        const move=(mx,my)=>{
            el.style.left=(ox+mx-startX)+'px';
            el.style.top=(oy+my-startY)+'px';
        };

        const end=()=>{
            el.classList.remove('dragging');
            document.removeEventListener('mousemove',onMM);
            document.removeEventListener('mouseup',onMU);
            document.removeEventListener('touchmove',onTM);
            document.removeEventListener('touchend',onTE);
        };

        const onMM=e=>move(e.clientX,e.clientY);
        const onMU=end;
        const onTM=e=>move(e.touches[0].clientX,e.touches[0].clientY);
        const onTE=end;

        document.addEventListener('mousemove',onMM);
        document.addEventListener('mouseup',onMU);
        document.addEventListener('touchmove',onTM,{passive:true});
        document.addEventListener('touchend',onTE);
    };

    el.addEventListener('mousedown',e=>{e.preventDefault();start(e.clientX,e.clientY)});
    el.addEventListener('touchstart',e=>{e.preventDefault();start(e.touches[0].clientX,e.touches[0].clientY)},{passive:false});

    // Double click to remove
    el.addEventListener('dblclick',()=>el.remove());
}

// Scatter some starter words
const starters=['the','moon','is','beautiful','tonight'];
starters.forEach((w,i)=>{
    const el=document.createElement('div');
    el.className='word';
    el.textContent=w;
    el.style.left=(100+i*80)+'px';
    el.style.top='200px';
    fridge.appendChild(el);
    makeDraggable(el);
});
</script>

    <!-- wwg-mobile-patch-js-start -->
    <script>
        // Touch-to-Mouse Polyfill for legacy canvas interactives
        document.addEventListener('touchstart', function(e) {
            if(e.touches.length > 0) {
                const touch = e.touches[0];
                const mouseEvent = new MouseEvent('mousedown', {
                    clientX: touch.clientX,
                    clientY: touch.clientY,
                    bubbles: true,
                    cancelable: true
                });
                e.target.dispatchEvent(mouseEvent);
            }
        }, {passive: false});

        document.addEventListener('touchmove', function(e) {
            if(e.touches.length > 0) {
                const touch = e.touches[0];
                const mouseEvent = new MouseEvent('mousemove', {
                    clientX: touch.clientX,
                    clientY: touch.clientY,
                    bubbles: true,
                    cancelable: true
                });
                e.target.dispatchEvent(mouseEvent);
            }
        }, {passive: false});

        document.addEventListener('touchend', function(e) {
            const mouseEvent = new MouseEvent('mouseup', {
                bubbles: true,
                cancelable: true
            });
            e.target.dispatchEvent(mouseEvent);
        }, {passive: false});
    </script>
    <!-- wwg-mobile-patch-js-end -->

</body>
</html>
