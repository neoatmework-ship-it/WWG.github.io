<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pulse</title>
    <link rel="icon"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E💓%3C/text%3E%3C/svg%3E">
    <style>
        body {
            margin: 0;
            background: #001100;
            overflow: hidden;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        canvas {
            display: block;
            filter: drop-shadow(0 0 5px #0f0);
        }

        .hint {
            position: absolute;
            bottom: 30px;
            font-family: monospace;
            color: #0a0;
            font-size: 1.5rem;
            letter-spacing: 5px;
            opacity: 0.5;
            pointer-events: none;
        }
    </style>

    <!-- wwg-mobile-patch-start -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        canvas {
            max-width: 100vw;
            max-height: 100vh;
            touch-action: none;
        }
    </style>
    <!-- wwg-mobile-patch-end -->

</head>

<body>
    <div class="hint">STAY CALM</div>
    <canvas id="c"></canvas>

    <script src="discovery.js"></script>
    <script>
        Discovery.unlock('pulse');
        const canvas = document.getElementById('c');
        const ctx = canvas.getContext('2d');
        let w = canvas.width = window.innerWidth;
        let h = canvas.height = window.innerHeight;

        const path = [];
        let time = 0;
        let bpm = 60; // Base heart rate
        let mouseMovs = 0;

        window.addEventListener('mousemove', () => {
            mouseMovs += 5;
            if (mouseMovs > 100) mouseMovs = 100; // max stress
        });

        // Decay stress
        setInterval(() => {
            if (mouseMovs > 0) mouseMovs--;
        }, 100);

        function draw() {
            // EKG sweep effect (fade out old)
            ctx.fillStyle = 'rgba(0, 17, 0, 0.05)';
            ctx.fillRect(0, 0, w, h);

            bpm = 60 + mouseMovs; // 60 to 160 bpm
            const speed = bpm / 20; // x-axis speed

            time += speed;
            const x = time % w;

            // Generate EKG wave
            // Normal rhythm: flat, small P curve, sharp QRS spike, small T curve
            let y = h / 2;
            const cyclePhase = (time * (bpm / 60) * 0.05) % (Math.PI * 2);

            // Add noise based on stress
            y += (Math.random() - 0.5) * mouseMovs * 0.5;

            // Simplified EKG shape using sine waves at specific phases
            if (cyclePhase > 0 && cyclePhase < 0.5) y -= Math.sin(cyclePhase * 2 * Math.PI) * 10; // P wave
            if (cyclePhase > 1.0 && cyclePhase < 1.1) y += 20; // Q dip
            if (cyclePhase > 1.1 && cyclePhase < 1.25) y -= 150 + mouseMovs; // R spike (gets higher with stress)
            if (cyclePhase > 1.25 && cyclePhase < 1.4) y += 50; // S dip
            if (cyclePhase > 2.0 && cyclePhase < 2.5) y -= Math.sin((cyclePhase - 2) * 2 * Math.PI) * 20; // T wave

            path.push({ x, y });

            // If wrapped around, clear line connection
            if (path.length > 2 && path[path.length - 1].x < path[path.length - 2].x) {
                path.shift(); // break line
            }

            // Keep memory manageable
            if (path.length > w / speed) path.shift();

            ctx.lineWidth = 3;
            ctx.strokeStyle = mouseMovs > 80 ? '#f00' : '#0f0'; // turn red if panicked
            ctx.shadowBlur = 10;
            ctx.shadowColor = ctx.strokeStyle;
            ctx.lineJoin = 'round';

            ctx.beginPath();
            if (path.length > 0) {
                ctx.moveTo(path[0].x, path[0].y);
                for (let i = 1; i < path.length; i++) {
                    ctx.lineTo(path[i].x, path[i].y);
                }
                ctx.stroke();
            }

            requestAnimationFrame(draw);
        }
        draw();

        window.addEventListener('resize', () => {
            w = canvas.width = window.innerWidth;
            h = canvas.height = window.innerHeight;
            path.length = 0;
            time = 0;
        });
    </script>

    <!-- wwg-mobile-patch-js-start -->
    <script>
        // Touch-to-Mouse Polyfill for legacy canvas interactives
        document.addEventListener('touchstart', function(e) {
            if(e.touches.length > 0) {
                const touch = e.touches[0];
                const mouseEvent = new MouseEvent('mousedown', {
                    clientX: touch.clientX,
                    clientY: touch.clientY,
                    bubbles: true,
                    cancelable: true
                });
                e.target.dispatchEvent(mouseEvent);
            }
        }, {passive: false});

        document.addEventListener('touchmove', function(e) {
            if(e.touches.length > 0) {
                const touch = e.touches[0];
                const mouseEvent = new MouseEvent('mousemove', {
                    clientX: touch.clientX,
                    clientY: touch.clientY,
                    bubbles: true,
                    cancelable: true
                });
                e.target.dispatchEvent(mouseEvent);
            }
        }, {passive: false});

        document.addEventListener('touchend', function(e) {
            const mouseEvent = new MouseEvent('mouseup', {
                bubbles: true,
                cancelable: true
            });
            e.target.dispatchEvent(mouseEvent);
        }, {passive: false});
    </script>
    <!-- wwg-mobile-patch-js-end -->

</body>

</html>
