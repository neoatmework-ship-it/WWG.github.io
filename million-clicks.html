<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE MILLION CLICK PROJECT — Collective Effort</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🖱️%3C/text%3E%3C/svg%3E">
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #050505;
            --accent: #facc15;
            --glass: rgba(255, 255, 255, 0.03);
            --border: rgba(255, 255, 255, 0.1);
        }

        * { margin:0; padding:0; box-sizing:border-box; }

        body {
            background: var(--bg);
            color: #fff;
            font-family: 'Share Tech Mono', monospace;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background-image: 
                radial-gradient(circle at 20% 20%, rgba(250, 204, 21, 0.05) 0%, transparent 40%),
                radial-gradient(circle at 80% 80%, rgba(250, 204, 21, 0.05) 0%, transparent 40%);
        }

        .counter-container {
            text-align: center;
            z-index: 10;
        }

        .label {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.8rem;
            letter-spacing: 10px;
            color: #555;
            margin-bottom: 20px;
            text-transform: uppercase;
        }

        .main-number {
            font-family: 'Orbitron', sans-serif;
            font-size: 5rem;
            font-weight: 900;
            color: var(--accent);
            text-shadow: 0 0 40px rgba(250, 204, 21, 0.4);
            margin-bottom: 40px;
            letter-spacing: -2px;
        }

        .click-zone {
            width: 250px;
            height: 250px;
            border: 2px solid var(--border);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.1s;
            position: relative;
            background: var(--glass);
            backdrop-filter: blur(10px);
        }

        .click-zone:hover {
            border-color: var(--accent);
            transform: scale(1.02);
            box-shadow: 0 0 30px rgba(250, 204, 21, 0.1);
        }

        .click-zone:active {
            transform: scale(0.95);
            background: rgba(250, 204, 21, 0.1);
        }

        .click-zone::before {
            content: 'TAP';
            font-family: 'Orbitron', sans-serif;
            letter-spacing: 5px;
            font-weight: 900;
            color: var(--accent);
            opacity: 0.3;
        }

        .personal-stats {
            margin-top: 50px;
            font-size: 0.7rem;
            color: #444;
            display: flex;
            gap: 40px;
            letter-spacing: 2px;
        }

        .personal-stats b { color: #888; }

        .progress-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            height: 4px;
            background: var(--accent);
            width: 0%;
            transition: width 1s ease-out;
            box-shadow: 0 0 20px var(--accent);
        }

        .milestone {
            position: fixed;
            top: 40px;
            right: 40px;
            text-align: right;
            font-size: 0.6rem;
            color: #333;
        }

        .back-link {
            position: fixed;
            top: 20px;
            left: 20px;
            color: #333;
            text-decoration: none;
            font-size: 0.8rem;
        }
        .back-link:hover { color: #fff; }

        .floating-plus {
            position: absolute;
            color: var(--accent);
            font-weight: bold;
            pointer-events: none;
            animation: floatUp 1s ease-out forwards;
        }

        @keyframes floatUp {
            0% { transform: translateY(0); opacity: 1; }
            100% { transform: translateY(-100px); opacity: 0; }
        }
    </style>
</head>
<body>

    <a href="index.html" class="back-link">← DISCONNECT</a>

    <div class="milestone">
        NEXT MILESTONE:<br>
        <span id="next-milestone" style="color: #666;">10,000 CLICKS</span>
    </div>

    <div class="counter-container">
        <div class="label">GLOBAL AGGREGATE</div>
        <div class="main-number" id="global-counter">000,000</div>
        
        <div style="display: flex; justify-content: center;">
            <div class="click-zone" id="btn" onclick="handleClick()"></div>
        </div>

        <div class="personal-stats">
            <span>YOU CONTRIBUTED: <b id="personal-count">0</b></span>
            <span>RANK: <b id="personal-rank">RECRUIT</b></span>
        </div>
    </div>

    <div class="progress-bar" id="progress"></div>

    <script src="discovery.js"></script>
    <script>
        Discovery.unlock('million-clicks');

        const NAMESPACE = 'wwg_million_clicks_pikav';
        const API = `https://api.counterapi.dev/v1/${NAMESPACE}/global`;

        let personalClicks = parseInt(localStorage.getItem('wwg_personal_clicks') || '0');
        document.getElementById('personal-count').textContent = personalClicks;
        updateRank();

        async function fetchGlobal() {
            try {
                const res = await fetch(API);
                const data = await res.json();
                updateDisplay(data.count || 0);
            } catch(e) { console.error("Counter Offline"); }
        }

        function updateDisplay(count) {
            const el = document.getElementById('global-counter');
            el.textContent = count.toLocaleString('en-US', { minimumIntegerDigits: 6 });
            
            const next = Math.ceil((count + 1) / 10000) * 10000;
            document.getElementById('next-milestone').textContent = `${next.toLocaleString()} CLICKS`;
            
            const pct = (count % 10000) / 100;
            document.getElementById('progress').style.width = `${pct}%`;
        }

        async function handleClick() {
            personalClicks++;
            localStorage.setItem('wwg_personal_clicks', personalClicks);
            document.getElementById('personal-count').textContent = personalClicks;
            updateRank();

            // Visual feedback
            const plus = document.createElement('div');
            plus.textContent = '+1';
            plus.className = 'floating-plus';
            plus.style.left = `${event.clientX}px`;
            plus.style.top = `${event.clientY}px`;
            document.body.appendChild(plus);
            setTimeout(() => plus.remove(), 1000);

            // API Call
            try {
                const res = await fetch(`${API}/up`);
                const data = await res.json();
                updateDisplay(data.count);
            } catch(e) {}
        }

        function updateRank() {
            let rank = "RECRUIT";
            if(personalClicks > 10) rank = "ACOLYTE";
            if(personalClicks > 100) rank = "DEVOTEE";
            if(personalClicks > 500) rank = "ZEALOT";
            if(personalClicks > 1000) rank = "GRAND ARCHON";
            document.getElementById('personal-rank').textContent = rank;
        }

        fetchGlobal();
        setInterval(fetchGlobal, 10000); // Polling for global live-ness
    </script>
    <script>
        if(/Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent)){
            document.body.innerHTML += '<a href="index.html" style="position:fixed;bottom:20px;right:20px;background:#000;color:#fff;padding:10px 20px;border-radius:30px;text-decoration:none;z-index:9999;border:1px solid #333;font-family:sans-serif;font-size:14px;">Back to Gallery</a>';
        }
    </script>
</body>
</html>
