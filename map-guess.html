<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Where In The World? — Street View Guess</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #111;
            --accent: #34d399;
            --text: #fff;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Space Grotesk', sans-serif;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            flex-direction: column;
        }

        .game-container {
            width: 90%;
            max-width: 900px;
            background: #222;
            padding: 20px;
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        .view-port {
            width: 100%;
            aspect-ratio: 16/9;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            position: relative;
        }

        .view-port iframe { width: 100%; height: 100%; border: none; }

        .guess-box {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }

        .guess-btn {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            color: #fff;
            padding: 15px;
            border-radius: 12px;
            cursor: pointer;
            transition: 0.2s;
            font-family: inherit;
            font-weight: 700;
        }

        .guess-btn:hover { background: var(--accent); color: #000; border-color: var(--accent); }
        .guess-btn.correct { background: #10b981; color: #fff; }
        .guess-btn.wrong { background: #ef4444; color: #fff; }

        .status-bar { display: flex; justify-content: space-between; margin-bottom: 15px; font-size: 0.9rem; opacity: 0.7; }

        .back-link { position: fixed; top: 20px; left: 20px; color: #444; text-decoration: none; }

        .overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            display: none;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            z-index: 10;
        }
    </style>
</head>
<body>

    <a href="index.html" class="back-link">← GIVE_UP</a>

    <div class="game-container">
        <div class="status-bar">
            <div id="round-txt">Round 1/5</div>
            <div id="score-txt">Score: 0</div>
        </div>
        
        <div class="view-port">
            <div class="overlay" id="overlay">
                <h1 id="res-title">CORRECT!</h1>
                <p id="res-desc">That was Tokyo, Japan.</p>
                <button class="guess-btn" style="margin-top: 20px; width: 200px;" onclick="nextRound()">NEXT ROUND</button>
            </div>
            <!-- Using Google Maps Street View Embeds with random coordinates -->
            <iframe id="map-frame" src=""></iframe>
        </div>

        <div class="guess-box" id="options"></div>
    </div>

    <script src="discovery.js"></script>
    <script>
        Discovery.unlock('map-guess');

        const LOCATIONS = [
            { 
                url: "https://www.google.com/maps/embed?pb=!4v1700000000000!6m8!1m2!1sAF1QipPrV5F1oD8WjJ_7W-YQ!2y0!3f0!4f0!5f0.7820865974627469", 
                correct: "Japan", 
                options: ["Japan", "China", "South Korea", "Vietnam"] 
            },
            { 
                url: "https://www.google.com/maps/embed?pb=!4v1700000000001!6m8!1m2!1sAF1QipMT3W_9pI_G6wO6yA!2y0!3f0!4f0!5f0.7820865974627469", 
                correct: "Iceland", 
                options: ["Norway", "Iceland", "Greenland", "Canada"] 
            },
            { 
                url: "https://www.google.com/maps/embed?pb=!4v1700000000002!6m8!1m2!1sAF1QipM_T9y9p7_vY6A_A!2y0!3f0!4f0!5f0.7820865974627469", 
                correct: "Australia", 
                options: ["Australia", "South Africa", "USA", "Chile"] 
            },
            { 
                url: "https://www.google.com/maps/embed?pb=!4v1700000000003!6m8!1m2!1sAF1QipO_R9_Y9W9G6_A_A!2y0!3f0!4f0!5f0.7820865974627469", 
                correct: "France", 
                options: ["Italy", "Spain", "France", "Germany"] 
            },
            { 
                url: "https://www.google.com/maps/embed?pb=!4v1700000000004!6m8!1m2!1sAF1QipP_S9_W9G6_B_A_A!2y0!3f0!4f0!5f0.7820865974627469", 
                correct: "Brazil", 
                options: ["Mexico", "Brazil", "Colombia", "Peru"] 
            }
        ];

        let currentRound = 0;
        let score = 0;
        let locked = false;

        function loadRound() {
            locked = false;
            const round = LOCATIONS[currentRound];
            document.getElementById('map-frame').src = round.url;
            document.getElementById('round-txt').textContent = `Round ${currentRound + 1}/${LOCATIONS.length}`;
            document.getElementById('overlay').style.display = 'none';
            
            const optWrap = document.getElementById('options');
            optWrap.innerHTML = '';
            round.options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'guess-btn';
                btn.textContent = opt;
                btn.onclick = () => guess(opt, btn);
                optWrap.appendChild(btn);
            });
        }

        function guess(val, btn) {
            if(locked) return;
            locked = true;
            
            const round = LOCATIONS[currentRound];
            if(val === round.correct) {
                score += 1000;
                btn.classList.add('correct');
                document.getElementById('res-title').textContent = "CORRECT!";
                document.getElementById('res-title').style.color = "#10b981";
            } else {
                btn.classList.add('wrong');
                document.getElementById('res-title').textContent = "WRONG!";
                document.getElementById('res-title').style.color = "#ef4444";
            }

            document.getElementById('res-desc').textContent = `It was ${round.correct}.`;
            document.getElementById('score-txt').textContent = `Score: ${score}`;
            document.getElementById('overlay').style.display = 'flex';
        }

        function nextRound() {
            currentRound++;
            if(currentRound < LOCATIONS.length) {
                loadRound();
            } else {
                showFinal();
            }
        }

        function showFinal() {
            document.querySelector('.game-container').innerHTML = `
                <div style="text-align: center; padding: 40px;">
                    <h1 style="font-size: 3rem; color: var(--accent);">GEOGRAPHY PRO</h1>
                    <p style="font-size: 1.5rem; margin: 20px 0;">Final Score: ${score}</p>
                    <button class="guess-btn" style="width: 200px;" onclick="location.reload()">PLAY AGAIN</button>
                </div>
            `;
        }

        loadRound();
    </script>
<script>
    if(/Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent)){
        document.body.innerHTML += '<a href="index.html" style="position:fixed;bottom:20px;right:20px;background:#000;color:#fff;padding:10px 20px;border-radius:30px;text-decoration:none;z-index:9999;border:1px solid #333;font-family:sans-serif;font-size:14px;">Back to Gallery</a>';
    }
</script>
</body>
</html>
