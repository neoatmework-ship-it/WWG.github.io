<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DefNotaVirus — Totally Safe Downloads</title>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Creepster&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --toxic: #39ff14;
            --danger: #ff1744;
            --bg: #0a0a0f;
            --card-bg: rgba(15, 15, 25, 0.8);
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: #e0e0e0;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Scanline overlay */
        body::after {
            content: '';
            position: fixed;
            inset: 0;
            background: repeating-linear-gradient(
                0deg,
                transparent,
                transparent 2px,
                rgba(0, 255, 0, 0.02) 2px,
                rgba(0, 255, 0, 0.02) 4px
            );
            pointer-events: none;
            z-index: 9999;
        }

        /* Hero */
        .hero {
            text-align: center;
            padding: 80px 20px 50px;
            position: relative;
        }

        .hero::before {
            content: '⚠️';
            font-size: 4rem;
            display: block;
            margin-bottom: 10px;
            animation: wobble 2s ease-in-out infinite;
        }

        @keyframes wobble {
            0%, 100% { transform: rotate(-5deg); }
            50% { transform: rotate(5deg); }
        }

        .hero h1 {
            font-family: 'Creepster', cursive;
            font-size: clamp(3rem, 8vw, 5rem);
            background: linear-gradient(135deg, var(--toxic), #00e676, var(--toxic));
            background-size: 200% 200%;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: toxicShift 3s ease infinite;
            text-shadow: none;
            letter-spacing: 2px;
        }

        @keyframes toxicShift {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        .hero .subtitle {
            font-family: 'Share Tech Mono', monospace;
            color: var(--toxic);
            font-size: 0.9rem;
            margin-top: 12px;
            opacity: 0.7;
        }

        .hero .disclaimer {
            margin-top: 20px;
            padding: 12px 24px;
            background: rgba(255, 23, 68, 0.1);
            border: 1px solid rgba(255, 23, 68, 0.3);
            border-radius: 12px;
            display: inline-block;
            font-size: 0.78rem;
            color: var(--danger);
            font-weight: 600;
            letter-spacing: 0.5px;
            animation: pulse-border 2s ease infinite;
        }

        @keyframes pulse-border {
            0%, 100% { border-color: rgba(255, 23, 68, 0.3); }
            50% { border-color: rgba(255, 23, 68, 0.7); }
        }

        /* Grid */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 24px;
            max-width: 1100px;
            margin: 0 auto;
            padding: 20px 24px 80px;
        }

        /* Card */
        .exe-card {
            background: var(--card-bg);
            border: 1px solid rgba(57, 255, 20, 0.1);
            border-radius: 16px;
            padding: 28px;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            backdrop-filter: blur(10px);
        }

        .exe-card::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(57, 255, 20, 0.03), transparent 60%);
            pointer-events: none;
        }

        .exe-card:hover {
            transform: translateY(-6px);
            border-color: rgba(57, 255, 20, 0.3);
            box-shadow: 0 10px 40px rgba(57, 255, 20, 0.1), 0 0 60px rgba(57, 255, 20, 0.05);
        }

        .card-icon {
            font-size: 2.5rem;
            margin-bottom: 14px;
        }

        .card-name {
            font-family: 'Share Tech Mono', monospace;
            font-size: 1.2rem;
            color: var(--toxic);
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .card-name .ext {
            font-size: 0.65rem;
            background: rgba(255, 23, 68, 0.15);
            color: var(--danger);
            padding: 2px 8px;
            border-radius: 6px;
            font-weight: 700;
        }

        .card-desc {
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.5);
            line-height: 1.6;
            margin-bottom: 18px;
        }

        .card-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .card-size {
            font-family: 'Share Tech Mono', monospace;
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.3);
        }

        .card-safety {
            font-size: 0.7rem;
            padding: 3px 10px;
            border-radius: 20px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .safety-safe {
            background: rgba(57, 255, 20, 0.1);
            color: var(--toxic);
            border: 1px solid rgba(57, 255, 20, 0.2);
        }

        .safety-medium {
            background: rgba(255, 193, 7, 0.1);
            color: #ffc107;
            border: 1px solid rgba(255, 193, 7, 0.2);
        }

        .safety-extreme {
            background: rgba(255, 23, 68, 0.1);
            color: var(--danger);
            border: 1px solid rgba(255, 23, 68, 0.2);
        }

        .download-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, rgba(57, 255, 20, 0.15), rgba(57, 255, 20, 0.05));
            border: 1px solid rgba(57, 255, 20, 0.2);
            border-radius: 12px;
            color: var(--toxic);
            font-family: 'Share Tech Mono', monospace;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
        }

        .download-btn:hover {
            background: linear-gradient(135deg, rgba(57, 255, 20, 0.25), rgba(57, 255, 20, 0.1));
            border-color: var(--toxic);
            box-shadow: 0 0 20px rgba(57, 255, 20, 0.15);
            transform: scale(1.02);
        }

        /* Random glitch effect on page */
        @keyframes glitch {
            0% { transform: translate(0); }
            20% { transform: translate(-2px, 2px); }
            40% { transform: translate(-2px, -2px); }
            60% { transform: translate(2px, 2px); }
            80% { transform: translate(2px, -2px); }
            100% { transform: translate(0); }
        }

        .glitch-text {
            animation: glitch 0.3s infinite;
            animation-play-state: paused;
        }

        .exe-card:hover .glitch-text {
            animation-play-state: running;
        }

        /* Footer warning */
        .footer-warning {
            text-align: center;
            padding: 40px 20px;
            font-family: 'Share Tech Mono', monospace;
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.2);
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }

        .footer-warning a {
            color: var(--toxic);
            text-decoration: none;
        }

        /* Responsive */
        @media (max-width: 600px) {
            .grid {
                grid-template-columns: 1fr;
                padding: 16px;
            }
            .hero { padding: 60px 16px 30px; }
            .hero h1 { font-size: 2.5rem; }
        }

        /* Floating particles */
        .particle {
            position: fixed;
            width: 4px;
            height: 4px;
            background: var(--toxic);
            border-radius: 50%;
            opacity: 0;
            pointer-events: none;
            z-index: -1;
            animation: floatUp 6s linear infinite;
        }

        @keyframes floatUp {
            0% { opacity: 0; transform: translateY(100vh) scale(0); }
            10% { opacity: 0.6; }
            90% { opacity: 0.6; }
            100% { opacity: 0; transform: translateY(-20vh) scale(1.5); }
        }
    </style>
</head>
