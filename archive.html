<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🏛️%3C/text%3E%3C/svg%3E">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE VAULT | Artifact Archive</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #030308;
            --accent: #a78bfa;
            --border: rgba(167, 139, 250, 0.2);
            --glow: rgba(167, 139, 250, 0.4);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: var(--bg);
            color: #fff;
            font-family: 'Space Grotesk', sans-serif;
            min-height: 100vh;
            padding: 60px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header { text-align: center; margin-bottom: 60px; }
        h1 { 
            font-size: 3rem; 
            background: linear-gradient(to bottom, #fff, var(--accent)); 
            -webkit-background-clip: text; 
            background-clip: text;
            -webkit-text-fill-color: transparent; 
        }
        .stats { font-family: 'JetBrains Mono', monospace; font-size: 0.8rem; color: #6366f1; letter-spacing: 4px; }

        .chamber-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 30px;
            width: 100%;
            max-width: 1200px;
        }

        .chamber {
            background: rgba(15, 23, 42, 0.4);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 30px;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: 0.4s;
            overflow: hidden;
        }
        .chamber.found { border-color: var(--accent); box-shadow: 0 0 30px rgba(167, 139, 250, 0.1); }
        .chamber.locked { opacity: 0.4; filter: grayscale(1); }

        .artifact-box {
            width: 120px; height: 120px;
            margin-bottom: 20px;
            display: flex; align-items: center; justify-content: center;
            position: relative;
        }

        /* Artifact Visuals */
        .art-phantom { width: 50px; height: 50px; border: 2px solid var(--accent); animation: rotate 4s infinite linear; }
        .art-void { width: 60px; height: 60px; background: radial-gradient(circle, var(--accent), transparent); border-radius: 50%; animation: pulse 2s infinite; }
        .art-oracle { font-size: 3rem; text-shadow: 0 0 20px var(--accent); animation: float 3s infinite ease-in-out; }
        .art-final { font-size: 3.5rem; filter: drop-shadow(0 0 30px gold); animation: spin-y 5s infinite linear; }

        @keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        @keyframes spin-y { from { transform: rotateY(0deg); } to { transform: rotateY(360deg); } }
        @keyframes pulse { 0%, 100% { transform: scale(1); opacity: 0.5; } 50% { transform: scale(1.3); opacity: 1; } }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }

        .chamber-info { text-align: center; }
        .chamber-id { font-family: 'JetBrains Mono', monospace; font-size: 0.6rem; color: var(--accent); margin-bottom: 5px; opacity: 0.6; }
        .chamber-name { font-size: 1.2rem; font-weight: 700; margin-bottom: 15px; }

        .theme-btn {
            background: rgba(167, 139, 250, 0.1);
            border: 1px solid var(--accent);
            color: var(--accent);
            padding: 8px 16px;
            border-radius: 50px;
            font-size: 0.7rem;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .theme-btn:hover { background: var(--accent); color: #fff; box-shadow: 0 0 20px var(--accent); }

        .terminal-panel {
            width: 100%; max-width: 1200px;
            background: #000; border: 1px solid #1e293b;
            border-radius: 12px; margin-top: 40px; padding: 20px;
            font-family: 'JetBrains Mono', monospace; font-size: 0.8rem; color: #4ade80;
        }

        .back-btn { position: fixed; top: 40px; left: 40px; color: #475569; text-decoration: none; font-size: 0.8rem; }
    </style>
</head>

<body>
    <a href="index.html" class="back-btn">← RETURN</a>

    <div class="header">
        <h1>THE ARTIFACT VAULT</h1>
        <div class="stats" id="vault-stats">SYNCHRONIZED // 0 OF 10</div>
    </div>

    <div class="chamber-grid" id="chamber-grid"></div>

    <div class="terminal-panel">
        <div id="term-output">> SYSTEM READY. SELECT CHAMBER FOR GUIDANCE.</div>
    </div>

    <script src="discovery.js"></script>
    <script>
        const vaultGrid = document.getElementById('chamber-grid');
        const term = document.getElementById('term-output');

        const HINTS = {
            'phantom-signal': 'HANDSHAKE DETECTED IN MAIN LOGO. 7 PULSES REQUIRED.',
            'void-fragment': 'ZERO-POINT OBSERVATION: 60 SECONDS OF STILLNESS ON LANDING ZONE.',
            'oracle-machine': 'ORACLE REQUIRES SIGHT (HOVER) AND VOICE (V+I KEYS) IN THE FOOTER.',
            'whisperer': 'IDENTITY QUERY: SEARCH THE VOID FOR YOUR NAME AND FIND NOTHING.',
            'pattern-breaker': 'GEOMETRIC SYNC: CONNECT THE FOUR CORNERS (TL->TR->BR->BL).',
            'night-mode': 'TEMPORAL ANOMALY: SEEK ACCESS BETWEEN 00:00 AND 01:00.',
            'forgotten': 'SPECTRAL DELAY: WAIT 15 SECONDS IN THE ROOM OF NO RESULTS.',
            'chaos-engine': 'ENTROPY MODIFIER: HOLD [CTRL+ALT+C] WHILE TAPPING THE CHAOS PILL.',
            'liar': 'DECEPTION SATURATION: STAY IN THE HALLS OF THE LIAR FOR 30 SECONDS.',
            'grand-finale': 'THE SINGULARITY: COLLECT ALL 9 FRAGMENTS TO STABILIZE.'
        };

        function render() {
            const discovered = Discovery.getDiscovered();
            document.getElementById('vault-stats').innerText = `SYNCHRONIZED // ${discovered.length} OF 10`;
            vaultGrid.innerHTML = '';

            Discovery.SITES.forEach((site, index) => {
                const isFound = discovered.includes(site.id);
                const chamber = document.createElement('div');
                chamber.className = `chamber ${isFound ? 'found' : 'locked'}`;
                
                let artifact = '';
                if (isFound) {
                    if (site.id === 'phantom-signal') artifact = '<div class="art-phantom"></div>';
                    else if (site.id === 'void-fragment') artifact = '<div class="art-void"></div>';
                    else if (site.id === 'oracle-machine') artifact = '<div class="art-oracle">👁️</div>';
                    else if (site.id === 'grand-finale') artifact = '<div class="art-final">💎</div>';
                    else artifact = '<div class="art-oracle" style="animation: none">✨</div>';
                } else {
                    artifact = '<div style="font-size: 2rem; opacity: 0.2">🔒</div>';
                }

                chamber.innerHTML = `
                    <div class="chamber-id">BLOCK_${(index+1).toString().padStart(2,'0')}</div>
                    <div class="artifact-box">${artifact}</div>
                    <div class="chamber-name">${isFound ? site.name : 'ENCRYPTED'}</div>
                `;

                if (isFound && site.theme) {
                    const btn = document.createElement('button');
                    btn.className = 'theme-btn';
                    btn.innerText = 'UPLINK THEME';
                    btn.onclick = () => {
                        Discovery.setActiveTheme(site.theme);
                        term.innerText = `> THEME [${site.theme.toUpperCase()}] UPLINKED TO MAIN GALLERY.`;
                    };
                    chamber.appendChild(btn);
                }

                if (!isFound) {
                    chamber.style.cursor = 'help';
                    chamber.onclick = () => {
                        term.innerText = `> DECODED RITUAL: ${HINTS[site.id]}`;
                    };
                }

                vaultGrid.appendChild(chamber);
            });
        }

        render();
    </script>
</body>
</html>
