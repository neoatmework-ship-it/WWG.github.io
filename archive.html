<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E📁%3C/text%3E%3C/svg%3E">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Vault | WWG Fragment Archive</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;700&family=Inter:wght@400;600&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg: #020205;
            --accent: #a78bfa;
            --locked: #18181b;
            --unlocked: rgba(167, 139, 250, 0.1);
            --border: rgba(255, 255, 255, 0.05);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--bg);
            color: #fff;
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            padding: 80px 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header {
            text-align: center;
            margin-bottom: 60px;
        }

        h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 2.5rem;
            letter-spacing: -1px;
            color: var(--accent);
            text-shadow: 0 0 30px rgba(167, 139, 250, 0.3);
        }

        .stats {
            margin-top: 10px;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 0.9rem;
            color: #888;
            letter-spacing: 2px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            width: 100%;
            max-width: 1200px;
        }

        .slot {
            aspect-ratio: 1;
            background: var(--locked);
            border: 1px solid var(--border);
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: 0.3s cubic-bezier(0.23, 1, 0.32, 1);
            position: relative;
            text-decoration: none;
            color: inherit;
        }

        .slot.unlocked {
            background: var(--unlocked);
            border-color: var(--accent);
            cursor: pointer;
        }

        .slot.unlocked:hover {
            transform: translateY(-5px);
            background: rgba(167, 139, 250, 0.2);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .icon {
            font-size: 2rem;
            margin-bottom: 10px;
            filter: grayscale(1) opacity(0.2);
            transition: 0.3s;
        }

        .unlocked .icon {
            filter: none;
            opacity: 1;
        }

        .name {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #444;
            transition: 0.3s;
        }

        .unlocked .name {
            color: #fff;
        }

        /* Enable interaction for locked slots for secrets */
        div.slot {
            pointer-events: auto;
        }

        .back-link {
            position: fixed;
            top: 40px;
            left: 40px;
            color: #666;
            text-decoration: none;
            font-size: 0.8rem;
            letter-spacing: 2px;
        }

        .back-link:hover {
            color: #fff;
        }

        .empty-hint {
            position: absolute;
            bottom: -40px;
            font-size: 0.7rem;
            color: #444;
            white-space: nowrap;
        }
    </style>

    <!-- wwg-mobile-patch-start -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        canvas {
            max-width: 100vw;
            max-height: 100vh;
            touch-action: none;
        }
    </style>
    <!-- wwg-mobile-patch-end -->

</head>

<body>
    <a href="index.html" class="back-link">← RETURN</a>
    <div style="position:fixed; top:40px; right:40px; display:flex; gap:20px; align-items:center;">
        <a href="shop.html" style="text-decoration:none; color:var(--coin); font-family:'Space Grotesk'; font-size:0.8rem; border:1px solid var(--coin); padding:5px 15px; border-radius:50px;">🪙 <span class="coin-balance-val">0</span></a>
    </div>

    <div class="header">
        <div class="header-content">
            <span class="badge" id="discovery-stats">LOADED fragments // 0 of 45 secure</span>
            <h1 id="archive-title"
                onclick="window.archClicks = (window.archClicks || 0) + 1; if(window.archClicks === 3) window.location.href='horizon.html'; setTimeout(()=>window.archClicks=0, 2000);">
                THE ARCHIVE VAULT</h1>
            <p class="desc">A localized mirror of all salvaged fragments. Use the shortcuts to warp back
                to established dimensions.</p>
        </div>
        <div id="guide-cont" style="display:none; margin-top:20px;">
            <a href="cheatsheet.html" class="guide-btn" style="
                background: rgba(167, 139, 250, 0.1);
                border: 1px solid var(--accent);
                color: var(--accent);
                padding: 10px 20px;
                border-radius: 50px;
                text-decoration: none;
                font-family: 'Space Grotesk', sans-serif;
                font-size: 0.8rem;
                font-weight: bold;
                letter-spacing: 1px;
                transition: 0.3s;
                display: inline-block;
            ">VIEW_DISCOVERY_GUIDE</a>
        </div>

        <div class="reset-wrap" style="display:flex; gap:10px; margin-top:20px;">
            <button id="reset-btn" class="reset-btn" style="
                background: rgba(255, 50, 50, 0.1);
                border: 1px solid rgba(255, 50, 50, 0.2);
                color: #ff5555;
                padding: 10px 15px;
                border-radius: 8px;
                font-family: 'Space Grotesk', sans-serif;
                font-size: 0.7rem;
                font-weight: bold;
                letter-spacing: 1px;
                cursor: pointer;
                transition: 0.3s;
            ">RESET_VAULT</button>
        </div>
    </div>

    <div class="grid" id="vault-grid">
        <!-- Slots generated by JS -->
    </div>

    <script src="economy.js"></script>
    <script src="discovery.js"></script>

            'totem': { name: 'Totem', icon: '🗿' }

        function render() {
            const discovered = Discovery.getDiscovered();
            discoveryStats.innerText = `SALVAGED: ${discovered.length} of 100 secure`;

            if (Discovery.isCheatsheetUnlocked()) {
                document.getElementById('guide-cont').style.display = 'block';
            }

            grid.innerHTML = '';

            Object.keys(siteData).forEach(id => {
                const data = siteData[id];
                const isFound = discovered.includes(id);

                const slot = document.createElement(isFound ? 'a' : 'div');
                slot.className = `slot ${isFound ? 'unlocked' : ''}`;
                if (isFound) slot.href = data.file || `${id}.html`;

                if (!isFound) {
                    slot.onclick = () => {
                        // Secret: Glimmer (Triple click)
                        slot.gClicks = (slot.gClicks || 0) + 1;
                        if (slot.gClicks === 3) window.location.href = 'glimmer.html';
                        setTimeout(() => slot.gClicks = 0, 2000);

                        // New: Coin Unlock (Single click modal)
                        if (confirm(`Unlock "${data.name}" for 50 Coins?`)) {
                            if (Economy.spendCoins(50)) {
                                Discovery.unlock(id);
                                window.location.reload();
                            } else {
                                if(confirm("Insufficient Coins. Visit the Digital Treasury?")) {
                                    window.location.href = 'shop.html';
                                }
                            }
                        }
                    };
                }

                slot.innerHTML = `
                    <div class="icon">${isFound ? data.icon : '🔒'}</div>
                    <div class="name">${isFound ? data.name : '???'}</div>
                    ${!isFound ? '<div class="empty-hint">PAY 50 🪙</div>' : ''}
                `;
                grid.appendChild(slot);
            });
        }

        resetButton.addEventListener('click', () => {
            if (confirm('CRITICAL: This will purge all salvaged fragments from your local cache. Continue?')) {
                localStorage.removeItem('wwg_discovered_secrets');
                localStorage.removeItem('wwg_tainted_secrets');
                localStorage.removeItem('wwg_cheatsheet_unlocked');
                window.location.reload();
            }
        });

        render();
    </script>

    <!-- wwg-mobile-patch-js-start -->
    <script>
        // Touch-to-Mouse Polyfill for legacy canvas interactives
        document.addEventListener('touchstart', function(e) {
            if(e.touches.length > 0) {
                const touch = e.touches[0];
                const mouseEvent = new MouseEvent('mousedown', {
                    clientX: touch.clientX,
                    clientY: touch.clientY,
                    bubbles: true,
                    cancelable: true
                });
                e.target.dispatchEvent(mouseEvent);
            }
        }, {passive: false});

        document.addEventListener('touchmove', function(e) {
            if(e.touches.length > 0) {
                const touch = e.touches[0];
                const mouseEvent = new MouseEvent('mousemove', {
                    clientX: touch.clientX,
                    clientY: touch.clientY,
                    bubbles: true,
                    cancelable: true
                });
                e.target.dispatchEvent(mouseEvent);
            }
        }, {passive: false});

        document.addEventListener('touchend', function(e) {
            const mouseEvent = new MouseEvent('mouseup', {
                bubbles: true,
                cancelable: true
            });
            e.target.dispatchEvent(mouseEvent);
        }, {passive: false});
    </script>
    <!-- wwg-mobile-patch-js-end -->
