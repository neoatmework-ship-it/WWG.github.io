<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quartz</title>
    <link rel="icon"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E💎%3C/text%3E%3C/svg%3E">
    <style>
        body {
            margin: 0;
            background: radial-gradient(circle at top right, #9fe6f7, #0e1e24);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .crystal {
            width: 0;
            height: 0;
            border-left: 50px solid transparent;
            border-right: 50px solid transparent;
            border-bottom: 200px solid rgba(255, 255, 255, 0.8);
            position: relative;
            transform-style: preserve-3d;
            animation: spin 10s linear infinite;
        }

        .crystal::after {
            content: '';
            position: absolute;
            top: 200px;
            left: -50px;
            border-left: 50px solid transparent;
            border-right: 50px solid transparent;
            border-top: 100px solid rgba(200, 240, 255, 0.7);
        }

        .facet {
            position: absolute;
            top: 0;
            left: -50px;
            border-left: 50px solid transparent;
            border-right: 50px solid transparent;
            border-bottom: 200px solid rgba(255, 255, 255, 0.6);
            transform-origin: bottom center;
        }

        .facet.f1 {
            transform: rotateY(60deg) translateZ(43px) rotateX(10deg);
            border-bottom-color: rgba(180, 240, 255, 0.5);
        }

        .facet.f2 {
            transform: rotateY(120deg) translateZ(43px) rotateX(10deg);
            border-bottom-color: rgba(220, 255, 255, 0.5);
        }

        .facet.f3 {
            transform: rotateY(180deg) translateZ(43px) rotateX(10deg);
            border-bottom-color: rgba(150, 220, 255, 0.5);
        }

        @keyframes spin {
            100% {
                transform: rotateY(360deg);
            }
        }

        .glow {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(150, 240, 255, 0.4) 0%, transparent 70%);
            border-radius: 50%;
        }
    </style>

    <!-- wwg-mobile-patch-start -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        canvas {
            max-width: 100vw;
            max-height: 100vh;
            touch-action: none;
        }
    </style>
    <!-- wwg-mobile-patch-end -->

</head>

<body>
    <div class="glow"></div>
    <div class="crystal">
        <div class="facet f1"></div>
        <div class="facet f2"></div>
        <div class="facet f3"></div>
    </div>
    <script src="discovery.js"></script>
    <script>Discovery.unlock('quartz');</script>

    <!-- wwg-mobile-patch-js-start -->
    <script>
        // Touch-to-Mouse Polyfill for legacy canvas interactives
        document.addEventListener('touchstart', function(e) {
            if(e.touches.length > 0) {
                const touch = e.touches[0];
                const mouseEvent = new MouseEvent('mousedown', {
                    clientX: touch.clientX,
                    clientY: touch.clientY,
                    bubbles: true,
                    cancelable: true
                });
                e.target.dispatchEvent(mouseEvent);
            }
        }, {passive: false});

        document.addEventListener('touchmove', function(e) {
            if(e.touches.length > 0) {
                const touch = e.touches[0];
                const mouseEvent = new MouseEvent('mousemove', {
                    clientX: touch.clientX,
                    clientY: touch.clientY,
                    bubbles: true,
                    cancelable: true
                });
                e.target.dispatchEvent(mouseEvent);
            }
        }, {passive: false});

        document.addEventListener('touchend', function(e) {
            const mouseEvent = new MouseEvent('mouseup', {
                bubbles: true,
                cancelable: true
            });
            e.target.dispatchEvent(mouseEvent);
        }, {passive: false});
    </script>
    <!-- wwg-mobile-patch-js-end -->

</body>

</html>
