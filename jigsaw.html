<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jigsaw</title>
    <link rel="icon"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🧩%3C/text%3E%3C/svg%3E">
    <style>
        body {
            margin: 0;
            background: #121212;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            font-family: monospace;
            color: #fff;
        }

        .board {
            width: 300px;
            height: 300px;
            background: #222;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 2px;
            border: 2px solid #555;
            padding: 2px;
        }

        .tile {
            background: #444;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            cursor: pointer;
            user-select: none;
            transition: background 0.2s;
        }

        .tile:hover {
            background: #555;
        }

        .empty {
            background: transparent;
            cursor: default;
        }

        .empty:hover {
            background: transparent;
        }

        .win {
            position: absolute;
            top: 20%;
            font-size: 3rem;
            color: #0f0;
            display: none;
            animation: flash 1s infinite;
        }

        @keyframes flash {
            50% {
                opacity: 0;
            }
        }
    </style>
</head>

<body>
    <div class="win" id="win">RESOLVED</div>
    <div class="board" id="board"></div>

    <script src="discovery.js"></script>
    <script>
        Discovery.unlock('jigsaw');

        const board = document.getElementById('board');
        let tiles = [1, 2, 3, 4, 5, 6, 7, 8, 0];

        // Simple shuffle
        for (let i = tiles.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [tiles[i], tiles[j]] = [tiles[j], tiles[i]];
        }

        function render() {
            board.innerHTML = '';
            tiles.forEach((t, i) => {
                const el = document.createElement('div');
                el.className = 'tile' + (t === 0 ? ' empty' : '');
                el.innerText = t || '';
                if (t !== 0) {
                    el.addEventListener('click', () => move(i));
                }
                board.appendChild(el);
            });
            checkWin();
        }

        function move(idx) {
            const emptyIdx = tiles.indexOf(0);
            const row = Math.floor(idx / 3);
            const col = idx % 3;
            const eRow = Math.floor(emptyIdx / 3);
            const eCol = emptyIdx % 3;

            const isAdjacent = (Math.abs(row - eRow) === 1 && col === eCol) || (Math.abs(col - eCol) === 1 && row === eRow);

            if (isAdjacent) {
                [tiles[idx], tiles[emptyIdx]] = [tiles[emptyIdx], tiles[idx]];
                render();
            }
        }

        function checkWin() {
            const winState = [1, 2, 3, 4, 5, 6, 7, 8, 0];
            if (JSON.stringify(tiles) === JSON.stringify(winState)) {
                document.getElementById('win').style.display = 'block';
            }
        }

        render();
    </script>
</body>

</html>
