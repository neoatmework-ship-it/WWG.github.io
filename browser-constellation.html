<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Browser Constellation | WWG</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --bg: #030612;
            --text: #f5f7ff;
            --muted: #93a4c7;
            --panel: rgba(5,10,26,.74);
            --line: rgba(255,255,255,.14);
            --star: #ffe8a3;
            --cyan: #67e8f9;
            --violet: #c084fc;
        }
        body {
            min-height: 100vh;
            overflow: hidden;
            font-family: Inter, system-ui, sans-serif;
            color: var(--text);
            background: radial-gradient(circle at 50% 50%, rgba(103,232,249,.13), transparent 34%), var(--bg);
        }
        canvas { position: fixed; inset: 0; width: 100%; height: 100%; cursor: crosshair; }
        .back {
            position: fixed; top: 18px; left: 18px; z-index: 6;
            width: 44px; height: 44px; border-radius: 50%;
            display: grid; place-items: center; text-decoration: none;
            color: var(--text); background: var(--panel); border: 1px solid var(--line);
            backdrop-filter: blur(14px);
        }
        .panel {
            position: fixed;
            left: 50%;
            bottom: 24px;
            transform: translateX(-50%);
            z-index: 5;
            width: min(820px, calc(100% - 32px));
            padding: 18px;
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 16px;
            align-items: center;
            border: 1px solid var(--line);
            background: var(--panel);
            backdrop-filter: blur(14px);
        }
        h1 { font-size: clamp(2rem, 5vw, 4.6rem); line-height: .9; letter-spacing: -3px; }
        p { color: var(--muted); line-height: 1.55; max-width: 54ch; margin-top: 8px; }
        .buttons { display: flex; gap: 10px; flex-wrap: wrap; justify-content: flex-end; }
        button {
            border: 1px solid var(--line);
            background: rgba(255,255,255,.08);
            color: var(--text);
            padding: 11px 13px;
            font-weight: 800;
            cursor: pointer;
        }
        button:hover { background: var(--cyan); color: #03101a; }
        .readout {
            position: fixed;
            top: 22px;
            right: 22px;
            z-index: 5;
            font: 700 12px/1.4 "Courier New", monospace;
            color: rgba(255,255,255,.72);
            padding: 10px 12px;
            border: 1px solid var(--line);
            background: var(--panel);
            backdrop-filter: blur(14px);
        }
        @media (max-width: 700px) {
            .panel { grid-template-columns: 1fr; bottom: 14px; }
            .buttons { justify-content: stretch; }
            button { flex: 1; }
            .readout { right: 14px; top: 74px; }
        }
    </style>
</head>
<body>
    <canvas id="sky"></canvas>
    <a class="back" href="index.html" title="Back to Gallery">&larr;</a>
    <div class="readout" id="readout">0 STARS // 0 LINKS</div>
    <section class="panel">
        <div>
            <h1>Browser Constellation</h1>
            <p>Click the sky to pin stars. Nearby points form temporary constellations and receive official names they did not request.</p>
        </div>
        <div class="buttons">
            <button id="sprinkle">Sprinkle</button>
            <button id="name">Name It</button>
            <button id="clear">Clear</button>
        </div>
    </section>
    <script>
        const canvas = document.getElementById("sky");
        const ctx = canvas.getContext("2d");
        const readout = document.getElementById("readout");
        const names = ["The Late Refresh", "Minor Tab Drift", "The North Cache", "Undo Cluster", "Quiet Upload", "The Soft Timeout", "Local Horizon"];
        let stars = [];
        let label = "";
        let tick = 0;

        function resize() {
            canvas.width = innerWidth * devicePixelRatio;
            canvas.height = innerHeight * devicePixelRatio;
            ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
        }
        addEventListener("resize", resize);
        resize();

        function addStar(x, y) {
            stars.push({ x, y, r: 1.8 + Math.random() * 3.2, phase: Math.random() * 9 });
            if (stars.length > 120) stars.shift();
        }

        function links() {
            const lines = [];
            for (let i = 0; i < stars.length; i++) {
                for (let j = i + 1; j < stars.length; j++) {
                    const a = stars[i], b = stars[j];
                    const d = Math.hypot(a.x - b.x, a.y - b.y);
                    if (d < 155) lines.push([a, b, d]);
                }
            }
            return lines;
        }

        canvas.addEventListener("click", e => addStar(e.clientX, e.clientY));
        document.getElementById("sprinkle").addEventListener("click", () => {
            for (let i = 0; i < 18; i++) addStar(Math.random() * innerWidth, Math.random() * innerHeight);
        });
        document.getElementById("clear").addEventListener("click", () => { stars = []; label = ""; });
        document.getElementById("name").addEventListener("click", () => {
            label = names[Math.floor(Math.random() * names.length)];
        });

        function draw() {
            tick += .015;
            ctx.clearRect(0, 0, innerWidth, innerHeight);
            ctx.fillStyle = "rgba(3,6,18,.62)";
            ctx.fillRect(0, 0, innerWidth, innerHeight);

            const currentLinks = links();
            currentLinks.forEach(([a, b, d]) => {
                ctx.globalAlpha = Math.max(.08, 1 - d / 155) * .55;
                ctx.strokeStyle = "#67e8f9";
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(a.x, a.y);
                ctx.lineTo(b.x, b.y);
                ctx.stroke();
            });

            stars.forEach(star => {
                const pulse = .65 + Math.sin(tick * 5 + star.phase) * .35;
                ctx.globalAlpha = .9;
                ctx.fillStyle = "#ffe8a3";
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.r * pulse, 0, Math.PI * 2);
                ctx.fill();
                ctx.globalAlpha = .18;
                ctx.fillStyle = "#c084fc";
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.r * 5, 0, Math.PI * 2);
                ctx.fill();
            });

            if (label && stars.length) {
                const cx = stars.reduce((sum, s) => sum + s.x, 0) / stars.length;
                const cy = stars.reduce((sum, s) => sum + s.y, 0) / stars.length;
                ctx.globalAlpha = .9;
                ctx.fillStyle = "#f5f7ff";
                ctx.font = "700 16px Inter, system-ui, sans-serif";
                ctx.fillText(label, Math.min(innerWidth - 190, Math.max(20, cx - 70)), Math.min(innerHeight - 120, Math.max(34, cy - 24)));
            }
            ctx.globalAlpha = 1;
            readout.textContent = `${stars.length} STARS // ${currentLinks.length} LINKS`;
            requestAnimationFrame(draw);
        }
        draw();
    </script>
    <script src="transitions.js"></script>
</body>
</html>
