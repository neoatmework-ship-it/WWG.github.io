<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monolith</title>
    <link rel="icon"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🗿%3C/text%3E%3C/svg%3E">
    <style>
        body {
            margin: 0;
            background: #0a0a0c;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            perspective: 1000px;
        }

        .monolith {
            width: 80px;
            height: 400px;
            background: #111;
            position: relative;
            transform-style: preserve-3d;
            animation: float 6s ease-in-out infinite, rotate 20s linear infinite;
        }

        .face {
            position: absolute;
            inset: 0;
            background: #1a1a1f;
            border: 1px solid #333;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .front {
            transform: translateZ(40px);
        }

        .back {
            transform: rotateY(180deg) translateZ(40px);
        }

        .left {
            transform: rotateY(-90deg) translateZ(40px);
            width: 80px;
        }

        .right {
            transform: rotateY(90deg) translateZ(40px);
            width: 80px;
        }

        .top {
            transform: rotateX(90deg) translateZ(40px);
            height: 80px;
        }

        .bottom {
            transform: rotateX(-90deg) translateZ(360px);
            height: 80px;
        }

        .rune {
            color: rgba(255, 100, 50, 0.8);
            font-size: 2rem;
            text-shadow: 0 0 10px #ff6432, 0 0 20px #ff3200;
            animation: pulse 2s infinite alternate;
        }

        @keyframes float {
            50% {
                transform: translateY(-30px);
            }
        }

        @keyframes rotate {
            100% {
                transform: rotateY(360deg);
            }
        }

        @keyframes pulse {
            100% {
                opacity: 0.3;
                text-shadow: none;
            }
        }

        .ground {
            position: absolute;
            bottom: -100px;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(255, 100, 50, 0.1) 0%, transparent 60%);
            transform: rotateX(90deg);
        }
    </style>

    <!-- wwg-mobile-patch-start -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        canvas {
            max-width: 100vw;
            max-height: 100vh;
            touch-action: none;
        }
    </style>
    <!-- wwg-mobile-patch-end -->

</head>

<body>
    <div class="monolith" id="mono">
        <div class="face front">
            <div class="rune">ᛟ</div>
        </div>
        <div class="face back">
            <div class="rune">ᛉ</div>
        </div>
        <div class="face left">
            <div class="rune">ᛊ</div>
        </div>
        <div class="face right">
            <div class="rune">ᚲ</div>
        </div>
        <div class="face top"></div>
        <div class="face bottom"></div>
    </div>
    <div class="ground"></div>

    <script src="discovery.js"></script>
    <script>
        Discovery.unlock('monolith');
        document.addEventListener('mousemove', (e) => {
            const x = (e.clientX / window.innerWidth - 0.5) * 40;
            const y = (e.clientY / window.innerHeight - 0.5) * -40;
            document.getElementById('mono').style.transform = `rotateX(${y}deg) rotateY(${x}deg)`;
            document.getElementById('mono').style.animation = 'none'; // stop rot on move
        });
    </script>

    <!-- wwg-mobile-patch-js-start -->
    <script>
        // Touch-to-Mouse Polyfill for legacy canvas interactives
        document.addEventListener('touchstart', function(e) {
            if(e.touches.length > 0) {
                const touch = e.touches[0];
                const mouseEvent = new MouseEvent('mousedown', {
                    clientX: touch.clientX,
                    clientY: touch.clientY,
                    bubbles: true,
                    cancelable: true
                });
                e.target.dispatchEvent(mouseEvent);
            }
        }, {passive: false});

        document.addEventListener('touchmove', function(e) {
            if(e.touches.length > 0) {
                const touch = e.touches[0];
                const mouseEvent = new MouseEvent('mousemove', {
                    clientX: touch.clientX,
                    clientY: touch.clientY,
                    bubbles: true,
                    cancelable: true
                });
                e.target.dispatchEvent(mouseEvent);
            }
        }, {passive: false});

        document.addEventListener('touchend', function(e) {
            const mouseEvent = new MouseEvent('mouseup', {
                bubbles: true,
                cancelable: true
            });
            e.target.dispatchEvent(mouseEvent);
        }, {passive: false});
    </script>
    <!-- wwg-mobile-patch-js-end -->

</body>

</html>
